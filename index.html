<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planning GHE — Brancardiers</title>

<style>
/* =========================================================
   PLANNING GHE — ACCUEIL
   Version retouchée : page sans titre de tête.
   La page commence directement par la photo d'accueil.

   Images actuellement utilisées :
   Image/Bannière/01-accueil-planning-acces.png
   Image/Bannière/02-mon-planning-personnel.png
   Image/Bannière/03-organisation.png
   Image/Bannière/04-demander-changement.png
   Image/Bannière/05-abonnement-planning.png
========================================================= */

*,*::before,*::after{box-sizing:border-box}

:root{
  --ink:#07183f;
  --ink-deep:#020919;
  --paper:#fff7dd;
  --paper-soft:#fff2c8;
  --gold:#d3a24b;
  --old-gold:#b98028;
  --cream:#fff1c4;
  --shadow:rgba(3,10,32,.26);
}

html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:Impact,"Arial Black",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 15% 0%,rgba(255,255,255,.95) 0 9%,transparent 31%),
    radial-gradient(circle at 88% 4%,rgba(255,218,116,.46) 0 9%,transparent 32%),
    repeating-linear-gradient(-6deg,rgba(7,24,63,.035) 0 1px,transparent 1px 13px),
    linear-gradient(180deg,#fff9e8 0%,#f5e8bf 57%,#ead9a5 100%);
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.24;
  background:
    repeating-linear-gradient(8deg,rgba(7,24,63,.06) 0 1px,transparent 1px 12px),
    repeating-linear-gradient(-9deg,rgba(178,116,26,.08) 0 1px,transparent 1px 17px);
  mix-blend-mode:multiply;
}

.page{
  width:min(760px,100%);
  margin:auto;
  padding:10px 12px 48px;
}

/* =============================
   CARTES
============================= */

.hand-card{
  position:relative;
  margin:18px 0 32px;
  padding:17px 13px 18px;
  background:
    radial-gradient(circle at 12% 0%,rgba(255,255,255,.75),transparent 34%),
    linear-gradient(180deg,rgba(255,255,255,.40),transparent 48%),
    var(--paper);
  border:6px solid var(--ink);
  border-radius:34px 28px 38px 29px;
  box-shadow:
    0 13px 0 rgba(7,24,63,.20),
    0 18px 0 rgba(0,0,0,.12),
    inset 0 0 0 3px rgba(255,215,115,.42);
}

.hero-card{
  margin-top:6px;
}

.hand-card::before{
  content:"";
  position:absolute;
  inset:8px;
  border:3px solid rgba(255,218,123,.42);
  border-radius:24px 22px 28px 23px;
  pointer-events:none;
}

.hand-card::after{
  content:"";
  position:absolute;
  inset:-4px;
  border:2px solid rgba(7,24,63,.32);
  border-radius:40px 31px 42px 33px;
  transform:rotate(-.25deg);
  pointer-events:none;
}

.block-title{
  position:relative;
  z-index:2;
  margin:15px 0 18px;
  text-align:center;
  text-transform:uppercase;
  color:var(--ink);
  font-size:clamp(35px,8vw,58px);
  line-height:.88;
  letter-spacing:1px;
  text-shadow:
    0 4px 0 #f8d67d,
    4px 7px 0 rgba(7,24,63,.13);
}

.block-title.small-title{font-size:clamp(34px,7.6vw,54px)}

.scene-img{
  position:relative;
  z-index:2;
  display:block;
  width:100%;
  height:auto;
  margin:0 0 14px;
  border:6px solid var(--ink);
  border-radius:27px 24px 31px 23px;
  background:white;
  box-shadow:
    0 10px 0 rgba(7,24,63,.18),
    0 14px 0 rgba(0,0,0,.10);
}

.scene-img.tight{margin-bottom:14px}

/* =============================
   BOUTONS
============================= */

.grid{
  position:relative;
  z-index:3;
  display:grid;
  gap:14px;
}

.grid.two{grid-template-columns:1fr 1fr}
.grid.three{grid-template-columns:repeat(3,1fr);gap:11px}

.btn{
  --main1:#277bd5;
  --main2:#0c4da8;
  --main3:#072b73;
  --edge:#061738;
  --stitch:rgba(255,226,154,.72);
  --tilt:0deg;

  position:relative;
  isolation:isolate;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:96px;
  padding:11px 8px 12px;
  overflow:hidden;
  color:#fff4ce;
  text-decoration:none;
  text-align:center;
  text-transform:uppercase;
  letter-spacing:.6px;
  line-height:.9;
  font-size:clamp(23px,6vw,38px);
  border:6px solid var(--edge);
  border-radius:26px 22px 30px 23px;
  background:
    radial-gradient(circle at 22% 16%,rgba(255,255,255,.34),transparent 28%),
    repeating-linear-gradient(-7deg,rgba(255,255,255,.08) 0 2px,transparent 2px 10px),
    repeating-linear-gradient(7deg,rgba(0,0,0,.10) 0 1px,transparent 1px 11px),
    linear-gradient(145deg,var(--main1) 0%,var(--main2) 56%,var(--main3) 100%);
  box-shadow:
    0 9px 0 rgba(7,24,63,.35),
    0 14px 0 rgba(0,0,0,.13),
    inset 0 0 0 4px rgba(255,221,132,.26),
    inset 0 -12px 18px rgba(0,0,0,.22),
    inset 0 8px 16px rgba(255,255,255,.16);
  text-shadow:
    0 3px 0 rgba(0,0,0,.48),
    2px 5px 0 rgba(94,56,12,.34);
  transform:rotate(var(--tilt));
  -webkit-tap-highlight-color:transparent;
}

.btn::before{
  content:"";
  position:absolute;
  z-index:2;
  inset:8px;
  border:3px dashed var(--stitch);
  border-radius:18px 16px 21px 17px;
  pointer-events:none;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.25));
}

.btn::after{
  content:"";
  position:absolute;
  z-index:1;
  inset:-12px;
  background:
    radial-gradient(circle at 12% 15%,rgba(255,238,181,.24),transparent 18%),
    radial-gradient(circle at 84% 86%,rgba(0,0,0,.22),transparent 24%),
    repeating-radial-gradient(circle at 30% 40%,rgba(255,232,160,.13) 0 1px,transparent 1px 7px);
  opacity:.75;
  mix-blend-mode:overlay;
  pointer-events:none;
}

.btn span{
  position:relative;
  z-index:4;
  display:block;
}

.btn .icon{
  display:block;
  margin-bottom:7px;
  font-size:1.18em;
  line-height:.85;
  filter:
    drop-shadow(0 3px 0 rgba(0,0,0,.33))
    drop-shadow(0 0 2px rgba(255,226,154,.35));
}

.btn .mini{
  display:block;
  margin-top:6px;
  font-size:.50em;
  line-height:1;
  opacity:.95;
}

.btn:active{
  transform:translateY(4px) rotate(var(--tilt));
  box-shadow:
    0 5px 0 rgba(7,24,63,.34),
    0 9px 0 rgba(0,0,0,.12),
    inset 0 0 0 4px rgba(255,221,132,.26),
    inset 0 -10px 16px rgba(0,0,0,.22);
}

/* Couleurs par bouton */
.btn-day{--tilt:-.55deg;--main1:#34b7ff;--main2:#086bd2;--main3:#063f98;--edge:#051940;--stitch:rgba(255,230,137,.76)}
.btn-night{--tilt:.45deg;--main1:#243a74;--main2:#071a45;--main3:#020812;--edge:#061129;--stitch:rgba(214,187,112,.72)}
.btn-chief{--tilt:-.35deg;--main1:#b75aff;--main2:#7130b5;--main3:#3d145f;--edge:#15072a;--stitch:rgba(255,210,138,.68)}

.btn-print{--tilt:-.45deg;--main1:#1fc9cf;--main2:#077f8d;--main3:#045260;--edge:#052b40;--stitch:rgba(232,226,150,.70)}
.btn-agenda{--tilt:.38deg;--main1:#26d8d0;--main2:#078f92;--main3:#055668;--edge:#052b40;--stitch:rgba(232,226,150,.70)}

.btn-formations{--tilt:-.50deg;--main1:#ffb43a;--main2:#f07c00;--main3:#b74d00;--edge:#061738;--stitch:rgba(255,229,145,.74)}
.btn-stagiaires{--tilt:.45deg;--main1:#ffe165;--main2:#f2ae12;--main3:#ce7600;--edge:#061738;--stitch:rgba(255,245,175,.70);color:#fff7d8}

.change-btn{
  --tilt:-.15deg;
  --main1:#ff5157;
  --main2:#dc0917;
  --main3:#930711;
  --edge:#160715;
  --stitch:rgba(255,213,116,.76);
  width:100%;
  min-height:82px;
  font-size:clamp(26px,7vw,46px);
  border-radius:24px 19px 28px 20px;
}

.btn-ios{--tilt:-.45deg;--main1:#3db9ff;--main2:#0c6ed5;--main3:#083c91;--edge:#061738;--stitch:rgba(255,230,150,.72)}
.btn-android{--tilt:.45deg;--main1:#35d864;--main2:#12873d;--main3:#075324;--edge:#061738;--stitch:rgba(255,230,150,.72)}
.btn-ics{--tilt:-.15deg;grid-column:1/-1;min-height:86px;--main1:#a66cff;--main2:#6530af;--main3:#3d176e;--edge:#100722;--stitch:rgba(255,222,142,.72)}

/* Ajustements par section */
.hero-card .btn{min-height:124px;font-size:clamp(25px,6.5vw,43px)}
.personal-card .btn,.org-card .btn{min-height:106px}
.subscribe-card .btn{min-height:92px}

/* =============================
   RESPONSIVE
============================= */

@media(max-width:520px){
  .page{padding:8px 10px 42px}
  .hand-card{margin:16px 0 29px;padding:14px 10px 15px;border-width:5px;border-radius:30px 25px 33px 26px}
  .hero-card{margin-top:4px}
  .hand-card::before{inset:7px;border-width:2px}
  .scene-img{border-width:5px;border-radius:23px 20px 26px 20px;margin-bottom:12px}
  .block-title{font-size:clamp(34px,8.4vw,52px);margin:14px 0 17px}
  .grid{gap:12px}
  .grid.three{gap:8px}
  .btn{min-height:86px;padding:9px 6px;border-width:5px;border-radius:22px 18px 25px 19px;font-size:clamp(20px,5.5vw,30px)}
  .btn::before{inset:7px;border-width:2px}
  .btn .icon{margin-bottom:6px;font-size:1.14em}
  .hero-card .btn{min-height:112px;font-size:clamp(22px,6vw,33px)}
  .personal-card .btn,.org-card .btn{min-height:96px}
  .change-btn{min-height:72px;font-size:clamp(24px,6.6vw,36px)}
  .subscribe-card .btn{min-height:82px}
  .btn-ics{min-height:78px}
}

@media(max-width:390px){
  .grid.three{gap:7px}
  .btn{font-size:19px}
  .hero-card .btn{font-size:21px}
  .block-title{font-size:32px}
}
</style>
</head>

<body>
<main class="page">

  <!-- 1. ACCUEIL + PLANNING OFFICIEL -->
  <section class="hand-card hero-card" id="accueil">
    <img class="scene-img" src="Image/Bannière/01-accueil-planning-acces.png" alt="Planning et accès faciles GHE">

    <div class="grid three" aria-label="Planning officiel">
      <a class="btn btn-day" href="mois.html?type=jour">
        <span><span class="icon">☀️</span>JOUR</span>
      </a>
      <a class="btn btn-night" href="mois.html?type=nuit">
        <span><span class="icon">🌙</span>NUIT</span>
      </a>
      <a class="btn btn-chief" href="mois.html?type=chef">
        <span><span class="icon">👥</span>CHEF</span>
      </a>
    </div>
  </section>

  <!-- 2. MON PLANNING PERSONNEL -->
  <section class="hand-card personal-card" id="mon-planning">
    <img class="scene-img tight" src="Image/Bannière/02-mon-planning-personnel.png" alt="Agents consultant leur planning personnel sur papier, téléphone et tablette">

    <h2 class="block-title small-title">Mon planning personnel</h2>

    <div class="grid two" aria-label="Mon planning personnel">
      <a class="btn btn-print" href="mois.html?type=pdf">
        <span><span class="icon">🖨️</span>CAPTURE<br>& IMPRIMER</span>
      </a>
      <a class="btn btn-agenda" href="mois.html?type=ics">
        <span><span class="icon">📅</span>AJOUTER<br>À MON AGENDA</span>
      </a>
    </div>
  </section>

  <!-- 3. ORGANISATION -->
  <section class="hand-card org-card" id="organisation">
    <img class="scene-img tight" src="Image/Bannière/03-organisation.png" alt="Équipe de brancardiers autour d'un plan d'organisation">

    <h2 class="block-title">Organisation</h2>

    <div class="grid two" aria-label="Organisation">
      <a class="btn btn-formations" href="/formations.html">
        <span><span class="icon">📋</span>FORMATIONS</span>
      </a>
      <a class="btn btn-stagiaires" href="/stagiaires.html">
        <span><span class="icon">🎓</span>STAGIAIRES</span>
      </a>
    </div>
  </section>

  <!-- 4. DEMANDER UN CHANGEMENT -->
  <section class="hand-card change-card" id="demander-changement">
    <img class="scene-img tight" src="Image/Bannière/04-demander-changement.png" alt="Demande de changement de planning">

    <a class="btn change-btn" href="https://docs.google.com/forms/d/e/1FAIpQLSeSD74DbSRNuiu1gF2waVTPdSg38jwRCwk3mp6XwpX-sRyh_g/viewform" target="_blank" rel="noopener">
      <span>DEMANDER UN CHANGEMENT</span>
    </a>
  </section>

  <!-- 5. S'ABONNER AU PLANNING -->
  <section class="hand-card subscribe-card" id="abonnement">
    <img class="scene-img tight" src="Image/Bannière/05-abonnement-planning.png" alt="Abonnement au planning avec iPhone Android et fichier ICS">

    <h2 class="block-title small-title">S’abonner au planning</h2>

    <div class="grid two" aria-label="S'abonner au planning">
      <a class="btn btn-ios" href="webcal://calendar.google.com/calendar/ical/ca4fd5e66513b5e783fba86f6df8e1f73dbd237fc1f83749f3cabb97d273d969%40group.calendar.google.com/private-5a1892e376d3c9b3cc82c5f0ad61c333/basic.ics">
        <span><span class="icon">🍎</span>iOS<span class="mini">iPhone / iPad</span></span>
      </a>
      <a class="btn btn-android" href="https://calendar.google.com/calendar/render?cid=https%3A%2F%2Fcalendar.google.com">
        <span><span class="icon">🤖</span>ANDROID</span>
      </a>
      <a class="btn btn-ics" href="mois.html?type=collectif-ics">
        <span><span class="icon">⬇️</span>IMPORT MANUEL (.ICS)<span class="mini">Télécharger le calendrier</span></span>
      </a>
    </div>
  </section>

</main>
</body>
</html>
