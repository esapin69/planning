    * { box-sizing:border-box; }

    body {

      color:var(--ink);

    a { color:inherit; text-decoration:none; -webkit-tap-highlight-color:transparent; }

    .page {

      margin:0 auto;
      padding:20px 14px 42px;
      overflow:hidden;

    .signature { position:relative; text-align:center; padding:4px 0 20px; }

      position:absolute;
      color:#0b95d2;
      font-size:38px;
      font-weight:900;
      transform:rotate(-17deg);

    .spark.left { left:20px; top:42px; }
    .spark.right { right:20px; top:122px; transform:rotate(19deg); }

      position:absolute;

      background:#ffd23f;

    }
