<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>GHE — Formations</title>

<style>
*,*::before,*::after{box-sizing:border-box}

:root{
  --ink:#07183f;
  --ink-soft:#263653;

  --cream:#fff7dd;
  --card:#fffaf0;
  --card-soft:#fff6dc;

  --line:#132752;
  --line-soft:rgba(7,24,63,.18);

  --danger:#b42318;
  --danger-line:#c43a2f;
  --danger-bg:#fff1ed;

  --warning:#8a4b00;
  --warning-line:#d2a631;
  --warning-bg:#fff6d8;

  --ok:#166534;
  --ok-line:#2f8f4e;
  --ok-bg:#edf9f1;

  --muted:#6b7280;
  --shadow:0 6px 0 rgba(7,24,63,.14);

  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --display:Impact,"Arial Black",system-ui,sans-serif;
}

html,body{
  margin:0;
  min-height:100vh;
}

body{
  font-family:var(--font);
  background:var(--cream);
  color:var(--ink);
}

.page{
  width:min(1080px,100%);
  margin:auto;
  padding:calc(10px + env(safe-area-inset-top)) 8px calc(130px + env(safe-area-inset-bottom));
}

/* NAV */

.topbar{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.navbtn{
  min-height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:8px 14px;
  border:3px solid var(--line);
  border-radius:18px;
  background:var(--card);
  color:var(--ink);
  text-decoration:none;
  font-size:20px;
  font-weight:950;
  box-shadow:0 4px 0 rgba(7,24,63,.14);
}

/* HERO */

.hero{
  border:4px solid var(--line);
  border-radius:24px;
  overflow:hidden;
  background:var(--ink);
  box-shadow:var(--shadow);
  margin-bottom:12px;
}

.hero img{
  display:block;
  width:100%;
  height:clamp(118px,28vw,220px);
  object-fit:cover;
}

/* PILOTAGE */

.pilot{
  background:var(--card);
  border:4px solid var(--line);
  border-radius:22px;
  padding:12px;
  box-shadow:var(--shadow);
  margin-bottom:10px;
}

.pilot-main{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.pilot-title{
  font-weight:950;
  font-size:20px;
  line-height:1.1;
}

.pilot-sub{
  margin-top:3px;
  color:var(--ink-soft);
  font-size:14px;
  font-weight:850;
}

.pilot-badge{
  flex:0 0 auto;
  border-radius:999px;
  padding:8px 10px;
  font-weight:950;
  font-size:14px;
  border:2px solid transparent;
  white-space:nowrap;
}

.pilot.ok .pilot-badge{
  background:var(--ok-bg);
  color:var(--ok);
  border-color:#b7e0c5;
}

.pilot.warning .pilot-badge{
  background:var(--warning-bg);
  color:var(--warning);
  border-color:#ecd27f;
}

.pilot.danger .pilot-badge{
  background:var(--danger-bg);
  color:var(--danger);
  border-color:#efb1b1;
}

.pilot-line{
  margin-top:10px;
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.mini-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:30px;
  padding:6px 9px;
  border-radius:999px;
  background:var(--card-soft);
  border:2px solid var(--line-soft);
  font-size:14px;
  font-weight:900;
}

.mini-pill.danger{
  background:var(--danger-bg);
  color:var(--danger);
  border-color:#efb1b1;
}

.mini-pill.warning{
  background:var(--warning-bg);
  color:var(--warning);
  border-color:#ecd27f;
}

/* OUTILS */

.tools{
  display:grid;
  gap:8px;
  margin-bottom:14px;
}

.search{
  width:100%;
  min-height:46px;
  border:3px solid var(--line);
  border-radius:16px;
  padding:8px 12px;
  font-size:16px;
  font-weight:850;
  background:var(--card);
  color:var(--ink);
  outline:none;
  box-shadow:0 4px 0 rgba(7,24,63,.12);
}

.search::placeholder{
  color:rgba(7,24,63,.38);
}

.filters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:2px;
}

.filter-btn{
  flex:0 0 auto;
  border:3px solid var(--line);
  border-radius:999px;
  background:var(--card);
  color:var(--ink);
  padding:8px 11px;
  font-size:14px;
  font-weight:950;
  cursor:pointer;
  box-shadow:0 3px 0 rgba(7,24,63,.12);
}

.filter-btn.active{
  background:var(--ink);
  color:var(--cream);
}

/* TITRES */

.section-label{
  margin:18px 4px 8px;
  color:rgba(7,24,63,.62);
  text-transform:uppercase;
  font-size:13px;
  font-weight:950;
  letter-spacing:.6px;
}

.day-title{
  margin:24px 4px 10px;
  font-family:var(--display);
  font-size:clamp(34px,9vw,62px);
  line-height:.88;
  letter-spacing:-1px;
  text-transform:uppercase;
  text-shadow:0 3px 0 #f8d67d;
}

/* FORMATION */

.formation-card{
  background:var(--card);
  border:4px solid var(--line);
  border-radius:24px;
  padding:12px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}

.formation-card.ok{border-color:var(--ok-line)}
.formation-card.warning{border-color:var(--warning-line)}
.formation-card.danger{border-color:var(--danger-line)}

.formation-head{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:start;
  margin-bottom:10px;
}

.formation-title{
  font-family:var(--display);
  font-size:clamp(30px,8vw,46px);
  line-height:.92;
  letter-spacing:-.8px;
  text-transform:uppercase;
}

.formation-meta{
  margin-top:5px;
  font-family:var(--font);
  font-size:16px;
  line-height:1.15;
  font-weight:950;
  color:var(--ink-soft);
}

.status{
  border-radius:999px;
  padding:7px 10px;
  border:2px solid transparent;
  font-size:14px;
  font-weight:950;
  white-space:nowrap;
}

.status.ok{
  background:var(--ok-bg);
  color:var(--ok);
  border-color:#b7e0c5;
}

.status.warning{
  background:var(--warning-bg);
  color:var(--warning);
  border-color:#ecd27f;
}

.status.danger{
  background:var(--danger-bg);
  color:var(--danger);
  border-color:#efb1b1;
}

.formation-detail{
  margin:8px 0 10px;
  padding:10px 11px;
  border:2px solid rgba(7,24,63,.16);
  border-radius:16px;
  background:var(--card-soft);
}

.detail-label{
  display:block;
  margin-bottom:3px;
  color:rgba(7,24,63,.58);
  font-size:12px;
  font-weight:950;
  letter-spacing:.5px;
  text-transform:uppercase;
}

.detail-value{
  font-size:17px;
  line-height:1.2;
  font-weight:900;
}

/* ALERTES GENERALES */

.alert{
  margin:9px 0;
  padding:9px 11px;
  border-radius:16px;
  border:2px solid transparent;
  font-size:15px;
  font-weight:850;
  line-height:1.25;
}

.alert.danger{
  background:var(--danger-bg);
  color:var(--danger);
  border-color:#efb1b1;
}

.alert.warning{
  background:var(--warning-bg);
  color:var(--warning);
  border-color:#ecd27f;
}

.alert-title{
  font-weight:950;
  margin-bottom:5px;
}

.alert ul{
  margin:0;
  padding-left:20px;
}

.alert li{
  margin:3px 0;
}

.alert-name{
  font-weight:950;
  text-decoration:underline;
  text-underline-offset:3px;
}

/* AGENTS */

.agent-list{
  display:grid;
  gap:9px;
  margin-top:10px;
}

.agent-card{
  display:grid;
  grid-template-columns:82px minmax(0,1fr);
  gap:10px;
  align-items:start;
  padding:9px;
  border-radius:20px;
  border:3px solid var(--line-soft);
  background:var(--card-soft);
}

.agent-card.ok{
  border-color:rgba(47,143,78,.28);
}

.agent-card.warning{
  background:#fff8df;
  border-color:#e2c060;
}

.agent-card.danger{
  background:#fff4f1;
  border-color:#e7a29d;
}

.avatar{
  width:76px;
  height:76px;
  border-radius:18px;
  background:#eef3ff;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.avatar img{
  max-width:96%;
  max-height:96%;
  width:auto;
  height:auto;
  object-fit:contain;
  display:block;
}

.avatar .initials{
  width:58px;
  height:58px;
  border-radius:15px;
  border:3px solid var(--line);
  background:var(--card);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--display);
  font-size:21px;
}

.avatar.has-img .initials{
  display:none;
}

.agent-content{
  min-width:0;
}

.agent-name-row{
  display:flex;
  gap:7px;
  align-items:flex-start;
  margin-bottom:7px;
}

.agent-status{
  width:27px;
  height:27px;
  flex:0 0 27px;
  border-radius:9px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  line-height:1;
  border:2px solid transparent;
}

.agent-status.ok{
  background:var(--ok-bg);
  color:var(--ok);
  border-color:#b7e0c5;
}

.agent-status.warning{
  background:var(--warning-bg);
  color:var(--warning);
  border-color:#ecd27f;
}

.agent-status.danger{
  background:var(--danger-bg);
  color:var(--danger);
  border-color:#efb1b1;
}

.agent-name{
  font-size:clamp(21px,5.6vw,31px);
  line-height:1;
  font-weight:950;
  letter-spacing:-.6px;
  text-transform:uppercase;
  word-break:normal;
  overflow-wrap:normal;
  hyphens:none;
}

.agent-card.warning .agent-name{
  color:#744000;
}

.agent-card.danger .agent-name{
  color:var(--danger);
}

.agent-chips{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.chip{
  min-height:29px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 8px;
  border-radius:999px;
  border:2px solid rgba(7,24,63,.16);
  background:var(--card);
  color:var(--ink);
  font-size:14px;
  line-height:1.05;
  font-weight:900;
}

.chip a{
  color:#064ee4;
  font-weight:950;
}

.chip.warning{
  background:var(--warning-bg);
  color:var(--warning);
  border-color:#ecd27f;
}

.chip.danger{
  background:var(--danger-bg);
  color:var(--danger);
  border-color:#efb1b1;
}

.chip.ok{
  background:var(--ok-bg);
  color:var(--ok);
  border-color:#b7e0c5;
}

.agent-alerts{
  margin-top:7px;
  display:grid;
  gap:5px;
}

.agent-alert{
  padding:7px 9px;
  border-radius:13px;
  border:2px solid transparent;
  font-size:14px;
  line-height:1.2;
  font-weight:850;
}

.agent-alert.warning{
  background:var(--warning-bg);
  color:var(--warning);
  border-color:#ecd27f;
}

.agent-alert.danger{
  background:var(--danger-bg);
  color:var(--danger);
  border-color:#efb1b1;
}

.source{
  margin-top:9px;
  color:rgba(7,24,63,.50);
  font-size:12px;
  font-weight:850;
}

/* ETATS */

.empty,.error,.loading{
  background:var(--card);
  border:4px solid var(--line);
  border-radius:20px;
  padding:14px;
  font-weight:900;
  box-shadow:var(--shadow);
}

.error{
  color:var(--danger);
}

/* AGENDA */

.agenda-box{
  margin:26px 0 4px;
  padding:13px;
  background:var(--card);
  border:4px solid var(--line);
  border-radius:24px;
  box-shadow:var(--shadow);
}

.agenda-title{
  margin:0 0 10px;
  font-family:var(--display);
  font-size:clamp(25px,7vw,44px);
  line-height:.92;
  text-align:center;
  text-transform:uppercase;
  letter-spacing:-.8px;
  text-shadow:0 3px 0 #f8d67d;
}

.agenda-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.agenda-btn{
  min-height:62px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  text-decoration:none;
  color:#fff4ce;
  border:4px solid #061738;
  border-radius:20px;
  font-family:var(--display);
  font-size:clamp(21px,5.5vw,34px);
  line-height:.95;
  text-transform:uppercase;
  box-shadow:0 6px 0 rgba(7,24,63,.32);
}

.agenda-btn.ios{
  background:linear-gradient(145deg,#3db9ff 0%,#0c6ed5 56%,#083c91 100%);
}

.agenda-btn.android{
  background:linear-gradient(145deg,#35d864 0%,#12873d 56%,#075324 100%);
}

/* DESKTOP */

@media(min-width:720px){
  .page{
    padding-left:14px;
    padding-right:14px;
  }

  .pilot{
    padding:14px;
  }

  .formation-card{
    padding:15px;
  }

  .agent-card{
    grid-template-columns:92px minmax(0,1fr);
  }

  .avatar{
    width:84px;
    height:84px;
  }
}

@media(max-width:370px){
  .agent-card{
    grid-template-columns:72px minmax(0,1fr);
  }

  .avatar{
    width:66px;
    height:66px;
    border-radius:16px;
  }

  .agent-name{
    font-size:20px;
  }

  .chip{
    font-size:13px;
    padding:5px 7px;
  }
}
</style>
</head>

<body>
<main class="page">

  <div class="topbar">
    <a class="navbtn" href="index.html">← Accueil</a>
    <a class="navbtn" href="stagiaires.html">Stagiaires</a>
  </div>

  <section class="hero">
    <img
      src="Image/Bannière/Page Formation.PNG"
      alt="Formations GHE"
      onerror="this.onerror=null;this.src='Image/Banni%C3%A8re/Page%20Formation.PNG';"
    >
  </section>

  <section id="pilot" class="pilot ok">
    <div class="pilot-main">
      <div>
        <div id="pilotTitle" class="pilot-title">Chargement du cockpit…</div>
        <div id="pilotSub" class="pilot-sub">Analyse des formations à venir</div>
      </div>
      <div id="pilotBadge" class="pilot-badge">…</div>
    </div>

    <div class="pilot-line">
      <span id="pilotFormations" class="mini-pill">📚 0 formation</span>
      <span id="pilotAgents" class="mini-pill">👥 0 agent</span>
      <span id="pilotDanger" class="mini-pill danger">⛔ 0 bloquant</span>
      <span id="pilotWarning" class="mini-pill warning">⚠️ 0 à vérifier</span>
    </div>
  </section>

  <section class="tools">
    <input id="search" class="search" type="search" placeholder="Rechercher formation, agent, GHE, téléphone…">

    <div class="filters">
      <button class="filter-btn active" data-filter="tous">Tous</button>
      <button class="filter-btn" data-filter="traiter">À traiter</button>
      <button class="filter-btn" data-filter="bloquants">Bloquants</button>
      <button class="filter-btn" data-filter="prets">Prêts</button>
    </div>
  </section>

  <div class="section-label">Formations à venir</div>

  <section id="content">
    <div class="loading">Chargement des formations…</div>
  </section>

  <section class="agenda-box">
    <h2 class="agenda-title">Ajouter l’agenda formations</h2>
    <div class="agenda-buttons">
      <a id="btnIos" class="agenda-btn ios" href="#"><span>🍎</span><span>iOS</span></a>
      <a id="btnAndroid" class="agenda-btn android" href="#"><span>🤖</span><span>Android</span></a>
    </div>
  </section>

</main>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzmelNrBU583V3CvOlle3cafAKEAZQ8NAX-peSN6D-yxFO3gX26SnVNUVd5xbwV3CUISg/exec";

const ICS_URL = "https://calendar.google.com/calendar/ical/c5da5df12db0eba65a14410cada08fea4e5a8037ddd256b03e7426cb22cb751b%40group.calendar.google.com/private-4f5072a64d36548137a30abb665ed23f/basic.ics";

let ITEMS = [];
let CURRENT_FILTER = "tous";

document.getElementById("btnIos").href = ICS_URL.replace(/^https:\/\//i, "webcal://");
document.getElementById("btnAndroid").href = "https://calendar.google.com/calendar/render?cid=" + encodeURIComponent(ICS_URL);

document.getElementById("search").addEventListener("input", () => {
  render(filterItems());
});

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    CURRENT_FILTER = btn.dataset.filter;
    render(filterItems());
  });
});

loadJsonp("formations");

function loadJsonp(type){
  const callbackName = "recevoirGhe_" + type + "_" + Date.now();
  const script = document.createElement("script");

  window[callbackName] = function(data){
    delete window[callbackName];
    script.remove();

    if (!data || !data.ok) {
      showError(data && data.erreur ? data.erreur : "Données invalides.");
      return;
    }

    ITEMS = data.items || [];
    updatePilot(ITEMS);
    render(filterItems());
  };

  script.onerror = function(){
    delete window[callbackName];
    script.remove();
    showError("Impossible de charger les données.");
  };

  script.src = WEB_APP_URL
    + "?mode=site_stagiaires_formations"
    + "&type=" + encodeURIComponent(type)
    + "&callback=" + encodeURIComponent(callbackName)
    + "&v=" + Date.now();

  document.body.appendChild(script);
}

/* FILTRAGE */

function filterItems(){
  const q = norm(document.getElementById("search").value);

  return ITEMS.filter(item => {
    const level = itemLevel(item);
    const issueCount = countItemIssues(item).total;

    if (CURRENT_FILTER === "traiter" && issueCount === 0) return false;
    if (CURRENT_FILTER === "bloquants" && level !== "danger") return false;
    if (CURRENT_FILTER === "prets" && issueCount > 0) return false;

    if (!q) return true;

    const agents = item.agents || [];
    const txt = [
      item.titre,
      item.dateLabel,
      item.formation && item.formation.intitule,
      item.formation && item.formation.typeLabel,
      item.formation && item.formation.horaireAffiche,
      agents.map(a => [
        a.nomComplet,
        a.nom,
        a.prenom,
        a.ghe,
        a.telephone,
        a.shift && a.shift.code,
        a.shift && a.shift.label
      ].join(" ")).join(" "),
      item.alertes && item.alertes.bloquantes && item.alertes.bloquantes.join(" "),
      item.alertes && item.alertes.infos && item.alertes.infos.join(" ")
    ].join(" ");

    return norm(txt).includes(q);
  });
}

/* PILOTAGE */

function updatePilot(items){
  const totalFormations = items.length;
  const totalAgents = items.reduce((s,item) => s + ((item.agents || []).length), 0);

  const totals = items.reduce((acc,item) => {
    const c = countItemIssues(item);
    acc.danger += c.danger;
    acc.warning += c.warning;
    acc.total += c.total;
    return acc;
  }, {danger:0, warning:0, total:0});

  const pilot = document.getElementById("pilot");
  const title = document.getElementById("pilotTitle");
  const sub = document.getElementById("pilotSub");
  const badge = document.getElementById("pilotBadge");

  pilot.classList.remove("ok","warning","danger");

  if (totals.danger > 0) {
    pilot.classList.add("danger");
    title.textContent = totals.total + " point" + plural(totals.total) + " à traiter";
    sub.textContent = totals.danger + " bloquant" + plural(totals.danger) + " · " + totals.warning + " à vérifier";
    badge.textContent = "⛔ Bloquant";
  } else if (totals.warning > 0) {
    pilot.classList.add("warning");
    title.textContent = totals.total + " point" + plural(totals.total) + " à vérifier";
    sub.textContent = "Aucun blocage, mais des infos à compléter";
    badge.textContent = "⚠️ À vérifier";
  } else {
    pilot.classList.add("ok");
    title.textContent = "Tout est prêt";
    sub.textContent = "Aucun point bloquant ni information manquante";
    badge.textContent = "✅ Prêt";
  }

  document.getElementById("pilotFormations").textContent = "📚 " + totalFormations + " formation" + plural(totalFormations);
  document.getElementById("pilotAgents").textContent = "👥 " + totalAgents + " agent" + plural(totalAgents);
  document.getElementById("pilotDanger").textContent = "⛔ " + totals.danger + " bloquant" + plural(totals.danger);
  document.getElementById("pilotWarning").textContent = "⚠️ " + totals.warning + " à vérifier";
}

/* RENDU */

function render(items){
  const content = document.getElementById("content");

  if (!items.length) {
    content.innerHTML = `<div class="empty">Aucune formation à afficher avec ce filtre.</div>`;
    return;
  }

  const groups = groupByDate(items);

  content.innerHTML = Object.keys(groups).map(dateKey => {
    const list = groups[dateKey];
    const label = list[0].dateLabel || dateKey;

    return `
      <div class="day-title">${esc(label)}</div>
      ${list.map(cardFormation).join("")}
    `;
  }).join("");
}

function cardFormation(item){
  const formation = item.formation || {};
  const agents = item.agents || [];
  const level = itemLevel(item);
  const general = formationGeneralAlerts(item);

  const title = compactFormationTitle(item);
  const horaire = formation.horaireAffiche || extractHoraire(item.titre) || "";
  const countAgents = agents.length;
  const detail = cleanFormationDetail(formation.intitule, title);

  return `
    <article class="formation-card ${esc(level)}">

      <div class="formation-head">
        <div>
          <div class="formation-title">${esc(title)}</div>
          <div class="formation-meta">
            ${esc([horaire, countAgents + " agent" + plural(countAgents)].filter(Boolean).join(" · "))}
          </div>
        </div>
        <div class="status ${esc(level)}">${statusLabel(level)}</div>
      </div>

      ${detail ? `
        <div class="formation-detail">
          <span class="detail-label">Formation</span>
          <div class="detail-value">${esc(detail)}</div>
        </div>
      ` : ""}

      ${general.danger.length ? alertBlock("danger", "⛔ Alertes générales", general.danger, agents) : ""}
      ${general.warning.length ? alertBlock("warning", "⚠️ Points à vérifier", general.warning, agents) : ""}

      <div class="agent-list">
        ${agents.map(a => agentCard(a, item)).join("")}
      </div>

      <div class="source">Source : DETAIL_FORMATIONS</div>
    </article>
  `;
}

function agentCard(a, item){
  const issues = agentIssues(a, item);
  const level = issues.level;
  const avatar = a.avatar || {};
  const shift = a.shift || {};

  const gheText = formatGhe(a.ghe);
  const telRaw = String(a.telephone || "").trim();
  const telOk = hasUsefulValue(telRaw);
  const telHref = telRaw.replace(/[^\d+]/g, "");

  const shiftText = formatShift(shift);
  const shiftKnown = shiftIsKnown(shiftText);
  const shiftDanger = issues.danger.some(x => norm(x).includes("code non travaille"));

  return `
    <div class="agent-card ${esc(level)}">
      ${avatarHtml(avatar)}

      <div class="agent-content">
        <div class="agent-name-row">
          <span class="agent-status ${esc(level)}">${agentStatusIcon(level)}</span>
          <div class="agent-name">${esc(agentDisplayName(a))}</div>
        </div>

        <div class="agent-chips">
          <span class="chip ${hasUsefulValue(a.ghe) ? "" : "warning"}">${esc(gheText)}</span>

          <span class="chip ${telOk ? "" : "warning"}">
            📞 ${telOk ? `<a href="tel:${esc(telHref)}">${esc(telRaw)}</a>` : "non renseigné"}
          </span>

          <span class="chip ${shiftDanger ? "danger" : (shiftKnown ? "" : "warning")}">
            ${shiftDot(shift)} ${esc(shiftText)}
          </span>
        </div>

        ${agentAlertBlock(issues)}
      </div>
    </div>
  `;
}

function avatarHtml(avatar){
  avatar = avatar || {};
  const initials = esc(avatar.initiales || "?");
  const thumb = avatar.thumb || "";

  if (!thumb) {
    return `<div class="avatar"><div class="initials">${initials}</div></div>`;
  }

  return `
    <div class="avatar has-img">
      <img src="${esc(thumb)}" alt="" loading="lazy" onerror="this.parentElement.classList.remove('has-img');this.remove();">
      <div class="initials">${initials}</div>
    </div>
  `;
}

/* ALERTES */

function countItemIssues(item){
  const agents = item.agents || [];
  const general = formationGeneralAlerts(item);

  let danger = general.danger.length;
  let warning = general.warning.length;

  agents.forEach(a => {
    const issues = agentIssues(a, item);
    danger += issues.danger.length;
    warning += issues.warning.length;
  });

  return {
    danger,
    warning,
    total: danger + warning
  };
}

function itemLevel(item){
  const c = countItemIssues(item);

  if (c.danger > 0) return "danger";
  if (c.warning > 0) return "warning";
  return "ok";
}

function formationGeneralAlerts(item){
  const agents = item.agents || [];
  const bloquantes = (item.alertes && item.alertes.bloquantes) || [];
  const infos = (item.alertes && item.alertes.infos) || [];

  return {
    danger: bloquantes.filter(msg => !agents.some(a => messageMentionsAgent(msg, a))),
    warning: infos.filter(msg => !agents.some(a => messageMentionsAgent(msg, a)))
  };
}

function agentIssues(a, item){
  const bloquantes = ((item.alertes && item.alertes.bloquantes) || [])
    .filter(msg => messageMentionsAgent(msg, a))
    .map(msg => simplifyAgentAlert(msg, a, "danger"));

  const infosOriginal = ((item.alertes && item.alertes.infos) || [])
    .filter(msg => messageMentionsAgent(msg, a));

  const warning = [];

  const missing = [];
  if (!hasUsefulValue(a.ghe)) missing.push("GHE");
  if (!hasUsefulValue(a.telephone)) missing.push("téléphone");

  if (missing.length) {
    warning.push(missingPhrase(missing));
  }

  infosOriginal.forEach(msg => {
    const n = norm(msg);

    if (missing.length && (n.includes("ghe") || n.includes("telephone"))) return;

    pushUnique(warning, simplifyAgentAlert(msg, a, "warning"));
  });

  if (a.agentTrouve === false) {
    pushUnique(bloquantes, "Agent introuvable dans la source agents.");
  }

  const level = bloquantes.length ? "danger" : (warning.length ? "warning" : "ok");

  return {
    level,
    danger: bloquantes,
    warning
  };
}

function agentAlertBlock(issues){
  const danger = issues.danger || [];
  const warning = issues.warning || [];

  if (!danger.length && !warning.length) return "";

  return `
    <div class="agent-alerts">
      ${danger.map(x => `<div class="agent-alert danger">⛔ ${esc(x)}</div>`).join("")}
      ${warning.map(x => `<div class="agent-alert warning">⚠️ ${esc(x)}</div>`).join("")}
    </div>
  `;
}

function alertBlock(type, title, list, agents){
  return `
    <div class="alert ${esc(type)}">
      <div class="alert-title">${esc(title)}</div>
      <ul>${list.map(x => `<li>${formatAlertHTML(x, agents)}</li>`).join("")}</ul>
    </div>
  `;
}

function formatAlertHTML(text, agents){
  let html = esc(text);

  const names = (agents || [])
    .map(a => a && a.nomComplet)
    .filter(Boolean)
    .sort((a,b) => b.length - a.length);

  names.forEach(name => {
    const safeName = esc(name);
    html = html.replace(new RegExp(escapeRegExp(safeName), "gi"), `<strong class="alert-name">$&</strong>`);
  });

  return html;
}

function simplifyAgentAlert(message, a, type){
  let s = String(message || "").trim();

  const names = [
    a.nomComplet,
    a.nom && a.prenom ? a.nom + " " + a.prenom : "",
    a.nom && a.prenom ? a.prenom + " " + a.nom : ""
  ].filter(Boolean);

  names.forEach(name => {
    s = s.replace(new RegExp("^\\s*" + escapeRegExp(name) + "\\s*:\\s*", "i"), "");
  });

  s = s.replace(/prévu sur un code non travaillé\s*:\s*/i, "Code non travaillé : ");
  s = s.replace(/téléphone manquant\.?/i, "Téléphone manquant.");
  s = s.replace(/GHE manquant\.?/i, "GHE manquant.");

  return s.trim();
}

function messageMentionsAgent(message, a){
  const msg = norm(message);
  if (!msg || !a) return false;

  const candidates = [];

  if (a.nomComplet) candidates.push(norm(a.nomComplet));

  if (a.nom && a.prenom) {
    candidates.push(norm(a.nom + " " + a.prenom));
    candidates.push(norm(a.prenom + " " + a.nom));
  }

  if (a.nom && norm(a.nom).length >= 4) candidates.push(norm(a.nom));
  if (a.prenom && norm(a.prenom).length >= 4) candidates.push(norm(a.prenom));

  return candidates.filter(Boolean).some(candidate => msg.includes(candidate));
}

function missingPhrase(parts){
  if (parts.length === 1) return parts[0] + " manquant.";
  if (parts.length === 2) return parts[0] + " et " + parts[1] + " manquants.";

  const last = parts.pop();
  return parts.join(", ") + " et " + last + " manquants.";
}

function pushUnique(list, message){
  const n = norm(message);
  if (!list.some(x => norm(x) === n)) list.push(message);
}

/* FORMATAGE */

function compactFormationTitle(item){
  const formation = item.formation || {};
  const raw = String(item.titre || formation.typeLabel || formation.intitule || "Formation").trim();

  const first = raw.split("|")[0].trim();
  return first || "Formation";
}

function cleanFormationDetail(intitule, title){
  const value = String(intitule || "").trim();
  if (!value) return "";

  const a = norm(value);
  const b = norm(title).replace(/[^\w\s]/g,"").trim();

  if (a === b) return "";
  if (a.includes(b) && b.length > 4) return value;

  return value;
}

function extractHoraire(text){
  const match = String(text || "").match(/\b\d{1,2}[:h]\d{2}\s*[–-]\s*\d{1,2}[:h]\d{2}\b/i);
  return match ? match[0].replace(/h/g,":") : "";
}

function statusLabel(level){
  if (level === "danger") return "⛔ Bloquant";
  if (level === "warning") return "⚠️ À vérifier";
  return "✅ Prêt";
}

function agentStatusIcon(level){
  if (level === "danger") return "⛔";
  if (level === "warning") return "⚠️";
  return "✅";
}

function agentDisplayName(a){
  return String(a.nomComplet || [a.nom, a.prenom].filter(Boolean).join(" ") || "Agent sans nom").trim();
}

function formatGhe(value){
  const raw = String(value || "").trim();

  if (!hasUsefulValue(raw)) return "GHE non renseigné";
  if (/^ghe\b/i.test(raw)) return raw.replace(/^ghe\s+ghe\s+/i, "GHE ");
  return "GHE " + raw;
}

function formatShift(shift){
  shift = shift || {};

  const label = cleanShiftText(shift.label);
  const code = cleanShiftText(shift.code);

  if (label && code) return label + " · " + code;
  if (label) return label;
  if (code) return code;

  return "Shift non connu";
}

function cleanShiftText(value){
  return String(value || "")
    .replace(/[🔵🟢🟡🟠⚪️⚪✅⛔⚠️]/g,"")
    .replace(/\s+/g," ")
    .trim();
}

function shiftIsKnown(text){
  const n = norm(text);
  return !!n && !n.includes("non connu") && !n.includes("inconnu") && !n.includes("non renseigne");
}

function shiftDot(shift){
  const text = norm([
    shift && shift.label,
    shift && shift.code
  ].join(" "));

  if (text.includes("matin") || text === "m") return "🔵";
  if (text.includes("journee") || text === "j") return "🟢";
  if (text.includes("soir") || text === "s") return "🟡";
  if (text.includes("j4")) return "🟠";

  return "⚪";
}

function hasUsefulValue(value){
  const n = norm(value);

  if (!n) return false;
  if (n === "non renseigne") return false;
  if (n === "non renseignee") return false;
  if (n.includes("non renseigne")) return false;
  if (n === "nr") return false;
  if (n === "-") return false;

  return true;
}

/* OUTILS */

function groupByDate(items){
  return items.reduce((acc,item) => {
    const key = item.dateKey || "sans-date";
    if (!acc[key]) acc[key] = [];
    acc[key].push(item);
    return acc;
  }, {});
}

function showError(message){
  document.getElementById("content").innerHTML = `<div class="error">Problème : ${esc(message)}</div>`;
}

function plural(number){
  return Number(number) > 1 ? "s" : "";
}

function esc(value){
  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function norm(value){
  return String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .trim();
}

function escapeRegExp(value){
  return String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}
