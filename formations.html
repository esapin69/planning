<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace stagiaires</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4efe4;
  color:#171717;
}

.page{
  max-width:760px;
  margin:auto;
  padding:14px;
}

.hero{
  width:100%;
  display:block;
  border:4px solid #171717;
  border-radius:26px;
  box-shadow:8px 8px 0 #171717;
  margin-bottom:22px;
}

.intro{
  background:#fffaf0;
  border:4px solid #171717;
  border-radius:24px;
  padding:18px;
  box-shadow:7px 7px 0 #171717;
  margin-bottom:24px;
}

h1{
  margin:0 0 10px;
  font-size:34px;
  line-height:1;
  text-transform:uppercase;
}

.intro p{
  margin:0;
  font-size:17px;
  font-weight:700;
}

.status{
  text-align:center;
  font-weight:800;
  color:#777;
  margin:26px 0;
}

.day-block{
  background:#fffaf0;
  border:4px solid #171717;
  border-radius:26px;
  padding:16px;
  margin-bottom:28px;
  box-shadow:7px 7px 0 #171717;
}

.day-title{
  font-size:25px;
  font-weight:900;
  text-transform:uppercase;
  color:#5f5f5f;
  margin:0 0 16px;
}

.inner-card{
  border:3px solid #171717;
  border-radius:20px;
  padding:14px;
  margin-bottom:14px;
  background:#fffdf7;
}

.inner-card:last-child{
  margin-bottom:0;
}

.card-title{
  font-size:24px;
  font-weight:900;
  text-transform:uppercase;
  border-bottom:3px dashed #171717;
  padding-bottom:8px;
  margin-bottom:14px;
}

.person{
  padding:10px 0;
  border-bottom:2px dashed #c8c0b0;
}

.person:last-child{
  border-bottom:0;
}

.person-name{
  font-size:20px;
  font-weight:900;
  margin-bottom:10px;
}

.line{
  display:grid;
  grid-template-columns:110px 1fr;
  gap:10px;
  margin:7px 0;
  font-size:17px;
}

.label{
  color:#555;
  font-weight:800;
}

.value{
  font-weight:900;
}

.agent-head{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:12px;
}

.avatar{
  width:62px;
  height:62px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #171717;
  background:#eee;
}

.avatar-placeholder{
  width:62px;
  height:62px;
  border-radius:50%;
  border:3px solid #171717;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:900;
  background:#f1d58a;
}

.back{
  display:block;
  width:max-content;
  margin:30px auto 10px;
  padding:13px 20px;
  border:4px solid #171717;
  border-radius:16px;
  background:#fffaf0;
  color:#171717;
  font-size:18px;
  font-weight:900;
  text-decoration:none;
  box-shadow:5px 5px 0 #171717;
}

.empty{
  text-align:center;
  font-size:18px;
  font-weight:900;
  padding:20px;
  border:3px dashed #171717;
  border-radius:18px;
  background:#fffdf7;
}
</style>
</head>

<body>
<div class="page">

  <img class="hero" src="Image/Autre page/Photo_stagiaire.png" alt="Espace stagiaires">

  <section class="intro">
    <h1>Espace stagiaires</h1>
    <p>Retrouve les stagiaires prévus par date, avec l’agent affilié et les informations utiles du jour.</p>
  </section>

  <div id="status" class="status">Chargement des données…</div>

  <main id="results"></main>

  <a class="back" href="index.html">← Retour à l’accueil</a>

</div>

<script>
const API_URL = "";

const demoData = [
  {
    date: "Aujourd’hui",
    stagiaire_nom: "Exemple stagiaire",
    stagiaire_horaire: "08h00 - 16h00",
    agent_nom: "Agent affilié",
    agent_horaire: "08h00 - 16h00",
    agent_telephone: "À renseigner",
    agent_avatar: ""
  }
];

function clean(value){
  return value && String(value).trim() !== "" ? String(value).trim() : "Non renseigné";
}

function getValue(item, keys){
  for(const key of keys){
    if(item[key] !== undefined && item[key] !== null && String(item[key]).trim() !== ""){
      return item[key];
    }
  }
  return "";
}

function groupByDate(data){
  const groups = {};

  data.forEach(item => {
    const date = clean(getValue(item, ["date", "jour", "Date", "Jour"]));

    if(!groups[date]){
      groups[date] = {
        date,
        stagiaires: [],
        agents: {}
      };
    }

    const stagiaireNom = clean(getValue(item, [
      "stagiaire_nom",
      "nom_stagiaire",
      "stagiaire",
      "Stagiaire"
    ]));

    const stagiaireHoraire = clean(getValue(item, [
      "stagiaire_horaire",
      "horaire_stagiaire",
      "horaire",
      "Horaire"
    ]));

    groups[date].stagiaires.push({
      nom: stagiaireNom,
      horaire: stagiaireHoraire
    });

    const agentNom = clean(getValue(item, [
      "agent_nom",
      "nom_agent",
      "agent",
      "Agent"
    ]));

    const agentHoraire = clean(getValue(item, [
      "agent_horaire",
      "horaire_agent",
      "horaire_agent_affilie"
    ]));

    const agentTelephone = clean(getValue(item, [
      "agent_telephone",
      "telephone_agent",
      "telephone",
      "tel",
      "Téléphone"
    ]));

    const agentAvatar = getValue(item, [
      "agent_avatar",
      "avatar_agent",
      "avatar",
      "Avatar"
    ]);

    groups[date].agents[agentNom] = {
      nom: agentNom,
      horaire: agentHoraire,
      telephone: agentTelephone,
      avatar: agentAvatar
    };
  });

  return Object.values(groups);
}

function render(data){
  const results = document.getElementById("results");
  const status = document.getElementById("status");

  if(!data || data.length === 0){
    status.textContent = "";
    results.innerHTML = `<div class="empty">Aucun stagiaire prévu pour le moment.</div>`;
    return;
  }

  const groups = groupByDate(data);

  status.textContent = API_URL ? "Données en direct" : "Mode test : API pas encore branchée.";

  results.innerHTML = groups.map(group => {
    const stagiairesHtml = group.stagiaires.map(stagiaire => `
      <div class="person">
        <div class="person-name">${clean(stagiaire.nom)}</div>
        <div class="line">
          <div class="label">horaire</div>
          <div class="value">${clean(stagiaire.horaire)}</div>
        </div>
      </div>
    `).join("");

    const agentsHtml = Object.values(group.agents).map(agent => `
      <div class="person">
        <div class="agent-head">
          ${
            agent.avatar
            ? `<img class="avatar" src="${agent.avatar}" alt="${clean(agent.nom)}">`
            : `<div class="avatar-placeholder">👤</div>`
          }
          <div class="person-name">${clean(agent.nom)}</div>
        </div>

        <div class="line">
          <div class="label">horaire</div>
          <div class="value">${clean(agent.horaire)}</div>
        </div>

        <div class="line">
          <div class="label">téléphone</div>
          <div class="value">${clean(agent.telephone)}</div>
        </div>
      </div>
    `).join("");

    return `
      <section class="day-block">
        <h2 class="day-title">${group.date}</h2>

        <div class="inner-card">
          <div class="card-title">Stagiaire(s)</div>
          ${stagiairesHtml}
        </div>

        <div class="inner-card">
          <div class="card-title">Agent affilié</div>
          ${agentsHtml}
        </div>
      </section>
    `;
  }).join("");
}

async function loadData(){
  if(!API_URL){
    render(demoData);
    return;
  }

  try{
    const response = await fetch(API_URL);
    const data = await response.json();
    render(Array.isArray(data) ? data : data.resultats);
  }catch(error){
    document.getElementById("status").textContent = "Erreur : impossible de charger les données.";
    render([]);
  }
}

loadData();
setInterval(loadData, 30000);
</script>

</body>
</html>
