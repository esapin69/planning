<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>GHE — Formations</title>

<style>
*,*::before,*::after{box-sizing:border-box}

:root{
  --ink:#07183f;
  --cream:#fff7dd;
  --card:#fffaf0;
  --line:#132752;
  --muted:#69738a;
  --danger:#b42318;
  --danger-bg:#fff1ed;
  --warning:#8a4b00;
  --warning-bg:#fff7db;
  --ok:#166534;
  --ok-bg:#edf9f1;
  --shadow:0 8px 0 rgba(7,24,63,.14);
}

html,body{
  margin:0;
  min-height:100vh;
}

body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#fff7dd;
  color:var(--ink);
}

.page{
  width:min(1080px,100%);
  margin:auto;
  padding:12px 10px 34px;
}

.topbar{
  display:flex;
  gap:8px;
  margin-bottom:12px;
  flex-wrap:wrap;
}

.navbtn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:44px;
  padding:9px 14px;
  border:3px solid var(--line);
  border-radius:16px;
  background:#fffaf0;
  color:var(--ink);
  text-decoration:none;
  font-weight:1000;
  box-shadow:0 4px 0 rgba(7,24,63,.16);
}

.hero{
  border:4px solid var(--line);
  border-radius:26px;
  overflow:hidden;
  background:#07183f;
  box-shadow:var(--shadow);
  margin-bottom:14px;
}

.hero img{
  display:block;
  width:100%;
  height:auto;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin:14px 0;
}

.stat{
  background:#fffaf0;
  border:4px solid var(--line);
  border-radius:20px;
  padding:13px 14px;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  gap:12px;
}

.stat-icon{
  width:52px;
  height:52px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  background:#eef3ff;
}

.stat-number{
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:38px;
  line-height:.9;
}

.stat-label{
  font-weight:1000;
  font-size:15px;
}

.tools{
  display:grid;
  gap:10px;
  margin:14px 0 18px;
}

.search{
  width:100%;
  min-height:54px;
  border:4px solid var(--line);
  border-radius:18px;
  padding:10px 14px;
  font-size:17px;
  font-weight:900;
  color:var(--ink);
  background:#fffaf0;
  outline:none;
  box-shadow:var(--shadow);
}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.filter-btn{
  border:3px solid var(--line);
  border-radius:999px;
  background:#fffaf0;
  color:var(--ink);
  padding:9px 13px;
  font-weight:1000;
  cursor:pointer;
  box-shadow:0 4px 0 rgba(7,24,63,.14);
}

.filter-btn.active{
  background:#07183f;
  color:#fff7dd;
}

.result-separator{
  margin:24px 4px 12px;
  display:flex;
  align-items:center;
  gap:12px;
}

.result-separator::before,
.result-separator::after{
  content:"";
  height:4px;
  flex:1;
  background:#07183f;
  border-radius:99px;
  opacity:.22;
}

.result-separator span{
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:clamp(30px,6vw,52px);
  text-transform:uppercase;
  text-shadow:0 3px 0 #f8d67d;
}

.day-title{
  margin:28px 4px 12px;
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:clamp(34px,7vw,58px);
  line-height:.9;
  text-transform:uppercase;
  text-shadow:0 3px 0 #f8d67d;
}

.formation-card{
  background:#fffaf0;
  border:4px solid var(--line);
  border-radius:24px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}

.formation-card.danger{border-color:var(--danger)}
.formation-card.warning{border-color:#b7791f}
.formation-card.ok{border-color:var(--ok)}

.formation-head{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:start;
  margin-bottom:12px;
}

.formation-title{
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:clamp(27px,5.4vw,44px);
  line-height:.95;
  text-transform:uppercase;
}

.status{
  border-radius:999px;
  padding:8px 12px;
  font-weight:1000;
  white-space:nowrap;
  border:2px solid transparent;
}

.status.ok{
  background:var(--ok-bg);
  color:var(--ok);
  border-color:#b7e0c5;
}

.status.warning{
  background:var(--warning-bg);
  color:var(--warning);
  border-color:#ecd27f;
}

.status.danger{
  background:var(--danger-bg);
  color:var(--danger);
  border-color:#efb1b1;
}

.formation-info{
  display:grid;
  grid-template-columns:1.3fr .7fr .7fr;
  gap:9px;
  margin-bottom:12px;
}

.info{
  background:#fff7dd;
  border:2px solid rgba(7,24,63,.20);
  border-radius:16px;
  padding:10px;
}

.info-label{
  display:block;
  opacity:.62;
  font-size:12px;
  text-transform:uppercase;
  font-weight:1000;
  margin-bottom:4px;
}

.info-value{
  font-weight:1000;
  font-size:16px;
  line-height:1.2;
}

.alert{
  margin:10px 0;
  padding:10px 12px;
  border-radius:16px;
  font-weight:900;
}

.alert.danger{
  background:var(--danger-bg);
  color:var(--danger);
}

.alert.warning{
  background:var(--warning-bg);
  color:var(--warning);
}

.alert ul{
  margin:6px 0 0;
  padding-left:20px;
}

.agent-list{
  display:grid;
  gap:9px;
  margin-top:12px;
}

.agent-card{
  display:grid;
  grid-template-columns:74px 1fr;
  gap:12px;
  align-items:center;
  background:#fff7dd;
  border:2px solid rgba(7,24,63,.18);
  border-radius:18px;
  padding:10px 12px;
}

.avatar{
  width:70px;
  height:70px;
  border:0;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
}

.avatar img{
  max-width:70px;
  max-height:70px;
  width:auto;
  height:auto;
  object-fit:contain;
  display:block;
}

.avatar .initials{
  width:56px;
  height:56px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:3px solid var(--line);
  border-radius:14px;
  background:#fffaf0;
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:20px;
}

.avatar.has-img .initials{
  display:none;
}

.agent-content{
  min-width:0;
}

.agent-name{
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:clamp(23px,4.5vw,36px);
  line-height:.95;
  text-transform:uppercase;
  margin-bottom:8px;
  word-break:break-word;
}

.agent-chips{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:30px;
  padding:5px 9px;
  border-radius:999px;
  background:#fffaf0;
  border:2px solid rgba(7,24,63,.16);
  color:var(--ink);
  font-size:14px;
  font-weight:900;
}

.chip a{
  color:#064ee4;
  font-weight:1000;
}

.source{
  margin-top:12px;
  font-size:13px;
  opacity:.68;
  font-weight:900;
}

.empty,.error,.loading{
  background:#fffaf0;
  border:4px solid var(--line);
  border-radius:22px;
  padding:16px;
  font-weight:1000;
  box-shadow:var(--shadow);
}

.error{
  color:var(--danger);
}

.agenda-box{
  margin:28px 0 4px;
  padding:16px 12px;
  background:#fffaf0;
  border:5px solid var(--line);
  border-radius:26px;
  box-shadow:var(--shadow);
}

.agenda-title{
  margin:0 0 12px;
  text-align:center;
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:clamp(27px,6.3vw,48px);
  line-height:.9;
  text-transform:uppercase;
  text-shadow:0 3px 0 #f8d67d;
}

.agenda-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.agenda-btn{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:3px;
  text-decoration:none;
  color:#fff4ce;
  border:5px solid #061738;
  border-radius:22px;
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:clamp(22px,5vw,36px);
  text-transform:uppercase;
  box-shadow:0 8px 0 rgba(7,24,63,.35);
}

.agenda-btn.ios{
  background:linear-gradient(145deg,#3db9ff 0%,#0c6ed5 56%,#083c91 100%);
}

.agenda-btn.android{
  background:linear-gradient(145deg,#35d864 0%,#12873d 56%,#075324 100%);
}

@media(max-width:820px){
  .stats{
    grid-template-columns:1fr 1fr;
  }

  .formation-head{
    grid-template-columns:1fr;
  }

  .formation-info{
    grid-template-columns:1fr;
  }
}

@media(max-width:620px){
  .page{
    padding:10px 8px 28px;
  }

  .hero{
    border-radius:22px;
    border-width:3px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .stat{
    border-width:3px;
  }

  .formation-card{
    border-width:3px;
    border-radius:21px;
  }

  .agent-card{
    grid-template-columns:64px 1fr;
    padding:9px;
  }

  .avatar,
  .avatar img{
    max-width:60px;
    max-height:60px;
    width:60px;
    height:60px;
  }

  .agent-name{
    font-size:26px;
  }

  .agenda-box{
    border-width:4px;
  }
}
</style>
</head>

<body>
<main class="page">

  <div class="topbar">
    <a class="navbtn" href="index.html">← Accueil</a>
    <a class="navbtn" href="stagiaires.html">Stagiaires</a>
  </div>

  <section class="hero">
    <img
      src="Image/Bannière/Page Formation.PNG"
      alt="Formations GHE"
      onerror="this.onerror=null;this.src='Image/Banni%C3%A8re/Page%20Formation.PNG';"
    >
  </section>

  <section class="stats">
    <div class="stat">
      <div class="stat-icon">📚</div>
      <div>
        <div class="stat-number" id="statTotal">0</div>
        <div class="stat-label">Formations</div>
      </div>
    </div>

    <div class="stat">
      <div class="stat-icon">👥</div>
      <div>
        <div class="stat-number" id="statAgents">0</div>
        <div class="stat-label">Agents</div>
      </div>
    </div>

    <div class="stat">
      <div class="stat-icon">⚠️</div>
      <div>
        <div class="stat-number" id="statAlertes">0</div>
        <div class="stat-label">Alertes</div>
      </div>
    </div>

    <div class="stat">
      <div class="stat-icon">✅</div>
      <div>
        <div class="stat-number" id="statOk">0</div>
        <div class="stat-label">OK</div>
      </div>
    </div>
  </section>

  <section class="tools">
    <input id="search" class="search" type="search" placeholder="Rechercher formation, agent, GHE, téléphone…">

    <div class="filters">
      <button class="filter-btn active" data-filter="tous">Tous</button>
      <button class="filter-btn" data-filter="alertes">Alertes</button>
      <button class="filter-btn" data-filter="ok">OK</button>
    </div>
  </section>

  <div class="result-separator"><span>Résultats</span></div>

  <section id="content">
    <div class="loading">Chargement des formations…</div>
  </section>

  <section class="agenda-box">
    <h2 class="agenda-title">Ajouter l’agenda formations</h2>
    <div class="agenda-buttons">
      <a id="btnIos" class="agenda-btn ios" href="#"><span>🍎</span><span>iOS</span></a>
      <a id="btnAndroid" class="agenda-btn android" href="#"><span>🤖</span><span>Android</span></a>
    </div>
  </section>

</main>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzmelNrBU583V3CvOlle3cafAKEAZQ8NAX-peSN6D-yxFO3gX26SnVNUVd5xbwV3CUISg/exec";

const ICS_URL = "https://calendar.google.com/calendar/ical/c5da5df12db0eba65a14410cada08fea4e5a8037ddd256b03e7426cb22cb751b%40group.calendar.google.com/private-4f5072a64d36548137a30abb665ed23f/basic.ics";

let ITEMS = [];
let CURRENT_FILTER = "tous";

document.getElementById("btnIos").href = ICS_URL.replace(/^https:\/\//i, "webcal://");
document.getElementById("btnAndroid").href = "https://calendar.google.com/calendar/render?cid=" + encodeURIComponent(ICS_URL);

document.getElementById("search").addEventListener("input", () => {
  render(filterItems());
});

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    CURRENT_FILTER = btn.dataset.filter;
    render(filterItems());
  });
});

loadJsonp("formations");

function loadJsonp(type){
  const callbackName = "recevoirGhe_" + type + "_" + Date.now();
  const script = document.createElement("script");

  window[callbackName] = function(data){
    delete window[callbackName];
    script.remove();

    if (!data || !data.ok) {
      showError(data && data.erreur ? data.erreur : "Données invalides.");
      return;
    }

    ITEMS = data.items || [];
    updateStats(ITEMS);
    render(filterItems());
  };

  script.onerror = function(){
    delete window[callbackName];
    script.remove();
    showError("Impossible de charger les données.");
  };

  script.src = WEB_APP_URL
    + "?mode=site_stagiaires_formations"
    + "&type=" + encodeURIComponent(type)
    + "&callback=" + encodeURIComponent(callbackName)
    + "&v=" + Date.now();

  document.body.appendChild(script);
}

function filterItems(){
  const q = norm(document.getElementById("search").value);

  return ITEMS.filter(item => {
    if (CURRENT_FILTER === "alertes" && item.niveau === "ok") return false;
    if (CURRENT_FILTER === "ok" && item.niveau !== "ok") return false;

    if (!q) return true;

    const agents = item.agents || [];
    const txt = [
      item.titre,
      item.dateLabel,
      item.formation && item.formation.intitule,
      item.formation && item.formation.typeLabel,
      agents.map(a => [
        a.nomComplet,
        a.nom,
        a.prenom,
        a.ghe,
        a.telephone,
        a.shift && a.shift.code
      ].join(" ")).join(" "),
      item.alertes && item.alertes.bloquantes && item.alertes.bloquantes.join(" "),
      item.alertes && item.alertes.infos && item.alertes.infos.join(" ")
    ].join(" ");

    return norm(txt).includes(q);
  });
}

function updateStats(items){
  const total = items.length;
  const agents = items.reduce((s,x) => s + ((x.agents || []).length), 0);
  const alertes = items.filter(x => x.niveau === "danger" || x.niveau === "warning").length;
  const ok = items.filter(x => x.niveau === "ok").length;

  document.getElementById("statTotal").textContent = total;
  document.getElementById("statAgents").textContent = agents;
  document.getElementById("statAlertes").textContent = alertes;
  document.getElementById("statOk").textContent = ok;
}

function render(items){
  const content = document.getElementById("content");

  if (!items.length) {
    content.innerHTML = `<div class="empty">Aucune formation à venir pour le moment.</div>`;
    return;
  }

  const groups = groupByDate(items);

  content.innerHTML = Object.keys(groups).map(dateKey => {
    const list = groups[dateKey];
    const label = list[0].dateLabel || dateKey;

    return `
      <div class="day-title">${esc(label)}</div>
      ${list.map(cardFormation).join("")}
    `;
  }).join("");
}

function cardFormation(item){
  const formation = item.formation || {};
  const agents = item.agents || [];
  const bloquantes = (item.alertes && item.alertes.bloquantes) || [];
  const infos = (item.alertes && item.alertes.infos) || [];
  const controles = item.controles || {};

  return `
    <article class="formation-card ${esc(item.niveau || "ok")}">

      <div class="formation-head">
        <div class="formation-title">${esc(item.titre || "")}</div>
        <div class="status ${esc(item.niveau || "ok")}">${statusLabel(item.niveau)}</div>
      </div>

      <div class="formation-info">
        <div class="info">
          <span class="info-label">Formation</span>
          <div class="info-value">${esc(formation.intitule || "")}</div>
        </div>

        <div class="info">
          <span class="info-label">Horaire</span>
          <div class="info-value">${esc(formation.horaireAffiche || "")}</div>
        </div>

        <div class="info">
          <span class="info-label">Agents</span>
          <div class="info-value">👥 ${esc(controles.nombreAgents || agents.length)}</div>
        </div>
      </div>

      ${bloquantes.length ? alertBlock("danger", "⛔️ Alertes bloquantes", bloquantes) : ""}
      ${infos.length ? alertBlock("warning", "⚠️ À vérifier", infos) : ""}

      <div class="agent-list">
        ${agents.map(agentCard).join("")}
      </div>

      <div class="source">
        Source : DETAIL_FORMATIONS
      </div>
    </article>
  `;
}

function agentCard(a){
  const shift = a.shift || {};
  const tel = a.telephone || "";
  const avatar = a.avatar || {};

  return `
    <div class="agent-card">
      ${avatarHtml(avatar)}

      <div class="agent-content">
        <div class="agent-name">${a.agentTrouve ? "✅ " : "⛔️ "}${esc(a.nomComplet || "")}</div>

        <div class="agent-chips">
          <span class="chip">GHE ${esc(a.ghe || "non renseigné")}</span>
          <span class="chip">📞 ${tel ? `<a href="tel:${esc(tel)}">${esc(tel)}</a>` : "non renseigné"}</span>
          <span class="chip">${esc((shift.label || "") + (shift.code ? " · " + shift.code : "")) || "Shift non connu"}</span>
        </div>
      </div>
    </div>
  `;
}

function avatarHtml(avatar){
  avatar = avatar || {};
  const initials = esc(avatar.initiales || "?");
  const thumb = avatar.thumb || "";

  if (!thumb) {
    return `<div class="avatar"><div class="initials">${initials}</div></div>`;
  }

  return `
    <div class="avatar has-img">
      <img src="${esc(thumb)}" alt="" loading="lazy" onerror="this.parentElement.classList.remove('has-img');this.remove();">
      <div class="initials">${initials}</div>
    </div>
  `;
}

function statusLabel(niveau){
  if (niveau === "danger") return "⛔ Bloquant";
  if (niveau === "warning") return "⚠️ À vérifier";
  return "✅ OK";
}

function alertBlock(type, title, list){
  return `
    <div class="alert ${type}">
      <div><strong>${esc(title)}</strong></div>
      <ul>${list.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    </div>
  `;
}

function groupByDate(items){
  return items.reduce((acc,item) => {
    const key = item.dateKey || "sans-date";
    if (!acc[key]) acc[key] = [];
    acc[key].push(item);
    return acc;
  }, {});
}

function showError(message){
  document.getElementById("content").innerHTML = `<div class="error">Problème : ${esc(message)}</div>`;
}

function esc(value){
  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function norm(value){
  return String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .trim();
}
</script>
</body>
</html>
