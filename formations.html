<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formations GHE</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:radial-gradient(circle at top,#fff9e8 0,#f6edcf 55%,#efe2bb 100%);
  color:#07183f;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

.page{
  max-width:760px;
  margin:auto;
  padding:24px 16px 44px;
}

.header{
  text-align:center;
  margin:10px 0 26px;
}

h1{
  font-size:48px;
  line-height:.95;
  margin:0;
  font-weight:1000;
  letter-spacing:1px;
  text-shadow:0 3px 0 rgba(255,200,70,.55);
}

h2{
  margin:10px 0 0;
  font-size:25px;
  color:#0876b8;
  font-weight:1000;
}

.box{
  background:#fff8e9;
  border:4px solid #07183f;
  border-radius:28px;
  padding:24px 16px 20px;
  margin:26px 0;
  box-shadow:0 12px 0 rgba(7,24,63,.18), inset 0 0 0 2px rgba(255,199,44,.22);
}

.title{
  display:inline-block;
  position:relative;
  left:50%;
  transform:translateX(-50%) rotate(-1deg);
  background:#ead39a;
  border:3px solid #07183f;
  border-radius:10px;
  padding:8px 18px;
  margin:-8px auto 20px;
  font-size:24px;
  font-weight:1000;
  text-align:center;
  box-shadow:0 6px 0 rgba(7,24,63,.2);
  text-transform:uppercase;
}

.text{
  font-size:19px;
  font-weight:800;
  line-height:1.35;
  text-align:center;
  margin:0 0 18px;
}

.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}

.btn{
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:88px;
  padding:14px;
  border:4px solid #07183f;
  border-radius:24px;
  color:#f8f0dc;
  font-size:24px;
  font-weight:1000;
  line-height:1.05;
  text-align:center;
  text-decoration:none;
  letter-spacing:.3px;
  box-shadow:0 9px 0 rgba(0,0,0,.28), inset 0 0 0 3px rgba(255,199,44,.5);
  text-shadow:0 2px 0 rgba(0,0,0,.28);
}

.btn::after{
  content:"";
  position:absolute;
  inset:8px;
  border:2px dashed rgba(255,218,110,.55);
  border-radius:17px;
}

.btn span{
  position:relative;
  z-index:1;
}

.orange{background:linear-gradient(145deg,#ff9f1c,#d45b00)}
.blue{background:linear-gradient(145deg,#0b85ff,#064fc0)}
.purple{background:linear-gradient(145deg,#7a3fc2,#45207f)}
.navy{background:linear-gradient(145deg,#10285f,#020b24)}

.small{
  min-height:62px;
  font-size:21px;
}

@media(max-width:520px){
  .page{padding:18px 12px 36px}
  h1{font-size:42px}
  h2{font-size:23px}
  .title{font-size:21px}
  .btn{font-size:21px;min-height:80px}
  .small{font-size:19px}
}
</style>
</head>

<body>
<div class="page">

  <div class="header">
    <h1>FORMATIONS</h1>
    <h2>dates, documents & retours</h2>
  </div>

  <div class="box">
    <div class="title">Dates formations</div>
    <p class="text">
      Consulte ici les dates, horaires et documents mis à jour.
    </p>
    <div class="grid">
      <a class="btn orange" href="https://drive.google.com/drive/folders/16_VrofzHjShXW4uhXKeeugsPdQURDdyk" target="_blank" rel="noopener">
        <span>OUVRIR LES DATES<br>DE FORMATION 📁</span>
      </a>
    </div>
  </div>

  <div class="box">
    <div class="title">Retour formation</div>
    <p class="text">
      Après une formation, remplis le formulaire pour indiquer ce qui a été dit.
    </p>
    <div class="grid">
      <a class="btn blue" href="https://docs.google.com/forms/d/1toa3uNjlocKOdH_Y41UQSF2QNm_CtmKEX6Kb1o0AHrs/viewform" target="_blank" rel="noopener">
        <span>REMPLIR LE<br>FORMULAIRE 📝</span>
      </a>
    </div>
  </div>

  <div class="box">
    <div class="grid">
      <a class="btn navy small" href="index.html">
        <span>RETOUR ACCUEIL ⬅️</span>
      </a>
    </div>
  </div>

</div>
</body>
</html>
