<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>GHE — Formations</title>

<style>
*,*::before,*::after{box-sizing:border-box}

:root{
  --ink:#07183f;
  --ink-soft:#243457;

  --cream:#fff7dd;
  --card:#fffaf0;
  --card-2:#fff7dd;

  --line:#132752;
  --line-soft:rgba(7,24,63,.18);

  --muted:#69738a;

  --danger:#b42318;
  --danger-line:#c0392b;
  --danger-bg:#fff1ed;

  --warning:#8a4b00;
  --warning-line:#d09321;
  --warning-bg:#fff7db;

  --ok:#166534;
  --ok-line:#2f8f4e;
  --ok-bg:#edf9f1;

  --blue-soft:#eef3ff;
  --shadow:0 8px 0 rgba(7,24,63,.14);

  --font-base:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --font-display:Impact,"Arial Black",system-ui,sans-serif;
}

html,body{
  margin:0;
  min-height:100vh;
}

body{
  font-family:var(--font-base);
  background:var(--cream);
  color:var(--ink);
}

.page{
  width:min(1080px,100%);
  margin:auto;
  padding:calc(12px + env(safe-area-inset-top)) 10px calc(42px + env(safe-area-inset-bottom));
}

/* =========================
   NAVIGATION
   ========================= */

.topbar{
  display:flex;
  gap:8px;
  margin-bottom:12px;
  flex-wrap:wrap;
}

.navbtn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:44px;
  padding:9px 14px;
  border:3px solid var(--line);
  border-radius:16px;
  background:var(--card);
  color:var(--ink);
  text-decoration:none;
  font-weight:900;
  box-shadow:0 4px 0 rgba(7,24,63,.16);
}

/* =========================
   HERO
   ========================= */

.hero{
  border:4px solid var(--line);
  border-radius:26px;
  overflow:hidden;
  background:#07183f;
  box-shadow:var(--shadow);
  margin-bottom:14px;
}

.hero img{
  display:block;
  width:100%;
  height:auto;
}

/* =========================
   STATS
   ========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin:14px 0;
}

.stat{
  background:var(--card);
  border:4px solid var(--line);
  border-radius:20px;
  padding:13px 14px;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  gap:12px;
}

.stat-icon{
  width:52px;
  height:52px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  background:var(--blue-soft);
  flex:0 0 auto;
}

.stat-number{
  font-family:var(--font-display);
  font-size:38px;
  line-height:.9;
  letter-spacing:-1px;
}

.stat-label{
  font-weight:900;
  font-size:15px;
  letter-spacing:-.2px;
}

/* =========================
   OUTILS
   ========================= */

.tools{
  display:grid;
  gap:10px;
  margin:14px 0 18px;
}

.search{
  width:100%;
  min-height:54px;
  border:4px solid var(--line);
  border-radius:18px;
  padding:10px 14px;
  font-size:18px;
  font-weight:850;
  color:var(--ink);
  background:var(--card);
  outline:none;
  box-shadow:var(--shadow);
}

.search::placeholder{
  color:rgba(7,24,63,.42);
  font-weight:850;
}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.filter-btn{
  border:3px solid var(--line);
  border-radius:999px;
  background:var(--card);
  color:var(--ink);
  padding:9px 13px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 4px 0 rgba(7,24,63,.14);
}

.filter-btn.active{
  background:var(--ink);
  color:var(--cream);
}

/* =========================
   TITRES JOUR / RESULTATS
   ========================= */

.result-separator{
  margin:24px 4px 12px;
  display:flex;
  align-items:center;
  gap:12px;
}

.result-separator::before,
.result-separator::after{
  content:"";
  height:4px;
  flex:1;
  background:var(--ink);
  border-radius:99px;
  opacity:.22;
}

.result-separator span{
  font-family:var(--font-display);
  font-size:clamp(30px,6vw,52px);
  line-height:.92;
  text-transform:uppercase;
  letter-spacing:-1px;
  text-shadow:0 3px 0 #f8d67d;
}

.day-title{
  margin:28px 4px 12px;
  font-family:var(--font-display);
  font-size:clamp(36px,7vw,62px);
  line-height:.9;
  text-transform:uppercase;
  letter-spacing:-1.2px;
  text-shadow:0 3px 0 #f8d67d;
}

/* =========================
   FORMATION
   ========================= */

.formation-card{
  background:var(--card);
  border:4px solid var(--line);
  border-radius:24px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}

.formation-card.danger{border-color:var(--danger-line)}
.formation-card.warning{border-color:var(--warning-line)}
.formation-card.ok{border-color:var(--ok-line)}

.formation-head{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:start;
  margin-bottom:12px;
}

.formation-title{
  font-family:var(--font-display);
  font-size:clamp(28px,5.4vw,46px);
  line-height:.95;
  text-transform:uppercase;
  letter-spacing:-.8px;
}

.status{
  border-radius:999px;
  padding:8px 12px;
  font-weight:900;
  white-space:nowrap;
  border:2px solid transparent;
  font-size:15px;
}

.status.ok{
  background:var(--ok-bg);
  color:var(--ok);
  border-color:#b7e0c5;
}

.status.warning{
  background:var(--warning-bg);
  color:var(--warning);
  border-color:#ecd27f;
}

.status.danger{
  background:var(--danger-bg);
  color:var(--danger);
  border-color:#efb1b1;
}

.formation-info{
  display:grid;
  grid-template-columns:1.3fr .7fr .7fr;
  gap:9px;
  margin-bottom:12px;
}

.info{
  background:var(--card-2);
  border:2px solid rgba(7,24,63,.20);
  border-radius:16px;
  padding:10px;
}

.info-label{
  display:block;
  opacity:.62;
  font-size:12px;
  text-transform:uppercase;
  font-weight:900;
  letter-spacing:.3px;
  margin-bottom:4px;
}

.info-value{
  font-weight:900;
  font-size:16px;
  line-height:1.2;
}

/* =========================
   ALERTES FORMATION
   ========================= */

.alert{
  margin:10px 0;
  padding:11px 12px;
  border-radius:18px;
  font-weight:850;
  line-height:1.25;
  border:3px solid transparent;
}

.alert.danger{
  background:var(--danger-bg);
  color:var(--danger);
  border-color:#efb1b1;
}

.alert.warning{
  background:var(--warning-bg);
  color:var(--warning);
  border-color:#ecd27f;
}

.alert-title{
  display:flex;
  align-items:center;
  gap:7px;
  font-weight:950;
  font-size:18px;
}

.alert ul{
  margin:7px 0 0;
  padding-left:22px;
}

.alert li{
  margin:4px 0;
}

.alert.is-single ul{
  margin-top:6px;
}

.alert-name{
  font-weight:950;
  text-decoration:underline;
  text-underline-offset:3px;
}

/* =========================
   AGENTS
   ========================= */

.agent-list{
  display:grid;
  gap:10px;
  margin-top:12px;
}

.agent-card{
  display:grid;
  grid-template-columns:104px 1fr;
  gap:14px;
  align-items:center;
  background:var(--card-2);
  border:3px solid var(--line-soft);
  border-radius:20px;
  padding:11px 12px;
}

.agent-card.ok{
  border-color:rgba(22,101,52,.25);
}

.agent-card.warning{
  border-color:#e5bf62;
  background:#fff8df;
}

.agent-card.danger{
  border-color:#e7a29d;
  background:#fff6f3;
}

.avatar{
  width:96px;
  height:96px;
  border-radius:20px;
  background:rgba(238,243,255,.72);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex:0 0 auto;
}

.avatar img{
  max-width:96%;
  max-height:96%;
  width:auto;
  height:auto;
  object-fit:contain;
  display:block;
}

.avatar .initials{
  width:72px;
  height:72px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:3px solid var(--line);
  border-radius:18px;
  background:var(--card);
  font-family:var(--font-display);
  font-size:24px;
  letter-spacing:-.4px;
}

.avatar.has-img .initials{
  display:none;
}

.agent-content{
  min-width:0;
}

.agent-name-row{
  display:flex;
  align-items:flex-start;
  gap:8px;
  margin-bottom:9px;
}

.agent-status{
  width:34px;
  height:34px;
  border-radius:10px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  font-size:22px;
  line-height:1;
}

.agent-status.ok{
  background:var(--ok-bg);
  color:var(--ok);
  border:2px solid #b7e0c5;
}

.agent-status.warning{
  background:var(--warning-bg);
  color:var(--warning);
  border:2px solid #ecd27f;
}

.agent-status.danger{
  background:var(--danger-bg);
  color:var(--danger);
  border:2px solid #efb1b1;
}

.agent-name-text{
  font-family:var(--font-base);
  font-size:clamp(25px,4.8vw,38px);
  line-height:1.02;
  font-weight:950;
  letter-spacing:-1px;
  text-transform:uppercase;
  overflow-wrap:anywhere;
}

.agent-card.danger .agent-name-text{
  color:var(--danger);
}

.agent-card.warning .agent-name-text{
  color:#643600;
}

.agent-chips{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:32px;
  padding:6px 10px;
  border-radius:999px;
  background:var(--card);
  border:2px solid rgba(7,24,63,.18);
  color:var(--ink);
  font-size:15px;
  line-height:1.05;
  font-weight:850;
}

.chip a{
  color:#064ee4;
  font-weight:950;
}

.chip.warning{
  background:var(--warning-bg);
  color:var(--warning);
  border-color:#ecd27f;
}

.chip.danger{
  background:var(--danger-bg);
  color:var(--danger);
  border-color:#efb1b1;
}

.chip.ok{
  background:var(--ok-bg);
  color:var(--ok);
  border-color:#b7e0c5;
}

.agent-alerts{
  display:grid;
  gap:6px;
  margin-top:9px;
}

.agent-alert{
  border-radius:14px;
  padding:8px 10px;
  font-weight:850;
  line-height:1.2;
  border:2px solid transparent;
  font-size:15px;
}

.agent-alert.danger{
  background:var(--danger-bg);
  color:var(--danger);
  border-color:#efb1b1;
}

.agent-alert.warning{
  background:var(--warning-bg);
  color:var(--warning);
  border-color:#ecd27f;
}

.source{
  margin-top:12px;
  font-size:13px;
  opacity:.68;
  font-weight:850;
}

/* =========================
   ETATS
   ========================= */

.empty,.error,.loading{
  background:var(--card);
  border:4px solid var(--line);
  border-radius:22px;
  padding:16px;
  font-weight:900;
  box-shadow:var(--shadow);
}

.error{
  color:var(--danger);
}

/* =========================
   AGENDA
   ========================= */

.agenda-box{
  margin:28px 0 4px;
  padding:16px 12px;
  background:var(--card);
  border:5px solid var(--line);
  border-radius:26px;
  box-shadow:var(--shadow);
}

.agenda-title{
  margin:0 0 12px;
  text-align:center;
  font-family:var(--font-display);
  font-size:clamp(27px,6.3vw,48px);
  line-height:.9;
  text-transform:uppercase;
  letter-spacing:-.8px;
  text-shadow:0 3px 0 #f8d67d;
}

.agenda-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.agenda-btn{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:3px;
  text-decoration:none;
  color:#fff4ce;
  border:5px solid #061738;
  border-radius:22px;
  font-family:var(--font-display);
  font-size:clamp(22px,5vw,36px);
  line-height:.95;
  text-transform:uppercase;
  box-shadow:0 8px 0 rgba(7,24,63,.35);
}

.agenda-btn.ios{
  background:linear-gradient(145deg,#3db9ff 0%,#0c6ed5 56%,#083c91 100%);
}

.agenda-btn.android{
  background:linear-gradient(145deg,#35d864 0%,#12873d 56%,#075324 100%);
}

/* =========================
   RESPONSIVE
   ========================= */

@media(max-width:820px){
  .stats{
    grid-template-columns:1fr 1fr;
  }

  .formation-head{
    grid-template-columns:1fr;
  }

  .formation-info{
    grid-template-columns:1fr;
  }
}

@media(max-width:620px){
  .page{
    padding-left:8px;
    padding-right:8px;
  }

  .hero{
    border-radius:22px;
    border-width:3px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .stat{
    border-width:3px;
  }

  .formation-card{
    border-width:3px;
    border-radius:22px;
    padding:13px;
  }

  .formation-title{
    font-size:clamp(30px,8vw,44px);
  }

  .status{
    width:max-content;
  }

  .agent-card{
    grid-template-columns:96px 1fr;
    gap:12px;
    padding:10px;
  }

  .avatar{
    width:88px;
    height:88px;
    border-radius:18px;
  }

  .avatar .initials{
    width:68px;
    height:68px;
  }

  .agent-name-text{
    font-size:clamp(25px,7.1vw,34px);
    letter-spacing:-.9px;
  }

  .chip{
    font-size:15px;
    min-height:31px;
  }

  .agenda-box{
    border-width:4px;
  }
}
</style>
</head>

<body>
<main class="page">

  <div class="topbar">
    <a class="navbtn" href="index.html">← Accueil</a>
    <a class="navbtn" href="stagiaires.html">Stagiaires</a>
  </div>

  <section class="hero">
    <img
      src="Image/Bannière/Page Formation.PNG"
      alt="Formations GHE"
      onerror="this.onerror=null;this.src='Image/Banni%C3%A8re/Page%20Formation.PNG';"
    >
  </section>

  <section class="stats">
    <div class="stat">
      <div class="stat-icon">📚</div>
      <div>
        <div class="stat-number" id="statTotal">0</div>
        <div class="stat-label">Formations</div>
      </div>
    </div>

    <div class="stat">
      <div class="stat-icon">👥</div>
      <div>
        <div class="stat-number" id="statAgents">0</div>
        <div class="stat-label">Agents</div>
      </div>
    </div>

    <div class="stat">
      <div class="stat-icon">⚠️</div>
      <div>
        <div class="stat-number" id="statAlertes">0</div>
        <div class="stat-label">Alertes</div>
      </div>
    </div>

    <div class="stat">
      <div class="stat-icon">✅</div>
      <div>
        <div class="stat-number" id="statOk">0</div>
        <div class="stat-label">OK</div>
      </div>
    </div>
  </section>

  <section class="tools">
    <input id="search" class="search" type="search" placeholder="Rechercher formation, agent, GHE, téléphone…">

    <div class="filters">
      <button class="filter-btn active" data-filter="tous">Tous</button>
      <button class="filter-btn" data-filter="alertes">Alertes</button>
      <button class="filter-btn" data-filter="ok">OK</button>
    </div>
  </section>

  <div class="result-separator"><span>Résultats</span></div>

  <section id="content">
    <div class="loading">Chargement des formations…</div>
  </section>

  <section class="agenda-box">
    <h2 class="agenda-title">Ajouter l’agenda formations</h2>
    <div class="agenda-buttons">
      <a id="btnIos" class="agenda-btn ios" href="#"><span>🍎</span><span>iOS</span></a>
      <a id="btnAndroid" class="agenda-btn android" href="#"><span>🤖</span><span>Android</span></a>
    </div>
  </section>

</main>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzmelNrBU583V3CvOlle3cafAKEAZQ8NAX-peSN6D-yxFO3gX26SnVNUVd5xbwV3CUISg/exec";

const ICS_URL = "https://calendar.google.com/calendar/ical/c5da5df12db0eba65a14410cada08fea4e5a8037ddd256b03e7426cb22cb751b%40group.calendar.google.com/private-4f5072a64d36548137a30abb665ed23f/basic.ics";

let ITEMS = [];
let CURRENT_FILTER = "tous";

document.getElementById("btnIos").href = ICS_URL.replace(/^https:\/\//i, "webcal://");
document.getElementById("btnAndroid").href = "https://calendar.google.com/calendar/render?cid=" + encodeURIComponent(ICS_URL);

document.getElementById("search").addEventListener("input", () => {
  render(filterItems());
});

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    CURRENT_FILTER = btn.dataset.filter;
    render(filterItems());
  });
});

loadJsonp("formations");

function loadJsonp(type){
  const callbackName = "recevoirGhe_" + type + "_" + Date.now();
  const script = document.createElement("script");

  window[callbackName] = function(data){
    delete window[callbackName];
    script.remove();

    if (!data || !data.ok) {
      showError(data && data.erreur ? data.erreur : "Données invalides.");
      return;
    }

    ITEMS = data.items || [];
    updateStats(ITEMS);
    render(filterItems());
  };

  script.onerror = function(){
    delete window[callbackName];
    script.remove();
    showError("Impossible de charger les données.");
  };

  script.src = WEB_APP_URL
    + "?mode=site_stagiaires_formations"
    + "&type=" + encodeURIComponent(type)
    + "&callback=" + encodeURIComponent(callbackName)
    + "&v=" + Date.now();

  document.body.appendChild(script);
}

function filterItems(){
  const q = norm(document.getElementById("search").value);

  return ITEMS.filter(item => {
    if (CURRENT_FILTER === "alertes" && !itemHasAnyAlert(item)) return false;
    if (CURRENT_FILTER === "ok" && itemHasAnyAlert(item)) return false;

    if (!q) return true;

    const agents = item.agents || [];
    const txt = [
      item.titre,
      item.dateLabel,
      item.formation && item.formation.intitule,
      item.formation && item.formation.typeLabel,
      agents.map(a => [
        a.nomComplet,
        a.nom,
        a.prenom,
        a.ghe,
        a.telephone,
        a.shift && a.shift.code,
        a.shift && a.shift.label
      ].join(" ")).join(" "),
      item.alertes && item.alertes.bloquantes && item.alertes.bloquantes.join(" "),
      item.alertes && item.alertes.infos && item.alertes.infos.join(" ")
    ].join(" ");

    return norm(txt).includes(q);
  });
}

function updateStats(items){
  const total = items.length;
  const agents = items.reduce((s,x) => s + ((x.agents || []).length), 0);

  const alertes = items.reduce((s,item) => {
    const bloquantes = (item.alertes && item.alertes.bloquantes) || [];
    const infos = (item.alertes && item.alertes.infos) || [];
    return s + bloquantes.length + infos.length;
  }, 0);

  const ok = items.filter(x => !itemHasAnyAlert(x)).length;

  document.getElementById("statTotal").textContent = total;
  document.getElementById("statAgents").textContent = agents;
  document.getElementById("statAlertes").textContent = alertes;
  document.getElementById("statOk").textContent = ok;
}

function render(items){
  const content = document.getElementById("content");

  if (!items.length) {
    content.innerHTML = `<div class="empty">Aucune formation à venir pour le moment.</div>`;
    return;
  }

  const groups = groupByDate(items);

  content.innerHTML = Object.keys(groups).map(dateKey => {
    const list = groups[dateKey];
    const label = list[0].dateLabel || dateKey;

    return `
      <div class="day-title">${esc(label)}</div>
      ${list.map(cardFormation).join("")}
    `;
  }).join("");
}

function cardFormation(item){
  const formation = item.formation || {};
  const agents = item.agents || [];
  const controles = item.controles || {};

  const niveau = itemLevel(item);
  const general = formationGeneralAlerts(item);

  return `
    <article class="formation-card ${esc(niveau)}">

      <div class="formation-head">
        <div class="formation-title">${esc(item.titre || "")}</div>
        <div class="status ${esc(niveau)}">${statusLabel(niveau)}</div>
      </div>

      <div class="formation-info">
        <div class="info">
          <span class="info-label">Formation</span>
          <div class="info-value">${esc(formation.intitule || "")}</div>
        </div>

        <div class="info">
          <span class="info-label">Horaire</span>
          <div class="info-value">${esc(formation.horaireAffiche || "")}</div>
        </div>

        <div class="info">
          <span class="info-label">Agents</span>
          <div class="info-value">👥 ${esc(controles.nombreAgents || agents.length)}</div>
        </div>
      </div>

      ${general.danger.length ? alertBlock("danger", "⛔️ Alertes bloquantes", general.danger, agents) : ""}
      ${general.warning.length ? alertBlock("warning", "⚠️ À vérifier", general.warning, agents) : ""}

      <div class="agent-list">
        ${agents.map(a => agentCard(a, item)).join("")}
      </div>

      <div class="source">
        Source : DETAIL_FORMATIONS
      </div>
    </article>
  `;
}

function agentCard(a, item){
  const avatar = a.avatar || {};
  const shift = a.shift || {};
  const issues = agentIssues(a, item);

  const gheText = formatGhe(a.ghe);
  const telRaw = String(a.telephone || "").trim();
  const telHref = telRaw.replace(/[^\d+]/g, "");
  const shiftText = formatShift(shift);

  const gheOk = hasUsefulValue(a.ghe);
  const telOk = hasUsefulValue(telRaw);
  const shiftOk = shiftIsKnown(shiftText);

  const shiftDanger = issues.danger.some(x => {
    const n = norm(x);
    return n.includes("code non travaille") || n.includes("shift") || n.includes("poste");
  });

  return `
    <div class="agent-card ${esc(issues.level)}">
      ${avatarHtml(avatar)}

      <div class="agent-content">
        <div class="agent-name-row">
          <span class="agent-status ${esc(issues.level)}">${agentStatusIcon(issues.level)}</span>
          <div class="agent-name-text">${esc(a.nomComplet || "Agent sans nom")}</div>
        </div>

        <div class="agent-chips">
          <span class="chip ${gheOk ? "" : "warning"}">${esc(gheText)}</span>

          <span class="chip ${telOk ? "" : "warning"}">
            📞 ${telOk ? `<a href="tel:${esc(telHref)}">${esc(telRaw)}</a>` : "non renseigné"}
          </span>

          <span class="chip ${shiftDanger ? "danger" : (shiftOk ? "" : "warning")}">
            ${shiftDot(shift)} ${esc(shiftText)}
          </span>
        </div>

        ${agentAlertBlock(issues)}
      </div>
    </div>
  `;
}

function avatarHtml(avatar){
  avatar = avatar || {};
  const initials = esc(avatar.initiales || "?");
  const thumb = avatar.thumb || "";

  if (!thumb) {
    return `<div class="avatar"><div class="initials">${initials}</div></div>`;
  }

  return `
    <div class="avatar has-img">
      <img src="${esc(thumb)}" alt="" loading="lazy" onerror="this.parentElement.classList.remove('has-img');this.remove();">
      <div class="initials">${initials}</div>
    </div>
  `;
}

/* =========================
   ALERTES INTELLIGENTES
   ========================= */

function itemHasAnyAlert(item){
  const bloquantes = (item.alertes && item.alertes.bloquantes) || [];
  const infos = (item.alertes && item.alertes.infos) || [];
  return bloquantes.length > 0 || infos.length > 0 || item.niveau === "danger" || item.niveau === "warning";
}

function itemLevel(item){
  const bloquantes = (item.alertes && item.alertes.bloquantes) || [];
  const infos = (item.alertes && item.alertes.infos) || [];

  if (item.niveau === "danger" || bloquantes.length) return "danger";
  if (item.niveau === "warning" || infos.length) return "warning";
  return "ok";
}

function formationGeneralAlerts(item){
  const agents = item.agents || [];
  const bloquantes = (item.alertes && item.alertes.bloquantes) || [];
  const infos = (item.alertes && item.alertes.infos) || [];

  return {
    danger: bloquantes.filter(msg => !agents.some(a => messageMentionsAgent(msg, a))),
    warning: infos.filter(msg => !agents.some(a => messageMentionsAgent(msg, a)))
  };
}

function agentIssues(a, item){
  const bloquantes = ((item.alertes && item.alertes.bloquantes) || [])
    .filter(msg => messageMentionsAgent(msg, a));

  const infos = ((item.alertes && item.alertes.infos) || [])
    .filter(msg => messageMentionsAgent(msg, a));

  if (a.agentTrouve === false) {
    pushUnique(bloquantes, "Agent absent de la source agents.");
  }

  if (!hasUsefulValue(a.ghe)) {
    pushUniqueByKeyword(infos, "GHE non renseigné.", "ghe");
  }

  if (!hasUsefulValue(a.telephone)) {
    pushUniqueByKeyword(infos, "Téléphone non renseigné.", "telephone");
  }

  const level = bloquantes.length ? "danger" : (infos.length ? "warning" : "ok");

  return {
    level,
    danger: bloquantes,
    warning: infos
  };
}

function agentAlertBlock(issues){
  const danger = issues.danger || [];
  const warning = issues.warning || [];

  if (!danger.length && !warning.length) return "";

  return `
    <div class="agent-alerts">
      ${danger.map(x => `<div class="agent-alert danger">⛔️ ${esc(x)}</div>`).join("")}
      ${warning.map(x => `<div class="agent-alert warning">⚠️ ${esc(x)}</div>`).join("")}
    </div>
  `;
}

function alertBlock(type, title, list, agents){
  const single = list.length === 1 ? " is-single" : "";

  return `
    <div class="alert ${esc(type)}${single}">
      <div class="alert-title">${esc(title)}</div>
      <ul>${list.map(x => `<li>${formatAlertHTML(x, agents)}</li>`).join("")}</ul>
    </div>
  `;
}

function formatAlertHTML(text, agents){
  let html = esc(text);

  const names = (agents || [])
    .map(a => a && a.nomComplet)
    .filter(Boolean)
    .sort((a,b) => b.length - a.length);

  names.forEach(name => {
    const safeName = esc(name);
    if (!safeName) return;
    html = html.replace(new RegExp(escapeRegExp(safeName), "gi"), `<strong class="alert-name">$&</strong>`);
  });

  return html;
}

function messageMentionsAgent(message, a){
  const msg = norm(message);
  if (!msg || !a) return false;

  const candidates = [];

  if (a.nomComplet) candidates.push(norm(a.nomComplet));

  if (a.nom && a.prenom) {
    candidates.push(norm(a.nom + " " + a.prenom));
    candidates.push(norm(a.prenom + " " + a.nom));
  }

  if (a.nom && norm(a.nom).length >= 4) candidates.push(norm(a.nom));
  if (a.prenom && norm(a.prenom).length >= 4) candidates.push(norm(a.prenom));

  return candidates
    .filter(Boolean)
    .some(candidate => msg.includes(candidate));
}

function pushUnique(list, message){
  const n = norm(message);
  if (!list.some(x => norm(x) === n)) list.push(message);
}

function pushUniqueByKeyword(list, message, keyword){
  const k = norm(keyword);
  if (!list.some(x => norm(x).includes(k))) list.push(message);
}

/* =========================
   FORMATAGE AFFICHAGE
   ========================= */

function statusLabel(niveau){
  if (niveau === "danger") return "⛔ Bloquant";
  if (niveau === "warning") return "⚠️ À vérifier";
  return "✅ OK";
}

function agentStatusIcon(level){
  if (level === "danger") return "⛔️";
  if (level === "warning") return "⚠️";
  return "✅";
}

function formatGhe(value){
  const raw = String(value || "").trim();

  if (!hasUsefulValue(raw)) return "GHE non renseigné";
  if (/^ghe\b/i.test(raw)) return raw;

  return "GHE " + raw;
}

function formatShift(shift){
  shift = shift || {};

  const label = String(shift.label || "").trim();
  const code = String(shift.code || "").trim();

  if (label && code) return label + " · " + code;
  if (label) return label;
  if (code) return code;

  return "Shift non connu";
}

function shiftIsKnown(text){
  const n = norm(text);
  return !!n && !n.includes("non connu") && !n.includes("inconnu") && !n.includes("non renseigne");
}

function shiftDot(shift){
  const text = norm([
    shift && shift.label,
    shift && shift.code
  ].join(" "));

  if (text.includes("matin") || text === "m") return "🔵";
  if (text.includes("journee") || text === "j") return "🟢";
  if (text.includes("soir") || text === "s") return "🟡";
  if (text.includes("j4")) return "🟠";

  return "⚪️";
}

function hasUsefulValue(value){
  const n = norm(value);

  if (!n) return false;
  if (n === "non renseigne") return false;
  if (n === "non renseignee") return false;
  if (n.includes("non renseigne")) return false;
  if (n === "nr") return false;
  if (n === "-") return false;

  return true;
}

/* =========================
   OUTILS
   ========================= */

function groupByDate(items){
  return items.reduce((acc,item) => {
    const key = item.dateKey || "sans-date";
    if (!acc[key]) acc[key] = [];
    acc[key].push(item);
    return acc;
  }, {});
}

function showError(message){
  document.getElementById("content").innerHTML = `<div class="error">Problème : ${esc(message)}</div>`;
}

function esc(value){
  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function norm(value){
  return String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .trim();
}

function escapeRegExp(value){
  return String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}
