<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espace formation</title>

  <style>
    * { box-sizing: border-box; }

    :root{
      --bg:#fff8df;
      --ink:#0f172a;
      --muted:#5b6475;
      --card:#ffffff;
      --line:#e8e2c9;
      --accent:#ffb703;
      --accent-2:#ffe29a;
      --danger:#d62828;
      --danger-soft:#ffe2e2;
      --ok:#1f7a1f;
      --shadow:0 12px 28px rgba(15, 23, 42, .10);
      --radius:24px;
    }

    body{
      margin:0;
      background:
        radial-gradient(circle at top, #fffdf4 0%, #fff6d9 35%, #fff0c1 100%);
      color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }

    .page{
      max-width:920px;
      margin:auto;
      padding:16px 14px 30px;
    }

    .hero{
      overflow:hidden;
      background:var(--card);
      border:3px solid #111;
      border-radius:30px;
      box-shadow:8px 8px 0 #111;
      margin-bottom:18px;
    }

    .hero img{
      width:100%;
      display:block;
      object-fit:cover;
    }

    .hero-content{
      padding:18px 18px 20px;
    }

    h1{
      margin:0 0 10px;
      font-size:clamp(30px, 7vw, 54px);
      line-height:.95;
      letter-spacing:-.02em;
      text-transform:uppercase;
    }

    .intro{
      margin:0;
      font-size:16px;
      line-height:1.45;
      color:#2d3748;
    }

    .topbar{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
      margin:18px 2px 12px;
      flex-wrap:wrap;
    }

    .topbar h2{
      margin:0;
      font-size:26px;
    }

    .status{
      font-size:14px;
      color:var(--muted);
      font-weight:700;
    }

    .slider-wrap{
      position:relative;
    }

    .slider{
      display:flex;
      gap:14px;
      overflow-x:auto;
      padding:8px 4px 10px;
      scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }

    .slider::-webkit-scrollbar{
      display:none;
    }

    .card{
      flex:0 0 88%;
      scroll-snap-align:start;
      background:var(--card);
      border:2px solid #111;
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:18px;
      position:relative;
      overflow:hidden;
    }

    @media (min-width:760px){
      .card{
        flex:0 0 62%;
      }
    }

    .card.today{
      background:linear-gradient(180deg,#fffef8 0%, #fff7d8 100%);
      box-shadow:
        0 0 0 3px #111 inset,
        0 0 0 8px rgba(255,183,3,.18),
        0 0 35px rgba(255,183,3,.45);
      border-color:#111;
    }

    .card.alert{
      border-color:var(--danger);
      box-shadow:
        0 0 0 2px rgba(214,40,40,.12),
        0 12px 28px rgba(214,40,40,.14);
    }

    .badge-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:14px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:8px 12px;
      border-radius:999px;
      font-size:13px;
      font-weight:800;
      border:2px solid #111;
      background:#fff;
    }

    .badge.today-badge{
      background:#ffe58f;
    }

    .badge.alert-badge{
      background:var(--danger-soft);
      border-color:var(--danger);
      color:var(--danger);
    }

    .formation-name{
      font-size:28px;
      line-height:1.05;
      margin:0 0 14px;
      font-weight:900;
    }

    .grid{
      display:grid;
      gap:10px;
    }

    .row{
      display:flex;
      gap:10px;
      align-items:flex-start;
      padding:10px 12px;
      border-radius:18px;
      background:#fffdf5;
      border:1px solid var(--line);
    }

    .icon{
      flex:0 0 auto;
      width:30px;
      height:30px;
      display:grid;
      place-items:center;
      font-size:18px;
    }

    .label{
      font-size:12px;
      color:var(--muted);
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.03em;
      margin-bottom:2px;
    }

    .value{
      font-size:16px;
      font-weight:700;
      line-height:1.3;
    }

    .call{
      color:inherit;
      text-decoration:none;
    }

    .call:hover{
      text-decoration:underline;
    }

    .alert-box{
      margin-top:14px;
      padding:14px;
      border-radius:20px;
      border:2px solid var(--danger);
      background:var(--danger-soft);
      color:#7f1d1d;
      font-weight:800;
    }

    .empty,
    .error{
      background:#fff;
      border:2px dashed #bbb;
      border-radius:22px;
      padding:22px 18px;
      color:var(--muted);
      text-align:center;
    }

    .hint{
      margin-top:8px;
      text-align:center;
      font-size:13px;
      color:var(--muted);
      font-weight:700;
    }
  </style>
</head>
<body>
  <main class="page">

    <section class="hero">
      <img src="./Image/Autre%20page/Photo_Formation.png" alt="Espace formation">
      <div class="hero-content">
        <h1>Espace formation</h1>
        <p class="intro">
          Merci de prévenir l’agent concerné dès qu’une formation apparaît, afin qu’il puisse s’organiser à l’avance.
        </p>
      </div>
    </section>

    <div class="topbar">
      <h2>Résultats en direct</h2>
      <div class="status" id="status">Chargement…</div>
    </div>

    <section class="slider-wrap">
      <div class="slider" id="slider"></div>
      <div class="hint">Fais glisser pour voir les formations suivantes →</div>
    </section>

  </main>

  <script>
    const slider = document.getElementById("slider");
    const status = document.getElementById("status");

    function escapeHtml(value){
      return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function phoneHref(phone){
      return "tel:" + String(phone || "").replace(/\s/g, "");
    }

    function parseDate(value){
      if(!value) return null;

      if(/^\d{4}-\d{2}-\d{2}/.test(value)){
        return new Date(value + "T00:00:00");
      }

      const d = new Date(value);
      return isNaN(d) ? null : d;
    }

    function isSameDay(a,b){
      return a && b &&
        a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate();
    }

    function sortItems(items){
      return [...items].sort((a,b) => {
        const da = parseDate(a.date);
        const db = parseDate(b.date);
        if(!da && !db) return 0;
        if(!da) return 1;
        if(!db) return -1;
        return da - db;
      });
    }

    function card(item){
      const today = new Date();
      const itemDate = parseDate(item.date);
      const todayFlag = isSameDay(itemDate, today);
      const alerte = !!item.alerte;

      const classes = [
        "card",
        todayFlag ? "today" : "",
        alerte ? "alert" : ""
      ].join(" ").trim();

      const dateLabel = item.dateLabel || item.date || "Date non renseignée";
      const formation = item.formation || item.titre || "Formation";
      const agent = item.agent || "Agent non renseigné";
      const horaireFormation = item.horaireFormation || "Non renseigné";
      const horaireAgent = item.horaireAgent || "Non renseigné";
      const ghe = item.ghe || "Non renseigné";
      const telephone = item.telephone || "";
      const messageAlerte = item.messageAlerte || "Vérifier l’horaire prévu de l’agent.";

      return `
        <article class="${classes}">
          <div class="badge-row">
            <div class="badge">📅 ${escapeHtml(dateLabel)}</div>
            ${todayFlag ? `<div class="badge today-badge">✨ Aujourd’hui</div>` : ``}
            ${alerte ? `<div class="badge alert-badge">⚠️ Alerte</div>` : ``}
          </div>

          <h3 class="formation-name">${escapeHtml(formation)}</h3>

          <div class="grid">
            <div class="row">
              <div class="icon">👤</div>
              <div>
                <div class="label">Agent</div>
                <div class="value">${escapeHtml(agent)}</div>
              </div>
            </div>

            <div class="row">
              <div class="icon">🕒</div>
              <div>
                <div class="label">Horaire formation</div>
                <div class="value">${escapeHtml(horaireFormation)}</div>
              </div>
            </div>

            <div class="row">
              <div class="icon">⏰</div>
              <div>
                <div class="label">Horaire agent prévu</div>
                <div class="value">${escapeHtml(horaireAgent)}</div>
              </div>
            </div>

            <div class="row">
              <div class="icon">🏥</div>
              <div>
                <div class="label">GHE</div>
                <div class="value">${escapeHtml(ghe)}</div>
              </div>
            </div>

            <div class="row">
              <div class="icon">📞</div>
              <div>
                <div class="label">Téléphone</div>
                <div class="value">
                  ${
                    telephone
                      ? `<a class="call" href="${phoneHref(telephone)}">${escapeHtml(telephone)}</a>`
                      : `Non renseigné`
                  }
                </div>
              </div>
            </div>
          </div>

          ${alerte ? `
            <div class="alert-box">
              ⚠️ ${escapeHtml(messageAlerte)}
            </div>
          ` : ``}
        </article>
      `;
    }

    async function loadFormations(){
      try{
        status.textContent = "Chargement des formations…";

        const response = await fetch("/api/formations", { cache:"no-store" });
        const data = await response.json();

        if(!data.ok){
          throw new Error(data.error || "Réponse invalide");
        }

        const items = sortItems(data.items || []);
        const today = new Date();

        items.sort((a,b) => {
          const aToday = isSameDay(parseDate(a.date), today) ? 0 : 1;
          const bToday = isSameDay(parseDate(b.date), today) ? 0 : 1;
          if(aToday !== bToday) return aToday - bToday;

          const da = parseDate(a.date);
          const db = parseDate(b.date);
          if(!da && !db) return 0;
          if(!da) return 1;
          if(!db) return -1;
          return da - db;
        });

        status.textContent = `${items.length} formation(s) trouvée(s)`;

        if(!items.length){
          slider.innerHTML = `<div class="empty">Aucune formation à afficher pour le moment.</div>`;
          return;
        }

        slider.innerHTML = items.map(card).join("");

      }catch(error){
        console.error(error);
        status.textContent = "Erreur de chargement";
        slider.innerHTML = `<div class="error">Impossible de charger les formations pour le moment.</div>`;
      }
    }

    loadFormations();
  </script>
</body>
</html>
