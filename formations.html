<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GHE — Formations</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--ink:#07183f;--soft:#33415f;--cream:#fff7dd;--paper:#fffaf0;--paper2:#fff2c9;--line:#07183f;--muted:rgba(7,24,63,.18);--danger:#b42318;--dangerbg:#fff0ec;--warning:#8a4b00;--warningbg:#fff4c7;--ok:#176b39;--okbg:#eaf8ef;--shadow:0 7px 0 rgba(7,24,63,.16);--small:0 4px 0 rgba(7,24,63,.12);--display:Impact,"Arial Black",system-ui,sans-serif}
html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink)}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body.modal-open{overflow:hidden}a{color:inherit}[hidden]{display:none!important}button,input{font:inherit;color:inherit}
.page{width:min(1080px,100%);margin:auto;padding:calc(8px + env(safe-area-inset-top)) 8px calc(120px + env(safe-area-inset-bottom))}.topbar{display:flex;gap:10px;margin-bottom:9px}.navbtn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;border:3px solid var(--line);border-radius:18px;background:var(--paper);text-decoration:none;font-size:18px;font-weight:950;box-shadow:var(--small)}
.hero{border:4px solid var(--line);border-radius:22px;overflow:hidden;background:var(--ink);box-shadow:var(--shadow);margin-bottom:11px}.hero img{display:block;width:100%;height:clamp(108px,25vw,200px);object-fit:cover}
.pilot{background:var(--paper);border:4px solid var(--line);border-radius:22px;padding:11px 12px;box-shadow:var(--shadow);margin-bottom:10px}.pilot.ok{border-color:#2f8f4e}.pilot.warning{border-color:#d2a631}.pilot.danger{border-color:#c43a2f}.pilot-title{font-weight:950;font-size:clamp(21px,5.5vw,33px);line-height:1.02}.pilot-sub{margin-top:4px;color:var(--soft);font-size:14px;font-weight:850;line-height:1.25}.pilot-pills{margin-top:9px;display:flex;flex-wrap:wrap;gap:7px}.pill,.chip{display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:6px 9px;border-radius:999px;background:var(--paper2);border:2px solid var(--muted);font-size:13px;font-weight:900}.pill.ok{background:var(--okbg);color:var(--ok);border-color:#9dd5af}.pill.warning{background:var(--warningbg);color:var(--warning);border-color:#e2c060}.pill.danger{background:var(--dangerbg);color:var(--danger);border-color:#e7a29d}
.tools{display:grid;gap:8px;margin-bottom:12px}.search{width:100%;min-height:48px;border:3px solid var(--line);border-radius:17px;padding:9px 12px;font-size:16px;font-weight:850;background:var(--paper);outline:none;box-shadow:var(--small)}.filters{display:flex;gap:7px;overflow-x:auto;padding:1px 0 4px}.filter-btn{flex:0 0 auto;border:3px solid var(--line);border-radius:999px;background:var(--paper);padding:8px 12px;font-size:14px;font-weight:950;cursor:pointer;box-shadow:0 3px 0 rgba(7,24,63,.12)}.filter-btn.active{background:var(--ink);color:var(--cream)}
.day-title{margin:22px 4px 9px;font-family:var(--display);font-size:clamp(32px,8.4vw,58px);line-height:.88;letter-spacing:-1px;text-transform:uppercase;text-shadow:0 3px 0 #f8d67d}.session{background:var(--paper);border:4px solid var(--line);border-radius:24px;padding:0 10px 10px;margin-bottom:13px;box-shadow:var(--shadow);overflow:hidden}.session.warning{border-color:#d2a631}.session.danger{border-color:#c43a2f}.session-head{margin:0 -10px 10px;padding:11px 12px;background:linear-gradient(135deg,#dce9ff,#9ec4ff);border-bottom:4px solid var(--line)}.session.incendie .session-head{background:linear-gradient(135deg,#ffdfbf,#ffb36b)}.session.caces .session-head{background:linear-gradient(135deg,#fff1a8,#ffc941)}.session.identite .session-head{background:linear-gradient(135deg,#e8e2ff,#b8a7ff)}.session-kicker{font-size:12px;font-weight:950;letter-spacing:.7px;text-transform:uppercase;color:rgba(7,24,63,.68)}.session-title{margin-top:3px;font-family:var(--display);font-size:clamp(29px,7.6vw,46px);line-height:.9;text-transform:uppercase}.session-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.session-toggle{width:100%;border:0;background:transparent;padding:2px;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;cursor:pointer}.chevron{width:34px;height:34px;border:3px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--paper2);font-size:22px;font-weight:950;transition:transform .18s}.session-toggle[aria-expanded="true"] .chevron{transform:rotate(180deg)}
.issue-btn{width:100%;min-height:41px;margin:0 0 9px;border:2px solid var(--muted);border-radius:15px;padding:7px 10px;background:var(--paper2);display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:950;cursor:pointer}.issue-btn.warning{background:var(--warningbg);color:var(--warning);border-color:#e2c060}.issue-btn.danger{background:var(--dangerbg);color:var(--danger);border-color:#e7a29d}.agent-list{display:grid;gap:8px}.agent{position:relative;display:grid;grid-template-columns:60px minmax(0,1fr);gap:9px;align-items:center;padding:9px 9px 9px 14px;border:3px solid var(--line);border-radius:20px;background:var(--paper2)}.agent::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;border-radius:16px 0 0 16px;background:#2f8f4e}.agent.warning::before{background:#d2a631}.agent.danger::before{background:#c43a2f}.avatar{width:60px;height:60px;border-radius:17px;background:#eaf0ff;overflow:hidden;display:flex;align-items:center;justify-content:center;border:2px solid rgba(7,24,63,.13)}.avatar img{max-width:97%;max-height:97%;width:auto;height:auto;object-fit:contain}.avatar .initials{width:48px;height:48px;border-radius:14px;border:3px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:18px}.avatar.has-img .initials{display:none}.role{display:block;color:rgba(7,24,63,.58);font-size:11px;font-weight:950;letter-spacing:.6px;text-transform:uppercase}.name{display:block;font-size:clamp(20px,5.2vw,31px);line-height:.98;font-weight:950;text-transform:uppercase;overflow-wrap:anywhere}.info{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.agent-issue{border:2px solid transparent;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:950;cursor:pointer}.agent-issue.warning{background:var(--warningbg);color:var(--warning);border-color:#e2c060}.agent-issue.danger{background:var(--dangerbg);color:var(--danger);border-color:#e7a29d}
.empty,.error,.loading{background:var(--paper);border:4px solid var(--line);border-radius:21px;padding:14px;font-weight:900;box-shadow:var(--shadow)}.error{color:var(--danger)}
.agenda{margin:25px 0 4px;padding:13px;background:var(--paper);border:4px solid var(--line);border-radius:25px;box-shadow:var(--shadow)}.agenda-title{margin:0 0 10px;font-family:var(--display);font-size:clamp(25px,7vw,44px);line-height:.92;text-align:center;text-transform:uppercase;text-shadow:0 3px 0 #f8d67d}.agenda-buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.agenda-btn{min-height:62px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff4ce;border:4px solid #061738;border-radius:20px;font-family:var(--display);font-size:clamp(21px,5.5vw,34px);text-transform:uppercase;box-shadow:0 6px 0 rgba(7,24,63,.32)}.agenda-btn.ios{background:linear-gradient(145deg,#3db9ff,#0c6ed5 56%,#083c91)}.agenda-btn.android{background:linear-gradient(145deg,#35d864,#12873d 56%,#075324)}
.modal{position:fixed;inset:0;z-index:1000;display:none;align-items:flex-end;justify-content:center;padding:10px;background:rgba(2,8,23,.68)}.modal.open{display:flex}.sheet{width:min(720px,100%);max-height:88vh;overflow:auto;background:var(--cream);border:4px solid var(--line);border-radius:25px 25px 18px 18px;padding:13px;box-shadow:0 14px 0 rgba(0,0,0,.18)}.sheet h2{margin:0;font-family:var(--display);font-size:clamp(29px,8vw,48px);line-height:.9;text-transform:uppercase}.sheet-sub{margin:6px 0 12px;color:var(--soft);font-weight:850}.issue-list{display:grid;gap:8px}.issue{border:2px solid transparent;border-radius:15px;padding:10px}.issue.warning{background:var(--warningbg);color:var(--warning);border-color:#e2c060}.issue.danger{background:var(--dangerbg);color:var(--danger);border-color:#e7a29d}.issue-message{font-weight:950;line-height:1.25}.issue-action{margin-top:6px;padding-top:6px;border-top:1px solid currentColor;font-size:13px;font-weight:800;line-height:1.3}.close{width:100%;min-height:48px;margin-top:12px;border:3px solid var(--line);border-radius:16px;background:var(--ink);color:var(--cream);font-weight:950;cursor:pointer}
@media(min-width:720px){.page{padding-left:14px;padding-right:14px}.agent{grid-template-columns:72px minmax(0,1fr)}.avatar{width:72px;height:72px}.modal{align-items:center}.sheet{border-radius:25px}}
</style>
</head>
<body>
<main class="page">
  <div class="topbar"><a class="navbtn" href="index.html">← Accueil</a></div>
  <section class="hero"><img src="Image/Bannière/Page Formation.PNG" alt="Formations GHE" onerror="this.onerror=null;this.src='Image/Banni%C3%A8re/Page%20Formation.PNG'"></section>
  <section id="pilot" class="pilot"><div class="pilot-title">Chargement des formations…</div><div class="pilot-sub">Les alertes personnelles et les informations techniques ne sont jamais affichées.</div></section>
  <section class="tools">
    <input id="search" class="search" type="search" placeholder="Rechercher formation, agent ou GHE…">
    <div class="filters"><button class="filter-btn active" data-filter="tous">Toutes</button><button class="filter-btn" data-filter="traiter">À vérifier</button><button class="filter-btn" data-filter="bloquants">Bloquantes</button></div>
  </section>
  <div id="content" class="loading">Connexion aux données…</div>
  <section class="agenda"><h2 class="agenda-title">S’abonner aux formations</h2><div class="agenda-buttons"><a id="btnIos" class="agenda-btn ios" href="#">iPhone</a><a id="btnAndroid" class="agenda-btn android" href="#">Android</a></div></section>
</main>
<div id="issueModal" class="modal" aria-hidden="true"><div class="sheet"><h2 id="issueTitle">Points à vérifier</h2><div id="issueSub" class="sheet-sub"></div><div id="issueBody" class="issue-list"></div><button id="issueClose" class="close" type="button">Fermer</button></div></div>
<script>
const WEB_APP_URL="https://script.google.com/macros/s/AKfycbzmelNrBU583V3CvOlle3cafAKEAZQ8NAX-peSN6D-yxFO3gX26SnVNUVd5xbwV3CUISg/exec";
const ICS_URL="https://calendar.google.com/calendar/ical/c5da5df12db0eba65a14410cada08fea4e5a8037ddd256b03e7426cb22cb751b%40group.calendar.google.com/private-4f5072a64d36548137a30abb665ed23f/basic.ics";
let ITEMS=[];let FILTER="tous";
const pilot=document.getElementById("pilot"),content=document.getElementById("content"),search=document.getElementById("search"),modal=document.getElementById("issueModal"),issueTitle=document.getElementById("issueTitle"),issueSub=document.getElementById("issueSub"),issueBody=document.getElementById("issueBody");
document.getElementById("btnIos").href=ICS_URL.replace(/^https:\/\//i,"webcal://");document.getElementById("btnAndroid").href="https://calendar.google.com/calendar/render?cid="+encodeURIComponent(ICS_URL);
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;")}
function norm(v){return String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\s+/g," ").trim()}
function arr(v){return Array.isArray(v)?v:[]}
function initials(v){const p=String(v||"").trim().split(/\s+/).filter(Boolean);return p.length?((p[0][0]||"")+(p[1]?.[0]||p[0][1]||"")).toUpperCase():"?"}
function publicIssue(x){if(typeof x==="string")return{message:x,action:"Vérifier uniquement la donnée concernée.",niveau:"warning"};return{message:String(x&&x.message||""),action:String(x&&x.action||"Vérifier uniquement la donnée concernée."),niveau:x&&x.niveau==="danger"?"danger":"warning"}}
function itemIssues(item){return arr(item.anomalies).map(publicIssue).filter(x=>x.message)}
function agentIssues(agent){return arr(agent&&agent.anomalies).map(publicIssue).filter(x=>x.message)}
function issueCount(item){return itemIssues(item).length+arr(item.agents).reduce((n,a)=>n+agentIssues(a).length,0)}
function level(item){if(item.niveau==="danger"||itemIssues(item).some(x=>x.niveau==="danger")||arr(item.agents).some(a=>agentIssues(a).some(x=>x.niveau==="danger")))return"danger";return issueCount(item)?"warning":"ok"}
function avatar(agent){const a=agent&&agent.avatar||{},t=a.thumb||"";return `<div class="avatar ${t?"has-img":""}">${t?`<img src="${esc(t)}" alt="" onerror="this.parentElement.classList.remove('has-img');this.remove()">`:""}<span class="initials">${esc(a.initiales||initials(agent&&agent.nomComplet))}</span></div>`}
function chip(t){return t?`<span class="chip">${esc(t)}</span>`:""}
function typeClass(item){const n=norm(item&&item.formation&&((item.formation.typeLabel||"")+" "+(item.formation.intitule||"")));return n.includes("INCENDIE")?"incendie":n.includes("CACES")?"caces":(n.includes("IDENTITE")||n.includes("VIGILANCE"))?"identite":"default"}
function openIssues(title,sub,list){list=arr(list).map(publicIssue).filter(x=>x.message);issueTitle.textContent=title;issueSub.textContent=sub||"";issueBody.innerHTML=list.length?list.map(x=>`<div class="issue ${x.niveau}"><div class="issue-message">${esc(x.message)}</div><div class="issue-action"><strong>Action :</strong> ${esc(x.action)}</div></div>`).join(""):'<div class="empty">Aucun point à vérifier.</div>';modal.classList.add("open");modal.setAttribute("aria-hidden","false");document.body.classList.add("modal-open")}
function closeIssues(){modal.classList.remove("open");modal.setAttribute("aria-hidden","true");document.body.classList.remove("modal-open")}
function agentHtml(agent,itemIndex,agentIndex){const issues=agentIssues(agent),lvl=issues.some(x=>x.niveau==="danger")?"danger":issues.length?"warning":"ok";const shift=agent.shift||{};return `<article class="agent ${lvl}">${avatar(agent)}<div><span class="role">Agent concerné</span><span class="name">${esc(agent.nomComplet||"Agent")}</span><div class="info">${chip(agent.ghe)}${chip((shift.label||shift.code||"")+(shift.horaire?" · "+shift.horaire:""))}${issues.length?`<button class="agent-issue ${lvl}" data-agent-issues="${itemIndex}:${agentIndex}" type="button">${lvl==="danger"?"⛔":"⚠️"} ${issues.length} point${issues.length>1?"s":""}</button>`:""}</div></div></article>`}
function sessionHtml(item,index){const f=item.formation||{},agents=arr(item.agents),count=issueCount(item),lvl=level(item),id="session-"+index,sessionIssues=itemIssues(item);return `<article class="session ${lvl} ${typeClass(item)}"><button class="session-toggle" type="button" data-toggle="${id}" aria-expanded="false"><div class="session-head"><div class="session-kicker">${esc(f.typeIcone||"🎓")} ${esc(f.typeLabel||"Formation")}</div><div class="session-title">${esc(f.intitule||"Formation")}</div><div class="session-meta">${chip(f.horaireAffiche||f.horaireSource||"Journée")}${chip(agents.length+" agent"+(agents.length>1?"s":""))}</div></div><span class="chevron">⌄</span></button>${count?`<button class="issue-btn ${lvl}" data-session-issues="${index}" type="button"><span>${lvl==="danger"?"⛔":"⚠️"} ${count} point${count>1?"s":""} à vérifier</span><span>›</span></button>`:""}<div id="${id}" hidden><div class="agent-list">${agents.map((a,i)=>agentHtml(a,index,i)).join("")||'<div class="empty">Aucun agent détecté.</div>'}</div></div></article>`}
function filtered(){const q=norm(search.value);return ITEMS.map((item,index)=>({item,index})).filter(({item})=>{const c=issueCount(item),l=level(item);if(FILTER==="traiter"&&!c)return false;if(FILTER==="bloquants"&&l!=="danger")return false;if(!q)return true;const f=item.formation||{};const text=[item.titre,item.dateLabel,item.semaineLabel,f.intitule,f.typeLabel,f.horaireAffiche,...arr(item.agents).flatMap(a=>[a.nomComplet,a.ghe,a.shift&&a.shift.code,a.shift&&a.shift.label,...agentIssues(a).map(x=>x.message)]),...itemIssues(item).map(x=>x.message)].join(" ");return norm(text).includes(q)})}
function render(){const list=filtered();if(!list.length){content.className="empty";content.innerHTML="Aucune formation à afficher avec ce filtre.";return}const byDate={};list.forEach(x=>{const k=x.item.dateKey||"date";(byDate[k]||(byDate[k]=[])).push(x)});content.className="";content.innerHTML=Object.keys(byDate).sort().map(k=>`<section><h2 class="day-title">${esc(byDate[k][0].item.dateLabel||k)}</h2>${byDate[k].map(x=>sessionHtml(x.item,x.index)).join("")}</section>`).join("")}
function updatePilot(){const total=ITEMS.length,d=ITEMS.filter(x=>level(x)==="danger").length,w=ITEMS.filter(x=>level(x)==="warning").length,l=d?"danger":w?"warning":"ok";pilot.className="pilot "+l;pilot.innerHTML=`<div class="pilot-title">${total} formation${total>1?"s":""} à venir</div><div class="pilot-sub">Les alertes restent repliées et sont rattachées uniquement à la session ou à l’agent concerné.</div><div class="pilot-pills"><span class="pill ok">✅ ${total-d-w} OK</span><span class="pill warning">⚠️ ${w} à vérifier</span><span class="pill danger">⛔ ${d} bloquantes</span></div>`}
content.addEventListener("click",e=>{const t=e.target.closest("[data-toggle]");if(t){const el=document.getElementById(t.dataset.toggle),open=t.getAttribute("aria-expanded")==="true";t.setAttribute("aria-expanded",String(!open));el.hidden=open}const s=e.target.closest("[data-session-issues]");if(s){const item=ITEMS[Number(s.dataset.sessionIssues)],all=[...itemIssues(item),...arr(item.agents).flatMap(a=>agentIssues(a))];openIssues("Points de la formation",(item.dateLabel||"")+" · "+((item.formation&&item.formation.intitule)||"Formation"),all)}const a=e.target.closest("[data-agent-issues]");if(a){const [ii,ai]=a.dataset.agentIssues.split(":").map(Number),item=ITEMS[ii],agent=arr(item.agents)[ai];openIssues("Point de l’agent",(agent&&agent.nomComplet)||"Agent",agentIssues(agent))}});
search.addEventListener("input",render);document.querySelectorAll(".filter-btn").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".filter-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");FILTER=b.dataset.filter;render()}));document.getElementById("issueClose").addEventListener("click",closeIssues);modal.addEventListener("click",e=>{if(e.target===modal)closeIssues()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeIssues()});
(function load(){const cb="recevoirFormations_"+Date.now(),s=document.createElement("script");window[cb]=data=>{delete window[cb];s.remove();if(!data||!data.ok){content.className="error";content.textContent=data&&data.erreur||"Données invalides.";return}ITEMS=arr(data.items);updatePilot();render()};s.onerror=()=>{delete window[cb];s.remove();content.className="error";content.textContent="Impossible de charger les données."};s.src=WEB_APP_URL+"?mode=site_stagiaires_formations&type=formations&callback="+encodeURIComponent(cb)+"&v="+Date.now();document.body.appendChild(s)})();
</script>
</body>
</html>
