<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espace formation</title>

  <style>
    *{box-sizing:border-box}

    :root{
      --ink:#101426;
      --muted:#626b7c;
      --cream:#fff1bd;
      --paper:#fffdf7;
      --line:#151515;
      --red:#d62828;
      --redSoft:#ffe1e1;
      --green:#168447;
      --greenSoft:#dcfce7;
      --orange:#f59e0b;
      --blue:#2563eb;
      --shadow:7px 7px 0 #151515;
    }

    body{
      margin:0;
      color:var(--ink);
      background:radial-gradient(circle at top,#fffef4 0%,#fff0ba 65%,#ffe39a 100%);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }

    .page{
      max-width:980px;
      margin:auto;
      padding:14px 14px 46px;
    }

    .hero{
      background:var(--paper);
      border:4px solid var(--line);
      border-radius:30px;
      overflow:hidden;
      box-shadow:var(--shadow);
      margin-bottom:18px;
    }

    .hero img{
      width:100%;
      display:block;
    }

    .hero-body{
      padding:18px;
    }

    h1{
      margin:0 0 10px;
      font-size:clamp(34px,7vw,62px);
      line-height:.92;
      text-transform:uppercase;
      letter-spacing:-.045em;
      font-weight:1000;
    }

    .intro{
      margin:0;
      color:#414b5f;
      font-size:16px;
      line-height:1.45;
      font-weight:700;
    }

    .today-card{
      background:linear-gradient(180deg,#fffdf8,#fff5d5);
      border:4px solid var(--line);
      border-radius:30px;
      box-shadow:var(--shadow);
      padding:18px;
      margin:18px 0 22px;
      position:relative;
      overflow:hidden;
    }

    .today-card::before{
      content:"";
      position:absolute;
      right:-60px;
      top:-70px;
      width:190px;
      height:190px;
      background:rgba(255,183,3,.28);
      border-radius:50%;
      filter:blur(4px);
    }

    .today-top{
      position:relative;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }

    .today-title{
      margin:0;
      font-size:30px;
      line-height:1;
      font-weight:1000;
      letter-spacing:-.035em;
    }

    .today-status{
      border:3px solid var(--line);
      border-radius:999px;
      background:white;
      padding:8px 12px;
      font-weight:1000;
      white-space:nowrap;
    }

    .today-status.alert{
      border-color:var(--red);
      background:var(--redSoft);
      color:var(--red);
    }

    .today-status.ok{
      border-color:var(--green);
      background:var(--greenSoft);
      color:var(--green);
    }

    .summary-grid{
      position:relative;
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
      margin-top:12px;
    }

    @media(max-width:520px){
      .summary-grid{grid-template-columns:1fr}
    }

    .summary-box{
      background:#fffaf0;
      border:2px solid #eadfbd;
      border-radius:20px;
      padding:12px;
    }

    .summary-label{
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.07em;
      font-size:12px;
      font-weight:1000;
      margin-bottom:4px;
    }

    .summary-value{
      font-size:19px;
      font-weight:1000;
      line-height:1.15;
    }

    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:12px;
      margin:20px 4px 12px;
    }

    .section-head h2{
      margin:0;
      font-size:28px;
      font-weight:1000;
      letter-spacing:-.03em;
    }

    #status{
      color:var(--muted);
      font-weight:900;
      font-size:14px;
      text-align:right;
    }

    .days-slider{
      display:flex;
      gap:18px;
      overflow-x:auto;
      scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling:touch;
      padding:6px 2px 18px;
      scrollbar-width:none;
    }

    .days-slider::-webkit-scrollbar{display:none}

    .day-slide{
      flex:0 0 92%;
      scroll-snap-align:start;
      background:#fffefa;
      border:4px solid var(--line);
      border-radius:34px;
      box-shadow:var(--shadow);
      padding:16px;
    }

    @media(min-width:820px){
      .day-slide{flex:0 0 72%}
    }

    .day-slide.today{
      box-shadow:
        7px 7px 0 #151515,
        0 0 0 8px rgba(255,183,3,.18),
        0 0 35px rgba(255,183,3,.36);
      background:linear-gradient(180deg,#fffef8,#fff6d8);
    }

    .day-header{
      border-bottom:3px dashed rgba(0,0,0,.18);
      padding-bottom:14px;
      margin-bottom:14px;
    }

    .day-line{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      flex-wrap:wrap;
    }

    .day-date{
      display:inline-flex;
      align-items:center;
      gap:8px;
      border:3px solid var(--line);
      border-radius:999px;
      background:white;
      padding:9px 14px;
      font-weight:1000;
      font-size:17px;
    }

    .day-badges{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .badge{
      border:3px solid var(--line);
      background:white;
      border-radius:999px;
      padding:8px 11px;
      font-size:14px;
      font-weight:1000;
    }

    .badge.alert{
      border-color:var(--red);
      background:var(--redSoft);
      color:var(--red);
    }

    .badge.ok{
      border-color:var(--green);
      background:var(--greenSoft);
      color:var(--green);
    }

    .day-formation-title{
      margin:14px 0 0;
      font-size:clamp(28px,6vw,46px);
      line-height:.96;
      letter-spacing:-.045em;
      font-weight:1000;
    }

    .agents-list{
      display:grid;
      gap:12px;
    }

    .agent-card{
      background:var(--paper);
      border:3px solid var(--line);
      border-radius:26px;
      padding:14px;
      box-shadow:5px 5px 0 rgba(0,0,0,.16);
    }

    .agent-card.alert{
      border-color:var(--red);
      box-shadow:5px 5px 0 rgba(214,40,40,.16);
    }

    .agent-card.ok{
      border-color:var(--green);
    }

    .agent-main{
      display:flex;
      gap:12px;
      align-items:center;
      margin-bottom:12px;
    }

    .avatar{
      width:48px;
      height:48px;
      border:3px solid var(--line);
      border-radius:18px;
      display:grid;
      place-items:center;
      background:#f1f5f9;
      font-size:23px;
      font-weight:1000;
      flex:0 0 auto;
    }

    .agent-name{
      font-size:24px;
      font-weight:1000;
      line-height:1.05;
      letter-spacing:-.03em;
    }

    .agent-sub{
      color:var(--muted);
      font-size:13px;
      font-weight:900;
      margin-top:3px;
      text-transform:uppercase;
      letter-spacing:.05em;
    }

    .info-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    @media(max-width:540px){
      .info-grid{grid-template-columns:1fr}
    }

    .info-row{
      display:grid;
      grid-template-columns:34px 1fr;
      gap:9px;
      align-items:center;
      background:#fffaf0;
      border:2px solid #eadfbd;
      border-radius:18px;
      padding:10px 11px;
    }

    .icon{
      font-size:22px;
      display:grid;
      place-items:center;
    }

    .label{
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.07em;
      font-size:11px;
      font-weight:1000;
      margin-bottom:2px;
    }

    .value{
      font-size:17px;
      line-height:1.15;
      font-weight:1000;
    }

    .phone{
      color:inherit;
      text-decoration:none;
    }

    .alert-box,.ok-box{
      margin-top:11px;
      border-radius:20px;
      padding:12px 13px;
      font-size:16px;
      line-height:1.25;
      font-weight:1000;
    }

    .alert-box{
      border:3px solid var(--red);
      background:var(--redSoft);
      color:#8f1d1d;
    }

    .ok-box{
      border:3px solid var(--green);
      background:var(--greenSoft);
      color:#14532d;
    }

    .empty,.error{
      background:white;
      border:3px dashed #999;
      border-radius:24px;
      padding:24px;
      color:var(--muted);
      font-weight:900;
      text-align:center;
    }

    .hint{
      text-align:center;
      color:#6b7280;
      font-size:14px;
      font-weight:950;
      padding-bottom:28px;
    }
  </style>
</head>

<body>
  <main class="page">

    <section class="hero">
      <img src="./Image/Autre%20page/Photo_Formation.png" alt="Espace formation">
      <div class="hero-body">
        <h1>Espace formation</h1>
        <p class="intro">
          Merci de prévenir l’agent concerné dès qu’une formation apparaît, afin qu’il puisse s’organiser à l’avance.
        </p>
      </div>
    </section>

    <section id="todaySummary" class="today-card">
      Chargement du résumé…
    </section>

    <div class="section-head">
      <h2>Journées formation</h2>
      <div id="status">Chargement…</div>
    </div>

    <section id="daysSlider" class="days-slider"></section>

    <div class="hint">Swipe à gauche ou à droite pour changer de jour →</div>

  </main>

  <script>
    const slider = document.getElementById("daysSlider");
    const status = document.getElementById("status");
    const todaySummary = document.getElementById("todaySummary");

    function escapeHtml(value){
      return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function parseDate(value){
      if(!value) return null;
      if(/^\d{4}-\d{2}-\d{2}/.test(value)){
        return new Date(value + "T00:00:00");
      }
      const d = new Date(value);
      return isNaN(d) ? null : d;
    }

    function isSameDay(a,b){
      return a && b &&
        a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate();
    }

    function phoneHref(phone){
      return "tel:" + String(phone || "").replace(/\s/g,"");
    }

    function unique(values){
      return [...new Set(values.filter(Boolean))];
    }

    function groupByDate(items){
      const groups = {};

      items.forEach(item => {
        const key = item.date || "date-inconnue";

        if(!groups[key]){
          groups[key] = {
            date: key,
            dateLabel: item.dateLabel || key,
            items: []
          };
        }

        groups[key].items.push(item);
      });

      return Object.values(groups).sort((a,b) => {
        const today = new Date();
        const da = parseDate(a.date);
        const db = parseDate(b.date);

        const aToday = isSameDay(da,today) ? 0 : 1;
        const bToday = isSameDay(db,today) ? 0 : 1;

        if(aToday !== bToday) return aToday - bToday;
        return String(a.date).localeCompare(String(b.date));
      });
    }

    function buildTodaySummary(groups, allItems){
      const today = new Date();
      const todayGroup = groups.find(group => isSameDay(parseDate(group.date), today));
      const nextGroup = groups.find(group => !isSameDay(parseDate(group.date), today));

      const totalAlerts = allItems.filter(item => item.alerte).length;
      const totalAgents = unique(allItems.map(item => item.agent)).length;
      const allGhe = unique(allItems.map(item => item.ghe).filter(v => v && v !== "Non renseigné"));

      if(!todayGroup){
        return `
          <div class="today-top">
            <h2 class="today-title">🧭 Aujourd’hui</h2>
            <div class="today-status ok">✅ Rien aujourd’hui</div>
          </div>

          <div class="summary-grid">
            <div class="summary-box">
              <div class="summary-label">Formation du jour</div>
              <div class="summary-value">Aucune formation prévue aujourd’hui</div>
            </div>

            <div class="summary-box">
              <div class="summary-label">Prochaine journée</div>
              <div class="summary-value">${nextGroup ? escapeHtml(nextGroup.dateLabel) : "Aucune date trouvée"}</div>
            </div>

            <div class="summary-box">
              <div class="summary-label">Agents à suivre</div>
              <div class="summary-value">${totalAgents} agent(s)</div>
            </div>

            <div class="summary-box">
              <div class="summary-label">Alertes restantes</div>
              <div class="summary-value">${totalAlerts} alerte(s)</div>
            </div>
          </div>
        `;
      }

      const alerts = todayGroup.items.filter(item => item.alerte).length;
      const agents = unique(todayGroup.items.map(item => item.agent)).length;
      const formations = unique(todayGroup.items.map(item => item.formation));
      const ghe = unique(todayGroup.items.map(item => item.ghe).filter(v => v && v !== "Non renseigné"));

      return `
        <div class="today-top">
          <h2 class="today-title">🧭 Aujourd’hui</h2>
          <div class="today-status ${alerts ? "alert" : "ok"}">
            ${alerts ? "⚠️ À vérifier" : "✅ OK"}
          </div>
        </div>

        <div class="summary-grid">
          <div class="summary-box">
            <div class="summary-label">Formation</div>
            <div class="summary-value">${escapeHtml(formations.join(" / ") || "Formation")}</div>
          </div>

          <div class="summary-box">
            <div class="summary-label">Participants</div>
            <div class="summary-value">${agents} agent(s) concerné(s)</div>
          </div>

          <div class="summary-box">
            <div class="summary-label">GHE concernés</div>
            <div class="summary-value">${escapeHtml(ghe.join(", ") || "Non renseigné")}</div>
          </div>

          <div class="summary-box">
            <div class="summary-label">Action</div>
            <div class="summary-value">${alerts ? alerts + " alerte(s) planning à contrôler" : "Prévenir les agents concernés"}</div>
          </div>
        </div>
      `;
    }

    function daySlide(group){
      const today = new Date();
      const isToday = isSameDay(parseDate(group.date), today);
      const alertCount = group.items.filter(item => item.alerte).length;
      const formations = unique(group.items.map(item => item.formation));
      const ghe = unique(group.items.map(item => item.ghe).filter(v => v && v !== "Non renseigné"));

      return `
        <article class="day-slide ${isToday ? "today" : ""}">
          <div class="day-header">
            <div class="day-line">
              <div class="day-date">📅 ${escapeHtml(group.dateLabel)}</div>
              <div class="day-badges">
                <div class="badge">${group.items.length} agent(s)</div>
                ${alertCount ? `<div class="badge alert">⚠️ ${alertCount}</div>` : `<div class="badge ok">✅ OK</div>`}
              </div>
            </div>

            <h3 class="day-formation-title">${escapeHtml(formations.join(" / ") || "Formation")}</h3>
          </div>

          <div class="agents-list">
            ${group.items.map(agentCard).join("")}
          </div>
        </article>
      `;
    }

    function agentCard(item){
      const hasAlert = !!item.alerte;
      const tel = item.telephone && item.telephone !== "Non renseigné"
        ? `<a class="phone" href="${phoneHref(item.telephone)}">${escapeHtml(item.telephone)}</a>`
        : `Non renseigné`;

      return `
        <article class="agent-card ${hasAlert ? "alert" : "ok"}">
          <div class="agent-main">
            <div class="avatar">👤</div>
            <div>
              <div class="agent-name">${escapeHtml(item.agent || "Agent non renseigné")}</div>
              <div class="agent-sub">${escapeHtml(item.ghe || "GHE non renseigné")}</div>
            </div>
          </div>

          <div class="info-grid">
            <div class="info-row">
              <div class="icon">🕒</div>
              <div>
                <div class="label">Formation</div>
                <div class="value">${escapeHtml(item.horaireFormation || "Non renseigné")}</div>
              </div>
            </div>

            <div class="info-row">
              <div class="icon">⏰</div>
              <div>
                <div class="label">Planning</div>
                <div class="value">${escapeHtml(item.horaireAgent || "Non trouvé")}</div>
              </div>
            </div>

            <div class="info-row">
              <div class="icon">🏥</div>
              <div>
                <div class="label">GHE</div>
                <div class="value">${escapeHtml(item.ghe || "Non renseigné")}</div>
              </div>
            </div>

            <div class="info-row">
              <div class="icon">📞</div>
              <div>
                <div class="label">Téléphone</div>
                <div class="value">${tel}</div>
              </div>
            </div>
          </div>

          ${
            hasAlert
              ? `<div class="alert-box">⚠️ ${escapeHtml(item.messageAlerte || "À vérifier.")}</div>`
              : `<div class="ok-box">✅ Horaire cohérent avec la formation.</div>`
          }
        </article>
      `;
    }

    async function loadFormations(){
      try{
        status.textContent = "Chargement…";

        const response = await fetch("/api/formations", { cache:"no-store" });
        const data = await response.json();

        if(!data.ok){
          throw new Error(data.error || "Réponse invalide");
        }

        const items = data.items || [];
        const groups = groupByDate(items);

        todaySummary.innerHTML = buildTodaySummary(groups, items);
        status.textContent = `${items.length} agent(s) • ${groups.length} jour(s)`;

        if(!groups.length){
          slider.innerHTML = `<div class="empty">Aucune formation à afficher.</div>`;
          return;
        }

        slider.innerHTML = groups.map(daySlide).join("");

      }catch(error){
        console.error(error);
        status.textContent = "Erreur";
        todaySummary.innerHTML = `<div class="error">Impossible de charger le résumé.</div>`;
        slider.innerHTML = `<div class="error">Impossible de charger les formations.</div>`;
      }
    }

    loadFormations();
  </script>
</body>
</html>
