<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>GHE — Formations</title>

<style>
*,*::before,*::after{box-sizing:border-box}

:root{
  --ink:#07183f;
  --ink-soft:#263653;

  --cream:#fff7dd;
  --card:#fffaf0;
  --card-soft:#fff6dc;

  --line:#132752;
  --line-soft:rgba(7,24,63,.18);

  --danger:#b42318;
  --danger-line:#c43a2f;
  --danger-bg:#fff1ed;

  --warning:#8a4b00;
  --warning-line:#d2a631;
  --warning-bg:#fff6d8;

  --ok:#166534;
  --ok-line:#2f8f4e;
  --ok-bg:#edf9f1;

  --shadow:0 6px 0 rgba(7,24,63,.14);

  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --display:Impact,"Arial Black",system-ui,sans-serif;
}

html,body{
  margin:0;
  min-height:100vh;
}

body{
  font-family:var(--font);
  background:var(--cream);
  color:var(--ink);
}

.page{
  width:min(1080px,100%);
  margin:auto;
  padding:calc(10px + env(safe-area-inset-top)) 8px calc(130px + env(safe-area-inset-bottom));
}

.topbar{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.navbtn{
  min-height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:8px 14px;
  border:3px solid var(--line);
  border-radius:18px;
  background:var(--card);
  color:var(--ink);
  text-decoration:none;
  font-size:20px;
  font-weight:950;
  box-shadow:0 4px 0 rgba(7,24,63,.14);
}

.hero{
  border:4px solid var(--line);
  border-radius:24px;
  overflow:hidden;
  background:var(--ink);
  box-shadow:var(--shadow);
  margin-bottom:12px;
}

.hero img{
  display:block;
  width:100%;
  height:clamp(118px,28vw,220px);
  object-fit:cover;
}

.pilot{
  background:var(--card);
  border:4px solid var(--line);
  border-radius:22px;
  padding:12px;
  box-shadow:var(--shadow);
  margin-bottom:10px;
}

.pilot-title{
  font-weight:950;
  font-size:20px;
  line-height:1.1;
}

.pilot-sub{
  margin-top:4px;
  color:var(--ink-soft);
  font-size:14px;
  font-weight:850;
  line-height:1.2;
}

.pilot-line{
  margin-top:10px;
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.mini-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:30px;
  padding:6px 9px;
  border-radius:999px;
  background:var(--card-soft);
  border:2px solid var(--line-soft);
  font-size:14px;
  font-weight:900;
}

.mini-pill.danger{
  background:var(--danger-bg);
  color:var(--danger);
  border-color:#efb1b1;
}

.mini-pill.warning{
  background:var(--warning-bg);
  color:var(--warning);
  border-color:#ecd27f;
}

.mini-pill.ok{
  background:var(--ok-bg);
  color:var(--ok);
  border-color:#b7e0c5;
}

.tools{
  display:grid;
  gap:8px;
  margin-bottom:14px;
}

.search{
  width:100%;
  min-height:46px;
  border:3px solid var(--line);
  border-radius:16px;
  padding:8px 12px;
  font-size:16px;
  font-weight:850;
  background:var(--card);
  color:var(--ink);
  outline:none;
  box-shadow:0 4px 0 rgba(7,24,63,.12);
}

.search::placeholder{
  color:rgba(7,24,63,.38);
}

.filters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:4px;
}

.filter-btn{
  flex:0 0 auto;
  border:3px solid var(--line);
  border-radius:999px;
  background:var(--card);
  color:var(--ink);
  padding:8px 11px;
  font-size:14px;
  font-weight:950;
  cursor:pointer;
  box-shadow:0 3px 0 rgba(7,24,63,.12);
}

.filter-btn.active{
  background:var(--ink);
  color:var(--cream);
}

.section-label{
  margin:18px 4px 8px;
  color:rgba(7,24,63,.62);
  text-transform:uppercase;
  font-size:13px;
  font-weight:950;
  letter-spacing:.6px;
}

.formation-summary,
.student-summary{
  display:grid;
  gap:8px;
  margin-bottom:14px;
}

.formation-row,
.student-row{
  background:var(--card);
  border:3px solid var(--line-soft);
  border-radius:19px;
  padding:10px 11px;
  box-shadow:0 4px 0 rgba(7,24,63,.10);
}

.formation-row.ok,
.student-row.ok{
  border-color:rgba(47,143,78,.28);
}

.formation-row.warning,
.student-row.warning{
  background:#fff8df;
  border-color:#e2c060;
}

.formation-row.danger,
.student-row.danger{
  background:#fff4f1;
  border-color:#e7a29d;
}

.formation-row-title,
.student-name{
  font-family:var(--display);
  font-size:clamp(25px,6.5vw,40px);
  line-height:.9;
  letter-spacing:-.5px;
  text-transform:uppercase;
}

.formation-row-meta,
.student-meta{
  margin-top:5px;
  color:var(--ink-soft);
  font-size:14px;
  line-height:1.2;
  font-weight:850;
}

.formation-row-issues,
.student-issues{
  margin-top:7px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.day-title{
  margin:24px 4px 10px;
  font-family:var(--display);
  font-size:clamp(34px,9vw,62px);
  line-height:.88;
  letter-spacing:-1px;
  text-transform:uppercase;
  text-shadow:0 3px 0 #f8d67d;
}

.session-card,
.stagiaire-card{
  background:var(--card);
  border:4px solid var(--line);
  border-radius:24px;
  padding:12px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}

.session-card.ok,
.stagiaire-card.ok{border-color:var(--ok-line)}
.session-card.warning,
.stagiaire-card.warning{border-color:var(--warning-line)}
.session-card.danger,
.stagiaire-card.danger{border-color:var(--danger-line)}

.session-head{
  margin-bottom:10px;
}

.session-title{
  font-family:var(--display);
  font-size:clamp(30px,8vw,46px);
  line-height:.92;
  letter-spacing:-.8px;
  text-transform:uppercase;
}

.session-meta{
  margin-top:6px;
  color:var(--ink-soft);
  font-size:15px;
  line-height:1.18;
  font-weight:900;
}

.session-detail{
  margin:8px 0 10px;
  padding:9px 10px;
  border:2px solid rgba(7,24,63,.16);
  border-radius:16px;
  background:var(--card-soft);
  font-size:15px;
  line-height:1.22;
  font-weight:850;
}

.agent-list{
  display:grid;
  gap:8px;
  margin-top:10px;
}

.agent-card,
.person{
  display:grid;
  grid-template-columns:68px minmax(0,1fr);
  gap:10px;
  align-items:center;
  min-width:0;
  background:var(--card-soft);
  border:2px solid rgba(7,24,63,.16);
  border-radius:18px;
  padding:8px;
}

.agent-card.danger,
.person.danger{
  background:#fff4f1;
  border-color:#e7a29d;
}

.agent-card.warning,
.person.warning{
  background:#fff8df;
  border-color:#e2c060;
}

.agent-card.ok,
.person.ok{
  border-color:rgba(47,143,78,.22);
}

.people-box{
  display:grid;
  gap:8px;
  margin-bottom:10px;
}

.avatar{
  width:62px;
  height:62px;
  border-radius:16px;
  background:#eef3ff;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.avatar img{
  max-width:96%;
  max-height:96%;
  width:auto;
  height:auto;
  object-fit:contain;
  display:block;
}

.avatar .initials{
  width:50px;
  height:50px;
  border-radius:14px;
  border:3px solid var(--line);
  background:var(--card);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--display);
  font-size:19px;
}

.avatar.has-img .initials{
  display:none;
}

.agent-info,
.person-info{
  min-width:0;
}

.role{
  display:block;
  margin-bottom:2px;
  color:rgba(7,24,63,.58);
  font-size:12px;
  font-weight:950;
  letter-spacing:.5px;
  text-transform:uppercase;
}

.agent-name,
.name{
  display:block;
  font-size:clamp(22px,5.8vw,33px);
  line-height:1;
  font-weight:950;
  letter-spacing:-.7px;
  text-transform:uppercase;
  word-break:normal;
  overflow-wrap:normal;
  hyphens:none;
}

.agent-card.danger .agent-name,
.person.danger .name{
  color:var(--danger);
}

.agent-card.warning .agent-name,
.person.warning .name{
  color:#744000;
}

.agent-chips,
.person-chips{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:7px;
}

.agent-chip,
.person-chip,
.chip{
  min-height:28px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 8px;
  border-radius:999px;
  border:2px solid rgba(7,24,63,.16);
  background:var(--card);
  color:var(--ink);
  font-size:13px;
  line-height:1.05;
  font-weight:900;
}

.chip{
  min-height:29px;
  font-size:14px;
}

.agent-chip a,
.person-chip a,
.chip a{
  color:#064ee4;
  font-weight:950;
}

.agent-chip.warning,
.person-chip.warning,
.chip.warning{
  background:var(--warning-bg);
  color:var(--warning);
  border-color:#ecd27f;
}

.agent-chip.danger,
.person-chip.danger,
.chip.danger{
  background:var(--danger-bg);
  color:var(--danger);
  border-color:#efb1b1;
}

.agent-chip.ok,
.person-chip.ok,
.chip.ok{
  background:var(--ok-bg);
  color:var(--ok);
  border-color:#b7e0c5;
}

.alerts{
  display:grid;
  gap:6px;
  margin-top:8px;
}

.alert{
  padding:8px 10px;
  border-radius:15px;
  border:2px solid transparent;
  font-size:14px;
  line-height:1.22;
  font-weight:850;
}

.alert.danger{
  background:var(--danger-bg);
  color:var(--danger);
  border-color:#efb1b1;
}

.alert.warning{
  background:var(--warning-bg);
  color:var(--warning);
  border-color:#ecd27f;
}

.source{
  margin-top:9px;
  color:rgba(7,24,63,.45);
  font-size:12px;
  font-weight:850;
}

.empty,.error,.loading{
  background:var(--card);
  border:4px solid var(--line);
  border-radius:20px;
  padding:14px;
  font-weight:900;
  box-shadow:var(--shadow);
}

.error{
  color:var(--danger);
}

.agenda-box{
  margin:26px 0 4px;
  padding:13px;
  background:var(--card);
  border:4px solid var(--line);
  border-radius:24px;
  box-shadow:var(--shadow);
}

.agenda-title{
  margin:0 0 10px;
  font-family:var(--display);
  font-size:clamp(25px,7vw,44px);
  line-height:.92;
  text-align:center;
  text-transform:uppercase;
  letter-spacing:-.8px;
  text-shadow:0 3px 0 #f8d67d;
}

.agenda-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.agenda-btn{
  min-height:62px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  text-decoration:none;
  color:#fff4ce;
  border:4px solid #061738;
  border-radius:20px;
  font-family:var(--display);
  font-size:clamp(21px,5.5vw,34px);
  line-height:.95;
  text-transform:uppercase;
  box-shadow:0 6px 0 rgba(7,24,63,.32);
}

.agenda-btn.ios{
  background:linear-gradient(145deg,#3db9ff 0%,#0c6ed5 56%,#083c91 100%);
}

.agenda-btn.android{
  background:linear-gradient(145deg,#35d864 0%,#12873d 56%,#075324 100%);
}

.arrow-line{
  display:flex;
  justify-content:center;
  align-items:center;
  height:25px;
  color:var(--ink);
  font-size:25px;
  line-height:1;
  font-weight:950;
}

@media(min-width:720px){
  .page{
    padding-left:14px;
    padding-right:14px;
  }

  .pilot,
  .session-card,
  .stagiaire-card{
    padding:14px;
  }

  .people-box{
    grid-template-columns:1fr 38px 1fr;
    align-items:center;
  }

  .arrow-line{
    height:auto;
  }

  .agent-card,
  .person{
    grid-template-columns:76px minmax(0,1fr);
  }

  .avatar{
    width:70px;
    height:70px;
  }
}

@media(max-width:370px){
  .agent-card,
  .person{
    grid-template-columns:60px minmax(0,1fr);
  }

  .avatar{
    width:54px;
    height:54px;
    border-radius:14px;
  }

  .agent-name,
  .name{
    font-size:20px;
  }

  .chip,
  .agent-chip,
  .person-chip{
    font-size:13px;
    padding:5px 7px;
  }
}
</style>
</head>

<body>
<main class="page">

  <div class="topbar">
    <a class="navbtn" href="index.html">← Accueil</a>
  </div>

  <section class="hero">
    <img
      src="Image/Bannière/Page Formation.PNG"
      alt="Formations GHE"
      onerror="this.onerror=null;this.src='Image/Banni%C3%A8re/Page%20Formation.PNG';"
    >
  </section>

  <section id="pilot" class="pilot ok">
    <div id="pilotTitle" class="pilot-title">Chargement du cockpit…</div>
    <div id="pilotSub" class="pilot-sub">Analyse des sessions de formation à venir</div>

    <div class="pilot-line">
      <span id="pilotTypes" class="mini-pill">🎓 0 type</span>
      <span id="pilotSessions" class="mini-pill">📅 0 session</span>
      <span id="pilotAgents" class="mini-pill">👥 0 agent</span>
      <span id="pilotDanger" class="mini-pill danger">⛔ 0 bloquant</span>
      <span id="pilotWarning" class="mini-pill warning">⚠️ 0 à vérifier</span>
    </div>
  </section>

  <section class="tools">
    <input id="search" class="search" type="search" placeholder="Rechercher formation, agent, GHE, téléphone…">

    <div class="filters">
      <button class="filter-btn active" data-filter="tous">Tous</button>
      <button class="filter-btn" data-filter="traiter">À traiter</button>
      <button class="filter-btn" data-filter="bloquants">Bloquants</button>
    </div>
  </section>

  <div class="section-label">Formations concernées</div>
  <section id="formationSummary" class="formation-summary">
    <div class="loading">Analyse des formations…</div>
  </section>

  <div class="section-label">Détail par date</div>

  <section id="content">
    <div class="loading">Chargement des formations…</div>
  </section>

  <section class="agenda-box">
    <h2 class="agenda-title">Ajouter l’agenda formations</h2>
    <div class="agenda-buttons">
      <a id="btnIos" class="agenda-btn ios" href="#"><span>🍎</span><span>iOS</span></a>
      <a id="btnAndroid" class="agenda-btn android" href="#"><span>🤖</span><span>Android</span></a>
    </div>
  </section>

</main>

<script>

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzmelNrBU583V3CvOlle3cafAKEAZQ8NAX-peSN6D-yxFO3gX26SnVNUVd5xbwV3CUISg/exec";

const ICS_URL = "https://calendar.google.com/calendar/ical/c5da5df12db0eba65a14410cada08fea4e5a8037ddd256b03e7426cb22cb751b%40group.calendar.google.com/private-4f5072a64d36548137a30abb665ed23f/basic.ics";

let ITEMS = [];
let CURRENT_FILTER = "tous";

document.getElementById("btnIos").href = ICS_URL.replace(/^https:\/\//i, "webcal://");
document.getElementById("btnAndroid").href = "https://calendar.google.com/calendar/render?cid=" + encodeURIComponent(ICS_URL);

document.getElementById("search").addEventListener("input", refreshView);

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    CURRENT_FILTER = btn.dataset.filter;
    refreshView();
  });
});

loadJsonp("formations");

function loadJsonp(type){
  const callbackName = "recevoirGhe_" + type + "_" + Date.now();
  const script = document.createElement("script");

  window[callbackName] = function(data){
    delete window[callbackName];
    script.remove();

    if (!data || !data.ok) {
      showError(data && data.erreur ? data.erreur : "Données invalides.");
      return;
    }

    ITEMS = data.items || [];
    updatePilot(ITEMS);
    refreshView();
  };

  script.onerror = function(){
    delete window[callbackName];
    script.remove();
    showError("Impossible de charger les données.");
  };

  script.src = WEB_APP_URL
    + "?mode=site_stagiaires_formations"
    + "&type=" + encodeURIComponent(type)
    + "&callback=" + encodeURIComponent(callbackName)
    + "&v=" + Date.now();

  document.body.appendChild(script);
}

function refreshView(){
  const filtered = filterItems();
  renderFormationSummary(filtered);
  render(filtered);
}

function filterItems(){
  const q = norm(document.getElementById("search").value);

  return ITEMS.filter(item => {
    const level = itemLevel(item);
    const issueCount = countItemIssues(item).total;

    if (CURRENT_FILTER === "traiter" && issueCount === 0) return false;
    if (CURRENT_FILTER === "bloquants" && level !== "danger") return false;

    if (!q) return true;

    const formation = item.formation || {};
    const agents = item.agents || [];
    const alertes = item.alertes || {};

    const txt = [
      item.titre,
      item.dateLabel,
      formation.intitule,
      formation.typeLabel,
      formation.horaireAffiche,
      agents.map(a => [
        a.nomComplet,
        a.nom,
        a.prenom,
        a.ghe,
        a.telephone,
        a.shift && a.shift.code,
        a.shift && a.shift.label
      ].join(" ")).join(" "),
      (alertes.bloquantes || []).join(" "),
      (alertes.infos || []).join(" ")
    ].join(" ");

    return norm(txt).includes(q);
  });
}

function updatePilot(items){
  const summaries = formationSummaries(items);
  const typeCount = summaries.length;
  const sessionCount = items.length;
  const agentCount = uniqueAgents(items).size;

  const totals = uniqueGlobalIssues(items);

  const pilot = document.getElementById("pilot");
  const title = document.getElementById("pilotTitle");
  const sub = document.getElementById("pilotSub");

  pilot.classList.remove("ok","warning","danger");

  if (totals.danger > 0) {
    pilot.classList.add("danger");
    title.textContent = totals.total + " point" + plural(totals.total) + " à traiter";
  } else if (totals.warning > 0) {
    pilot.classList.add("warning");
    title.textContent = totals.total + " point" + plural(totals.total) + " à vérifier";
  } else {
    pilot.classList.add("ok");
    title.textContent = "Tout est prêt";
  }

  sub.textContent =
    typeCount + " type" + plural(typeCount) + " de formation"
    + " · "
    + sessionCount + " session" + plural(sessionCount)
    + " · "
    + agentCount + " agent" + plural(agentCount) + " concerné" + plural(agentCount);

  document.getElementById("pilotTypes").textContent = "🎓 " + typeCount + " type" + plural(typeCount);
  document.getElementById("pilotSessions").textContent = "📅 " + sessionCount + " session" + plural(sessionCount);
  document.getElementById("pilotAgents").textContent = "👥 " + agentCount + " agent" + plural(agentCount);
  document.getElementById("pilotDanger").textContent = "⛔ " + totals.danger + " bloquant" + plural(totals.danger);
  document.getElementById("pilotWarning").textContent = "⚠️ " + totals.warning + " à vérifier";
}

function renderFormationSummary(items){
  const box = document.getElementById("formationSummary");
  const summaries = formationSummaries(items);

  if (!summaries.length) {
    box.innerHTML = `<div class="empty">Aucune formation à afficher avec ce filtre.</div>`;
    return;
  }

  box.innerHTML = summaries.map(s => {
    const level = s.danger > 0 ? "danger" : (s.warning > 0 ? "warning" : "ok");
    const points = s.danger + s.warning;

    return `
      <article class="formation-row ${esc(level)}">
        <div class="formation-row-title">${esc(s.name)}</div>

        <div class="formation-row-meta">
          ${esc(s.sessions + " session" + plural(s.sessions))}
          · ${esc(s.agents.size + " agent" + plural(s.agents.size) + " concerné" + plural(s.agents.size))}
        </div>

        <div class="formation-row-issues">
          ${points ? `<span class="chip ${level === "danger" ? "danger" : "warning"}">${esc(points + " point" + plural(points) + " à traiter")}</span>` : `<span class="chip ok">✅ prêt</span>`}
          ${s.danger ? `<span class="chip danger">⛔ ${esc(s.danger + " bloquant" + plural(s.danger))}</span>` : ""}
          ${s.warning ? `<span class="chip warning">⚠️ ${esc(s.warning + " à vérifier")}</span>` : ""}
        </div>
      </article>
    `;
  }).join("");
}

function formationSummaries(items){
  const map = new Map();

  items.forEach(item => {
    const key = formationKey(item);
    const name = compactFormationTitle(item);
    const agents = item.agents || [];

    if (!map.has(key)) {
      map.set(key, {
        key,
        name,
        sessions:0,
        agents:new Set(),
        dangerSet:new Set(),
        warningSet:new Set()
      });
    }

    const s = map.get(key);
    s.sessions += 1;

    agents.forEach(a => {
      s.agents.add(agentKey(a));
    });

    const general = formationGeneralAlerts(item);

    general.danger.forEach(msg => {
      s.dangerSet.add(issueSignature(item, msg, "danger", "general"));
    });

    general.warning.forEach(msg => {
      s.warningSet.add(issueSignature(item, msg, "warning", "general"));
    });

    agents.forEach(a => {
      const issues = agentIssues(a, item);

      issues.danger.forEach(msg => {
        s.dangerSet.add(issueSignature(item, msg, "danger", agentKey(a)));
      });

      issues.warning.forEach(msg => {
        s.warningSet.add(issueSignature(item, msg, "warning", agentKey(a)));
      });
    });
  });

  return Array.from(map.values())
    .map(s => ({
      key:s.key,
      name:s.name,
      sessions:s.sessions,
      agents:s.agents,
      danger:s.dangerSet.size,
      warning:s.warningSet.size
    }))
    .sort((a,b) => a.name.localeCompare(b.name, "fr"));
}

function render(items){
  const content = document.getElementById("content");

  if (!items.length) {
    content.innerHTML = `<div class="empty">Aucune formation à afficher avec ce filtre.</div>`;
    return;
  }

  const groups = groupByDate(items);

  content.innerHTML = Object.keys(groups).map(dateKey => {
    const list = groups[dateKey];
    const label = list[0].dateLabel || dateKey;

    return `
      <div class="day-title">${esc(label)}</div>
      ${list.map(cardFormation).join("")}
    `;
  }).join("");
}

function cardFormation(item){
  const formation = item.formation || {};
  const agents = item.agents || [];
  const source = "DETAIL_FORMATIONS";

  const level = itemLevel(item);
  const general = formationGeneralAlerts(item);

  const title = compactFormationTitle(item);
  const horaire = formation.horaireAffiche || extractHoraire(item.titre) || "";
  const detail = cleanFormationDetail(formation.intitule, title);

  return `
    <article class="session-card ${esc(level)}">

      <div class="session-head">
        <div class="session-title">${esc(title)}</div>
        <div class="session-meta">
          ${esc([horaire, agents.length + " agent" + plural(agents.length)].filter(Boolean).join(" · "))}
        </div>
      </div>

      ${detail ? `<div class="session-detail">${esc(detail)}</div>` : ""}

      ${general.danger.length || general.warning.length ? issueBlock(general) : ""}

      <div class="agent-list">
        ${agents.map(a => agentCard(a, item)).join("")}
      </div>

      <div class="source">Source : ${esc(source)}</div>
    </article>
  `;
}

function agentCard(a, item){
  const shift = a.shift || {};
  const issues = agentIssues(a, item);
  const level = issues.danger.length ? "danger" : (issues.warning.length ? "warning" : "ok");

  const telRaw = String(a.telephone || "").trim();
  const telOk = hasUsefulValue(telRaw);
  const telHref = telRaw.replace(/[^\d+]/g, "");

  const gheOk = hasUsefulValue(a.ghe);

  const shiftText = formatShift(shift);
  const shiftOk = shiftKnown(shiftText);

  const contactHtml = [
    esc(formatGhe(a.ghe)),
    telOk ? `📞 <a href="tel:${esc(telHref)}">${esc(telRaw)}</a>` : "📞 non renseigné"
  ].join(" · ");

  return `
    <div class="agent-card ${esc(level)}">
      ${avatarHtml(a.avatar)}

      <div class="agent-info">
        <span class="role">Agent</span>
        <span class="agent-name">${esc(agentDisplayName(a))}</span>

        <div class="agent-chips">
          <span class="agent-chip ${gheOk && telOk ? "" : "warning"}">
            ${contactHtml}
          </span>

          <span class="agent-chip ${shiftOk ? "" : "warning"}">
            ${shiftDot(shift)} ${esc(shiftText)}
          </span>
        </div>

        ${issueBlock(issues)}
      </div>
    </div>
  `;
}

function uniqueGlobalIssues(items){
  const dangerSet = new Set();
  const warningSet = new Set();

  items.forEach(item => {
    const general = formationGeneralAlerts(item);

    general.danger.forEach(msg => {
      dangerSet.add(issueSignature(item, msg, "danger", "general"));
    });

    general.warning.forEach(msg => {
      warningSet.add(issueSignature(item, msg, "warning", "general"));
    });

    (item.agents || []).forEach(a => {
      const issues = agentIssues(a, item);

      issues.danger.forEach(msg => {
        dangerSet.add(issueSignature(item, msg, "danger", agentKey(a)));
      });

      issues.warning.forEach(msg => {
        warningSet.add(issueSignature(item, msg, "warning", agentKey(a)));
      });
    });
  });

  return {
    danger:dangerSet.size,
    warning:warningSet.size,
    total:dangerSet.size + warningSet.size
  };
}

function countItemIssues(item){
  const general = formationGeneralAlerts(item);
  let danger = general.danger.length;
  let warning = general.warning.length;

  (item.agents || []).forEach(a => {
    const issues = agentIssues(a, item);
    danger += issues.danger.length;
    warning += issues.warning.length;
  });

  return {
    danger,
    warning,
    total:danger + warning
  };
}

function itemLevel(item){
  const c = countItemIssues(item);

  if (c.danger > 0 || item.niveau === "danger") return "danger";
  if (c.warning > 0 || item.niveau === "warning") return "warning";
  return "ok";
}

function formationGeneralAlerts(item){
  const agents = item.agents || [];
  const alertes = item.alertes || {};
  const bloquantes = alertes.bloquantes || [];
  const infos = alertes.infos || [];

  return {
    danger:dedupeList(bloquantes.filter(msg => !agents.some(a => messageMentionsAgent(msg, a))).map(simplifyFormationAlert)),
    warning:dedupeList(infos.filter(msg => !agents.some(a => messageMentionsAgent(msg, a))).map(simplifyFormationAlert))
  };
}

function simplifyFormationAlert(message){
  return String(message || "").trim();
}

function messageMentionsAgent(message, a){
  const msg = norm(message);
  if (!msg || !a) return false;

  const candidates = [];

  if (a.nomComplet) candidates.push(norm(a.nomComplet));

  if (a.nom && a.prenom) {
    candidates.push(norm(a.nom + " " + a.prenom));
    candidates.push(norm(a.prenom + " " + a.nom));
  }

  if (a.nom && norm(a.nom).length >= 4) candidates.push(norm(a.nom));
  if (a.prenom && norm(a.prenom).length >= 4) candidates.push(norm(a.prenom));

  return candidates.filter(Boolean).some(candidate => msg.includes(candidate));
}

function issueSignature(item, message, type, agent){
  const formation = formationKey(item);
  const msg = norm(message);
  const person = norm(agent || "general");

  return [type, formation, person, msg].join("|");
}

function compactFormationTitle(item){
  const formation = item.formation || {};
  const raw = String(item.titre || formation.typeLabel || formation.intitule || "Formation").trim();

  const first = raw.split("|")[0].trim();
  return first || "Formation";
}

function cleanFormationDetail(intitule, title){
  const value = String(intitule || "").trim();
  if (!value) return "";

  const a = norm(value);
  const b = norm(title).replace(/[^\w\s]/g,"").trim();

  if (a === b) return "";
  return value;
}

function extractHoraire(text){
  const match = String(text || "").match(/\b\d{1,2}[:h]\d{2}\s*[–-]\s*\d{1,2}[:h]\d{2}\b/i);
  return match ? match[0].replace(/h/g,":") : "";
}

function formationKey(item){
  return norm(compactFormationTitle(item));
}

function agentKey(a){
  return norm(a && (a.nomComplet || [a.nom, a.prenom].filter(Boolean).join(" ") || a.ghe || a.telephone || "agent"));
}

function agentDisplayName(a){
  return String(a.nomComplet || [a.nom, a.prenom].filter(Boolean).join(" ") || "Agent sans nom").trim();
}

function uniqueAgents(items){
  const set = new Set();

  items.forEach(item => {
    (item.agents || []).forEach(a => set.add(agentKey(a)));
  });

  return set;
}

function showError(message){
  document.getElementById("content").innerHTML = `<div class="error">Problème : ${esc(message)}</div>`;
  document.getElementById("formationSummary").innerHTML = `<div class="error">Résumé indisponible.</div>`;
}


function plural(number){
  return Number(number) > 1 ? "s" : "";
}

function esc(value){
  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function norm(value){
  return String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .trim();
}

function escapeRegExp(value){
  return String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function hasUsefulValue(value){
  const n = norm(value);

  if (!n) return false;
  if (n === "non renseigne") return false;
  if (n === "non renseignee") return false;
  if (n.includes("non renseigne")) return false;
  if (n === "nr") return false;
  if (n === "-") return false;

  return true;
}

function pushUnique(list, message){
  const n = norm(message);
  if (!list.some(x => norm(x) === n)) list.push(message);
}

function dedupeList(list){
  const seen = new Set();
  const out = [];

  list.forEach(x => {
    const key = norm(x);
    if (!seen.has(key)) {
      seen.add(key);
      out.push(x);
    }
  });

  return out;
}

function missingPhrase(parts){
  if (parts.length === 1) return parts[0] + " manquant.";
  if (parts.length === 2) return parts[0] + " et " + parts[1] + " manquants.";

  const copy = parts.slice();
  const last = copy.pop();
  return copy.join(", ") + " et " + last + " manquants.";
}

function groupByDate(items){
  return items.reduce((acc,item) => {
    const key = item.dateKey || "sans-date";
    if (!acc[key]) acc[key] = [];
    acc[key].push(item);
    return acc;
  }, {});
}

function avatarHtml(avatar){
  avatar = avatar || {};
  const initials = esc(avatar.initiales || "?");
  const thumb = avatar.thumb || "";

  if (!thumb) {
    return `<div class="avatar"><div class="initials">${initials}</div></div>`;
  }

  return `
    <div class="avatar has-img">
      <img src="${esc(thumb)}" alt="" loading="lazy" onerror="this.parentElement.classList.remove('has-img');this.remove();">
      <div class="initials">${initials}</div>
    </div>
  `;
}

function formatGhe(value){
  const raw = String(value || "").trim();

  if (!hasUsefulValue(raw)) return "GHE non renseigné";

  const cleaned = raw
    .replace(/^(ghe\s*)+/i, "")
    .trim();

  return "GHE " + cleaned;
}

function issueBlock(issues){
  const danger = issues.danger || [];
  const warning = issues.warning || [];

  if (!danger.length && !warning.length) return "";

  return `
    <div class="alerts">
      ${danger.map(x => `<div class="alert danger">⛔ ${esc(x)}</div>`).join("")}
      ${warning.map(x => `<div class="alert warning">⚠️ ${esc(x)}</div>`).join("")}
    </div>
  `;
}





/* =========================================================
   PATCH INTÉGRÉ — SHIFTS INTELLIGENTS FORMATIONS
   But :
   - RH / CA / RTT / RTa / RC / RF / SYR / ABS / AM / MA / AA / AR / FO
     sont reconnus, mais restent BLOQUANTS en rouge.
   - M / S / J / J4 / N / M0130 / M0131 sont reconnus comme shifts travaillés.
   ========================================================= */

function GHE_shiftCodeFromText(value){
  const raw = String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toUpperCase();

  const compact = raw.replace(/[^A-Z0-9]/g, "");
  const spaced = raw.replace(/[^A-Z0-9]+/g, " ").trim();
  const tokens = spaced ? spaced.split(/\s+/) : [];

  if (compact.includes("M0130")) return "M0130";
  if (compact.includes("M0131")) return "M0131";

  if (tokens.includes("RTTA") || tokens.includes("RTA") || compact.includes("RTTA") || compact.includes("RTA")) return "RTTA";
  if (tokens.includes("RTT") || compact.includes("RTT")) return "RTT";

  if (tokens.includes("J4") || compact.includes("J4")) return "J4";

  if (tokens.includes("RH")) return "RH";
  if (tokens.includes("CA")) return "CA";
  if (tokens.includes("RC")) return "RC";
  if (tokens.includes("RF")) return "RF";
  if (tokens.includes("SYR") || tokens.includes("SYN") || raw.includes("SYNDICAT")) return "SYR";
  if (tokens.includes("ABS") || raw.includes("ABSENCE")) return "ABS";

  if (tokens.includes("AM")) return "AM";
  if (tokens.includes("MA")) return "MA";
  if (tokens.includes("AA")) return "AA";
  if (tokens.includes("AR")) return "AR";
  if (tokens.includes("FO")) return "FO";

  if (raw.includes("MATIN") || tokens.includes("M")) return "M";
  if (raw.includes("SOIR") || tokens.includes("S")) return "S";
  if (raw.includes("NUIT") || tokens.includes("N")) return "N";
  if (raw.includes("JOURNEE") || raw.includes("JOURNÉE") || tokens.includes("J")) return "J";

  return "";
}

function GHE_shiftMetaFromCode(code){
  const c = String(code || "").toUpperCase();

  const map = {
    M:     {code:"M",     icon:"🔵", label:"Matin", worked:true,  blocking:false, family:"matin"},
    M0130: {code:"M0130", icon:"🌅", label:"Matin référence M0130", worked:true, blocking:false, family:"matin"},
    M0131: {code:"M0131", icon:"🌅", label:"Matin référence M0131", worked:true, blocking:false, family:"matin"},
    S:     {code:"S",     icon:"🟡", label:"Soir", worked:true,   blocking:false, family:"soir"},
    J:     {code:"J",     icon:"🟢", label:"Journée", worked:true, blocking:false, family:"journee"},
    J4:    {code:"J4",    icon:"🟠", label:"Journée J4", worked:true, blocking:false, family:"journee"},
    N:     {code:"N",     icon:"🌙", label:"Nuit", worked:true,   blocking:false, family:"nuit"},

    RH:    {code:"RH",    icon:"🛋️", label:"Repos hebdomadaire", worked:false, blocking:true, family:"repos"},
    CA:    {code:"CA",    icon:"🏝️", label:"Congé payé", worked:false, blocking:true, family:"conge"},
    RC:    {code:"RC",    icon:"🔁", label:"Repos compensateur", worked:false, blocking:true, family:"recuperation"},
    RF:    {code:"RF",    icon:"🎌", label:"Repos férié / récupération", worked:false, blocking:true, family:"recuperation"},
    RTT:   {code:"RTT",   icon:"🧘", label:"RTT", worked:false, blocking:true, family:"recuperation"},
    RTTA:  {code:"RTTA",  icon:"🧘", label:"Récupération temps de travail", worked:false, blocking:true, family:"recuperation"},
    SYR:   {code:"SYR",   icon:"🗣️", label:"Syndicat", worked:false, blocking:true, family:"syndicat"},

    ABS:   {code:"ABS",   icon:"⚠️", label:"Absence", worked:false, blocking:true, family:"absence"},
    AM:    {code:"AM",    icon:"⚪", label:"Statut spécial AM à vérifier", worked:false, blocking:true, family:"special"},
    MA:    {code:"MA",    icon:"⚪", label:"Statut spécial MA à vérifier", worked:false, blocking:true, family:"special"},
    AA:    {code:"AA",    icon:"⚪", label:"Statut spécial AA à vérifier", worked:false, blocking:true, family:"special"},
    AR:    {code:"AR",    icon:"⚪", label:"Statut spécial AR à vérifier", worked:false, blocking:true, family:"special"},
    FO:    {code:"FO",    icon:"⚪", label:"Statut spécial FO à vérifier", worked:false, blocking:true, family:"special"}
  };

  return map[c] || {code:c, icon:"⚪", label:c || "Shift inconnu", worked:false, blocking:false, family:"unknown", known:false};
}

function GHE_shiftMetaFromAny(value){
  if (typeof value === "object" && value) {
    const code = GHE_shiftCodeFromText([
      value.code,
      value.label,
      value.base,
      value.horaire
    ].join(" "));

    const meta = GHE_shiftMetaFromCode(code);
    meta.known = !!code;
    return meta;
  }

  const code = GHE_shiftCodeFromText(value);
  const meta = GHE_shiftMetaFromCode(code);
  meta.known = !!code;
  return meta;
}

function GHE_smartShiftMessage(message){
  const meta = GHE_shiftMetaFromAny(message);

  if (meta.known && meta.blocking) {
    return "Indisponible : " + meta.code + " — " + meta.label;
  }

  if (meta.known && meta.worked) {
    return "Shift reconnu : " + meta.code + " — " + meta.label + ". Vérifier la compatibilité avec le créneau prévu.";
  }

  return String(message || "").trim();
}

function GHE_messageIsShiftProblem(message){
  const n = norm(message);
  return (
    n.includes("code shift") ||
    n.includes("shift non reconnu") ||
    n.includes("code non travaille") ||
    n.includes("non travaille")
  );
}

function GHE_messageIsBlockingShift(message){
  const meta = GHE_shiftMetaFromAny(message);
  return meta.known && meta.blocking;
}

function cleanShiftText(value){
  return String(value || "")
    .replace(/[🔵🟢🟡🟠🌙🌅🛋️🏝️🔁🎌🧘🗣️⚪✅⛔⚠️]/g,"")
    .replace(/\s+/g," ")
    .trim();
}

function formatShift(shift){
  shift = shift || {};

  const meta = GHE_shiftMetaFromAny(shift);
  const rawLabel = cleanShiftText(shift.label);
  const rawCode = cleanShiftText(shift.code);

  if (meta.known) {
    return meta.label + " · " + meta.code;
  }

  if (rawLabel && rawCode) return rawLabel + " · " + rawCode;
  if (rawLabel) return rawLabel;
  if (rawCode) return rawCode;

  return "inconnu";
}

function shiftKnown(text){
  const meta = GHE_shiftMetaFromAny(text);
  if (meta.known) return true;

  const n = norm(text);
  return !!n && !n.includes("non connu") && !n.includes("inconnu") && !n.includes("non renseigne");
}

function shiftDot(shift){
  const meta = GHE_shiftMetaFromAny(shift);
  if (meta.known) return meta.icon;
  return "⚪";
}

function simplifyAgentAlert(message, a){
  let s = String(message || "").trim();

  const names = [
    a.nomComplet,
    a.nom && a.prenom ? a.nom + " " + a.prenom : "",
    a.nom && a.prenom ? a.prenom + " " + a.nom : "",
    a.nom,
    a.prenom
  ].filter(Boolean);

  names.forEach(name => {
    s = s.replace(new RegExp("^\\s*" + escapeRegExp(name) + "\\s*:\\s*", "i"), "");
  });

  if (GHE_messageIsShiftProblem(s)) {
    return GHE_smartShiftMessage(s);
  }

  s = s.replace(/prévu sur un code non travaillé\s*:\s*/i, "Code non travaillé : ");
  s = s.replace(/Code shift non reconnu\s*:\s*/i, "Code shift non reconnu : ");
  s = s.replace(/Téléphone manquant\.?/i, "Téléphone manquant.");
  s = s.replace(/GHE manquant\.?/i, "GHE manquant.");

  return s.trim();
}

function agentIssues(a, item){
  const alertes = item.alertes || {};
  const danger = [];
  const warning = [];

  const shift = a.shift || {};
  const shiftText = formatShift(shift);
  const meta = GHE_shiftMetaFromAny(shift);

  if (meta.known && meta.blocking) {
    pushUnique(danger, "Indisponible : " + meta.code + " — " + meta.label);
  }

  (alertes.bloquantes || [])
    .filter(msg => messageMentionsAgent(msg, a))
    .forEach(msg => pushUnique(danger, simplifyAgentAlert(msg, a)));

  const missing = [];
  if (!hasUsefulValue(a.ghe)) missing.push("GHE");
  if (!hasUsefulValue(a.telephone)) missing.push("téléphone");

  if (missing.length) {
    warning.push(missingPhrase(missing));
  }

  const hasShiftAlert = (alertes.infos || []).concat(alertes.bloquantes || [])
    .some(msg => {
      const n = norm(msg);
      return n.includes("code shift") || n.includes("shift non reconnu") || n.includes("code non travaille");
    });

  (alertes.infos || [])
    .filter(msg => messageMentionsAgent(msg, a))
    .forEach(msg => {
      const n = norm(msg);

      if (missing.length && (n.includes("ghe") || n.includes("telephone"))) return;

      if (GHE_messageIsBlockingShift(msg)) {
        pushUnique(danger, simplifyAgentAlert(msg, a));
        return;
      }

      pushUnique(warning, simplifyAgentAlert(msg, a));
    });

  if (!shiftKnown(shiftText) && !hasShiftAlert) {
    pushUnique(warning, "Shift à vérifier.");
  }

  if (a.agentTrouve === false) {
    pushUnique(danger, "Agent introuvable dans la source agents.");
  }

  return {
    danger:dedupeList(danger),
    warning:dedupeList(warning)
  };
}
