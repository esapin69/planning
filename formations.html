<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espace formation</title>

  <style>
    *{box-sizing:border-box}

    :root{
      --bg:#fff3c7;
      --ink:#101426;
      --muted:#687082;
      --paper:#fffdf7;
      --line:#161616;
      --soft:#f9f2df;
      --green:#1f8a4c;
      --orange:#f59e0b;
      --red:#d62828;
      --red-soft:#ffe1e1;
      --shadow:8px 8px 0 #171717;
    }

    body{
      margin:0;
      background:radial-gradient(circle at top,#fffdf3 0%,#fff0b8 70%,#ffe49a 100%);
      color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }

    .page{
      max-width:980px;
      margin:auto;
      padding:14px 14px 44px;
    }

    .hero{
      background:#fffdf7;
      border:4px solid var(--line);
      border-radius:30px;
      overflow:hidden;
      box-shadow:var(--shadow);
      margin-bottom:22px;
    }

    .hero img{
      width:100%;
      display:block;
    }

    .hero-body{
      padding:18px;
    }

    h1{
      margin:0 0 10px;
      font-size:clamp(32px,7vw,60px);
      line-height:.92;
      text-transform:uppercase;
      letter-spacing:-.04em;
    }

    .intro{
      margin:0;
      color:#424b5f;
      font-size:16px;
      line-height:1.45;
      font-weight:650;
    }

    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:12px;
      margin:20px 4px 12px;
    }

    .section-head h2{
      margin:0;
      font-size:28px;
    }

    #status{
      color:var(--muted);
      font-weight:800;
      font-size:14px;
      text-align:right;
    }

    .days-slider{
      display:flex;
      gap:18px;
      overflow-x:auto;
      scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling:touch;
      padding:6px 2px 16px;
      scrollbar-width:none;
    }

    .days-slider::-webkit-scrollbar{display:none}

    .day-slide{
      flex:0 0 92%;
      scroll-snap-align:start;
      background:#fffefa;
      border:4px solid var(--line);
      border-radius:34px;
      box-shadow:var(--shadow);
      padding:16px;
      min-height:420px;
      position:relative;
    }

    @media(min-width:800px){
      .day-slide{flex:0 0 72%}
    }

    .day-slide.today{
      box-shadow:
        8px 8px 0 #171717,
        0 0 0 8px rgba(255,183,3,.22),
        0 0 38px rgba(255,183,3,.42);
      background:linear-gradient(180deg,#fffef9,#fff6d8);
    }

    .day-top{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
      margin-bottom:16px;
      border-bottom:3px dashed rgba(0,0,0,.18);
      padding-bottom:14px;
    }

    .day-date{
      display:inline-flex;
      align-items:center;
      gap:8px;
      border:3px solid var(--line);
      border-radius:999px;
      padding:9px 14px;
      font-weight:950;
      background:white;
      font-size:17px;
    }

    .day-stats{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .pill{
      border:3px solid var(--line);
      border-radius:999px;
      padding:8px 12px;
      background:#fff;
      font-weight:950;
      font-size:14px;
    }

    .pill.today-pill{
      background:#ffe58f;
    }

    .pill.alert-pill{
      color:var(--red);
      border-color:var(--red);
      background:var(--red-soft);
    }

    .formations-list{
      display:grid;
      gap:14px;
    }

    .formation-card{
      background:var(--paper);
      border:3px solid var(--line);
      border-radius:26px;
      padding:15px;
      box-shadow:5px 5px 0 rgba(0,0,0,.16);
    }

    .formation-card.alert{
      border-color:var(--red);
      box-shadow:5px 5px 0 rgba(214,40,40,.18);
    }

    .formation-card.ok{
      border-color:var(--green);
    }

    .formation-title{
      margin:0 0 12px;
      font-size:clamp(24px,5vw,38px);
      line-height:.98;
      letter-spacing:-.035em;
      font-weight:1000;
    }

    .info-grid{
      display:grid;
      gap:9px;
    }

    .info-row{
      display:grid;
      grid-template-columns:38px 1fr;
      gap:10px;
      align-items:center;
      background:#fffaf0;
      border:2px solid #eadfbd;
      border-radius:18px;
      padding:10px 12px;
    }

    .icon{
      font-size:25px;
      display:grid;
      place-items:center;
    }

    .label{
      font-size:12px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.07em;
      font-weight:950;
    }

    .value{
      font-size:18px;
      font-weight:950;
      line-height:1.2;
    }

    .phone{
      color:inherit;
      text-decoration:none;
    }

    .alert-box{
      margin-top:12px;
      border:3px solid var(--red);
      background:var(--red-soft);
      border-radius:22px;
      padding:14px;
      color:#8f1d1d;
      font-size:18px;
      font-weight:950;
      line-height:1.25;
    }

    .ok-box{
      margin-top:12px;
      border:3px solid var(--green);
      background:#dcfce7;
      border-radius:22px;
      padding:12px 14px;
      color:#14532d;
      font-size:16px;
      font-weight:950;
    }

    .empty,.error{
      background:white;
      border:3px dashed #999;
      border-radius:24px;
      padding:24px;
      color:var(--muted);
      font-weight:850;
      text-align:center;
    }

    .hint{
      text-align:center;
      color:#6b7280;
      font-size:14px;
      font-weight:900;
      padding-bottom:30px;
    }
  </style>
</head>

<body>
  <main class="page">

    <section class="hero">
      <img src="./Image/Autre%20page/Photo_Formation.png" alt="Espace formation">
      <div class="hero-body">
        <h1>Espace formation</h1>
        <p class="intro">
          Merci de prévenir l’agent concerné dès qu’une formation apparaît, afin qu’il puisse s’organiser à l’avance.
        </p>
      </div>
    </section>

    <div class="section-head">
      <h2>Résultats en direct</h2>
      <div id="status">Chargement…</div>
    </div>

    <section id="daysSlider" class="days-slider"></section>

    <div class="hint">Swipe à gauche ou à droite pour changer de jour →</div>

  </main>

  <script>
    const slider = document.getElementById("daysSlider");
    const status = document.getElementById("status");

    function escapeHtml(value){
      return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function parseDate(value){
      if(!value) return null;
      if(/^\d{4}-\d{2}-\d{2}/.test(value)){
        return new Date(value + "T00:00:00");
      }
      const d = new Date(value);
      return isNaN(d) ? null : d;
    }

    function isSameDay(a,b){
      return a && b &&
        a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate();
    }

    function phoneHref(phone){
      return "tel:" + String(phone || "").replace(/\s/g,"");
    }

    function groupByDate(items){
      const groups = {};

      items.forEach(item => {
        const key = item.date || "date-inconnue";
        if(!groups[key]){
          groups[key] = {
            date: key,
            dateLabel: item.dateLabel || key,
            items: []
          };
        }
        groups[key].items.push(item);
      });

      return Object.values(groups).sort((a,b) => {
        const today = new Date();
        const da = parseDate(a.date);
        const db = parseDate(b.date);

        const aToday = isSameDay(da,today) ? 0 : 1;
        const bToday = isSameDay(db,today) ? 0 : 1;

        if(aToday !== bToday) return aToday - bToday;
        return String(a.date).localeCompare(String(b.date));
      });
    }

    function formationCard(item){
      const hasAlert = !!item.alerte;
      const cls = hasAlert ? "formation-card alert" : "formation-card ok";

      const tel = item.telephone && item.telephone !== "Non renseigné"
        ? `<a class="phone" href="${phoneHref(item.telephone)}">${escapeHtml(item.telephone)}</a>`
        : `Non renseigné`;

      return `
        <article class="${cls}">
          <h3 class="formation-title">${escapeHtml(item.formation || "Formation")}</h3>

          <div class="info-grid">
            <div class="info-row">
              <div class="icon">👤</div>
              <div>
                <div class="label">Agent</div>
                <div class="value">${escapeHtml(item.agent || "Non renseigné")}</div>
              </div>
            </div>

            <div class="info-row">
              <div class="icon">🕒</div>
              <div>
                <div class="label">Horaire formation</div>
                <div class="value">${escapeHtml(item.horaireFormation || "Non renseigné")}</div>
              </div>
            </div>

            <div class="info-row">
              <div class="icon">⏰</div>
              <div>
                <div class="label">Horaire agent prévu</div>
                <div class="value">${escapeHtml(item.horaireAgent || "Non trouvé")}</div>
              </div>
            </div>

            <div class="info-row">
              <div class="icon">🏥</div>
              <div>
                <div class="label">GHE</div>
                <div class="value">${escapeHtml(item.ghe || "Non renseigné")}</div>
              </div>
            </div>

            <div class="info-row">
              <div class="icon">📞</div>
              <div>
                <div class="label">Téléphone</div>
                <div class="value">${tel}</div>
              </div>
            </div>
          </div>

          ${
            hasAlert
              ? `<div class="alert-box">⚠️ ${escapeHtml(item.messageAlerte || "À vérifier.")}</div>`
              : `<div class="ok-box">✅ Aucun problème détecté sur l’horaire.</div>`
          }
        </article>
      `;
    }

    function daySlide(group){
      const today = new Date();
      const isToday = isSameDay(parseDate(group.date), today);
      const alertCount = group.items.filter(item => item.alerte).length;

      return `
        <article class="day-slide ${isToday ? "today" : ""}">
          <div class="day-top">
            <div class="day-date">📅 ${escapeHtml(group.dateLabel)}</div>

            <div class="day-stats">
              ${isToday ? `<div class="pill today-pill">✨ Aujourd’hui</div>` : ``}
              <div class="pill">${group.items.length} formation(s)</div>
              ${
                alertCount
                  ? `<div class="pill alert-pill">⚠️ ${alertCount} alerte(s)</div>`
                  : `<div class="pill">✅ OK</div>`
              }
            </div>
          </div>

          <div class="formations-list">
            ${group.items.map(formationCard).join("")}
          </div>
        </article>
      `;
    }

    async function loadFormations(){
      try{
        status.textContent = "Chargement…";

        const response = await fetch("/api/formations", { cache:"no-store" });
        const data = await response.json();

        if(!data.ok){
          throw new Error(data.error || "Réponse invalide");
        }

        const items = data.items || [];
        const groups = groupByDate(items);

        status.textContent = `${items.length} formation(s) • ${groups.length} jour(s)`;

        if(!groups.length){
          slider.innerHTML = `<div class="empty">Aucune formation à afficher.</div>`;
          return;
        }

        slider.innerHTML = groups.map(daySlide).join("");

      }catch(error){
        console.error(error);
        status.textContent = "Erreur";
        slider.innerHTML = `<div class="error">Impossible de charger les formations.</div>`;
      }
    }

    loadFormations();
  </script>
</body>
</html>
