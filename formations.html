<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GHE — Formations</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#07183f;
  --ink-soft:#33415f;
  --cream:#fff7dd;
  --paper:#fffaf0;
  --paper-2:#fff2c9;
  --line:#07183f;
  --muted-line:rgba(7,24,63,.18);

  --danger:#b42318;
  --danger-bg:#fff0ec;
  --warning:#8a4b00;
  --warning-bg:#fff4c7;
  --ok:#176b39;
  --ok-bg:#eaf8ef;

  --matin:#1976f3;
  --matin-soft:#dcebff;
  --journee:#20a754;
  --journee-soft:#dff6e8;
  --j4:#f27617;
  --j4-soft:#ffead6;
  --soir:#f0c400;
  --soir-soft:#fff3a8;
  --nuit:#6d42d8;
  --nuit-soft:#e9e0ff;
  --off:#6b7280;
  --off-soft:#eceef2;

  --shadow:0 7px 0 rgba(7,24,63,.16);
  --shadow-small:0 4px 0 rgba(7,24,63,.12);
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --display:Impact,"Arial Black",system-ui,sans-serif;
}
html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink)}
body{font-family:var(--font)}
a{color:inherit}
.page{
  width:min(1080px,100%);
  margin:auto;
  padding:calc(10px + env(safe-area-inset-top)) 8px calc(130px + env(safe-area-inset-bottom));
}

/* RETOUR ACCUEIL — même famille visuelle que les autres pages */
.topbar{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  margin:8px 0 20px;
}
.navbtn{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:84px;
  padding:14px 18px;
  border:6px solid var(--line);
  border-radius:28px;
  background:
    radial-gradient(circle at 16% 4%,rgba(255,255,255,.13),transparent 30%),
    repeating-linear-gradient(-7deg,rgba(255,255,255,.045) 0 2px,transparent 2px 15px),
    linear-gradient(145deg,#4a4d52 0%,#2d3035 48%,#181a1e 100%);
  color:#fff5d7;
  text-decoration:none;
  font-family:var(--display);
  font-size:clamp(28px,6.4vw,46px);
  line-height:.95;
  letter-spacing:.025em;
  text-transform:uppercase;
  text-shadow:
    0 3px 0 rgba(0,0,0,.55),
    0 6px 0 rgba(210,162,69,.22);
  box-shadow:
    0 10px 0 rgba(7,24,63,.24),
    0 15px 0 rgba(0,0,0,.10),
    inset 0 0 0 3px rgba(255,255,255,.06);
}
.navbtn:active{
  transform:translateY(4px);
  box-shadow:
    0 6px 0 rgba(7,24,63,.24),
    0 10px 0 rgba(0,0,0,.10),
    inset 0 0 0 3px rgba(255,255,255,.06);
}

/* BANNIÈRE LIBRE — plus de carte autour de l’image */
.hero{
  margin:0 0 18px;
  padding:0;
  border:0;
  border-radius:0;
  overflow:visible;
  background:transparent;
  box-shadow:none;
}
.hero img{
  display:block;
  width:100%;
  height:auto;
  max-height:none;
  margin:0 auto;
  border:0;
  border-radius:0;
  object-fit:contain;
  object-position:center;
  filter:drop-shadow(0 10px 0 rgba(7,24,63,.13));
}

.pilot{
  background:var(--paper);border:4px solid var(--line);border-radius:22px;
  padding:12px;box-shadow:var(--shadow);margin-bottom:10px
}
.pilot.ok{border-color:var(--ok)}
.pilot.warning{border-color:#d2a631}
.pilot.danger{border-color:#c43a2f}
.pilot-title{font-weight:950;font-size:20px;line-height:1.1}
.pilot-sub{margin-top:4px;color:var(--ink-soft);font-size:14px;font-weight:850;line-height:1.25}
.pilot-line{margin-top:10px;display:flex;flex-wrap:wrap;gap:7px}
.mini-pill,.chip{
  display:inline-flex;align-items:center;gap:5px;min-height:30px;
  padding:6px 9px;border-radius:999px;background:var(--paper-2);
  border:2px solid var(--muted-line);font-size:14px;font-weight:900
}
.mini-pill.ok,.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:#9dd5af}
.mini-pill.warning,.chip.warning{background:var(--warning-bg);color:var(--warning);border-color:#e2c060}
.mini-pill.danger,.chip.danger{background:var(--danger-bg);color:var(--danger);border-color:#e7a29d}
.tools{display:grid;gap:8px;margin-bottom:14px}
.search{
  width:100%;min-height:48px;border:3px solid var(--line);border-radius:17px;
  padding:9px 12px;font-size:16px;font-weight:850;background:var(--paper);
  color:var(--ink);outline:none;box-shadow:var(--shadow-small)
}
.search::placeholder{color:rgba(7,24,63,.38)}
.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px}
.filter-btn{
  flex:0 0 auto;border:3px solid var(--line);border-radius:999px;
  background:var(--paper);color:var(--ink);padding:8px 12px;
  font-size:14px;font-weight:950;cursor:pointer;box-shadow:0 3px 0 rgba(7,24,63,.12)
}
.filter-btn.active{background:var(--ink);color:var(--cream)}
.section-label{
  margin:19px 4px 8px;color:rgba(7,24,63,.62);
  text-transform:uppercase;font-size:13px;font-weight:950;letter-spacing:.7px
}
.summary-list{display:grid;gap:8px;margin-bottom:14px}
.summary-row{
  position:relative;overflow:hidden;background:var(--paper);border:3px solid var(--line);
  border-radius:20px;padding:11px 12px 11px 17px;box-shadow:var(--shadow-small)
}
.summary-row::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--ok)
}
.summary-row.warning::before{background:#d2a631}
.summary-row.danger::before{background:#c43a2f}
.summary-title{
  font-family:var(--display);font-size:clamp(25px,6.4vw,40px);
  line-height:.92;letter-spacing:-.5px;text-transform:uppercase
}
.summary-meta{margin-top:5px;color:var(--ink-soft);font-size:14px;line-height:1.2;font-weight:850}
.summary-issues{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px}
.day-title{
  margin:25px 4px 10px;font-family:var(--display);
  font-size:clamp(35px,9vw,62px);line-height:.88;letter-spacing:-1px;
  text-transform:uppercase;text-shadow:0 3px 0 #f8d67d
}
.main-card{
  background:var(--paper);border:4px solid var(--line);border-radius:26px;
  padding:12px;margin-bottom:16px;box-shadow:var(--shadow)
}
.main-card.warning{border-color:#d2a631}
.main-card.danger{border-color:#c43a2f}
.avatar{
  width:68px;height:68px;border-radius:18px;background:#eaf0ff;
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  border:2px solid rgba(7,24,63,.13);flex:0 0 auto
}
.avatar img{max-width:97%;max-height:97%;width:auto;height:auto;object-fit:contain;display:block}
.avatar .initials{
  width:54px;height:54px;border-radius:15px;border:3px solid var(--line);
  background:var(--paper);display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:20px
}
.avatar.has-img .initials{display:none}
.role{
  display:block;margin-bottom:3px;color:rgba(7,24,63,.58);
  font-size:12px;font-weight:950;letter-spacing:.65px;text-transform:uppercase
}
.person-name{
  display:block;font-size:clamp(22px,5.7vw,34px);line-height:.98;
  font-weight:950;letter-spacing:-.7px;text-transform:uppercase;
  overflow-wrap:anywhere
}
.info-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.info-chip{
  min-height:29px;display:inline-flex;align-items:center;gap:5px;
  padding:5px 9px;border-radius:999px;border:2px solid var(--muted-line);
  background:var(--paper);font-size:13px;line-height:1.05;font-weight:900
}
.info-chip a{color:#064ee4;font-weight:950;text-decoration:none}
.shift-pill{
  display:inline-flex;align-items:center;gap:6px;min-height:34px;
  padding:7px 11px;border:3px solid var(--line);border-radius:999px;
  font-size:14px;line-height:1;font-weight:950;box-shadow:0 3px 0 rgba(7,24,63,.12)
}
.shift-pill.matin{background:var(--matin-soft);border-color:var(--matin);color:#074baf}
.shift-pill.journee{background:var(--journee-soft);border-color:var(--journee);color:#0b6d31}
.shift-pill.j4{background:var(--j4-soft);border-color:var(--j4);color:#9b3e00}
.shift-pill.soir{background:var(--soir-soft);border-color:#d4a900;color:#6f5500}
.shift-pill.nuit{background:var(--nuit-soft);border-color:var(--nuit);color:#43219d}
.shift-pill.off,.shift-pill.unknown{background:var(--off-soft);border-color:#9ca3af;color:#4b5563}
.alerts{display:grid;gap:7px;margin-top:9px}
.alert{
  padding:9px 11px;border-radius:15px;border:2px solid transparent;
  font-size:14px;line-height:1.25;font-weight:850
}
.alert.danger{background:var(--danger-bg);color:var(--danger);border-color:#e7a29d}
.alert.warning{background:var(--warning-bg);color:var(--warning);border-color:#e2c060}
.empty,.error,.loading{
  background:var(--paper);border:4px solid var(--line);border-radius:21px;
  padding:14px;font-weight:900;box-shadow:var(--shadow)
}
.error{color:var(--danger)}
.agenda-box{
  margin:27px 0 4px;padding:13px;background:var(--paper);
  border:4px solid var(--line);border-radius:25px;box-shadow:var(--shadow)
}
.agenda-title{
  margin:0 0 10px;font-family:var(--display);font-size:clamp(25px,7vw,44px);
  line-height:.92;text-align:center;text-transform:uppercase;
  letter-spacing:-.8px;text-shadow:0 3px 0 #f8d67d
}
.agenda-buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.agenda-btn{
  min-height:62px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;text-decoration:none;color:#fff4ce;
  border:4px solid #061738;border-radius:20px;font-family:var(--display);
  font-size:clamp(21px,5.5vw,34px);line-height:.95;text-transform:uppercase;
  box-shadow:0 6px 0 rgba(7,24,63,.32)
}
.agenda-btn.ios{background:linear-gradient(145deg,#3db9ff 0%,#0c6ed5 56%,#083c91 100%)}
.agenda-btn.android{background:linear-gradient(145deg,#35d864 0%,#12873d 56%,#075324 100%)}
@media(min-width:720px){
  .page{padding-left:14px;padding-right:14px}
  .main-card,.pilot{padding:14px}
  .avatar{width:76px;height:76px}
}
@media(max-width:620px){
  .topbar{margin:4px 0 16px}
  .navbtn{
    min-height:74px;
    border-width:4px;
    border-radius:24px;
    font-size:clamp(25px,6.4vw,36px);
  }
  .hero{margin-bottom:16px}
  .hero img{filter:drop-shadow(0 8px 0 rgba(7,24,63,.12))}
}
@media(max-width:370px){
  .avatar{width:58px;height:58px;border-radius:15px}
  .avatar .initials{width:47px;height:47px;font-size:18px}
  .person-name{font-size:20px}
  .shift-pill,.info-chip,.chip{font-size:12px;padding:5px 7px}
}

.session-card{position:relative;overflow:hidden;padding-top:0}
.session-banner{
  margin:0 -12px 12px;padding:11px 12px 12px;
  border-bottom:4px solid var(--line);background:#dfeaff
}
.session-banner.incendie{background:linear-gradient(135deg,#ffdfbf 0%,#ffb36b 100%)}
.session-banner.identite{background:linear-gradient(135deg,#e8e2ff 0%,#b8a7ff 100%)}
.session-banner.caces{background:linear-gradient(135deg,#fff1a8 0%,#ffc941 100%)}
.session-banner.default{background:linear-gradient(135deg,#dce9ff 0%,#9ec4ff 100%)}
.session-kicker{
  display:flex;align-items:center;gap:8px;font-size:13px;font-weight:950;
  letter-spacing:.7px;text-transform:uppercase;color:rgba(7,24,63,.72)
}
.session-title{
  margin-top:3px;font-family:var(--display);font-size:clamp(31px,8vw,48px);
  line-height:.9;letter-spacing:-.8px;text-transform:uppercase
}
.session-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.session-meta .info-chip{background:rgba(255,250,240,.86)}
.session-detail{
  margin:0 0 10px;padding:9px 10px;border:2px solid var(--muted-line);
  border-radius:16px;background:var(--paper-2);font-size:15px;line-height:1.23;font-weight:850
}
.agent-list{display:grid;gap:9px}
.agent-card{
  position:relative;display:grid;grid-template-columns:68px minmax(0,1fr);
  gap:10px;align-items:center;min-width:0;background:var(--paper-2);
  border:3px solid var(--line);border-radius:21px;padding:10px 10px 10px 16px
}
.agent-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:8px;
  border-radius:17px 0 0 17px;background:var(--ok)
}
.agent-card.warning::before{background:#d2a631}
.agent-card.danger::before{background:#c43a2f}
.agent-card.warning{background:#fff8df}
.agent-card.danger{background:#fff3ef}
@media(min-width:720px){
  .session-banner{margin-left:-14px;margin-right:-14px;padding-left:14px;padding-right:14px}
  .agent-card{grid-template-columns:76px minmax(0,1fr)}
}
</style>
</head>
<body>
<main class="page">
  <div class="topbar">
    <a class="navbtn" href="index.html">← Retour accueil</a>
  </div>

  <section class="hero">
    <img src="Image/Bannière/Page Formation.PNG" alt="Formations GHE"
      onerror="this.onerror=null;this.src='Image/Banni%C3%A8re/Page%20Formation.PNG';">
  </section>

  <section id="pilot" class="pilot ok">
    <div id="pilotTitle" class="pilot-title">Chargement du cockpit…</div>
    <div id="pilotSub" class="pilot-sub">Analyse des sessions de formation à venir</div>
    <div class="pilot-line">
      <span id="pilotTypes" class="mini-pill">🎓 0 type</span>
      <span id="pilotSessions" class="mini-pill">📅 0 session</span>
      <span id="pilotAgents" class="mini-pill">👥 0 agent</span>
      <span id="pilotDanger" class="mini-pill danger">⛔ 0 bloquant</span>
      <span id="pilotWarning" class="mini-pill warning">⚠️ 0 à vérifier</span>
    </div>
  </section>

  <section class="tools">
    <input id="search" class="search" type="search" placeholder="Rechercher formation, agent, GHE, téléphone…">
    <div class="filters">
      <button class="filter-btn active" data-filter="tous">Tous</button>
      <button class="filter-btn" data-filter="traiter">À traiter</button>
      <button class="filter-btn" data-filter="bloquants">Bloquants</button>
    </div>
  </section>

  <div class="section-label">Formations concernées</div>
  <section id="formationSummary" class="summary-list"><div class="loading">Analyse des formations…</div></section>

  <div class="section-label">Détail par date</div>
  <section id="content"><div class="loading">Chargement des formations…</div></section>

  <section class="agenda-box">
    <h2 class="agenda-title">Ajouter l’agenda formations</h2>
    <div class="agenda-buttons">
      <a id="btnIos" class="agenda-btn ios" href="#"><span>🍎</span><span>iOS</span></a>
      <a id="btnAndroid" class="agenda-btn android" href="#"><span>🤖</span><span>Android</span></a>
    </div>
  </section>
</main>
<script>
function plural(number){ return Number(number) > 1 ? "s" : ""; }

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function norm(value){
  return String(value ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .trim();
}

function hasUsefulValue(value){
  const n = norm(value);
  return !!n &&
    n !== "nr" &&
    n !== "-" &&
    !n.includes("non renseigne") &&
    !n.includes("non connu") &&
    !n.includes("inconnu");
}

function pushUnique(list,message){
  const key = norm(message);
  if (key && !list.some(item => norm(item) === key)) list.push(String(message).trim());
}

function dedupeList(list){
  const seen = new Set();
  return (list || []).filter(item => {
    const key = norm(item);
    if (!key || seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function groupByDate(items){
  return (items || []).reduce((acc,item) => {
    const key = item.dateKey || item.dateLabel || "sans-date";
    (acc[key] ||= []).push(item);
    return acc;
  }, {});
}

function avatarHtml(avatar){
  avatar = avatar || {};
  const initials = esc(avatar.initiales || "?");
  const thumb = String(avatar.thumb || "").trim();

  if (!thumb) {
    return `<div class="avatar"><div class="initials">${initials}</div></div>`;
  }

  return `
    <div class="avatar has-img">
      <img src="${esc(thumb)}" alt="" loading="lazy"
        onerror="this.parentElement.classList.remove('has-img');this.remove();">
      <div class="initials">${initials}</div>
    </div>
  `;
}

function formatGhe(value){
  if (!hasUsefulValue(value)) return "";
  const cleaned = String(value).replace(/^(ghe\s*)+/i,"").trim();
  return cleaned ? "GHE " + cleaned : "";
}

function issueBlock(issues){
  const danger = (issues && issues.danger) || [];
  const warning = (issues && issues.warning) || [];
  if (!danger.length && !warning.length) return "";

  return `
    <div class="alerts">
      ${danger.map(x => `<div class="alert danger">⛔ ${esc(x)}</div>`).join("")}
      ${warning.map(x => `<div class="alert warning">⚠️ ${esc(x)}</div>`).join("")}
    </div>
  `;
}

function shiftCodeFromAny(value){
  const parts = typeof value === "object" && value
    ? [value.code,value.label,value.base,value.horaire]
    : [value];

  const raw = parts.filter(Boolean).join(" ")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
  const compact = raw.replace(/[^A-Z0-9]/g,"");
  const tokens = raw.replace(/[^A-Z0-9]+/g," ").trim().split(/\s+/).filter(Boolean);

  if (/^M\d+$/.test(compact) || compact.includes("M0130") || compact.includes("M0131")) return "M";
  if (/^S\d+$/.test(compact) || compact.includes("S0113")) return "S";
  if (compact.includes("J0464")) return "J";
  if (tokens.includes("J4") || compact === "J4") return "J4";
  if (/^J\d+$/.test(compact)) return "J";
  if (/^N\d+$/.test(compact)) return "N";

  if (tokens.includes("RTTA") || tokens.includes("RTA") || compact === "RTTA" || compact === "RTA") return "RTTA";
  if (tokens.includes("RTT") || compact === "RTT") return "RTT";

  const exact = ["RH","CA","RC","RF","SYR","ABS","AM","MA","AA","AR","FO","M","J","S","N"];
  for (const code of exact) if (tokens.includes(code) || compact === code) return code;

  if (raw.includes("MATIN")) return "M";
  if (raw.includes("JOURNEE")) return "J";
  if (raw.includes("SOIR")) return "S";
  if (raw.includes("NUIT")) return "N";
  if (raw.includes("SYNDICAT")) return "SYR";
  if (raw.includes("ABSENCE")) return "ABS";
  return "";
}

function shiftMeta(value){
  const code = shiftCodeFromAny(value);
  const map = {
    M:{label:"Matin",icon:"🔵",className:"matin",worked:true,blocking:false},
    J:{label:"Journée",icon:"🟢",className:"journee",worked:true,blocking:false},
    J4:{label:"Journée J4",icon:"🟠",className:"j4",worked:true,blocking:false},
    S:{label:"Soir",icon:"🟡",className:"soir",worked:true,blocking:false},
    N:{label:"Nuit",icon:"🌙",className:"nuit",worked:true,blocking:false},

    RH:{label:"Repos hebdomadaire",icon:"🛋️",className:"off",worked:false,blocking:true},
    CA:{label:"Congé payé",icon:"🏝️",className:"off",worked:false,blocking:true},
    RC:{label:"Repos compensateur",icon:"🔁",className:"off",worked:false,blocking:true},
    RF:{label:"Repos férié",icon:"🎌",className:"off",worked:false,blocking:true},
    RTT:{label:"RTT",icon:"🧘",className:"off",worked:false,blocking:true},
    RTTA:{label:"Récupération du temps de travail",icon:"🧘",className:"off",worked:false,blocking:true},
    SYR:{label:"Syndicat",icon:"🗣️",className:"off",worked:false,blocking:true},
    ABS:{label:"Absence",icon:"⚠️",className:"off",worked:false,blocking:true},
    AM:{label:"Arrêt médical",icon:"🩺",className:"off",worked:false,blocking:true},
    MA:{label:"Maladie",icon:"🩺",className:"off",worked:false,blocking:true},
    AA:{label:"Absence autorisée",icon:"📝",className:"off",worked:false,blocking:true},
    AR:{label:"Absence à régulariser",icon:"⚠️",className:"off",worked:false,blocking:true},
    FO:{label:"Formation",icon:"🎓",className:"off",worked:false,blocking:true}
  };

  return code && map[code]
    ? {...map[code],code,known:true}
    : {code:"",label:"Shift à vérifier",icon:"⚪",className:"unknown",worked:false,blocking:false,known:false};
}

function shiftPillHtml(shift, includeTime){
  const meta = shiftMeta(shift);
  const time = includeTime && shift && hasUsefulValue(shift.horaire) ? String(shift.horaire).trim() : "";
  return `
    <span class="shift-pill ${esc(meta.className)}">
      <span>${esc(meta.icon)}</span>
      <span>${esc(meta.label)}${time ? " · " + esc(time) : ""}</span>
    </span>
  `;
}

function missingPhrase(parts){
  if (parts.length === 1) return parts[0] + " manquant.";
  if (parts.length === 2) return parts[0] + " et " + parts[1] + " manquants.";
  const copy = parts.slice();
  const last = copy.pop();
  return copy.join(", ") + " et " + last + " manquants.";
}

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzmelNrBU583V3CvOlle3cafAKEAZQ8NAX-peSN6D-yxFO3gX26SnVNUVd5xbwV3CUISg/exec";
const ICS_URL = "https://calendar.google.com/calendar/ical/c5da5df12db0eba65a14410cada08fea4e5a8037ddd256b03e7426cb22cb751b%40group.calendar.google.com/private-4f5072a64d36548137a30abb665ed23f/basic.ics";

let ITEMS = [];
let CURRENT_FILTER = "tous";

document.getElementById("btnIos").href = ICS_URL.replace(/^https:\/\//i,"webcal://");
document.getElementById("btnAndroid").href =
  "https://calendar.google.com/calendar/render?cid=" + encodeURIComponent(ICS_URL);

document.getElementById("search").addEventListener("input",refreshView);
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click",() => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    CURRENT_FILTER = btn.dataset.filter;
    refreshView();
  });
});

loadJsonp("formations");

function loadJsonp(type){
  const callbackName = "recevoirGhe_" + type + "_" + Date.now();
  const script = document.createElement("script");

  window[callbackName] = data => {
    delete window[callbackName];
    script.remove();

    if (!data || !data.ok) {
      showError(data && data.erreur ? data.erreur : "Données invalides.");
      return;
    }

    ITEMS = Array.isArray(data.items) ? data.items : [];
    updatePilot(ITEMS);
    refreshView();
  };

  script.onerror = () => {
    delete window[callbackName];
    script.remove();
    showError("Impossible de charger les données.");
  };

  script.src = WEB_APP_URL
    + "?mode=site_stagiaires_formations"
    + "&type=" + encodeURIComponent(type)
    + "&callback=" + encodeURIComponent(callbackName)
    + "&v=" + Date.now();

  document.body.appendChild(script);
}

function refreshView(){
  const filtered = filterItems();
  renderFormationSummary(filtered);
  render(filtered);
}

function filterItems(){
  const q = norm(document.getElementById("search").value);

  return ITEMS.filter(item => {
    const level = itemLevel(item);
    const issueCount = countItemIssues(item).total;

    if (CURRENT_FILTER === "traiter" && issueCount === 0) return false;
    if (CURRENT_FILTER === "bloquants" && level !== "danger") return false;
    if (!q) return true;

    const formation = item.formation || {};
    const agents = item.agents || [];
    const alerts = item.alertes || {};

    return norm([
      item.titre,item.dateLabel,formation.intitule,formation.typeLabel,formation.horaireAffiche,
      ...agents.flatMap(a => [a.nomComplet,a.nom,a.prenom,a.ghe,a.telephone,a.shift && a.shift.code,a.shift && a.shift.label]),
      ...(alerts.bloquantes || []),...(alerts.infos || [])
    ].join(" ")).includes(q);
  });
}

function compactFormationTitle(item){
  const f = item.formation || {};
  const raw = String(item.titre || f.typeLabel || f.intitule || "Formation").trim();
  return raw.split("|")[0].trim() || "Formation";
}

function formationKey(item){ return norm(compactFormationTitle(item)); }

function formationVisual(item){
  const title = norm([
    compactFormationTitle(item),
    item.formation && item.formation.intitule,
    item.formation && item.formation.typeLabel
  ].join(" "));

  if (title.includes("incendie") || title.includes("feu")) {
    return {className:"incendie",icon:"🔥",kicker:"Sécurité incendie"};
  }
  if (title.includes("identite") || title.includes("vigilance")) {
    return {className:"identite",icon:"🪪",kicker:"Identité et vigilance"};
  }
  if (title.includes("caces") || title.includes("mobilis")) {
    return {className:"caces",icon:"🏗️",kicker:"Formation technique"};
  }
  return {className:"default",icon:"🎓",kicker:"Session de formation"};
}

function extractHoraire(text){
  const match = String(text || "").match(/\b\d{1,2}[:h]\d{2}\s*[–-]\s*\d{1,2}[:h]\d{2}\b/i);
  return match ? match[0].replace(/h/g,":") : "";
}

function cleanFormationDetail(intitule,title){
  const value = String(intitule || "").trim();
  if (!value || norm(value) === norm(title)) return "";
  return value;
}

function agentKey(a){
  return norm(a && (a.nomComplet || [a.nom,a.prenom].filter(Boolean).join(" ") || a.ghe || a.telephone || "agent"));
}

function agentDisplayName(a){
  return String(a.nomComplet || [a.nom,a.prenom].filter(Boolean).join(" ") || "Agent").trim();
}

function messageMentionsAgent(message,a){
  const msg = norm(message);
  const names = [
    a && a.nomComplet,
    a && a.nom && a.prenom ? a.nom + " " + a.prenom : "",
    a && a.prenom && a.nom ? a.prenom + " " + a.nom : "",
    a && a.nom,
    a && a.prenom
  ].filter(Boolean).map(norm).filter(x => x.length >= 4);

  return names.some(name => msg.includes(name));
}

function cleanAgentAlert(message,a){
  let text = String(message || "").trim();
  const names = [a.nomComplet,a.nom && a.prenom ? a.nom + " " + a.prenom : "",a.prenom && a.nom ? a.prenom + " " + a.nom : ""].filter(Boolean);

  names.forEach(name => {
    text = text.replace(new RegExp("^\\s*" + name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "\\s*:\\s*","i"),"");
  });

  return text
    .replace(/prévu sur un code non travaillé\s*:\s*/i,"Indisponible : ")
    .replace(/Code shift non reconnu\s*:\s*/i,"Shift à vérifier : ")
    .trim();
}

function agentIssues(a,item){
  const alerts = item.alertes || {};
  const danger = [];
  const warning = [];
  const meta = shiftMeta(a.shift || {});

  if (meta.blocking) pushUnique(danger,"Indisponible : " + meta.label);

  (alerts.bloquantes || [])
    .filter(msg => messageMentionsAgent(msg,a))
    .forEach(msg => pushUnique(danger,cleanAgentAlert(msg,a)));

  (alerts.infos || [])
    .filter(msg => messageMentionsAgent(msg,a))
    .forEach(msg => pushUnique(warning,cleanAgentAlert(msg,a)));

  const missing = [];
  if (!hasUsefulValue(a.ghe)) missing.push("GHE");
  if (!hasUsefulValue(a.telephone)) missing.push("téléphone");
  if (missing.length) pushUnique(warning,missingPhrase(missing));

  if (!meta.known) pushUnique(warning,"Shift à vérifier.");
  if (a.agentTrouve === false) pushUnique(danger,"Agent introuvable dans la source agents.");

  return {danger:dedupeList(danger),warning:dedupeList(warning)};
}

function formationGeneralAlerts(item){
  const agents = item.agents || [];
  const alerts = item.alertes || {};

  return {
    danger:dedupeList((alerts.bloquantes || []).filter(msg => !agents.some(a => messageMentionsAgent(msg,a)))),
    warning:dedupeList((alerts.infos || []).filter(msg => !agents.some(a => messageMentionsAgent(msg,a))))
  };
}

function issueSignature(item,message,type,agent){
  return [type,formationKey(item),norm(agent || "general"),norm(message)].join("|");
}

function countItemIssues(item){
  const general = formationGeneralAlerts(item);
  let danger = general.danger.length;
  let warning = general.warning.length;

  (item.agents || []).forEach(a => {
    const issues = agentIssues(a,item);
    danger += issues.danger.length;
    warning += issues.warning.length;
  });

  return {danger,warning,total:danger + warning};
}

function itemLevel(item){
  const count = countItemIssues(item);
  if (count.danger || item.niveau === "danger") return "danger";
  if (count.warning || item.niveau === "warning") return "warning";
  return "ok";
}

function uniqueGlobalIssues(items){
  const danger = new Set();
  const warning = new Set();

  items.forEach(item => {
    const general = formationGeneralAlerts(item);
    general.danger.forEach(msg => danger.add(issueSignature(item,msg,"danger","general")));
    general.warning.forEach(msg => warning.add(issueSignature(item,msg,"warning","general")));

    (item.agents || []).forEach(a => {
      const issues = agentIssues(a,item);
      issues.danger.forEach(msg => danger.add(issueSignature(item,msg,"danger",agentKey(a))));
      issues.warning.forEach(msg => warning.add(issueSignature(item,msg,"warning",agentKey(a))));
    });
  });

  return {danger:danger.size,warning:warning.size,total:danger.size + warning.size};
}

function formationSummaries(items){
  const map = new Map();

  items.forEach(item => {
    const key = formationKey(item);
    if (!map.has(key)) {
      map.set(key,{
        name:compactFormationTitle(item),
        sessions:0,
        agents:new Set(),
        danger:new Set(),
        warning:new Set()
      });
    }

    const row = map.get(key);
    row.sessions++;
    (item.agents || []).forEach(a => row.agents.add(agentKey(a)));

    const general = formationGeneralAlerts(item);
    general.danger.forEach(msg => row.danger.add(issueSignature(item,msg,"danger","general")));
    general.warning.forEach(msg => row.warning.add(issueSignature(item,msg,"warning","general")));

    (item.agents || []).forEach(a => {
      const issues = agentIssues(a,item);
      issues.danger.forEach(msg => row.danger.add(issueSignature(item,msg,"danger",agentKey(a))));
      issues.warning.forEach(msg => row.warning.add(issueSignature(item,msg,"warning",agentKey(a))));
    });
  });

  return Array.from(map.values()).map(row => ({
    name:row.name,
    sessions:row.sessions,
    agentCount:row.agents.size,
    danger:row.danger.size,
    warning:row.warning.size
  })).sort((a,b) => a.name.localeCompare(b.name,"fr"));
}

function uniqueAgents(items){
  const set = new Set();
  items.forEach(item => (item.agents || []).forEach(a => set.add(agentKey(a))));
  return set;
}

function updatePilot(items){
  const summaries = formationSummaries(items);
  const totals = uniqueGlobalIssues(items);
  const agentCount = uniqueAgents(items).size;
  const pilot = document.getElementById("pilot");

  pilot.classList.remove("ok","warning","danger");
  pilot.classList.add(totals.danger ? "danger" : totals.warning ? "warning" : "ok");

  document.getElementById("pilotTitle").textContent =
    totals.total ? totals.total + " point" + plural(totals.total) + " à traiter" : "Tout est prêt";

  document.getElementById("pilotSub").textContent =
    summaries.length + " type" + plural(summaries.length) + " de formation"
    + " · " + items.length + " session" + plural(items.length)
    + " · " + agentCount + " agent" + plural(agentCount);

  document.getElementById("pilotTypes").textContent =
    "🎓 " + summaries.length + " type" + plural(summaries.length);
  document.getElementById("pilotSessions").textContent =
    "📅 " + items.length + " session" + plural(items.length);
  document.getElementById("pilotAgents").textContent =
    "👥 " + agentCount + " agent" + plural(agentCount);
  document.getElementById("pilotDanger").textContent =
    "⛔ " + totals.danger + " bloquant" + plural(totals.danger);
  document.getElementById("pilotWarning").textContent =
    "⚠️ " + totals.warning + " à vérifier";
}

function renderFormationSummary(items){
  const box = document.getElementById("formationSummary");
  const summaries = formationSummaries(items);

  if (!summaries.length) {
    box.innerHTML = `<div class="empty">Aucune formation à afficher avec ce filtre.</div>`;
    return;
  }

  box.innerHTML = summaries.map(s => {
    const level = s.danger ? "danger" : s.warning ? "warning" : "ok";
    const points = s.danger + s.warning;

    return `
      <article class="summary-row ${level}">
        <div class="summary-title">${esc(s.name)}</div>
        <div class="summary-meta">
          ${s.sessions} session${plural(s.sessions)} ·
          ${s.agentCount} agent${plural(s.agentCount)}
        </div>
        <div class="summary-issues">
          ${points ? `<span class="chip ${level === "danger" ? "danger" : "warning"}">${points} point${plural(points)} à traiter</span>` : `<span class="chip ok">✅ Prêt</span>`}
        </div>
      </article>
    `;
  }).join("");
}

function render(items){
  const content = document.getElementById("content");

  if (!items.length) {
    content.innerHTML = `<div class="empty">Aucune formation à afficher avec ce filtre.</div>`;
    return;
  }

  const groups = groupByDate(items);
  content.innerHTML = Object.keys(groups).map(key => {
    const list = groups[key];
    return `
      <div class="day-title">${esc(list[0].dateLabel || key)}</div>
      ${list.map(cardFormation).join("")}
    `;
  }).join("");
}

function contactChipsHtml(agent){
  const chips = [];
  const ghe = formatGhe(agent && agent.ghe);
  const tel = agent && hasUsefulValue(agent.telephone) ? String(agent.telephone).trim() : "";

  if (ghe) chips.push(`<span class="info-chip">${esc(ghe)}</span>`);
  if (tel) {
    const href = tel.replace(/[^\d+]/g,"");
    chips.push(`<span class="info-chip">📞 <a href="tel:${esc(href)}">${esc(tel)}</a></span>`);
  }

  return chips.join("");
}

function agentCard(agent,item){
  const issues = agentIssues(agent,item);
  const level = issues.danger.length ? "danger" : issues.warning.length ? "warning" : "ok";

  return `
    <section class="agent-card ${level}">
      ${avatarHtml(agent.avatar)}
      <div>
        <span class="role">Agent</span>
        <span class="person-name">${esc(agentDisplayName(agent))}</span>
        <div class="info-chips">
          ${contactChipsHtml(agent)}
          ${shiftPillHtml(agent.shift || {},false)}
        </div>
        ${issueBlock(issues)}
      </div>
    </section>
  `;
}

function cardFormation(item){
  const formation = item.formation || {};
  const agents = item.agents || [];
  const level = itemLevel(item);
  const visual = formationVisual(item);
  const title = compactFormationTitle(item);
  const detail = cleanFormationDetail(formation.intitule,title);
  const horaire = hasUsefulValue(formation.horaireAffiche)
    ? String(formation.horaireAffiche).trim()
    : extractHoraire(item.titre);
  const general = formationGeneralAlerts(item);

  return `
    <article class="main-card session-card ${level}">
      <header class="session-banner ${visual.className}">
        <div class="session-kicker"><span>${visual.icon}</span><span>${esc(visual.kicker)}</span></div>
        <div class="session-title">${esc(title)}</div>
        <div class="session-meta">
          ${horaire ? `<span class="info-chip">🕒 ${esc(horaire)}</span>` : `<span class="chip warning">⚠️ Horaire à confirmer</span>`}
          <span class="info-chip">👥 ${agents.length} agent${plural(agents.length)}</span>
        </div>
      </header>

      ${detail ? `<div class="session-detail">${esc(detail)}</div>` : ""}
      ${issueBlock(general)}

      <div class="agent-list">
        ${agents.length ? agents.map(a => agentCard(a,item)).join("") : `<div class="empty">Aucun agent inscrit.</div>`}
      </div>
    </article>
  `;
}

function showError(message){
  document.getElementById("content").innerHTML = `<div class="error">Problème : ${esc(message)}</div>`;
  document.getElementById("formationSummary").innerHTML = `<div class="error">Résumé indisponible.</div>`;
}
</script>
