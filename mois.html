<!doctype html>

<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choisis ton mois</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#fff7df;
  color:#07183f;
  overflow-x:hidden;
}
/* BANNIÈRE */
.hero{
  width:100%;
  background:#fff7df;
  overflow:hidden;
  border-bottom:4px solid #07183f;
}
.hero img{
  display:block;
  width:100%;
  height:140px;
  object-fit:cover;
  object-position:center;
}
.hero.hidden{
  display:none;
}
/* PAGE */
.page{
  max-width:900px;
  margin:auto;
  padding:20px 16px 42px;
}
.back{
  display:inline-block;
  margin-bottom:16px;
  color:#07183f;
  text-decoration:none;
  font-weight:900;
  font-size:22px;
}
/* TITRE */
.title-box{
  margin:4px auto 22px;
  max-width:620px;
  padding:16px 14px 18px;
  background:#fffdf3;
  border:4px solid #07183f;
  border-radius:28px;
  box-shadow:0 7px 0 #07183f;
  text-align:center;
}
h1{
  margin:0;
  font-size:clamp(30px, 8vw, 46px);
  line-height:1;
  font-weight:1000;
  text-transform:uppercase;
  letter-spacing:-1px;
  color:#07183f;
  text-shadow:
    2px 2px 0 #ffffff,
    4px 4px 0 rgba(7,24,63,.14);
}
.subtitle{
  margin:10px 0 0;
  font-size:clamp(20px, 5.4vw, 28px);
  font-weight:900;
  color:#243154;
}
/* CARTES MOIS */
.months-list{
  display:flex;
  flex-direction:column;
  gap:28px;
}
.card{
  position:relative;
  width:100%;
  border-radius:30px;
  overflow:hidden;
  background:#ffffff;
  border:6px solid #07183f;
  box-shadow:
    0 10px 0 #07183f,
    0 18px 30px rgba(7,24,63,.18);
}
.card img{
  display:block;
  width:100%;
  height:auto;
}
.card button{
  position:absolute;
  inset:0;
  border:0;
  background:transparent;
  cursor:pointer;
  z-index:3;
}
.card:active{
  transform:scale(.985);
}
.card.missing{
  min-height:210px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  text-align:center;
  font-weight:900;
  font-size:20px;
}
.empty{
  background:white;
  border:5px dashed #07183f;
  border-radius:28px;
  padding:26px;
  text-align:center;
  font-weight:900;
  font-size:20px;
}
</style>
</head>
<body>
<header class="hero" id="hero">
  <img id="banner" alt="Bannière choix du mois">
</header>
<main class="page">

← Retour

  <div class="title-box">
    <h1>Choisis ton mois</h1>
    <div class="subtitle" id="subtitle">Sélectionne le mois souhaité</div>
  </div>
  <div id="months" class="months-list"></div>
</main>
<script>
const params = new URLSearchParams(window.location.search);
const type = params.get("type") || "jour";
const labels = {
  jour: "Planning équipe du jour",
  nuit: "Planning équipe de nuit",
  chef: "Planning chefs d’équipe",
  stagiaires: "Planning stagiaires",
  pdf: "PDF à imprimer",
  ics: "Sur ton agenda",
  "collectif-ics": "Télécharger le fichier ICS"
};
document.getElementById("subtitle").textContent =
  labels[type] || "Sélectionne le mois souhaité";
/* BANNIÈRE */
const banner = document.getElementById("banner");
const hero = document.getElementById("hero");
const bannerPaths = [
  "Image/Mois/Banniere-mois.png",
  "./Image/Mois/Banniere-mois.png",
  "/Image/Mois/Banniere-mois.png",
  "https://raw.githubusercontent.com/esapin69/planning/main/Image/Mois/Banniere-mois.png"
];
let bannerIndex = 0;
function tryBanner(){
  if(bannerIndex >= bannerPaths.length){
    hero.classList.add("hidden");
    return;
  }
  banner.src = bannerPaths[bannerIndex] + "?v=" + Date.now();
  bannerIndex++;
}
banner.onerror = tryBanner;
tryBanner();
/* IMAGES DES MOIS */
const monthImages = [
  { number: 1, key: "01.2026", image: "Image/Mois/Janvier.jpeg" },
  { number: 2, key: "02.2026", image: "Image/Mois/Fevrier.jpeg" },
  { number: 3, key: "03.2026", image: "Image/Mois/Mars.jpeg" },
  { number: 4, key: "04.2026", image: "Image/Mois/Avril.jpeg" },
  { number: 5, key: "05.2026", image: "Image/Mois/Mai.jpeg" },
  { number: 6, key: "06.2026", image: "Image/Mois/Juin.jpeg" },
  { number: 7, key: "07.2026", image: "Image/Mois/Juillet.jpeg" },
  { number: 8, key: "08.2026", image: "Image/Mois/Aout.jpeg" },
  { number: 9, key: "09.2026", image: "Image/Mois/Septembre.jpeg" },
  { number: 10, key: "10.2026", image: "Image/Mois/Octobre.jpeg" },
  { number: 11, key: "11.2026", image: "Image/Mois/Novembre.jpeg" },
  { number: 12, key: "12.2026", image: "Image/Mois/Decembre.jpeg" }
];
const today = new Date();
const currentMonth = today.getMonth() + 1;
let visibleMonths = monthImages.filter(month => month.number === currentMonth);
if(today.getDate() >= 20){
  const nextMonthNumber = currentMonth === 12 ? 1 : currentMonth + 1;
  visibleMonths.push(
    ...monthImages.filter(month => month.number === nextMonthNumber)
  );
}
/*
Pour tester toutes les images :
visibleMonths = monthImages;
*/
const monthsDiv = document.getElementById("months");
fetch("./liens-a-modifier.json?v=" + Date.now())
  .then(response => response.json())
  .then(links => {
    if(!visibleMonths.length){
      monthsDiv.innerHTML = `
        <div class="empty">
          Aucun mois disponible pour le moment.
        </div>
      `;
      return;
    }
    visibleMonths.forEach(month => {
      const card = document.createElement("div");
      card.className = "card";
      const img = document.createElement("img");
      img.src = month.image + "?v=" + Date.now();
      img.alt = "Planning " + month.key;
      img.onerror = () => {
        img.remove();
        card.classList.add("missing");
        card.textContent = "Image introuvable : " + month.image;
      };
      const button = document.createElement("button");
      button.setAttribute("aria-label", "Ouvrir " + month.key);
      button.onclick = () => {
        const url = links?.[type]?.[month.key];
        if(url){
          window.location.href = url;
        } else {
          alert("Lien pas encore disponible pour " + month.key);
        }
      };
      card.appendChild(img);
      card.appendChild(button);
      monthsDiv.appendChild(card);
    });
  })
  .catch(() => {
    monthsDiv.innerHTML = `
      <div class="empty">
        Impossible de charger liens-a-modifier.json.
      </div>
    `;
  });
</script>
</body>
</html>
