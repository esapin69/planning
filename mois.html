<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choisis ton mois</title>

<style>
*{box-sizing:border-box}

:root{
  --ink:#07183f;
  --paper:#fff7dd;
  --gold:#d3a24b;
  --cream:#fff1c4;
}

html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:Impact,"Arial Black",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 15% 0%,rgba(255,255,255,.95) 0 9%,transparent 31%),
    radial-gradient(circle at 88% 4%,rgba(255,218,116,.46) 0 9%,transparent 32%),
    repeating-linear-gradient(-6deg,rgba(7,24,63,.035) 0 1px,transparent 1px 13px),
    linear-gradient(180deg,#fff9e8 0%,#f5e8bf 57%,#ead9a5 100%);
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.22;
  background:
    repeating-linear-gradient(8deg,rgba(7,24,63,.055) 0 1px,transparent 1px 12px),
    repeating-linear-gradient(-9deg,rgba(178,116,26,.075) 0 1px,transparent 1px 17px);
  mix-blend-mode:multiply;
}

.hero{
  position:relative;
  z-index:2;
  width:100%;
  background:#fff7df;
  overflow:hidden;
  border-bottom:5px solid #07183f;
}

.hero img{
  display:block;
  width:100%;
  height:140px;
  object-fit:cover;
  object-position:center;
}

.hero.hidden{
  display:none;
}

.page{
  position:relative;
  z-index:3;
  width:min(900px,100%);
  margin:auto;
  padding:18px 12px 46px;
}

.back{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:56px;
  margin-bottom:16px;
  padding:9px 12px;
  color:#fff4ce;
  text-decoration:none;
  text-align:center;
  text-transform:uppercase;
  border:5px solid #061738;
  border-radius:22px;
  background:
    radial-gradient(circle at 22% 16%,rgba(255,255,255,.22),transparent 28%),
    repeating-linear-gradient(-7deg,rgba(255,255,255,.07) 0 2px,transparent 2px 10px),
    linear-gradient(145deg,#777,#444,#222);
  box-shadow:0 7px 0 rgba(7,24,63,.35);
  font-size:clamp(20px,5vw,31px);
}

.title-box{
  position:relative;
  margin:4px auto 24px;
  max-width:720px;
  padding:17px 14px 18px;
  background:
    radial-gradient(circle at 12% 0%,rgba(255,255,255,.75),transparent 34%),
    linear-gradient(180deg,rgba(255,255,255,.42),transparent 48%),
    var(--paper);
  border:6px solid #07183f;
  border-radius:34px 28px 38px 29px;
  box-shadow:
    0 11px 0 rgba(7,24,63,.24),
    0 16px 0 rgba(0,0,0,.10),
    inset 0 0 0 3px rgba(255,215,115,.42);
  text-align:center;
}

h1{
  margin:0;
  font-size:clamp(34px, 9vw, 60px);
  line-height:.86;
  font-weight:1000;
  text-transform:uppercase;
  letter-spacing:-1px;
  color:#07183f;
  text-shadow:
    0 4px 0 #f8d67d,
    4px 7px 0 rgba(7,24,63,.14);
}

.subtitle{
  margin:10px 0 0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:clamp(15px, 4vw, 20px);
  font-weight:950;
  color:#243154;
  line-height:1.25;
}

.months-list{
  display:flex;
  flex-direction:column;
  gap:28px;
}

.card{
  position:relative;
  width:100%;
  border-radius:30px;
  overflow:hidden;
  background:#ffffff;
  border:6px solid #07183f;
  box-shadow:
    0 10px 0 rgba(7,24,63,.26),
    0 18px 30px rgba(7,24,63,.18);
}

.card img{
  display:block;
  width:100%;
  height:auto;
}

.card button{
  position:absolute;
  inset:0;
  border:0;
  background:transparent;
  cursor:pointer;
  z-index:3;
  -webkit-tap-highlight-color:transparent;
}

.card:active{
  transform:translateY(4px) scale(.985);
}

.card.missing{
  min-height:210px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  text-align:center;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:950;
  font-size:20px;

.empty{

  text-align:center;

  font-weight:950;
  font-size:20px;

.loading-box{

  border:5px solid #07183f;

  text-align:center;

  line-height:1.25;

}

.loading-box.show{

}

  .back{border-width:4px;min-height:52px}

const params = new URLSearchParams(window.location.search);
const type = params.get("type") || "jour";
const agent = String(params.get("agent") || "").trim();

const labels = {
  jour: "Planning équipe du jour",
  nuit: "Planning équipe de nuit",
  chef: "Planning chefs d’équipe",
  stagiaires: "Planning stagiaires",
  formations: "Planning formations",
  pdf: "PDF à imprimer",
  ics: "Sur ton agenda",
  "collectif-ics": "Télécharger le fichier ICS",
  agent: "Planning personnel à imprimer"
};

const pageTitle = document.getElementById("pageTitle");
const subtitle = document.getElementById("subtitle");
const loadingBox = document.getElementById("loadingBox");

if(type === "agent"){
  pageTitle.textContent = "Choisis ton mois";
  subtitle.textContent = agent
    ? "Planning de " + agent.replace(/_/g, " ")
    : "Agent manquant";
}else{
  subtitle.textContent = labels[type] || "Sélectionne le mois souhaité";
}

function apiUrl(mode, extra){
  const url = new URL(PASSERELLE);
  url.searchParams.set("mode", mode);
  url.searchParams.set("t", Date.now());

  Object.keys(extra || {}).forEach(k => {
    url.searchParams.set(k, extra[k]);
  });

  return url.toString();
}

async function fetchJson(url){
  const res = await fetch(url, {
    method:"GET",
    cache:"no-store"
  });

  if(!res.ok){
    throw new Error("HTTP " + res.status);
  }

  return await res.json();
}

function showLoading(message){
  loadingBox.textContent = message;
  loadingBox.classList.add("show");
}

function hideLoading(){
  loadingBox.textContent = "";
  loadingBox.classList.remove("show");
}

const banner = document.getElementById("banner");
const hero = document.getElementById("hero");

const bannerPaths = [
  "Image/Mois/Banniere-mois.png",
  "./Image/Mois/Banniere-mois.png",
  "/Image/Mois/Banniere-mois.png",
  "https://raw.githubusercontent.com/esapin69/planning/main/Image/Mois/Banniere-mois.png"
];

let bannerIndex = 0;

function tryBanner(){
  if(bannerIndex >= bannerPaths.length){
    hero.classList.add("hidden");
    return;
  }

  banner.src = bannerPaths[bannerIndex] + "?v=" + Date.now();
  bannerIndex++;
}

banner.onerror = tryBanner;
tryBanner();

const monthImages = [
  { number: 1, key: "01.2026", image: "Image/Mois/Janvier.jpeg" },
  { number: 2, key: "02.2026", image: "Image/Mois/Fevrier.jpeg" },
  { number: 3, key: "03.2026", image: "Image/Mois/Mars.jpeg" },
  { number: 4, key: "04.2026", image: "Image/Mois/Avril.jpeg" },
  { number: 5, key: "05.2026", image: "Image/Mois/Mai.jpeg" },
  { number: 6, key: "06.2026", image: "Image/Mois/Juin.jpeg" },
  { number: 7, key: "07.2026", image: "Image/Mois/Juillet.jpeg" },
  { number: 8, key: "08.2026", image: "Image/Mois/Aout.jpeg" },
  { number: 9, key: "09.2026", image: "Image/Mois/Septembre.jpeg" },
  { number: 10, key: "10.2026", image: "Image/Mois/Octobre.jpeg" },
  { number: 11, key: "11.2026", image: "Image/Mois/Novembre.jpeg" },
  { number: 12, key: "12.2026", image: "Image/Mois/Decembre.jpeg" }
];

const today = new Date();
const currentMonth = today.getMonth() + 1;

let visibleMonths = monthImages.filter(month => month.number === currentMonth);

if(today.getDate() >= 20){
  const nextMonthNumber = currentMonth === 12 ? 1 : currentMonth + 1;
  visibleMonths.push(
    ...monthImages.filter(month => month.number === nextMonthNumber)
  );
}

/*
Pour afficher tous les mois :
visibleMonths = monthImages;
*/

const monthsDiv = document.getElementById("months");

async function ouvrirPdfAgentMois(month){
  if(!agent){
    alert("Agent manquant.");
    return;
  }

  showLoading("Recherche du PDF " + month.key + "...");

  try{
    const data = await fetchJson(apiUrl("pdf_agent", {
      agent: agent,
      mois: month.key
    }));

    if(!data || data.ok === false || !data.lien_pdf){
      throw new Error(data && data.erreur ? data.erreur : "PDF indisponible");
    }

    window.location.href = data.lien_pdf;

  }catch(err){
    console.error(err);
    hideLoading();
    alert("PDF indisponible pour " + month.key + ". Le planning est peut-être encore en préparation.");
  }
}

function ouvrirMois(month){
  if(type === "agent"){
    ouvrirPdfAgentMois(month);
    return;
  }

  const url = links?.[type]?.[month.key];

  if(url){
    window.location.href = url;
  }else{
    alert("Lien pas encore disponible pour " + month.key);
  }
}

if(!visibleMonths.length){
  monthsDiv.innerHTML = `
    <div class="empty">
      Aucun mois disponible pour le moment.
    </div>
  `;
}else{
  visibleMonths.forEach(month => {
    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.src = month.image + "?v=" + Date.now();
    img.alt = "Planning " + month.key;

    img.onerror = () => {
      img.remove();
      card.classList.add("missing");
      card.textContent = "Image introuvable : " + month.image;
    };

    const button = document.createElement("button");
    button.setAttribute("aria-label", "Ouvrir " + month.key);

    button.onclick = () => ouvrirMois(month);

    card.appendChild(img);
    card.appendChild(button);
    monthsDiv.appendChild(card);
  });
}
