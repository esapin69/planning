<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choisis ton mois</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#fff7df;
  color:#07183f;
  overflow-x:hidden;
}

/* BANNIÈRE */
.hero{
  width:100%;
  background:#fff7df;
  overflow:hidden;
  border-bottom:5px solid #07183f;
  box-shadow:0 8px 0 rgba(7,24,63,.08);
}

.hero img{
  display:block;
  width:100%;
  height:clamp(135px, 30vw, 260px);
  object-fit:cover;
  object-position:center;
}

/* Si la bannière ne charge pas */
.hero.missing{
  min-height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:white;
  border:5px dashed #07183f;
  text-align:center;
  font-weight:900;
}

/* PAGE */
.page{
  max-width:900px;
  margin:auto;
  padding:18px 16px 36px;
}

.back{
  display:inline-block;
  margin-bottom:14px;
  color:#07183f;
  text-decoration:none;
  font-weight:900;
  font-size:16px;
}

/* TITRE */
h1{
  text-align:center;
  font-size:clamp(34px, 10vw, 54px);
  line-height:.9;
  margin:6px 0 8px;
  font-weight:1000;
  text-transform:uppercase;
  letter-spacing:-1px;
  color:#07183f;
  text-shadow:
    2px 2px 0 #ffffff,
    4px 4px 0 rgba(7,24,63,.16);
}

.subtitle{
  text-align:center;
  font-size:18px;
  font-weight:800;
  margin:0 0 24px;
  opacity:.85;
}

/* CARTES MOIS EN HORIZONTAL */
.months-track{
  display:flex;
  gap:14px;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  padding:4px 22px 22px 2px;
}

.months-track::-webkit-scrollbar{
  display:none;
}

.card{
  position:relative;
  flex:0 0 calc((100% - 28px) / 2.45);
  aspect-ratio:1 / 1.28;
  border-radius:24px;
  overflow:hidden;
  background:#ffffff;
  border:4px solid #07183f;
  box-shadow:
    0 9px 0 #07183f,
    0 16px 28px rgba(7,24,63,.20);
  scroll-snap-align:start;
}

.card img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

.card button{
  position:absolute;
  inset:0;
  border:0;
  background:transparent;
  cursor:pointer;
  z-index:3;
}

.card:active{
  transform:scale(.97);
}

/* SI UNE IMAGE DE MOIS MANQUE */
.card.missing{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  text-align:center;
  font-weight:900;
  font-size:16px;
}

/* MESSAGE ERREUR */
.empty{
  background:white;
  border:4px dashed #07183f;
  border-radius:24px;
  padding:22px;
  text-align:center;
  font-weight:900;
  box-shadow:0 8px 0 rgba(7,24,63,.12);
}

/* GRAND ÉCRAN : MAX 3 CARTES VISIBLES */
@media(min-width:700px){
  .card{
    flex-basis:calc((100% - 28px) / 3);
    max-width:270px;
  }
}
</style>
</head>

<body>

<header class="hero" id="hero">
  <img
    id="banner"
    src="Image/Mois/Banni%C3%A8re%20page%20des%20Mois.PNG"
    alt="Bannière choix du mois">
</header>

<main class="page">

  <a class="back" href="index.html">← Retour</a>

  <h1>Choisis ton mois</h1>

  <div class="subtitle" id="subtitle">Sélectionne le mois souhaité</div>

  <div id="months" class="months-track"></div>

</main>

<script>
const params = new URLSearchParams(window.location.search);
const type = params.get("type") || "jour";

const labels = {
  jour: "Planning équipe du jour",
  nuit: "Planning équipe de nuit",
  stagiaires: "Planning stagiaires",
  pdf: "PDF à imprimer",
  ics: "Sur ton agenda",
  "collectif-ics": "Télécharger le fichier ICS"
};

document.getElementById("subtitle").textContent =
  labels[type] || "Sélectionne le mois souhaité";

/* SÉCURITÉ BANNIÈRE */
const banner = document.getElementById("banner");
const hero = document.getElementById("hero");

banner.onerror = () => {
  banner.remove();
  hero.classList.add("missing");
  hero.textContent = "Bannière introuvable : Image/Mois/Bannière page des Mois.PNG";
};

/* IMAGES DES MOIS */
const monthImages = [
  { number: 1, key: "01.2026", image: "Image/Mois/Janvier.jpeg" },
  { number: 2, key: "02.2026", image: "Image/Mois/Fevrier.jpeg" },
  { number: 3, key: "03.2026", image: "Image/Mois/Mars.jpeg" },
  { number: 4, key: "04.2026", image: "Image/Mois/Avril.jpeg" },
  { number: 5, key: "05.2026", image: "Image/Mois/Mai.jpeg" },
  { number: 6, key: "06.2026", image: "Image/Mois/Juin.jpeg" },
  { number: 7, key: "07.2026", image: "Image/Mois/Juillet.jpeg" },
  { number: 8, key: "08.2026", image: "Image/Mois/Aout.jpeg" },
  { number: 9, key: "09.2026", image: "Image/Mois/Septembre.jpeg" },
  { number: 10, key: "10.2026", image: "Image/Mois/Octobre.jpeg" },
  { number: 11, key: "11.2026", image: "Image/Mois/Novembre.jpeg" },
  { number: 12, key: "12.2026", image: "Image/Mois/Decembre.jpeg" }
];

const today = new Date();
const currentMonth = today.getMonth() + 1;

let visibleMonths = monthImages.filter(month => month.number === currentMonth);

/* À PARTIR DU 20, ON AFFICHE AUSSI LE MOIS SUIVANT */
if(today.getDate() >= 20){
  const nextMonthNumber = currentMonth === 12 ? 1 : currentMonth + 1;
  visibleMonths.push(
    ...monthImages.filter(month => month.number === nextMonthNumber)
  );
}

/*
POUR TESTER TOUTES LES CARTES VISUELLEMENT,
décommente temporairement cette ligne :

visibleMonths = monthImages;
*/

const monthsDiv = document.getElementById("months");

fetch("./liens-a-modifier.json?v=" + Date.now())
  .then(response => response.json())
  .then(links => {

    if(!visibleMonths.length){
      monthsDiv.innerHTML = `
        <div class="empty">
          Aucun mois disponible pour le moment.
        </div>
      `;
      return;
    }

    visibleMonths.forEach(month => {
      const card = document.createElement("div");
      card.className = "card";

      const img = document.createElement("img");
      img.src = month.image + "?v=" + Date.now();
      img.alt = "Planning " + month.key;

      img.onerror = () => {
        img.remove();
        card.classList.add("missing");
        card.textContent = "Image introuvable : " + month.image;
      };

      const button = document.createElement("button");
      button.setAttribute("aria-label", "Ouvrir " + month.key);

      button.onclick = () => {
        const url = links?.[type]?.[month.key];

        if(url){
          window.location.href = url;
        } else {
          alert("Lien pas encore disponible pour " + month.key);
        }
      };

      card.appendChild(img);
      card.appendChild(button);
      monthsDiv.appendChild(card);
    });
  })
  .catch(() => {
    monthsDiv.innerHTML = `
      <div class="empty">
        Impossible de charger liens-a-modifier.json.
      </div>
    `;
  });
</script>

</body>
</html>
