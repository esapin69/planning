<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choisis ton mois</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fff7df;color:#07183f}
.page{max-width:900px;margin:auto;padding:20px}
h1{text-align:center;font-size:36px;margin:12px 0 10px;font-weight:900;text-transform:uppercase}
.subtitle{text-align:center;font-size:20px;margin-bottom:24px}
#months{display:grid;grid-template-columns:1fr;gap:22px}
.card{position:relative;border-radius:24px;overflow:hidden;background:white;box-shadow:0 10px 28px rgba(7,24,63,.18);border:4px solid #07183f}
.card img{display:block;width:100%}
.card button{position:absolute;inset:0;border:0;background:transparent;cursor:pointer}
.missing{padding:22px;background:#fff;border:3px solid #07183f;border-radius:18px;font-size:18px;text-align:center}
.back{display:inline-block;margin-bottom:15px;color:#07183f;text-decoration:none;font-weight:800}
</style>
</head>
<body>

<div class="page">
  <a class="back" href="index.html">← Retour</a>
  <h1 id="title">Choisis ton mois</h1>
  <div class="subtitle" id="subtitle"></div>
  <div id="months"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const type = params.get("type") || "jour";

const labels = {
  jour: "Planning équipe du jour",
  nuit: "Planning équipe de nuit",
  stagiaires: "Planning stagiaires",
  pdf: "PDF à imprimer",
  ics: "Sur ton agenda"
};

document.getElementById("title").textContent = labels[type] || "Choisis ton mois";
document.getElementById("subtitle").textContent = "Sélectionne le mois souhaité";

function formatMonth(date){
  const mm = String(date.getMonth() + 1).padStart(2, "0");
  const yyyy = date.getFullYear();
  return `${mm}.${yyyy}`;
}

function nextMonth(date){
  return new Date(date.getFullYear(), date.getMonth() + 1, 1);
}

const today = new Date();
const visibleMonths = [formatMonth(today)];

if(today.getDate() >= 20){
  visibleMonths.push(formatMonth(nextMonth(today)));
}

const monthsDiv = document.getElementById("months");

async function loadLinks(){
  try{
    const response = await fetch("liens.json?v=" + Date.now());
    return await response.json();
  }catch(e){
    return {};
  }
}

function getTarget(type, month, links){
  if(type === "pdf") return `pdf/${month}/`;
  if(type === "ics") return `ics/${month}/`;
  return links?.[type]?.[month] || "";
}

loadLinks().then(links=>{
  visibleMonths.forEach(month=>{
    const target = getTarget(type, month, links);

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="assets/mois/${month}.jpg" alt="">
      <button aria-label="Ouvrir ${month}"></button>
    `;

    card.querySelector("button").onclick = ()=>{
      if(target){
        window.location.href = target;
      }else{
        alert("Lien non disponible pour ce mois.");
      }
    };

    monthsDiv.appendChild(card);
  });
});
</script>

</body>
</html>
