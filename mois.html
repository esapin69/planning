<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choisis ton mois</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#fff7df;
  color:#07183f;
  overflow-x:hidden;
}

/* BANNIÈRE TÊTE DE PAGE */
.hero{
  width:100%;
  background:#fff7df;
  overflow:hidden;
  border-bottom:5px solid #07183f;
}

.hero img{
  display:block;
  width:100%;
  height:150px;
  object-fit:cover;
  object-position:center;
}

.hero.missing{
  min-height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:white;
  border:5px dashed #07183f;
  text-align:center;
  font-weight:900;
  font-size:22px;
}

/* PAGE */
.page{
  max-width:900px;
  margin:auto;
  padding:22px 16px 40px;
}

.back{
  display:inline-block;
  margin-bottom:18px;
  color:#07183f;
  text-decoration:none;
  font-weight:900;
  font-size:24px;
}

/* TITRE */
h1{
  text-align:center;
  font-size:clamp(42px, 11vw, 64px);
  line-height:.9;
  margin:10px 0 12px;
  font-weight:1000;
  text-transform:uppercase;
  letter-spacing:-2px;
  color:#07183f;
  text-shadow:
    3px 3px 0 #ffffff,
    6px 6px 0 rgba(7,24,63,.18);
}

.subtitle{
  text-align:center;
  font-size:24px;
  font-weight:900;
  margin:0 0 28px;
  opacity:.88;
}

/* LISTE DES CARTES */
.months-list{
  display:flex;
  flex-direction:column;
  gap:28px;
}

/* CARTE PLEINE LARGEUR DANS LA PAGE */
.card{
  position:relative;
  width:100%;
  border-radius:28px;
  overflow:hidden;
  background:#ffffff;
  border:6px solid #07183f;
  box-shadow:
    0 10px 0 #07183f,
    0 18px 30px rgba(7,24,63,.18);
}

/* Image rectangle dans la carte */
.card img{
  display:block;
  width:100%;
  height:auto;
  object-fit:cover;
}

/* Bouton invisible sur toute la carte */
.card button{
  position:absolute;
  inset:0;
  border:0;
  background:transparent;
  cursor:pointer;
  z-index:3;
}

.card:active{
  transform:scale(.985);
}

/* Si image mois absente */
.card.missing{
  min-height:210px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  text-align:center;
  font-weight:900;
  font-size:20px;
}

/* Message erreur */
.empty{
  background:white;
  border:5px dashed #07183f;
  border-radius:28px;
  padding:26px;
  text-align:center;
  font-weight:900;
  font-size:20px;
}
</style>
</head>

<body>

<header class="hero" id="hero">
  <img id="banner" alt="Bannière choix du mois">
</header>

<main class="page">

  <a class="back" href="index.html">← Retour</a>

  <h1>Choisis ton mois</h1>

  <div class="subtitle" id="subtitle">Sélectionne le mois souhaité</div>

  <div id="months" class="months-list"></div>

</main>

<script>
const params = new URLSearchParams(window.location.search);
const type = params.get("type") || "jour";

const labels = {
  jour: "Planning équipe du jour",
  nuit: "Planning équipe de nuit",
  stagiaires: "Planning stagiaires",
  pdf: "PDF à imprimer",
  ics: "Sur ton agenda",
  "collectif-ics": "Télécharger le fichier ICS"
};

document.getElementById("subtitle").textContent =
  labels[type] || "Sélectionne le mois souhaité";

/* BANNIÈRE : plusieurs essais pour éviter le bug accent/espace */
const banner = document.getElementById("banner");
const hero = document.getElementById("hero");

const bannerPaths = [
  "Image/Mois/Bannière page des Mois.PNG",
  "Image/Mois/Banni%C3%A8re%20page%20des%20Mois.PNG",
  "./Image/Mois/Bannière page des Mois.PNG",
  "./Image/Mois/Banni%C3%A8re%20page%20des%20Mois.PNG"
];

let bannerIndex = 0;

function tryBanner(){
  if(bannerIndex >= bannerPaths.length){
    banner.remove();
    hero.classList.add("missing");
    hero.textContent = "Bannière introuvable";
    return;
  }

  banner.src = bannerPaths[bannerIndex] + "?v=" + Date.now();
  bannerIndex++;
}

banner.onerror = tryBanner;
tryBanner();

/* IMAGES DES MOIS */
const monthImages = [
  { number: 1, key: "01.2026", image: "Image/Mois/Janvier.jpeg" },
  { number: 2, key: "02.2026", image: "Image/Mois/Fevrier.jpeg" },
  { number: 3, key: "03.2026", image: "Image/Mois/Mars.jpeg" },
  { number: 4, key: "04.2026", image: "Image/Mois/Avril.jpeg" },
  { number: 5, key: "05.2026", image: "Image/Mois/Mai.jpeg" },
  { number: 6, key: "06.2026", image: "Image/Mois/Juin.jpeg" },
  { number: 7, key: "07.2026", image: "Image/Mois/Juillet.jpeg" },
  { number: 8, key: "08.2026", image: "Image/Mois/Aout.jpeg" },
  { number: 9, key: "09.2026", image: "Image/Mois/Septembre.jpeg" },
  { number: 10, key: "10.2026", image: "Image/Mois/Octobre.jpeg" },
  { number: 11, key: "11.2026", image: "Image/Mois/Novembre.jpeg" },
  { number: 12, key: "12.2026", image: "Image/Mois/Decembre.jpeg" }
];

const today = new Date();
const currentMonth = today.getMonth() + 1;

/*
  MODE SIMPLE :
  - mois actuel visible
  - mois suivant visible à partir du 20
*/
let visibleMonths = monthImages.filter(month => month.number === currentMonth);

if(today.getDate() >= 20){
  const nextMonthNumber = currentMonth === 12 ? 1 : currentMonth + 1;
  visibleMonths.push(
    ...monthImages.filter(month => month.number === nextMonthNumber)
  );
}

/*
  SI TU VEUX AFFICHER LES 12 MOIS,
  remplace la ligne au-dessus par celle-ci :

  visibleMonths = monthImages;
*/

const monthsDiv = document.getElementById("months");

fetch("./liens-a-modifier.json?v=" + Date.now())
  .then(response => response.json())
  .then(links => {

    if(!visibleMonths.length){
      monthsDiv.innerHTML = `
        <div class="empty">
          Aucun mois disponible pour le moment.
        </div>
      `;
      return;
    }

    visibleMonths.forEach(month => {
      const card = document.createElement("div");
      card.className = "card";

      const img = document.createElement("img");
      img.src = month.image + "?v=" + Date.now();
      img.alt = "Planning " + month.key;

      img.onerror = () => {
        img.remove();
        card.classList.add("missing");
        card.textContent = "Image introuvable : " + month.image;
      };

      const button = document.createElement("button");
      button.setAttribute("aria-label", "Ouvrir " + month.key);

      button.onclick = () => {
        const url = links?.[type]?.[month.key];

        if(url){
          window.location.href = url;
        } else {
          alert("Lien pas encore disponible pour " + month.key);
        }
      };

      card.appendChild(img);
      card.appendChild(button);
      monthsDiv.appendChild(card);
    });
  })
  .catch(() => {
    monthsDiv.innerHTML = `
      <div class="empty">
        Impossible de charger liens-a-modifier.json.
      </div>
    `;
  });
</script>

</body>
</html>
