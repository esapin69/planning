<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7dd">
<title>GHE — Stagiaires</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --navy:#07183f;
  --cream:#fff7dd;
  --paper:#fffdf4;
  --muted:#697184;
  --blue:#1675ef;
  --green:#24a247;
  --orange:#ff7c12;
  --yellow:#f5bd00;
  --black:#171717;
  --warn:#7c4b00;
  --warn-bg:#fff1b8;
  --danger:#a82018;
  --danger-bg:#fff0ec;
  --shadow:0 9px 0 rgba(7,24,63,.16);
  --display:Impact,"Arial Black",system-ui,sans-serif;
}
html,body{margin:0;min-height:100%;background:var(--cream);color:var(--navy)}
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:
    repeating-linear-gradient(0deg,rgba(7,24,63,.025) 0 1px,transparent 1px 27px),
    linear-gradient(180deg,#fffaf0 0%,#fff6d6 100%);
}
body.modal-open{overflow:hidden}
button,a{font:inherit;color:inherit}
button{border:0}
[hidden]{display:none!important}
.page{width:min(760px,100%);margin:auto;padding:calc(7px + env(safe-area-inset-top)) 9px calc(95px + env(safe-area-inset-bottom))}
.topbar{margin-bottom:9px}
.navbtn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;border:3px solid var(--navy);border-radius:17px;background:var(--paper);text-decoration:none;font-size:16px;font-weight:950;box-shadow:0 4px 0 rgba(7,24,63,.13)}
.hero{overflow:hidden;border:5px solid var(--navy);border-radius:28px;background:var(--navy);box-shadow:var(--shadow);margin-bottom:17px}
.hero img{display:block;width:100%;height:clamp(112px,26vw,190px);object-fit:cover}
.loading,.empty,.error{background:var(--paper);border:4px solid var(--navy);border-radius:22px;padding:16px;font-weight:900;box-shadow:var(--shadow)}
.error{color:var(--danger)}
.day-card{overflow:hidden;background:var(--paper);border:5px solid var(--navy);border-radius:30px;box-shadow:var(--shadow);margin:0 0 18px}
.day-band{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:13px 17px 12px;background:linear-gradient(180deg,#aab4c8 0%,#6b778e 100%);color:#fff;text-shadow:0 3px 0 rgba(7,24,63,.22)}
.day-name{font-family:var(--display);font-size:clamp(31px,8vw,52px);line-height:.82;text-transform:uppercase;letter-spacing:.3px}
.date-inline{font-family:var(--display);font-size:clamp(19px,5vw,31px);line-height:.9;text-transform:uppercase;white-space:nowrap}
.assignments{background:linear-gradient(145deg,#fffdf6 0%,#fff6da 100%)}
.assignment{--accent:#7b8597;--accent-deep:#5f697b;position:relative;padding:16px 14px 15px;background:linear-gradient(145deg,#f2f4f7 0%,rgba(255,255,255,.96) 75%)}
.assignment+.assignment{border-top:3px dashed rgba(7,24,63,.16)}
.assignment.status-ok{background:linear-gradient(145deg,#eaf8ef 0%,#fbfffc 78%)}
.assignment.status-warning{background:linear-gradient(145deg,#fff7d9 0%,#fffdf5 78%)}
.assignment.status-danger{background:linear-gradient(145deg,#fff0ec 0%,#fffdfb 78%)}
.assignment.shift-m{--accent:var(--blue);--accent-deep:#0756c7}
.assignment.shift-j{--accent:var(--green);--accent-deep:#168037}
.assignment.shift-j4{--accent:var(--orange);--accent-deep:#d95800}
.assignment.shift-s{--accent:var(--yellow);--accent-deep:#c79300}
.assignment.shift-n{--accent:var(--black);--accent-deep:#000}
.shift-head{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 16px;text-align:center}
.shift-medallion{width:58px;height:58px;flex:0 0 58px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 34% 28%,#fff 0 7%,var(--accent) 18% 58%,var(--accent-deep) 59% 100%);border:5px solid var(--accent-deep);box-shadow:inset 0 0 0 5px rgba(255,255,255,.35),0 6px 0 rgba(7,24,63,.14)}
.shift-letter{font-family:var(--display);font-size:30px;line-height:1;color:var(--navy);text-shadow:0 2px 0 rgba(255,255,255,.35)}
.shift-name{font-family:var(--display);font-size:clamp(24px,6vw,36px);line-height:.9;text-transform:uppercase;letter-spacing:.3px}
.people{display:grid;grid-template-columns:minmax(0,1fr) 36px minmax(0,1fr);gap:8px;align-items:start}
.arrow{align-self:center;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;font-size:21px;font-weight:950;box-shadow:0 4px 0 rgba(7,24,63,.16)}
.person{text-align:center;min-width:0}
.role-tag{display:inline-flex;align-items:center;justify-content:center;min-width:94px;margin:0 auto 8px;padding:5px 10px;border:3px solid var(--navy);border-radius:999px;background:var(--paper);font-size:10px;line-height:1;font-weight:1000;letter-spacing:.7px;text-transform:uppercase;box-shadow:0 3px 0 rgba(7,24,63,.11)}
.avatar-shell{position:relative;width:116px;height:116px;margin:0 auto 9px}
.avatar{width:116px;height:116px;border-radius:31px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.86);border:4px solid var(--navy);box-shadow:0 6px 0 rgba(7,24,63,.14)}
.avatar img{width:100%;height:100%;object-fit:contain;display:block}
.avatar-fallback{display:flex;align-items:center;justify-content:center;width:74px;height:74px;border-radius:24px;background:#eef1f7;border:3px solid rgba(7,24,63,.3);font-size:40px}
.avatar.has-img .avatar-fallback{display:none}
.ghe-badge{position:absolute;top:-7px;right:-7px;z-index:3;min-height:29px;padding:5px 8px;border:3px solid var(--navy);border-radius:999px;background:var(--navy);color:#fff;font-size:10px;line-height:1;font-weight:1000;letter-spacing:.2px;box-shadow:0 3px 0 rgba(7,24,63,.16);white-space:nowrap}
button.ghe-badge{cursor:pointer}
button.ghe-badge:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(7,24,63,.16)}
.person-name{display:block;min-height:42px;font-size:clamp(17px,4.8vw,24px);line-height:.94;font-weight:1000;text-transform:uppercase;overflow-wrap:anywhere}
.person-shift{min-height:42px;margin-top:7px;display:flex;align-items:flex-start;justify-content:center;gap:6px;color:var(--muted);font-size:12px;line-height:1.18;font-weight:900}
.person-shift-dot{width:11px;height:11px;margin-top:2px;flex:0 0 auto;border-radius:3px;background:var(--accent);border:1px solid rgba(7,24,63,.2)}
.person-shift-text{max-width:132px}
.alert-strip{width:100%;margin-top:14px;border:0;border-radius:15px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;align-items:center;text-align:left;box-shadow:0 3px 0 rgba(7,24,63,.09)}
.alert-strip.warning{background:var(--warn-bg);color:var(--warn);cursor:pointer}
.alert-strip.danger{background:var(--danger-bg);color:var(--danger);cursor:pointer}
.alert-icon{font-size:20px}
.alert-main{min-width:0}
.alert-title{font-size:13px;font-weight:1000;text-transform:uppercase;line-height:1.05}
.alert-text{margin-top:3px;font-size:12px;font-weight:850;line-height:1.24}
.alert-more{font-size:23px;font-weight:1000}
.modal{position:fixed;inset:0;z-index:1000;display:none;align-items:flex-end;justify-content:center;padding:12px;background:rgba(7,24,63,.62);backdrop-filter:blur(5px)}
.modal.open{display:flex}
.sheet{width:min(650px,100%);max-height:86vh;overflow:auto;border:5px solid var(--navy);border-radius:29px 29px 22px 22px;background:var(--paper);padding:18px 15px calc(18px + env(safe-area-inset-bottom));box-shadow:0 14px 0 rgba(0,0,0,.22)}
.sheet h2{margin:0;font-family:var(--display);font-size:clamp(31px,8vw,49px);line-height:.88;text-transform:uppercase}
.sheet-sub{margin:8px 0 15px;color:var(--muted);font-size:13px;font-weight:850;line-height:1.3}
.group{margin-top:13px}
.group-title{margin-bottom:7px;font-size:13px;font-weight:1000;text-transform:uppercase;color:var(--navy)}
.issue{border-radius:17px;padding:12px;margin-bottom:9px}
.issue.warning{background:var(--warn-bg);color:var(--warn)}
.issue.danger{background:var(--danger-bg);color:var(--danger)}
.issue-title{font-size:15px;font-weight:1000}
.issue-detail{margin-top:5px;font-size:13px;font-weight:800;line-height:1.34}
.issue-action{margin-top:8px;padding-top:8px;border-top:1px solid currentColor;font-size:13px;font-weight:850;line-height:1.34}
.close{width:100%;min-height:50px;margin-top:11px;border:4px solid var(--navy);border-radius:17px;background:var(--navy);color:var(--cream);font-weight:1000;cursor:pointer}
.call-number{margin:16px 0 12px;padding:14px;border:3px solid var(--navy);border-radius:18px;background:#f7f9ff;text-align:center;font-size:24px;font-weight:1000;letter-spacing:.8px}
.call-actions{display:grid;gap:9px}
.call-action{min-height:52px;display:flex;align-items:center;justify-content:center;border:4px solid var(--navy);border-radius:17px;text-decoration:none;font-weight:1000}
.call-action.primary{background:var(--navy);color:var(--cream)}
.call-action.secondary{background:var(--paper)}
@media(max-width:390px){
  .page{padding-left:7px;padding-right:7px}
  .day-band{padding-left:13px;padding-right:13px}
  .assignment{padding-left:10px;padding-right:10px}
  .shift-medallion{width:51px;height:51px;flex-basis:51px}
  .shift-letter{font-size:27px}
  .shift-name{font-size:24px}
  .avatar-shell,.avatar{width:96px;height:96px}
  .avatar{border-radius:26px}
  .avatar-fallback{width:62px;height:62px;font-size:33px}
  .role-tag{min-width:82px;font-size:9px}
  .people{grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);gap:4px}
  .arrow{width:28px;height:28px;font-size:16px}
  .person-name{font-size:16px}
  .person-shift{font-size:10.5px}
  .ghe-badge{font-size:9px;padding:4px 6px}
}
@media(min-width:700px){
  .assignment{padding:20px 22px 18px}
  .avatar-shell,.avatar{width:142px;height:142px}
  .avatar{border-radius:36px}
  .avatar-fallback{width:88px;height:88px;font-size:47px}
  .role-tag{min-width:112px;font-size:12px}
  .person-name{font-size:27px}
  .person-shift{font-size:14px}
  .modal{align-items:center}
}

/* Correction finale — GHE toujours cliquable */
.call-action.is-disabled{
  pointer-events:none;
  opacity:.45;
}
.ghe-badge{
  -webkit-tap-highlight-color:transparent;
}

</style>
</head>
<body>
<main class="page">
  <div class="topbar"><a class="navbtn" href="index.html">← Accueil</a></div>

  <section class="hero">
    <img src="Image/Bannière/Page stagiaire.PNG" alt="Stagiaires GHE" onerror="this.onerror=null;this.src='Image/Banni%C3%A8re/Page%20stagiaire.PNG';">
  </section>

  <section id="content"><div class="loading">Connexion aux données…</div></section>
</main>

<div id="issueModal" class="modal" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Pourquoi cette alerte ?</h2>
    <div id="modalSub" class="sheet-sub"></div>
    <div id="modalBody"></div>
    <button id="modalClose" class="close" type="button">Fermer</button>
  </div>
</div>

<div id="callModal" class="modal" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="callTitle">
    <h2 id="callTitle">Contacter l’agent</h2>
    <div id="callSub" class="sheet-sub"></div>
    <div id="callNumber" class="call-number"></div>
    <div class="call-actions">
      <a id="callNormal" class="call-action primary" href="#">Appeler</a>
      <a id="callHidden" class="call-action secondary" href="#">Appeler en numéro masqué</a>
      <button id="callClose" class="close" type="button">Annuler</button>
    </div>
  </div>
</div>

<script>
const WEB_APP_URL="https://script.google.com/macros/s/AKfycbzmelNrBU583V3CvOlle3cafAKEAZQ8NAX-peSN6D-yxFO3gX26SnVNUVd5xbwV3CUISg/exec";
let ITEMS=[];

const content=document.getElementById("content");
const issueModal=document.getElementById("issueModal");
const modalSub=document.getElementById("modalSub");
const modalBody=document.getElementById("modalBody");
const callModal=document.getElementById("callModal");
const callSub=document.getElementById("callSub");
const callNumber=document.getElementById("callNumber");
const callNormal=document.getElementById("callNormal");
const callHidden=document.getElementById("callHidden");

function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;")}
function norm(v){return String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\s+/g," ").trim()}
function arr(v){return Array.isArray(v)?v:[]}

function dateParts(item){
  const raw=String(item&&item.dateKey||"");
  const m=raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  let d;
  if(m){d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]),12,0,0)}else{d=new Date(item&&item.dateLabel||raw)}
  const jours=["DIMANCHE","LUNDI","MARDI","MERCREDI","JEUDI","VENDREDI","SAMEDI"];
  const mois=["JANVIER","FÉVRIER","MARS","AVRIL","MAI","JUIN","JUILLET","AOÛT","SEPTEMBRE","OCTOBRE","NOVEMBRE","DÉCEMBRE"];
  return Number.isNaN(d.getTime())?{jour:"DATE",numero:"--",mois:""}:{jour:jours[d.getDay()],numero:String(d.getDate()),mois:mois[d.getMonth()]};
}

function rawGroups(item){
  const a=item&&item.anomalies||{};
  return{
    stagiaire:arr(a.stagiaire),
    referent:arr(a.referent),
    affectation:arr(a.affectation)
  };
}

function hourMinutes(value){
  const txt=String(value||"").trim();
  const match=txt.match(/(\d{1,2})[:h](\d{2})/i);
  if(!match)return null;
  return Number(match[1])*60+Number(match[2]);
}

function shiftInterval(shift){
  shift=shift||{};

  let debut=shift.heureDebut||"";
  let fin=shift.heureFin||"";

  if((!debut||!fin)&&shift.horaire){
    const matches=[
      ...String(shift.horaire).matchAll(/(\d{1,2})[:h](\d{2})/gi)
    ];

    if(matches.length>=2){
      debut=`${matches[0][1]}:${matches[0][2]}`;
      fin=`${matches[1][1]}:${matches[1][2]}`;
    }
  }

  const start=hourMinutes(debut);
  let end=hourMinutes(fin);

  if(start===null||end===null)return null;
  if(end<=start)end+=1440;

  return {start,end};
}

function bestReferentInterval(traineeInterval,referentInterval){
  if(!traineeInterval||!referentInterval)return null;

  const candidates=[-1440,0,1440].map(offset=>({
    start:referentInterval.start+offset,
    end:referentInterval.end+offset
  }));

  candidates.sort((a,b)=>{
    const overlapA=Math.max(
      0,
      Math.min(traineeInterval.end,a.end)-
      Math.max(traineeInterval.start,a.start)
    );

    const overlapB=Math.max(
      0,
      Math.min(traineeInterval.end,b.end)-
      Math.max(traineeInterval.start,b.start)
    );

    return overlapB-overlapA;
  });

  return candidates[0];
}

function isMismatchIssue(issue){
  const text=norm(
    [
      issue&&issue.titre,
      issue&&issue.resume,
      issue&&issue.detail,
      issue&&issue.message
    ].filter(Boolean).join(" ")
  );

  return (
    text.includes("HORAIRES DIFFERENTS")||
    text.includes("HORAIRE DIFFERENT")||
    text.includes("PAS EXACTEMENT")||
    text.includes("CRENEAUX DIFFERENTS")||
    text.includes("SHIFT DIFFERENT")||
    text.includes("SHIFTS DIFFERENTS")||
    text.includes("HORAIRE INCOMPATIBLE")||
    text.includes("HORAIRES INCOMPATIBLES")||
    text.includes("MEME SHIFT")
  );
}

function isTechnicalIssue(issue){
  const text=norm(
    [
      issue&&issue.titre,
      issue&&issue.resume,
      issue&&issue.detail,
      issue&&issue.message,
      issue&&issue.action
    ].filter(Boolean).join(" ")
  );

  return (
    text.includes("HORAIRE STAGIAIRE RECUPERE DEPUIS LIGNE")||
    text.includes("RECUPERE DEPUIS LIGNE")||
    text.includes("SOURCE INTERNE")||
    text.includes("PHOTOCOPIE INTELLIGENTE")||
    text.includes("SORTIE_MAILS")||
    text.includes("MAIL PERSONNEL")||
    text.includes("ADRESSE MAIL PERSONNELLE")||
    text.includes("DONNEE TECHNIQUE")||
    text.includes("RATTACHEMENT TECHNIQUE")
  );
}

function formatClock(minutes){
  const normalized=((minutes%1440)+1440)%1440;
  const h=Math.floor(normalized/60);
  const m=normalized%60;

  return String(h).padStart(2,"0")+":"+
    String(m).padStart(2,"0");
}

function formatDuration(minutes){
  const total=Math.max(0,Math.round(Number(minutes)||0));
  const h=Math.floor(total/60);
  const m=total%60;

  if(h&&m)return`${h} h ${String(m).padStart(2,"0")}`;
  if(h)return`${h} h`;
  return`${m} min`;
}

function coverageIssue(item){
  const traineeInterval=shiftInterval(item&&item.stagiaireShift);
  const rawReferentInterval=shiftInterval(item&&item.referentShift);

  if(!traineeInterval||!rawReferentInterval)return null;

  const referentInterval=bestReferentInterval(
    traineeInterval,
    rawReferentInterval
  );

  if(!referentInterval)return null;

  const fullyCovered=
    referentInterval.start<=traineeInterval.start&&
    referentInterval.end>=traineeInterval.end;

  if(fullyCovered)return null;

  const stagiaire=String(
    item&&item.stagiaire&&item.stagiaire.nomPrenom||
    "Le stagiaire"
  ).toUpperCase();

  const referent=String(
    item&&item.referent&&item.referent.nomComplet||
    "Le référent"
  ).toUpperCase();

  const beforeGap=Math.max(
    0,
    referentInterval.start-traineeInterval.start
  );

  const afterGap=Math.max(
    0,
    traineeInterval.end-referentInterval.end
  );

  const totalGap=beforeGap+afterGap;

  const overlap=
    Math.min(traineeInterval.end,referentInterval.end)-
    Math.max(traineeInterval.start,referentInterval.start);

  const noOverlap=overlap<=0;
  const details=[];

  if(beforeGap>0){
    details.push(
      `${stagiaire} est présent de `+
      `${formatClock(traineeInterval.start)} à `+
      `${formatClock(referentInterval.start)} avant l’arrivée de `+
      `${referent} (${formatDuration(beforeGap)} sans référent).`
    );
  }

  if(afterGap>0){
    details.push(
      `${stagiaire} reste présent de `+
      `${formatClock(referentInterval.end)} à `+
      `${formatClock(traineeInterval.end)} après le départ de `+
      `${referent} (${formatDuration(afterGap)} sans référent).`
    );
  }

  return {
    niveau:noOverlap?"danger":"warning",
    titre:noOverlap
      ?"Référent absent pendant le créneau"
      :"Accompagnement incomplet",
    resume:noOverlap
      ?"Le référent n’est pas présent pendant le créneau du stagiaire."
      :`${formatDuration(totalGap)} sans référent au total.`,
    detail:details.join(" ")||
      "Le référent ne couvre pas toute la présence du stagiaire.",
    action:"Vérifier l’affectation ou choisir un référent présent pendant tout le créneau du stagiaire."
  };
}

function groups(item){
  const raw=rawGroups(item);

  const publicIssue=issue=>
    !isMismatchIssue(issue)&&
    !isTechnicalIssue(issue);

  const clean={
    stagiaire:raw.stagiaire.filter(publicIssue),
    referent:raw.referent.filter(publicIssue),
    affectation:raw.affectation.filter(publicIssue)
  };

  const coverage=coverageIssue(item);

  if(coverage){
    clean.affectation.push(coverage);
  }

  return clean;
}

function issuesWithTargets(item){
  const g=groups(item);
  return[
    ...g.stagiaire.map(x=>({target:"Stagiaire",issue:x})),
    ...g.referent.map(x=>({target:"Référent",issue:x})),
    ...g.affectation.map(x=>({target:"Affectation",issue:x}))
  ];
}

function level(item){
  const all=issuesWithTargets(item);

  if(
    all.some(
      x=>x.issue&&x.issue.niveau==="danger"
    )
  ){
    return"danger";
  }

  return all.length?"warning":"ok";
}

function shiftBase(shift){
  const code=norm(shift&&(shift.code||shift.base||shift.label)).replace(/[^A-Z0-9]/g,"");
  if(code.includes("J4"))return"J4";
  if(code==="M"||code.includes("MATIN"))return"M";
  if(code==="J"||code.includes("JOURNEE")||code==="JOUR")return"J";
  if(code==="S"||code.includes("SOIR"))return"S";
  if(code==="N"||code.includes("NUIT"))return"N";
  return code;
}

function shiftClass(shift){
  const base=shiftBase(shift);
  return base==="M"?"shift-m":base==="J4"?"shift-j4":base==="J"?"shift-j":base==="S"?"shift-s":base==="N"?"shift-n":"shift-neutral";
}

function shiftLetter(shift){
  const base=shiftBase(shift);
  return base||"?";
}

function shiftText(shift){
  const base=shiftBase(shift);

  if(base==="M")return"Matin";
  if(base==="J")return"Journée";
  if(base==="J4")return"J4";
  if(base==="S")return"Soir";
  if(base==="N")return"Nuit";

  return shift&&(shift.label||shift.code)||"Shift à vérifier";
}
function shiftHours(shift){return shift&&shift.horaire||"Horaire non renseigné"}

function mainShift(item){
  const s=item&&item.stagiaireShift||{};
  const r=item&&item.referentShift||{};
  if(shiftBase(s)&&shiftBase(s)===shiftBase(r))return s;
  return item&&item.shift&&Object.keys(item.shift).length?item.shift:(s.code?s:r);
}

function avatarBlock(person,role){
  person=person||{};
  const a=person.avatar||{};
  const thumb=a.thumb||"";
  const ghe=person.ghe||"";
  const phone=person.telephone||"";
  const name=person.nomPrenom||person.nomComplet||role;
  let badge="";
  if(ghe){
    badge=`<button
      class="ghe-badge"
      type="button"
      data-call-name="${esc(name)}"
      data-call-ghe="${esc(ghe)}"
      data-call-phone="${esc(phone)}">${esc(ghe)}</button>`;
  }
  return `<div class="role-tag">${esc(role)}</div><div class="avatar-shell"><div class="avatar ${thumb?"has-img":""}">${thumb?`<img src="${esc(thumb)}" alt="" loading="lazy" onerror="this.parentElement.classList.remove('has-img');this.remove()">`:""}<span class="avatar-fallback">👤</span></div>${badge}</div>`;
}

function person(personData,role,shift){
  personData=personData||{};
  const name=personData.nomPrenom||personData.nomComplet||(role==="Référent"?"Référent à attribuer":"Stagiaire");
  const hasShift=!!(shift&&(shift.code||shift.label||shift.horaire));
  const detail=hasShift?shiftHours(shift):"Horaire non renseigné";
  return `<section class="person">${avatarBlock(personData,role)}<span class="person-name">${esc(name)}</span><div class="person-shift"><span class="person-shift-dot"></span><span class="person-shift-text">${esc(detail)}</span></div></section>`;
}

function publicIssue(issue){
  issue=issue||{};
  const bag=norm([issue.titre,issue.resume,issue.detail].filter(Boolean).join(" "));
  const mismatch=bag.includes("MEME SHIFT")||bag.includes("CRENEAUX DIFFERENTS")||bag.includes("HORAIRES DIFFERENTS")||bag.includes("PAS EXACTEMENT")||bag.includes("HORAIRE DIFFERENT");
  if(mismatch){
    return{
      ...issue,
      titre:"Horaires différents",
      resume:"Le stagiaire et le référent n’ont pas exactement les mêmes horaires.",
      detail:"Ils travaillent sur le même type de shift, mais leur heure de début ou de fin est différente.",
      action:issue.action||"Vérifier que la différence d’horaires permet l’accompagnement prévu."
    };
  }
  return issue;
}

function alertStrip(item,index){
  const all=issuesWithTargets(item);
  if(!all.length)return"";
  const first=all.find(x=>x.issue&&x.issue.niveau==="danger")||all[0];
  const lvl=level(item);
  const issue=publicIssue(first.issue||{});
  const target=first.target||"Affectation";
  const suffix=all.length>1?` · ${all.length} points au total`:"";
  return `<button class="alert-strip ${lvl}" type="button" data-alert-index="${index}"><span class="alert-icon">${lvl==="danger"?"⛔":"⚠️"}</span><div class="alert-main"><div class="alert-title">${esc(target)} · ${esc(issue.titre||"Point à vérifier")}</div><div class="alert-text">${esc(issue.resume||issue.detail||"Une information doit être vérifiée.")}${esc(suffix)}</div></div><span class="alert-more">›</span></button>`;
}

function assignment(item,index){
  const primary=mainShift(item);
  const lvl=level(item);
  return `<article class="assignment ${shiftClass(primary)} status-${lvl}"><div class="shift-head"><div class="shift-medallion"><span class="shift-letter">${esc(shiftLetter(primary))}</span></div><div class="shift-name">${esc(shiftText(primary))}</div></div><div class="people">${person(item.stagiaire,"Stagiaire",item.stagiaireShift||{})}<div class="arrow">→</div>${person(item.referent,"Référent",item.referentShift||{})}</div>${alertStrip(item,index)}</article>`;
}

function dayCard(list){
  const first=list[0].item;
  const p=dateParts(first);
  return `<article class="day-card"><header class="day-band"><span class="day-name">${esc(p.jour)}</span><span class="date-inline">${esc(p.numero)} ${esc(p.mois)}</span></header><div class="assignments">${list.map(x=>assignment(x.item,x.index)).join("")}</div></article>`;
}

function issueHtml(x){
  const shown=publicIssue(x);
  const lvl=shown&&shown.niveau==="danger"?"danger":"warning";
  return `<div class="issue ${lvl}"><div class="issue-title">${lvl==="danger"?"⛔":"⚠️"} ${esc(shown&&shown.titre||"Point à vérifier")}</div><div class="issue-detail">${esc(shown&&shown.detail||shown&&shown.resume||"Une information doit être vérifiée.")}</div><div class="issue-action"><strong>À faire :</strong> ${esc(shown&&shown.action||"Vérifier l’information concernée.")}</div></div>`;
}

function groupHtml(label,list){
  list=arr(list);
  if(!list.length)return"";
  return `<section class="group"><div class="group-title">${esc(label)}</div>${list.map(issueHtml).join("")}</section>`;
}

function openAlert(index){
  const item=ITEMS[index];
  if(!item)return;
  const g=groups(item);
  const stagiaire=item.stagiaire&&item.stagiaire.nomPrenom||"Stagiaire";
  const referent=item.referent&&item.referent.nomComplet||"Référent à attribuer";
  modalSub.textContent=(item.dateLabel||"")+" · "+stagiaire+" → "+referent;
  modalBody.innerHTML=groupHtml("Concernant le stagiaire",g.stagiaire)+groupHtml("Concernant le référent",g.referent)+groupHtml("Concernant l’affectation",g.affectation);
  issueModal.classList.add("open");
  issueModal.setAttribute("aria-hidden","false");
  document.body.classList.add("modal-open");
}

function closeIssueModal(){
  issueModal.classList.remove("open");
  issueModal.setAttribute("aria-hidden","true");
  document.body.classList.remove("modal-open");
}

function phoneDigits(value){
  let digits=String(value||"").replace(/\D/g,"");
  if(digits.startsWith("33")&&digits.length===11)digits="0"+digits.slice(2);
  if((digits.startsWith("6")||digits.startsWith("7"))&&digits.length===9)digits="0"+digits;
  return digits;
}

function phoneDisplay(value){
  const digits=phoneDigits(value);
  return digits.replace(/(\d{2})(?=\d)/g,"$1 ").trim();
}

function setCallUnavailable(){
  callNumber.textContent="Numéro indisponible";
  callNormal.href="#";
  callHidden.href="#";
  callNormal.classList.add("is-disabled");
  callHidden.classList.add("is-disabled");
  callNormal.setAttribute("aria-disabled","true");
  callHidden.setAttribute("aria-disabled","true");
}

function setCallReady(digits){
  callNumber.textContent=phoneDisplay(digits);
  callNormal.href="tel:"+digits;
  callHidden.href="tel:%2331%23"+digits;
  callNormal.classList.remove("is-disabled");
  callHidden.classList.remove("is-disabled");
  callNormal.removeAttribute("aria-disabled");
  callHidden.removeAttribute("aria-disabled");
}

function openCall(button){
  const name=button.dataset.callName||"Agent";
  const ghe=button.dataset.callGhe||"";
  const provided=phoneDigits(button.dataset.callPhone||"");

  callSub.textContent=[name,ghe].filter(Boolean).join(" · ");
  callNumber.textContent=provided
    ? phoneDisplay(provided)
    : "Chargement…";

  callModal.classList.add("open");
  callModal.setAttribute("aria-hidden","false");
  document.body.classList.add("modal-open");

  if(provided){
    setCallReady(provided);
    return;
  }

  callNormal.classList.add("is-disabled");
  callHidden.classList.add("is-disabled");
  callNormal.setAttribute("aria-disabled","true");
  callHidden.setAttribute("aria-disabled","true");

  const callback=
    "recevoirTelephoneStagiaire_"+
    Date.now()+"_"+
    Math.floor(Math.random()*100000);

  const script=document.createElement("script");
  let finished=false;

  function cleanup(){
    if(finished)return;
    finished=true;
    delete window[callback];
    if(script.isConnected)script.remove();
  }

  window[callback]=data=>{
    const digits=phoneDigits(
      data&&(
        data.telephoneDial||
        data.telephone
      )||
      ""
    );

    if(data&&data.ok&&digits){
      button.dataset.callPhone=digits;
      setCallReady(digits);
    }else{
      setCallUnavailable();
    }

    cleanup();
  };

  script.onerror=()=>{
    setCallUnavailable();
    cleanup();
  };

  script.src=
    WEB_APP_URL+
    "?mode=telephone"+
    "&agent="+encodeURIComponent(name)+
    "&ghe="+encodeURIComponent(ghe)+
    "&callback="+encodeURIComponent(callback)+
    "&v="+Date.now();

  document.body.appendChild(script);

  setTimeout(()=>{
    if(!finished){
      setCallUnavailable();
      cleanup();
    }
  },8000);
}

function closeCallModal(){
  callModal.classList.remove("open");
  callModal.setAttribute("aria-hidden","true");
  document.body.classList.remove("modal-open");
}

function render(){
  if(!ITEMS.length){content.innerHTML='<div class="empty">Aucun stagiaire à venir.</div>';return}
  const byDate={};
  ITEMS.forEach((item,index)=>{const key=item.dateKey||String(index);(byDate[key]||(byDate[key]=[])).push({item,index})});
  content.innerHTML=Object.keys(byDate).sort().map(key=>dayCard(byDate[key])).join("");
}

content.addEventListener("click",e=>{
  const callButton=e.target.closest("[data-call-ghe]");
  if(callButton){e.preventDefault();e.stopPropagation();openCall(callButton);return}
  const alertButton=e.target.closest("[data-alert-index]");
  if(alertButton)openAlert(Number(alertButton.dataset.alertIndex));
});
document.getElementById("modalClose").addEventListener("click",closeIssueModal);
issueModal.addEventListener("click",e=>{if(e.target===issueModal)closeIssueModal()});
document.getElementById("callClose").addEventListener("click",closeCallModal);
callModal.addEventListener("click",e=>{if(e.target===callModal)closeCallModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeIssueModal();closeCallModal()}});

(function load(){
  const cb="recevoirStagiaires_"+Date.now();
  const s=document.createElement("script");
  window[cb]=data=>{
    delete window[cb];
    s.remove();
    if(!data||!data.ok){content.innerHTML=`<div class="error">${esc(data&&data.erreur||"Données invalides.")}</div>`;return}
    ITEMS=arr(data.items);
    render();
  };
  s.onerror=()=>{
    delete window[cb];
    s.remove();
    content.innerHTML='<div class="error">Impossible de charger les données.</div>';
  };
  s.src=WEB_APP_URL+"?mode=site_stagiaires_formations&type=stagiaires&callback="+encodeURIComponent(cb)+"&v="+Date.now();
  document.body.appendChild(s);
})();
</script>
</body>
</html>
