<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzZITQIw7jbrJHyPl7xfcFjv8H1zQrq7yF73ekVx3S23Efjo2fWRsZ-YIiWNOMYCs3r/exec";

function clean(v){
  return v && String(v).trim() !== "" ? String(v).trim() : "Non renseigné";
}

function missing(v){
  const x = String(v || "").trim();
  return !x || x === "Non renseigné" || x === "Référent non renseigné";
}

function todayFr(){
  const d = new Date();
  return String(d.getDate()).padStart(2,"0") + "/" +
         String(d.getMonth()+1).padStart(2,"0") + "/" +
         d.getFullYear();
}

function parseFr(date){
  const p = String(date).split("/");
  if(p.length !== 3) return 0;
  return new Date(p[2], p[1]-1, p[0]).getTime();
}

function groupByDate(data){
  const groups = {};

  data.forEach(item => {
    const date = clean(item.date);

    if(!groups[date]){
      groups[date] = {date, pairs:[]};
    }

    groups[date].pairs.push({
      stagiaire_nom:item.stagiaire_nom,
      stagiaire_horaire:item.stagiaire_horaire,
      agent_nom:item.agent_nom,
      agent_horaire:item.agent_horaire,
      agent_ghe:item.agent_ghe,
      agent_telephone:item.agent_telephone,
      agent_avatar:item.agent_avatar
    });
  });

  return Object.values(groups).sort((a,b)=>parseFr(a.date)-parseFr(b.date));
}

function renderSummary(groups){
  const box = document.getElementById("summary");
  const today = todayFr();
  const todayGroup = groups.find(g => g.date === today);
  const nextGroup = groups.find(g => parseFr(g.date) >= parseFr(today));

  if(todayGroup){
    const count = todayGroup.pairs.length;
    const missingRefs = todayGroup.pairs.filter(p => missing(p.agent_nom)).length;
    const missingGhe = todayGroup.pairs.filter(p => missing(p.agent_ghe)).length;
    const missingPhones = todayGroup.pairs.filter(p => missing(p.agent_telephone)).length;

    box.innerHTML = `
      <div class="summary-title">📍 Aujourd’hui</div>
      <div class="summary-big">${count} stagiaire${count>1?"s":""}</div>
      <div class="summary-line">🟢 ${count - missingRefs} référent${count - missingRefs>1?"s":""} trouvé${count - missingRefs>1?"s":""}</div>
      <div class="summary-line">🏥 ${missingGhe} GHE à vérifier</div>
      <div class="summary-line">☎️ ${missingPhones} téléphone${missingPhones>1?"s":""} à vérifier</div>
      <div class="summary-line">${missingRefs || missingGhe || missingPhones ? "⚠️ Vérification utile" : "✅ Tout est prêt"}</div>
    `;
    return;
  }

  if(nextGroup){
    box.innerHTML = `
      <div class="summary-title">📍 Aujourd’hui</div>
      <div class="summary-big">Aucun stagiaire aujourd’hui</div>
      <div class="summary-line">➡️ Prochaine présence : ${nextGroup.date}</div>
      <div class="summary-line">🎓 ${nextGroup.pairs.length} stagiaire${nextGroup.pairs.length>1?"s":""} prévu${nextGroup.pairs.length>1?"s":""}</div>
    `;
    return;
  }

  box.innerHTML = `
    <div class="summary-title">📍 Aujourd’hui</div>
    <div class="summary-big">Aucun stagiaire prévu</div>
    <div class="summary-line">✅ Rien à préparer pour le moment</div>
  `;
}

function render(data, updatedAt){
  const results = document.getElementById("results");
  const status = document.getElementById("status");

  if(!data || data.length === 0){
    status.textContent = "Aucune donnée trouvée.";
    results.innerHTML = `<div class="empty">Aucun stagiaire prévu.</div>`;
    renderSummary([]);
    return;
  }

  const groups = groupByDate(data);

  status.textContent = updatedAt
    ? "Dernière mise à jour : " + new Date(updatedAt).toLocaleString("fr-FR")
    : "Données chargées.";

  renderSummary(groups);

  results.innerHTML = groups.map(group => {
    const cards = group.pairs.map(pair => {
      const refMissing = missing(pair.agent_nom);
      const gheMissing = missing(pair.agent_ghe);
      const phoneMissing = missing(pair.agent_telephone);

      return `
        <article class="pair-card">
          <div class="pair-title">Binôme du jour</div>

          <div class="zone">
            <div class="name">🎓 ${clean(pair.stagiaire_nom)}</div>
            <div class="info">
              <div class="info-label">Horaire stagiaire</div>
              <div class="info-value">🕒 ${clean(pair.stagiaire_horaire)}</div>
            </div>
          </div>

          <div class="zone">
            <div class="agent-head">
              ${
                pair.agent_avatar
                ? `<img class="avatar" src="${pair.agent_avatar}" alt="${clean(pair.agent_nom)}">`
                : `<div class="avatar-placeholder">👤</div>`
              }
              <div class="name">🟢 ${clean(pair.agent_nom)}</div>
            </div>

            <div class="info">
              <div class="info-label">Horaire référent</div>
              <div class="info-value">🕒 ${clean(pair.agent_horaire)}</div>
            </div>

            <div class="info">
              <div class="info-label">GHE</div>
              <div class="info-value">🏥 ${clean(pair.agent_ghe)}</div>
            </div>

            <div class="info">
              <div class="info-label">Téléphone</div>
              <div class="info-value">☎️ ${clean(pair.agent_telephone)}</div>
            </div>

            <div class="badge ${refMissing || gheMissing || phoneMissing ? "warn" : ""}">
              ${refMissing || gheMissing || phoneMissing ? "⚠️ À vérifier" : "✅ Infos référent OK"}
            </div>
          </div>
        </article>
      `;
    }).join("");

    return `
      <section class="day-slide">
        <h2 class="day-title">📅 ${group.date}</h2>
        <div class="day-sub">${group.pairs.length} stagiaire${group.pairs.length>1?"s":""} prévu${group.pairs.length>1?"s":""}</div>
        ${cards}
      </section>
    `;
  }).join("");
}

function loadWithJsonp(){
  const callbackName = "stagiairesCallback_" + Date.now();

  window[callbackName] = function(payload){
    render(payload.resultats || [], payload.updatedAt);
    delete window[callbackName];
  };

  const script = document.createElement("script");
  script.src = API_URL + "?callback=" + callbackName;

  script.onerror = function(){
    document.getElementById("status").textContent = "Erreur : API inaccessible.";
    document.getElementById("results").innerHTML = `<div class="empty">Impossible de charger les données.</div>`;
  };

  document.body.appendChild(script);
}

loadWithJsonp();
</script>
