<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>GHE — Stagiaires</title>

<style>
*,*::before,*::after{box-sizing:border-box}

:root{
  --ink:#07183f;
  --ink-soft:#263653;

  --cream:#fff7dd;
  --card:#fffaf0;
  --card-soft:#fff6dc;

  --line:#132752;
  --line-soft:rgba(7,24,63,.18);

  --danger:#b42318;
  --danger-line:#c43a2f;
  --danger-bg:#fff1ed;

  --warning:#8a4b00;
  --warning-line:#d2a631;
  --warning-bg:#fff6d8;

  --ok:#166534;
  --ok-line:#2f8f4e;
  --ok-bg:#edf9f1;

  --muted:#6b7280;
  --shadow:0 6px 0 rgba(7,24,63,.14);

  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --display:Impact,"Arial Black",system-ui,sans-serif;
}

html,body{
  margin:0;
  min-height:100vh;
}

body{
  font-family:var(--font);
  background:var(--cream);
  color:var(--ink);
}

.page{
  width:min(1080px,100%);
  margin:auto;
  padding:calc(10px + env(safe-area-inset-top)) 8px calc(130px + env(safe-area-inset-bottom));
}

/* NAV */

.topbar{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.navbtn{
  min-height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:8px 14px;
  border:3px solid var(--line);
  border-radius:18px;
  background:var(--card);
  color:var(--ink);
  text-decoration:none;
  font-size:20px;
  font-weight:950;
  box-shadow:0 4px 0 rgba(7,24,63,.14);
}

/* HERO */

.hero{
  border:4px solid var(--line);
  border-radius:24px;
  overflow:hidden;
  background:var(--ink);
  box-shadow:var(--shadow);
  margin-bottom:12px;
}

.hero img{
  display:block;
  width:100%;
  height:clamp(118px,28vw,220px);
  object-fit:cover;
}

/* PILOTAGE */

.pilot{
  background:var(--card);
  border:4px solid var(--line);
  border-radius:22px;
  padding:12px;
  box-shadow:var(--shadow);
  margin-bottom:10px;
}

.pilot-main{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.pilot-title{
  font-weight:950;
  font-size:20px;
  line-height:1.1;
}

.pilot-sub{
  margin-top:3px;
  color:var(--ink-soft);
  font-size:14px;
  font-weight:850;
}

.pilot-badge{
  flex:0 0 auto;
  border-radius:999px;
  padding:8px 10px;
  font-weight:950;
  font-size:14px;
  border:2px solid transparent;
  white-space:nowrap;
}

.pilot.ok .pilot-badge{
  background:var(--ok-bg);
  color:var(--ok);
  border-color:#b7e0c5;
}

.pilot.warning .pilot-badge{
  background:var(--warning-bg);
  color:var(--warning);
  border-color:#ecd27f;
}

.pilot.danger .pilot-badge{
  background:var(--danger-bg);
  color:var(--danger);
  border-color:#efb1b1;
}

.pilot-line{
  margin-top:10px;
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.mini-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:30px;
  padding:6px 9px;
  border-radius:999px;
  background:var(--card-soft);
  border:2px solid var(--line-soft);
  font-size:14px;
  font-weight:900;
}

.mini-pill.danger{
  background:var(--danger-bg);
  color:var(--danger);
  border-color:#efb1b1;
}

.mini-pill.warning{
  background:var(--warning-bg);
  color:var(--warning);
  border-color:#ecd27f;
}

/* OUTILS */

.tools{
  display:grid;
  gap:8px;
  margin-bottom:14px;
}

.search{
  width:100%;
  min-height:46px;
  border:3px solid var(--line);
  border-radius:16px;
  padding:8px 12px;
  font-size:16px;
  font-weight:850;
  background:var(--card);
  color:var(--ink);
  outline:none;
  box-shadow:0 4px 0 rgba(7,24,63,.12);
}

.search::placeholder{
  color:rgba(7,24,63,.38);
}

.filters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:4px;
}

.filter-btn{
  flex:0 0 auto;
  border:3px solid var(--line);
  border-radius:999px;
  background:var(--card);
  color:var(--ink);
  padding:8px 11px;
  font-size:14px;
  font-weight:950;
  cursor:pointer;
  box-shadow:0 3px 0 rgba(7,24,63,.12);
}

.filter-btn.active{
  background:var(--ink);
  color:var(--cream);
}

/* TITRES */

.section-label{
  margin:18px 4px 8px;
  color:rgba(7,24,63,.62);
  text-transform:uppercase;
  font-size:13px;
  font-weight:950;
  letter-spacing:.6px;
}

.day-title{
  margin:24px 4px 10px;
  font-family:var(--display);
  font-size:clamp(34px,9vw,62px);
  line-height:.88;
  letter-spacing:-1px;
  text-transform:uppercase;
  text-shadow:0 3px 0 #f8d67d;
}

/* CARTE STAGIAIRE */

.stagiaire-card{
  background:var(--card);
  border:4px solid var(--line);
  border-radius:24px;
  padding:12px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}

.stagiaire-card.ok{border-color:var(--ok-line)}
.stagiaire-card.warning{border-color:var(--warning-line)}
.stagiaire-card.danger{border-color:var(--danger-line)}

.card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}

.card-title{
  font-family:var(--display);
  font-size:clamp(27px,7vw,42px);
  line-height:.92;
  letter-spacing:-.6px;
  text-transform:uppercase;
}

.card-meta{
  margin-top:4px;
  font-size:15px;
  font-weight:900;
  color:var(--ink-soft);
}

.status{
  border-radius:999px;
  padding:7px 10px;
  border:2px solid transparent;
  font-size:14px;
  font-weight:950;
  white-space:nowrap;
}

.status.ok{
  background:var(--ok-bg);
  color:var(--ok);
  border-color:#b7e0c5;
}

.status.warning{
  background:var(--warning-bg);
  color:var(--warning);
  border-color:#ecd27f;
}

.status.danger{
  background:var(--danger-bg);
  color:var(--danger);
  border-color:#efb1b1;
}

/* PERSONNES */

.people-box{
  display:grid;
  gap:8px;
  margin-bottom:10px;
}

.person{
  display:grid;
  grid-template-columns:68px minmax(0,1fr);
  gap:10px;
  align-items:center;
  min-width:0;
  background:var(--card-soft);
  border:2px solid rgba(7,24,63,.16);
  border-radius:18px;
  padding:8px;
}

.person.danger{
  background:#fff4f1;
  border-color:#e7a29d;
}

.person.warning{
  background:#fff8df;
  border-color:#e2c060;
}

.person.ok{
  border-color:rgba(47,143,78,.22);
}

.avatar{
  width:62px;
  height:62px;
  border-radius:16px;
  background:#eef3ff;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.avatar img{
  max-width:96%;
  max-height:96%;
  width:auto;
  height:auto;
  object-fit:contain;
  display:block;
}

.avatar .initials{
  width:50px;
  height:50px;
  border-radius:14px;
  border:3px solid var(--line);
  background:var(--card);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--display);
  font-size:19px;
}

.avatar.has-img .initials{
  display:none;
}

.role{
  display:block;
  margin-bottom:2px;
  color:rgba(7,24,63,.58);
  font-size:12px;
  font-weight:950;
  letter-spacing:.5px;
  text-transform:uppercase;
}

.name{
  display:block;
  font-size:clamp(22px,5.8vw,33px);
  line-height:1;
  font-weight:950;
  letter-spacing:-.7px;
  text-transform:uppercase;
  word-break:normal;
  overflow-wrap:normal;
  hyphens:none;
}

.person.danger .name{
  color:var(--danger);
}

.person.warning .name{
  color:#744000;
}

.arrow-line{
  display:flex;
  justify-content:center;
  align-items:center;
  height:26px;
  color:var(--ink);
  font-size:26px;
  line-height:1;
  font-weight:950;
}

/* CHIPS */

.summary-line{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:9px;
}

.chip{
  min-height:29px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 8px;
  border-radius:999px;
  border:2px solid rgba(7,24,63,.16);
  background:var(--card);
  color:var(--ink);
  font-size:14px;
  line-height:1.05;
  font-weight:900;
}

.chip a{
  color:#064ee4;
  font-weight:950;
}

.chip.warning{
  background:var(--warning-bg);
  color:var(--warning);
  border-color:#ecd27f;
}

.chip.danger{
  background:var(--danger-bg);
  color:var(--danger);
  border-color:#efb1b1;
}

.chip.ok{
  background:var(--ok-bg);
  color:var(--ok);
  border-color:#b7e0c5;
}

/* ALERTES */

.alerts{
  display:grid;
  gap:6px;
  margin-top:8px;
}

.alert{
  padding:8px 10px;
  border-radius:15px;
  border:2px solid transparent;
  font-size:14px;
  line-height:1.22;
  font-weight:850;
}

.alert.danger{
  background:var(--danger-bg);
  color:var(--danger);
  border-color:#efb1b1;
}

.alert.warning{
  background:var(--warning-bg);
  color:var(--warning);
  border-color:#ecd27f;
}

.source{
  margin-top:9px;
  color:rgba(7,24,63,.50);
  font-size:12px;
  font-weight:850;
}

/* ETATS */

.empty,.error,.loading{
  background:var(--card);
  border:4px solid var(--line);
  border-radius:20px;
  padding:14px;
  font-weight:900;
  box-shadow:var(--shadow);
}

.error{
  color:var(--danger);
}

/* AGENDA */

.agenda-box{
  margin:26px 0 4px;
  padding:13px;
  background:var(--card);
  border:4px solid var(--line);
  border-radius:24px;
  box-shadow:var(--shadow);
}

.agenda-title{
  margin:0 0 10px;
  font-family:var(--display);
  font-size:clamp(25px,7vw,44px);
  line-height:.92;
  text-align:center;
  text-transform:uppercase;
  letter-spacing:-.8px;
  text-shadow:0 3px 0 #f8d67d;
}

.agenda-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.agenda-btn{
  min-height:62px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  text-decoration:none;
  color:#fff4ce;
  border:4px solid #061738;
  border-radius:20px;
  font-family:var(--display);
  font-size:clamp(21px,5.5vw,34px);
  line-height:.95;
  text-transform:uppercase;
  box-shadow:0 6px 0 rgba(7,24,63,.32);
}

.agenda-btn.ios{
  background:linear-gradient(145deg,#3db9ff 0%,#0c6ed5 56%,#083c91 100%);
}

.agenda-btn.android{
  background:linear-gradient(145deg,#35d864 0%,#12873d 56%,#075324 100%);
}

/* DESKTOP */

@media(min-width:720px){
  .page{
    padding-left:14px;
    padding-right:14px;
  }

  .pilot,
  .stagiaire-card{
    padding:14px;
  }

  .people-box{
    grid-template-columns:1fr 38px 1fr;
    align-items:center;
  }

  .arrow-line{
    height:auto;
  }

  .person{
    grid-template-columns:76px minmax(0,1fr);
  }

  .avatar{
    width:70px;
    height:70px;
  }
}

@media(max-width:370px){
  .person{
    grid-template-columns:60px minmax(0,1fr);
  }

  .avatar{
    width:54px;
    height:54px;
    border-radius:14px;
  }

  .name{
    font-size:20px;
  }

  .chip{
    font-size:13px;
    padding:5px 7px;
  }
}
</style>
</head>

<body>
<main class="page">

  <div class="topbar">
    <a class="navbtn" href="index.html">← Accueil</a>
    <a class="navbtn" href="formations.html">Formations</a>
  </div>

  <section class="hero">
    <img
      src="Image/Bannière/Page stagiaire.PNG"
      alt="Stagiaires GHE"
      onerror="this.onerror=null;this.src='Image/Banni%C3%A8re/Page%20stagiaire.PNG';"
    >
  </section>

  <section id="pilot" class="pilot ok">
    <div class="pilot-main">
      <div>
        <div id="pilotTitle" class="pilot-title">Chargement du cockpit…</div>
        <div id="pilotSub" class="pilot-sub">Analyse des stagiaires à venir</div>
      </div>
      <div id="pilotBadge" class="pilot-badge">…</div>
    </div>

    <div class="pilot-line">
      <span id="pilotTotal" class="mini-pill">👶 0 stagiaire</span>
      <span id="pilotDanger" class="mini-pill danger">⛔ 0 bloquant</span>
      <span id="pilotWarning" class="mini-pill warning">⚠️ 0 à vérifier</span>
    </div>
  </section>

  <section class="tools">
    <input id="search" class="search" type="search" placeholder="Rechercher stagiaire, référent, GHE, téléphone…">

    <div class="filters">
      <button class="filter-btn active" data-filter="tous">Tous</button>
      <button class="filter-btn" data-filter="traiter">À traiter</button>
      <button class="filter-btn" data-filter="bloquants">Bloquants</button>
      <button class="filter-btn" data-filter="prets">Prêts</button>
      <button class="filter-btn" data-filter="M">Matin</button>
      <button class="filter-btn" data-filter="J">Journée</button>
      <button class="filter-btn" data-filter="J4">J4</button>
      <button class="filter-btn" data-filter="S">Soir</button>
      <button class="filter-btn" data-filter="N">Nuit</button>
    </div>
  </section>

  <div class="section-label">Planning stagiaires</div>

  <section id="content">
    <div class="loading">Chargement des stagiaires…</div>
  </section>

  <section class="agenda-box">
    <h2 class="agenda-title">Ajouter l’agenda stagiaires</h2>
    <div class="agenda-buttons">
      <a id="btnIos" class="agenda-btn ios" href="#"><span>🍎</span><span>iOS</span></a>
      <a id="btnAndroid" class="agenda-btn android" href="#"><span>🤖</span><span>Android</span></a>
    </div>
  </section>

</main>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzmelNrBU583V3CvOlle3cafAKEAZQ8NAX-peSN6D-yxFO3gX26SnVNUVd5xbwV3CUISg/exec";

const ICS_URL = "https://calendar.google.com/calendar/ical/2ced33be0e6a5c88fab9bae2ffdf3b56366970e4003b1718a7dabf4c0603eae6%40group.calendar.google.com/private-d3db5a97d6dbdd8ceeeaa375c8a460ef/basic.ics";

let ITEMS = [];
let CURRENT_FILTER = "tous";

document.getElementById("btnIos").href = ICS_URL.replace(/^https:\/\//i, "webcal://");
document.getElementById("btnAndroid").href = "https://calendar.google.com/calendar/render?cid=" + encodeURIComponent(ICS_URL);

document.getElementById("search").addEventListener("input", () => {
  render(filterItems());
});

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    CURRENT_FILTER = btn.dataset.filter;
    render(filterItems());
  });
});

loadJsonp("stagiaires");

function loadJsonp(type){
  const callbackName = "recevoirGhe_" + type + "_" + Date.now();
  const script = document.createElement("script");

  window[callbackName] = function(data){
    delete window[callbackName];
    script.remove();

    if (!data || !data.ok) {
      showError(data && data.erreur ? data.erreur : "Données invalides.");
      return;
    }

    ITEMS = data.items || [];
    updatePilot(ITEMS);
    render(filterItems());
  };

  script.onerror = function(){
    delete window[callbackName];
    script.remove();
    showError("Impossible de charger les données.");
  };

  script.src = WEB_APP_URL
    + "?mode=site_stagiaires_formations"
    + "&type=" + encodeURIComponent(type)
    + "&callback=" + encodeURIComponent(callbackName)
    + "&v=" + Date.now();

  document.body.appendChild(script);
}

/* FILTRES */

function filterItems(){
  const q = norm(document.getElementById("search").value);

  return ITEMS.filter(item => {
    const level = itemLevel(item);
    const issueCount = countItemIssues(item).total;

    if (CURRENT_FILTER === "traiter" && issueCount === 0) return false;
    if (CURRENT_FILTER === "bloquants" && level !== "danger") return false;
    if (CURRENT_FILTER === "prets" && issueCount > 0) return false;

    if (["M","J","J4","S","N"].includes(CURRENT_FILTER)) {
      if (!item.shift || item.shift.base !== CURRENT_FILTER) return false;
    }

    if (!q) return true;

    const stagiaire = item.stagiaire || {};
    const referent = item.referent || {};
    const shift = item.shift || {};
    const alertes = item.alertes || {};

    const txt = [
      item.titre,
      item.dateLabel,
      shift.label,
      shift.code,
      shift.horaire,
      stagiaire.nomPrenom,
      referent.nomComplet,
      referent.ghe,
      referent.telephone,
      (alertes.bloquantes || []).join(" "),
      (alertes.infos || []).join(" ")
    ].join(" ");

    return norm(txt).includes(q);
  });
}

/* PILOTAGE */

function updatePilot(items){
  const total = items.length;

  const totals = items.reduce((acc,item) => {
    const c = countItemIssues(item);
    acc.danger += c.danger;
    acc.warning += c.warning;
    acc.total += c.total;
    return acc;
  }, {danger:0, warning:0, total:0});

  const pilot = document.getElementById("pilot");
  const title = document.getElementById("pilotTitle");
  const sub = document.getElementById("pilotSub");
  const badge = document.getElementById("pilotBadge");

  pilot.classList.remove("ok","warning","danger");

  if (totals.danger > 0) {
    pilot.classList.add("danger");
    title.textContent = totals.total + " point" + plural(totals.total) + " à traiter";
    sub.textContent = totals.danger + " bloquant" + plural(totals.danger) + " · " + totals.warning + " à vérifier";
    badge.textContent = "⛔ Bloquant";
  } else if (totals.warning > 0) {
    pilot.classList.add("warning");
    title.textContent = totals.total + " point" + plural(totals.total) + " à vérifier";
    sub.textContent = "Aucun blocage, mais des infos à compléter";
    badge.textContent = "⚠️ À vérifier";
  } else {
    pilot.classList.add("ok");
    title.textContent = "Tout est prêt";
    sub.textContent = "Aucun point bloquant ni information manquante";
    badge.textContent = "✅ Prêt";
  }

  document.getElementById("pilotTotal").textContent = "👶 " + total + " stagiaire" + plural(total);
  document.getElementById("pilotDanger").textContent = "⛔ " + totals.danger + " bloquant" + plural(totals.danger);
  document.getElementById("pilotWarning").textContent = "⚠️ " + totals.warning + " à vérifier";
}

/* RENDU */

function render(items){
  const content = document.getElementById("content");

  if (!items.length) {
    content.innerHTML = `<div class="empty">Aucun stagiaire à afficher avec ce filtre.</div>`;
    return;
  }

  const groups = groupByDate(items);

  content.innerHTML = Object.keys(groups).map(dateKey => {
    const list = groups[dateKey];
    const label = list[0].dateLabel || dateKey;

    return `
      <div class="day-title">${esc(label)}</div>
      ${list.map(cardStagiaire).join("")}
    `;
  }).join("");
}

function cardStagiaire(item){
  const stagiaire = item.stagiaire || {};
  const referent = item.referent || {};
  const shift = item.shift || {};
  const source = item.source || {};

  const level = itemLevel(item);
  const issues = itemIssues(item);

  const shiftText = formatShift(shift);
  const horaire = shift.horaire || "horaire non connu";
  const referentName = referent.nomComplet || "Référent non renseigné";
  const stagiaireName = stagiaire.nomPrenom || "Stagiaire non renseigné";

  const telRaw = String(referent.telephone || "").trim();
  const telOk = hasUsefulValue(telRaw);
  const telHref = telRaw.replace(/[^\d+]/g, "");

  const gheOk = hasUsefulValue(referent.ghe);

  return `
    <article class="stagiaire-card ${esc(level)}">

      <div class="card-head">
        <div>
          <div class="card-title">${esc(stagiaireName)}</div>
          <div class="card-meta">Référent : ${esc(referentName)}</div>
        </div>
        <span class="status ${esc(level)}">${statusLabel(level)}</span>
      </div>

      <div class="people-box">
        <div class="person">
          ${avatarHtml(stagiaire.avatar)}
          <div>
            <span class="role">Stagiaire</span>
            <span class="name">${esc(stagiaireName)}</span>
          </div>
        </div>

        <div class="arrow-line">→</div>

        <div class="person ${esc(level)}">
          ${avatarHtml(referent.avatar)}
          <div>
            <span class="role">Référent</span>
            <span class="name">${esc(referentName)}</span>
          </div>
        </div>
      </div>

      <div class="summary-line">
        <span class="chip ${shiftKnown(shiftText) ? "" : "warning"}">${shiftDot(shift)} Shift : ${esc(shiftText)}</span>
        <span class="chip">🕒 ${esc(horaire)}</span>
        <span class="chip ${gheOk ? "" : "warning"}">GHE : ${esc(formatGhe(referent.ghe))}</span>
        <span class="chip ${telOk ? "" : "warning"}">
          📞 ${telOk ? `<a href="tel:${esc(telHref)}">${esc(telRaw)}</a>` : "non renseigné"}
        </span>
      </div>

      ${issueBlock(issues)}

      <div class="source">
        Source : ${esc(source.onglet || "DETAIL_STAGIAIRES")}${source.ongletSource ? " · " + esc(source.ongletSource) : ""}
      </div>
    </article>
  `;
}

function avatarHtml(avatar){
  avatar = avatar || {};
  const initials = esc(avatar.initiales || "?");
  const thumb = avatar.thumb || "";

  if (!thumb) {
    return `<div class="avatar"><div class="initials">${initials}</div></div>`;
  }

  return `
    <div class="avatar has-img">
      <img src="${esc(thumb)}" alt="" loading="lazy" onerror="this.parentElement.classList.remove('has-img');this.remove();">
      <div class="initials">${initials}</div>
    </div>
  `;
}

/* ALERTES */

function countItemIssues(item){
  const issues = itemIssues(item);

  return {
    danger: issues.danger.length,
    warning: issues.warning.length,
    total: issues.danger.length + issues.warning.length
  };
}

function itemLevel(item){
  const c = countItemIssues(item);

  if (c.danger > 0 || item.niveau === "danger") return "danger";
  if (c.warning > 0 || item.niveau === "warning") return "warning";
  return "ok";
}

function itemIssues(item){
  const referent = item.referent || {};
  const shift = item.shift || {};
  const alertes = item.alertes || {};

  const danger = [];
  const warning = [];

  (alertes.bloquantes || []).forEach(msg => {
    pushUnique(danger, simplifyAlert(msg, "danger"));
  });

  const missing = [];
  if (!hasUsefulValue(referent.ghe)) missing.push("GHE");
  if (!hasUsefulValue(referent.telephone)) missing.push("téléphone");

  if (missing.length) {
    warning.push("Référent : " + missingPhrase(missing));
  }

  (alertes.infos || []).forEach(msg => {
    const n = norm(msg);

    if (missing.length && (n.includes("ghe") || n.includes("telephone"))) return;

    pushUnique(warning, simplifyAlert(msg, "warning"));
  });

  const shiftText = formatShift(shift);
  if (!shiftKnown(shiftText)) {
    pushUnique(warning, "Shift à vérifier.");
  }

  if (item.niveau === "danger" && !danger.length) {
    danger.push("Point bloquant à vérifier.");
  }

  if (item.niveau === "warning" && !warning.length) {
    warning.push("Information à vérifier.");
  }

  return {danger, warning};
}

function issueBlock(issues){
  const danger = issues.danger || [];
  const warning = issues.warning || [];

  if (!danger.length && !warning.length) return "";

  return `
    <div class="alerts">
      ${danger.map(x => `<div class="alert danger">⛔ ${esc(x)}</div>`).join("")}
      ${warning.map(x => `<div class="alert warning">⚠️ ${esc(x)}</div>`).join("")}
    </div>
  `;
}

function simplifyAlert(message, type){
  let s = String(message || "").trim();

  s = s.replace(/Référent prévu sur un code non travaillé\s*:\s*/i, "Code non travaillé : ");
  s = s.replace(/Code shift non reconnu\s*:\s*/i, "Code shift non reconnu : ");
  s = s.replace(/Téléphone référent manquant\.?/i, "Téléphone référent manquant.");
  s = s.replace(/GHE référent manquant\.?/i, "GHE référent manquant.");

  return s.trim();
}

function missingPhrase(parts){
  if (parts.length === 1) return parts[0] + " manquant.";
  if (parts.length === 2) return parts[0] + " et " + parts[1] + " manquants.";

  const last = parts.pop();
  return parts.join(", ") + " et " + last + " manquants.";
}

function pushUnique(list, message){
  const n = norm(message);
  if (!list.some(x => norm(x) === n)) list.push(message);
}

/* FORMATAGE */

function statusLabel(level){
  if (level === "danger") return "⛔ Bloquant";
  if (level === "warning") return "⚠️ À vérifier";
  return "✅ Prêt";
}

function formatGhe(value){
  const raw = String(value || "").trim();

  if (!hasUsefulValue(raw)) return "non renseigné";
  if (/^ghe\b/i.test(raw)) return raw.replace(/^ghe\s+ghe\s+/i, "GHE ");

  return "GHE " + raw;
}

function formatShift(shift){
  shift = shift || {};

  const label = cleanShiftText(shift.label);
  const code = cleanShiftText(shift.code);

  if (label && code) return label + " · " + code;
  if (label) return label;
  if (code) return code;

  return "inconnu";
}

function cleanShiftText(value){
  return String(value || "")
    .replace(/[🔵🟢🟡🟠⚪️⚪✅⛔⚠️]/g,"")
    .replace(/\s+/g," ")
    .trim();
}

function shiftKnown(text){
  const n = norm(text);
  return !!n && !n.includes("non connu") && !n.includes("inconnu") && !n.includes("non renseigne");
}

function shiftDot(shift){
  const text = norm([
    shift && shift.label,
    shift && shift.code,
    shift && shift.base
  ].join(" "));

  if (text.includes("matin") || text === "m" || text.includes(" m ")) return "🔵";
  if (text.includes("journee") || text === "j" || text.includes(" j ")) return "🟢";
  if (text.includes("soir") || text === "s" || text.includes(" s ")) return "🟡";
  if (text.includes("j4")) return "🟠";
  if (text.includes("nuit") || text === "n" || text.includes(" n ")) return "⚫";

  return "⚪";
}

function hasUsefulValue(value){
  const n = norm(value);

  if (!n) return false;
  if (n === "non renseigne") return false;
  if (n === "non renseignee") return false;
  if (n.includes("non renseigne")) return false;
  if (n === "nr") return false;
  if (n === "-") return false;

  return true;
}

/* OUTILS */

function groupByDate(items){
  return items.reduce((acc,item) => {
    const key = item.dateKey || "sans-date";
    if (!acc[key]) acc[key] = [];
    acc[key].push(item);
    return acc;
  }, {});
}

function showError(message){
  document.getElementById("content").innerHTML = `<div class="error">Problème : ${esc(message)}</div>`;
}

function plural(number){
  return Number(number) > 1 ? "s" : "";
}

function esc(value){
  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function norm(value){
  return String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .trim();
}
