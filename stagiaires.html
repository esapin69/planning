<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace stagiaires</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4efe4;
  color:#171717;
}

.page{
  max-width:760px;
  margin:auto;
  padding:14px;
}

.hero{
  width:100%;
  display:block;
  border:4px solid #171717;
  border-radius:26px;
  box-shadow:8px 8px 0 #171717;
  margin-bottom:22px;
}

.intro{
  background:#fffaf0;
  border:4px solid #171717;
  border-radius:24px;
  padding:18px;
  box-shadow:7px 7px 0 #171717;
  margin-bottom:24px;
}

h1{
  margin:0 0 10px;
  font-size:34px;
  line-height:1;
  text-transform:uppercase;
}

.intro p{
  margin:0;
  font-size:17px;
  font-weight:800;
}

.status{
  text-align:center;
  font-weight:900;
  color:#777;
  margin:26px 0;
}

.day-block{
  background:#fffaf0;
  border:4px solid #171717;
  border-radius:26px;
  padding:16px;
  margin-bottom:28px;
  box-shadow:7px 7px 0 #171717;
}

.day-title{
  font-size:27px;
  font-weight:900;
  color:#102f68;
  margin:0 0 16px;
}

.inner-card{
  position:relative;
  border:3px solid #171717;
  border-radius:22px;
  padding:16px 14px 16px 22px;
  margin-bottom:16px;
  background:#fffdf7;
  overflow:hidden;
}

.inner-card:last-child{margin-bottom:0}

.inner-card.stagiaire::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:12px;
  background:#f5a000;
}

.inner-card.agent::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:12px;
  background:#20c765;
}

.card-title{
  font-size:23px;
  font-weight:900;
  text-transform:uppercase;
  border-bottom:3px dashed #171717;
  padding-bottom:8px;
  margin-bottom:14px;
}

.person{
  padding:10px 0;
  border-bottom:2px dashed #c8c0b0;
}

.person:last-child{border-bottom:0}

.person-name{
  font-size:21px;
  font-weight:900;
  margin-bottom:10px;
}

.line{
  display:grid;
  grid-template-columns:105px 1fr;
  gap:10px;
  margin:7px 0;
  font-size:17px;
}

.label{
  color:#5f6b7c;
  font-weight:900;
  text-transform:uppercase;
  font-size:14px;
  letter-spacing:1px;
}

.value{
  font-weight:900;
}

.agent-head{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:12px;
}

.avatar{
  width:62px;
  height:62px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #171717;
  background:#eee;
}

.avatar-placeholder{
  width:62px;
  height:62px;
  border-radius:50%;
  border:3px solid #171717;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:900;
  background:#f1d58a;
}

.empty{
  text-align:center;
  font-size:18px;
  font-weight:900;
  padding:22px;
  border:3px dashed #171717;
  border-radius:18px;
  background:#fffdf7;
}

.back{
  display:block;
  width:max-content;
  margin:30px auto 10px;
  padding:13px 20px;
  border:4px solid #171717;
  border-radius:16px;
  background:#fffaf0;
  color:#171717;
  font-size:18px;
  font-weight:900;
  text-decoration:none;
  box-shadow:5px 5px 0 #171717;
}
</style>
</head>

<body>
<div class="page">

  <img class="hero" src="Image/Autre page/Photo_stagiaire.png" alt="Espace stagiaires">

  <section class="intro">
    <h1>Espace stagiaires</h1>
    <p>Retrouve les stagiaires prévus par date, avec l’agent affilié et les informations utiles du jour.</p>
  </section>

  <div id="status" class="status">API pas encore branchée.</div>

  <main id="results">
    <div class="empty">Aucune donnée affichée pour le moment.</div>
  </main>

  <a class="back" href="index.html">← Retour à l’accueil</a>

</div>

<script>
const API_URL = "";

function clean(value){
  return value && String(value).trim() !== "" ? String(value).trim() : "Non renseigné";
}

function groupByDate(data){
  const groups = {};

  data.forEach(item => {
    const date = clean(item.date);

    if(!groups[date]){
      groups[date] = {
        date,
        stagiaires: [],
        agents: {}
      };
    }

    groups[date].stagiaires.push({
      nom: item.stagiaire_nom,
      horaire: item.stagiaire_horaire
    });

    const agentKey = clean(item.agent_nom);

    groups[date].agents[agentKey] = {
      nom: item.agent_nom,
      horaire: item.agent_horaire,
      telephone: item.agent_telephone,
      avatar: item.agent_avatar
    };
  });

  return Object.values(groups);
}

function render(data, updatedAt){
  const results = document.getElementById("results");
  const status = document.getElementById("status");

  if(!data || data.length === 0){
    status.textContent = "Aucune donnée trouvée.";
    results.innerHTML = `<div class="empty">Aucun stagiaire prévu pour le moment.</div>`;
    return;
  }

  const groups = groupByDate(data);

  status.textContent = updatedAt
    ? "Dernière mise à jour : " + new Date(updatedAt).toLocaleString("fr-FR")
    : "Données chargées.";

  results.innerHTML = groups.map(group => {
    const stagiairesHtml = group.stagiaires.map(stagiaire => `
      <div class="person">
        <div class="person-name">🎓 ${clean(stagiaire.nom)}</div>
        <div class="line">
          <div class="label">Horaire</div>
          <div class="value">${clean(stagiaire.horaire)}</div>
        </div>
      </div>
    `).join("");

    const agentsHtml = Object.values(group.agents).map(agent => `
      <div class="person">
        <div class="agent-head">
          ${
            agent.avatar
            ? `<img class="avatar" src="${agent.avatar}" alt="${clean(agent.nom)}">`
            : `<div class="avatar-placeholder">👤</div>`
          }
          <div class="person-name">${clean(agent.nom)}</div>
        </div>

        <div class="line">
          <div class="label">Horaire</div>
          <div class="value">${clean(agent.horaire)}</div>
        </div>

        <div class="line">
          <div class="label">Téléphone</div>
          <div class="value">${clean(agent.telephone)}</div>
        </div>
      </div>
    `).join("");

    return `
      <section class="day-block">
        <h2 class="day-title">📅 ${group.date}</h2>

        <div class="inner-card stagiaire">
          <div class="card-title">Stagiaire(s)</div>
          ${stagiairesHtml}
        </div>

        <div class="inner-card agent">
          <div class="card-title">Agent affilié</div>
          ${agentsHtml}
        </div>
      </section>
    `;
  }).join("");
}

function loadWithJsonp(){
  if(!API_URL){
    return;
  }

  const callbackName = "stagiairesCallback_" + Date.now();

  window[callbackName] = function(payload){
    const data = payload.resultats || [];
    render(data, payload.updatedAt);
    delete window[callbackName];
  };

  const script = document.createElement("script");
  script.src = API_URL + (API_URL.includes("?") ? "&" : "?") + "callback=" + callbackName;
  script.onerror = function(){
    document.getElementById("status").textContent = "Erreur : API inaccessible.";
  };

  document.body.appendChild(script);
}

loadWithJsonp();
</script>

</body>
</html>
