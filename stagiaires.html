<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>GHE — Stagiaires</title>

<style>
*,*::before,*::after{box-sizing:border-box}

:root{
  --ink:#07183f;
  --paper:#fff7dd;
  --cream:#fff9e8;
  --danger:#b42318;
  --warning:#b7791f;
  --ok:#166534;
}

html,body{
  margin:0;
  min-height:100vh;
}

body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#fff7dd;
  color:var(--ink);
}

.page{
  width:min(980px,100%);
  margin:auto;
  padding:12px 10px 34px;
}

.topbar{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.navbtn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:44px;
  padding:9px 13px;
  border:3px solid var(--ink);
  border-radius:16px;
  background:#fff9e8;
  color:var(--ink);
  text-decoration:none;
  font-weight:1000;
  box-shadow:0 4px 0 rgba(7,24,63,.18);
}

.hero{
  background:linear-gradient(135deg,#07183f 0%,#123c7c 58%,#020817 100%);
  color:#fff7dd;
  border:5px solid var(--ink);
  border-radius:30px;
  padding:22px 18px;
  box-shadow:0 10px 0 rgba(7,24,63,.22);
  margin-bottom:14px;
}

.badge{
  display:inline-flex;
  padding:7px 13px;
  margin-bottom:13px;
  border-radius:999px;
  background:rgba(255,255,255,.13);
  border:2px solid rgba(255,255,255,.22);
  font-weight:1000;
}

h1{
  margin:0;
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:clamp(46px,11vw,92px);
  line-height:.86;
  text-transform:uppercase;
  text-shadow:0 4px 0 rgba(211,162,75,.35);
}

.subtitle{
  margin:12px 0 0;
  font-weight:900;
  color:rgba(255,247,221,.9);
}

.period{
  margin-top:10px;
  display:inline-flex;
  padding:8px 12px;
  border-radius:999px;
  background:#fff9e8;
  color:#07183f;
  font-weight:1000;
  font-size:14px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin:14px 0;
}

.stat{
  background:#fff9e8;
  border:4px solid var(--ink);
  border-radius:20px;
  padding:12px 10px;
  font-weight:1000;
  box-shadow:0 5px 0 rgba(7,24,63,.16);
}

.stat strong{
  display:block;
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:34px;
  line-height:1;
}

.tools{
  display:grid;
  gap:10px;
  margin:14px 0 18px;
}

.search{
  width:100%;
  min-height:48px;
  border:4px solid var(--ink);
  border-radius:18px;
  padding:10px 13px;
  font-size:17px;
  font-weight:900;
  color:var(--ink);
  background:#fff9e8;
  outline:none;
}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.filter-btn{
  border:3px solid var(--ink);
  border-radius:999px;
  background:#fff9e8;
  color:var(--ink);
  padding:9px 12px;
  font-weight:1000;
  cursor:pointer;
  box-shadow:0 4px 0 rgba(7,24,63,.16);
}

.filter-btn.active{
  background:#07183f;
  color:#fff7dd;
}

.result-separator{
  margin:22px 4px 12px;
  display:flex;
  align-items:center;
  gap:10px;
}

.result-separator::before,
.result-separator::after{
  content:"";
  height:4px;
  flex:1;
  background:#07183f;
  border-radius:99px;
  opacity:.25;
}

.result-separator span{
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:clamp(28px,6vw,46px);
  text-transform:uppercase;
  text-shadow:0 3px 0 #f8d67d;
}

.day-title{
  margin:24px 4px 11px;
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:clamp(30px,7vw,52px);
  line-height:.9;
  text-transform:uppercase;
  text-shadow:0 3px 0 #f8d67d;
}

.card{
  background:#fff9e8;
  border:4px solid var(--ink);
  border-radius:24px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 7px 0 rgba(7,24,63,.17);
}

.card.danger{border-color:var(--danger)}
.card.warning{border-color:var(--warning)}
.card.ok{border-color:var(--ok)}

.card-head{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:12px;
  align-items:center;
  margin-bottom:12px;
}

.avatar-line{
  display:flex;
  align-items:center;
  gap:8px;
}

.avatar{
  width:78px;
  height:78px;
  border:0;
  border-radius:0;
  background:transparent;
  overflow:visible;
  position:relative;
  flex:0 0 auto;
  box-shadow:none;
  display:flex;
  align-items:center;
  justify-content:center;
}

.avatar img{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  object-fit:contain;
  display:block;
}

.avatar .initials{
  width:58px;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:22px;
  border:3px solid #07183f;
  border-radius:16px;
  background:#fff7dd;
  box-shadow:0 4px 0 rgba(7,24,63,.18);
}

.avatar.has-img .initials{
  display:none;
}
.arrow{
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:28px;
}

.card-title{
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:clamp(27px,6vw,44px);
  line-height:.95;
  text-transform:uppercase;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.info{
  background:#fff7dd;
  border:2px solid rgba(7,24,63,.22);
  border-radius:16px;
  padding:10px;
  font-weight:900;
}

.info span{
  display:block;
  opacity:.62;
  font-size:12px;
  text-transform:uppercase;
  margin-bottom:3px;
}

.alert{
  margin-top:10px;
  padding:10px;
  border-radius:16px;
  font-weight:900;
}

.alert.danger{
  background:#fff1ed;
  color:var(--danger);
}

.alert.warning{
  background:#fff7db;
  color:#8a4b00;
}

.source{
  margin-top:10px;
  font-size:12px;
  opacity:.7;
  font-weight:800;
}

.agenda-box{
  margin:28px 0 4px;
  padding:16px 12px;
  background:#fff9e8;
  border:5px solid var(--ink);
  border-radius:26px;
  box-shadow:0 8px 0 rgba(7,24,63,.17);
}

.agenda-title{
  margin:0 0 12px;
  text-align:center;
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:clamp(27px,6.3vw,48px);
  line-height:.9;
  text-transform:uppercase;
  text-shadow:0 3px 0 #f8d67d;
}

.agenda-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.agenda-btn{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:3px;
  text-decoration:none;
  color:#fff4ce;
  border:5px solid #061738;
  border-radius:22px;
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:clamp(22px,5vw,36px);
  text-transform:uppercase;
  box-shadow:0 8px 0 rgba(7,24,63,.35);
}

.agenda-btn.ios{
  background:linear-gradient(145deg,#3db9ff 0%,#0c6ed5 56%,#083c91 100%);
}

.agenda-btn.android{
  background:linear-gradient(145deg,#35d864 0%,#12873d 56%,#075324 100%);
}

.loading,.empty,.error{
  background:#fff9e8;
  border:4px solid var(--ink);
  border-radius:22px;
  padding:16px;
  font-weight:1000;
  box-shadow:0 6px 0 rgba(7,24,63,.16);
}

.error{color:var(--danger)}

@media(max-width:680px){
  .page{padding:10px 8px 28px}
  .hero{border-radius:24px;border-width:4px;padding:18px 14px}
  .stats{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .card{border-width:3px;border-radius:21px}
  .card-head{grid-template-columns:1fr}
  .agenda-box{border-width:4px}
}
</style>
</head>

<body>
<main class="page">

  <div class="topbar">
    <a class="navbtn" href="index.html">← Accueil</a>
    <a class="navbtn" href="formations.html">Formations</a>
  </div>

  <section class="hero">
    <div class="badge">Référents & stagiaires</div>
    <h1>Stagiaires</h1>
    <p class="subtitle">Vue détaillée du planning stagiaires GHE</p>
    <div id="period" class="period">Chargement…</div>
  </section>

  <section class="stats">
    <div class="stat"><strong id="statTotal">0</strong>Total</div>
    <div class="stat"><strong id="statAlertes">0</strong>Alertes</div>
    <div class="stat"><strong id="statOk">0</strong>OK</div>
  </section>

  <section class="tools">
    <input id="search" class="search" type="search" placeholder="Rechercher un stagiaire, référent, GHE…">

    <div class="filters">
      <button class="filter-btn active" data-filter="tous">Tous</button>
      <button class="filter-btn" data-filter="alertes">Alertes</button>
      <button class="filter-btn" data-filter="M">Matin</button>
      <button class="filter-btn" data-filter="J">Journée</button>
      <button class="filter-btn" data-filter="J4">J4</button>
      <button class="filter-btn" data-filter="S">Soir</button>
      <button class="filter-btn" data-filter="N">Nuit</button>
    </div>
  </section>

  <div class="result-separator"><span>Résultats</span></div>

  <section id="content">
    <div class="loading">Chargement des stagiaires…</div>
  </section>

  <section class="agenda-box">
    <h2 class="agenda-title">Ajouter l’agenda stagiaires</h2>
    <div class="agenda-buttons">
      <a id="btnIos" class="agenda-btn ios" href="#"><span>🍎</span><span>iOS</span></a>
      <a id="btnAndroid" class="agenda-btn android" href="#"><span>🤖</span><span>Android</span></a>
    </div>
  </section>

</main>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzmelNrBU583V3CvOlle3cafAKEAZQ8NAX-peSN6D-yxFO3gX26SnVNUVd5xbwV3CUISg/exec";

const ICS_URL = "https://calendar.google.com/calendar/ical/2ced33be0e6a5c88fab9bae2ffdf3b56366970e4003b1718a7dabf4c0603eae6%40group.calendar.google.com/private-d3db5a97d6dbdd8ceeeaa375c8a460ef/basic.ics";

let ITEMS = [];
let CURRENT_FILTER = "tous";

document.getElementById("btnIos").href = ICS_URL.replace(/^https:\/\//i, "webcal://");
document.getElementById("btnAndroid").href = "https://calendar.google.com/calendar/render?cid=" + encodeURIComponent(ICS_URL);

document.getElementById("search").addEventListener("input", () => render(filterItems()));

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    CURRENT_FILTER = btn.dataset.filter;
    render(filterItems());
  });
});

loadJsonp("stagiaires");

function loadJsonp(type){
  const callbackName = "recevoirGhe_" + type + "_" + Date.now();
  const script = document.createElement("script");

  window[callbackName] = function(data){
    delete window[callbackName];
    script.remove();

    if (!data || !data.ok) {
      showError(data && data.erreur ? data.erreur : "Données invalides.");
      return;
    }

    ITEMS = data.items || [];
    document.getElementById("period").textContent = data.meta && data.meta.periodeLabel ? data.meta.periodeLabel : "";
    updateStats(ITEMS);
    render(filterItems());
  };

  script.onerror = function(){
    delete window[callbackName];
    script.remove();
    showError("Impossible de charger les données.");
  };

  script.src = WEB_APP_URL
    + "?mode=site_stagiaires_formations"
    + "&type=" + encodeURIComponent(type)
    + "&callback=" + encodeURIComponent(callbackName)
    + "&v=" + Date.now();

  document.body.appendChild(script);
}

function filterItems(){
  const q = norm(document.getElementById("search").value);

  return ITEMS.filter(item => {
    if (CURRENT_FILTER === "alertes" && item.niveau === "ok") return false;
    if (["M","J","J4","S","N"].includes(CURRENT_FILTER)) {
      if (!item.shift || item.shift.base !== CURRENT_FILTER) return false;
    }

    if (!q) return true;

    const txt = [
      item.titre,
      item.dateLabel,
      item.shift && item.shift.label,
      item.shift && item.shift.code,
      item.stagiaire && item.stagiaire.nomPrenom,
      item.referent && item.referent.nomComplet,
      item.referent && item.referent.ghe,
      item.referent && item.referent.telephone,
      item.alertes && item.alertes.bloquantes && item.alertes.bloquantes.join(" "),
      item.alertes && item.alertes.infos && item.alertes.infos.join(" ")
    ].join(" ");

    return norm(txt).includes(q);
  });
}

function updateStats(items){
  const total = items.length;
  const alertes = items.filter(x => x.niveau === "danger" || x.niveau === "warning").length;
  const ok = items.filter(x => x.niveau === "ok").length;

  document.getElementById("statTotal").textContent = total;
  document.getElementById("statAlertes").textContent = alertes;
  document.getElementById("statOk").textContent = ok;
}

function render(items){
  const content = document.getElementById("content");

  if (!items.length) {
    content.innerHTML = `<div class="empty">Aucun stagiaire prévu à partir d’aujourd’hui.</div>`;
    return;
  }

  const groups = groupByDate(items);

  content.innerHTML = Object.keys(groups).map(dateKey => {
    const list = groups[dateKey];
    const label = list[0].dateLabel || dateKey;

    return `
      <div class="day-title">${esc(label)}</div>
      ${list.map(cardStagiaire).join("")}
    `;
  }).join("");
}

function cardStagiaire(item){
  const bloquantes = (item.alertes && item.alertes.bloquantes) || [];
  const infos = (item.alertes && item.alertes.infos) || [];
  const referent = item.referent || {};
  const stagiaire = item.stagiaire || {};
  const shift = item.shift || {};
  const source = item.source || {};

  return `
    <article class="card ${esc(item.niveau || "ok")}">
      <div class="card-head">
        <div class="avatar-line">
          ${avatarHtml(stagiaire.avatar || {initiales:stagiaire.initiales})}
          <div class="arrow">→</div>
          ${avatarHtml(referent.avatar || {initiales:referent.prenomCourt})}
        </div>

        <div class="card-title">${esc(item.titre || "")}</div>
      </div>

      <div class="grid">
        <div class="info">
          <span>Stagiaire</span>
          ${esc(stagiaire.nomPrenom || "")}
        </div>

        <div class="info">
          <span>Référent</span>
          ${esc(referent.nomComplet || "")}
        </div>

        <div class="info">
          <span>Shift référent</span>
          ${esc((shift.pastille || "") + " " + (shift.label || ""))} · ${esc(shift.code || "")}
        </div>

        <div class="info">
          <span>Horaire théorique</span>
          ${esc(shift.horaire || "non connu")}
        </div>

        <div class="info">
          <span>GHE</span>
          ${esc(referent.ghe || "non renseigné")}
        </div>

        <div class="info">
          <span>Téléphone</span>
          ${referent.telephone ? `<a href="tel:${esc(referent.telephone)}">${esc(referent.telephone)}</a>` : "non renseigné"}
        </div>
      </div>

      ${bloquantes.length ? alertBlock("danger", "⛔️ Alertes bloquantes", bloquantes) : ""}
      ${infos.length ? alertBlock("warning", "⚠️ À vérifier", infos) : ""}

      <div class="source">
        Source : ${esc(source.onglet || "DETAIL_STAGIAIRES")} · ${esc(source.ongletSource || "")}
      </div>
    </article>
  `;
}

function avatarHtml(avatar){
  avatar = avatar || {};
  const initials = esc(avatar.initiales || "?");
  const thumb = avatar.thumb || "";

  if (!thumb) {
    return `<div class="avatar"><div class="initials">${initials}</div></div>`;
  }

  return `
    <div class="avatar has-img">
      <img src="${esc(thumb)}" alt="" loading="lazy" onerror="this.parentElement.classList.remove('has-img');this.remove();">
      <div class="initials">${initials}</div>
    </div>
  `;
}

function alertBlock(type, title, list){
  return `
    <div class="alert ${type}">
      <div>${esc(title)}</div>
      <ul>${list.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    </div>
  `;
}

function groupByDate(items){
  return items.reduce((acc,item) => {
    const key = item.dateKey || "sans-date";
    if (!acc[key]) acc[key] = [];
    acc[key].push(item);
    return acc;
  }, {});
}

function showError(message){
  document.getElementById("content").innerHTML = `<div class="error">Problème : ${esc(message)}</div>`;
}

function esc(value){
  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function norm(value){
  return String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .trim();
}
</script>
</body>
</html>
