<!DOCTYPE html>
<html lang="fr">
<head>
  <base target="_top">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Planning stagiaires</title>

  <style>
    :root {
      --navy: #102b63;
      --navy-dark: #0b2558;
      --blue: #0f8ba7;
      --sky: #dfeeff;
      --card: #ffffff;
      --muted: #6c778d;
      --green-bg: #ecfff5;
      --green: #30c95f;
      --orange: #f5a623;
      --cream: #fff8df;
      --danger: #d93535;
      --danger-bg: #fff0f0;
      --shadow: rgba(16, 43, 99, 0.20);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(180deg, #eef9ff 0%, #dcecff 55%, #fffdf1 100%);
      color: #10172a;
    }

    .page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 18px 20px 42px;
    }

    .hero {
      border: 7px solid var(--navy);
      border-radius: 38px;
      overflow: hidden;
      background: white;
      box-shadow: 0 18px 0 rgba(16, 43, 99, 0.20);
      margin: 8px 0 34px;
    }

    .hero img {
      width: 100%;
      display: block;
    }

    .top-label {
      text-align: center;
      color: #3a97b3;
      font-weight: 900;
      font-size: clamp(22px, 4vw, 30px);
      letter-spacing: 7px;
      margin: 0;
    }

    h1 {
      text-align: center;
      color: var(--navy);
      font-size: clamp(48px, 10vw, 76px);
      line-height: 0.95;
      margin: 12px 0 22px;
      font-weight: 1000;
      letter-spacing: -2px;
      text-shadow: 0 7px 0 #ffe9a3;
    }

    .status {
      width: fit-content;
      margin: 0 auto 44px;
      padding: 16px 32px;
      border-radius: 999px;
      background: #fff8df;
      color: #713915;
      border: 5px solid var(--orange);
      font-weight: 1000;
      font-size: 28px;
    }

    .section-title {
      color: var(--navy);
      font-size: clamp(34px, 7vw, 50px);
      font-weight: 1000;
      text-transform: uppercase;
      margin: 34px 0 22px;
      letter-spacing: -1px;
    }

    .day-card {
      background: white;
      border: 6px solid var(--navy);
      border-radius: 38px;
      box-shadow: 0 22px 0 rgba(16, 43, 99, 0.18);
      overflow: hidden;
      margin: 0 0 34px;
    }

    .day-header {
      padding: 24px 30px;
      background: linear-gradient(120deg, #0d3d7a, #0b9ab0);
      color: white;
    }

    .day-title {
      font-size: clamp(34px, 7vw, 50px);
      line-height: 1;
      font-weight: 1000;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .day-count {
      margin-top: 10px;
      font-size: 24px;
      font-weight: 900;
      opacity: 0.95;
    }

    .day-body {
      padding: 28px 30px 34px;
    }

    .assignment-card {
      position: relative;
      background: #fbfdff;
      border: 4px solid #e3e8f0;
      border-left: 18px solid var(--orange);
      border-radius: 34px;
      padding: 28px 28px 30px;
      margin: 0 0 28px;
      box-shadow: 0 12px 22px rgba(16, 43, 99, 0.06);
    }

    .assignment-card:last-child {
      margin-bottom: 0;
    }

    .assignment-card.has-alert {
      border-left-color: var(--danger);
    }

    .date-line {
      color: var(--navy);
      font-size: clamp(32px, 6vw, 44px);
      font-weight: 1000;
      line-height: 1.05;
      margin: 0 0 22px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .label {
      color: var(--muted);
      font-size: clamp(20px, 4vw, 28px);
      letter-spacing: 5px;
      font-weight: 1000;
      text-transform: uppercase;
      margin: 20px 0 4px;
    }

    .value {
      color: #111827;
      font-size: clamp(26px, 5.3vw, 36px);
      font-weight: 1000;
      line-height: 1.12;
      margin: 0;
    }

    .small-value {
      color: #111827;
      font-size: clamp(22px, 4.6vw, 31px);
      font-weight: 1000;
      line-height: 1.16;
      margin: 0;
    }

    .agent-box {
      margin-top: 28px;
      padding: 28px 28px;
      background: var(--green-bg);
      border-radius: 30px;
      border-left: 16px solid var(--green);
    }

    .agent-box.warning {
      background: var(--danger-bg);
      border-left-color: var(--danger);
    }

    .referent-box {
      margin-top: 22px;
      padding: 28px 28px;
      background: var(--green-bg);
      border-radius: 30px;
      border-left: 16px solid var(--green);
    }

    .referent-box.warning {
      background: var(--danger-bg);
      border-left-color: var(--danger);
    }

    .line {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin: 8px 0;
    }

    .emoji {
      flex: 0 0 auto;
      width: 36px;
      text-align: center;
      font-size: 28px;
      line-height: 1.05;
    }

    .line-text {
      flex: 1;
      min-width: 0;
    }

    .alert-list {
      margin-top: 22px;
      padding: 18px 20px;
      border-radius: 24px;
      background: var(--danger-bg);
      color: #7f1d1d;
      border: 3px solid #ffd1d1;
      font-size: 20px;
      font-weight: 850;
      line-height: 1.25;
    }

    .alert-list div + div {
      margin-top: 8px;
    }

    .empty {
      background: white;
      border-radius: 34px;
      padding: 34px;
      border: 5px solid #e5e7eb;
      color: var(--navy);
      font-weight: 1000;
      font-size: 28px;
      text-align: center;
      margin-bottom: 34px;
    }

    .home-btn {
      width: 100%;
      border: none;
      border-radius: 28px;
      background: var(--navy);
      color: white;
      font-size: clamp(26px, 5vw, 36px);
      font-weight: 1000;
      padding: 26px 20px;
      margin: 28px 0;
      cursor: pointer;
    }

    .footer {
      color: #65758f;
      text-align: center;
      font-size: 24px;
      font-weight: 900;
      margin: 22px 0 0;
    }

    .mini {
      font-size: 18px;
      font-weight: 800;
      color: #6b7280;
      margin-top: 6px;
      word-break: break-word;
    }

    .refresh-btn {
      display: block;
      margin: 10px auto 28px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-weight: 900;
      font-size: 18px;
      text-decoration: underline;
      cursor: pointer;
    }

    @media (max-width: 420px) {
      .page {
        padding-left: 16px;
        padding-right: 16px;
      }

      .day-body {
        padding: 24px 20px 28px;
      }

      .assignment-card {
        padding: 24px 18px 26px;
      }

      .agent-box,
      .referent-box {
        padding: 24px 18px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="hero">
      <img
        src="https://dummyimage.com/1400x360/ffffff/102b63&text=BIENVENUE+STAGIAIRE+!"
        alt="Bienvenue stagiaire"
      >
    </div>

    <p class="top-label">ACCUEIL STAGIAIRES</p>
    <h1>Fil des affectations</h1>

    <div id="status" class="status">Chargement…</div>

    <h2 class="section-title">Stagiaires à venir</h2>

    <main id="app"></main>

    <button class="home-btn" onclick="retourAccueil()">🏠 Retour accueil</button>

    <button class="refresh-btn" onclick="refreshManual()">Rafraîchir maintenant</button>

    <div id="footer" class="footer"></div>
  </div>

  <script>
    const DATA = <?!= DATA_JSON ?>;

    document.addEventListener('DOMContentLoaded', function () {
      render(DATA);
    });

    function render(data) {
      const app = document.getElementById('app');
      const status = document.getElementById('status');
      const footer = document.getElementById('footer');

      if (!data || !data.ok) {
        status.textContent = 'Cache absent';
        app.innerHTML = `
          <div class="empty">
            Cache non généré.<br>
            Lance <strong>refreshCacheNow</strong> dans Apps Script.
          </div>
        `;
        footer.textContent = '';
        return;
      }

      status.textContent = `${data.totalAffectations || 0} affectation(s)`;

      if (!data.dates || data.dates.length === 0) {
        app.innerHTML = `
          <div class="empty">
            Aucun stagiaire à venir.
          </div>
        `;
        footer.textContent = `Dernière mise à jour : ${escapeHtml(data.generatedAtLabel || '')}`;
        return;
      }

      app.innerHTML = data.dates.map(renderDay).join('');

      footer.textContent = `Dernière mise à jour : ${data.generatedAtLabel || ''}`;
    }

    function renderDay(day) {
      const count = day.affectations.length;
      const countLabel = count > 1 ? `${count} affectations prévues` : `1 affectation prévue`;

      return `
        <section class="day-card">
          <div class="day-header">
            <h3 class="day-title">📅 ${escapeHtml(day.dateLabel)}</h3>
            <div class="day-count">${escapeHtml(countLabel)}</div>
          </div>

          <div class="day-body">
            ${day.affectations.map(renderAssignment).join('')}
          </div>
        </section>
      `;
    }

    function renderAssignment(item) {
      const hasAlert = item.alertes && item.alertes.length > 0;

      const stagiaireWarning =
        !item.stagiairePlanning ||
        !item.stagiairePlanning.found ||
        item.stagiairePlanning.isRepos;

      const referentWarning =
        item.referent &&
        item.referent !== 'Non renseigné' &&
        (!item.referentPlanning ||
          !item.referentPlanning.found ||
          item.referentPlanning.isRepos);

      return `
        <article class="assignment-card ${hasAlert ? 'has-alert' : ''}">
          <h4 class="date-line">🎓 ${escapeHtml(item.stagiaire)}</h4>

          <div class="label">Formation</div>
          <p class="value">${escapeHtml(item.horaireFormation)}</p>

          <div class="label">Lieu / service formation</div>
          <p class="small-value">${escapeHtml(item.lieuFormation)}</p>

          <div class="agent-box ${stagiaireWarning ? 'warning' : ''}">
            <div class="label">Affectation agent ce jour</div>

            <div class="line">
              <div class="emoji">🕒</div>
              <div class="line-text">
                <p class="small-value">${escapeHtml(item.stagiairePlanning.horaire)}</p>
              </div>
            </div>

            <div class="line">
              <div class="emoji">🏥</div>
              <div class="line-text">
                <p class="small-value">${escapeHtml(item.stagiairePlanning.service)}</p>
              </div>
            </div>

            ${item.stagiairePlanning.source ? `
              <div class="mini">Source : ${escapeHtml(item.stagiairePlanning.source)}</div>
            ` : ''}
          </div>

          <div class="referent-box ${referentWarning ? 'warning' : ''}">
            <div class="label">Référent du jour</div>

            <div class="line">
              <div class="emoji">👨‍⚕️</div>
              <div class="line-text">
                <p class="value">${escapeHtml(item.referent)}</p>
              </div>
            </div>

            <div class="label">Horaire référent ce jour</div>

            <div class="line">
              <div class="emoji">🕒</div>
              <div class="line-text">
                <p class="small-value">${escapeHtml(item.referentPlanning.horaire)}</p>
              </div>
            </div>

            <div class="line">
              <div class="emoji">🏥</div>
              <div class="line-text">
                <p class="small-value">${escapeHtml(item.referentPlanning.service)}</p>
              </div>
            </div>

            <div class="label">Contact</div>

            <div class="line">
              <div class="emoji">🏷️</div>
              <div class="line-text">
                <p class="small-value">GHE : ${escapeHtml(item.ghe)}</p>
              </div>
            </div>

            <div class="line">
              <div class="emoji">📞</div>
              <div class="line-text">
                <p class="small-value">Téléphone : ${escapeHtml(item.telephone)}</p>
              </div>
            </div>

            ${item.referentPlanning.source ? `
              <div class="mini">Source : ${escapeHtml(item.referentPlanning.source)}</div>
            ` : ''}
          </div>

          ${hasAlert ? renderAlerts(item.alertes) : ''}
        </article>
      `;
    }

    function renderAlerts(alertes) {
      return `
        <div class="alert-list">
          ${alertes.map(a => `<div>⚠️ ${escapeHtml(a)}</div>`).join('')}
        </div>
      `;
    }

    function refreshManual() {
      const status = document.getElementById('status');
      status.textContent = 'Mise à jour…';

      google.script.run
        .withSuccessHandler(function () {
          window.location.reload();
        })
        .withFailureHandler(function (err) {
          status.textContent = 'Erreur mise à jour';
          alert(err && err.message ? err.message : err);
        })
        .refreshCacheNow();
    }

    function retourAccueil() {
      window.location.href = './';
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
