<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stagiaires GHE</title>

<style>
*,*::before,*::after{box-sizing:border-box}

:root{
  --ink:#07183f;
  --paper:#fff7dd;
  --weekend:#fff0dc;
  --stage-soft:#f2eaff;
  --referent-soft:#eaf3ff;
  --alert-soft:#fff0d7;
}

html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:Impact,"Arial Black",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 15% 0%,rgba(255,255,255,.95) 0 9%,transparent 31%),
    radial-gradient(circle at 88% 4%,rgba(255,218,116,.46) 0 9%,transparent 32%),
    repeating-linear-gradient(-6deg,rgba(7,24,63,.035) 0 1px,transparent 1px 13px),
    linear-gradient(180deg,#fff9e8 0%,#f5e8bf 57%,#ead9a5 100%);
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.17;
  background:
    repeating-linear-gradient(8deg,rgba(7,24,63,.05) 0 1px,transparent 1px 12px),
    repeating-linear-gradient(-9deg,rgba(178,116,26,.07) 0 1px,transparent 1px 17px);
  mix-blend-mode:multiply;
}

.page{
  width:min(860px,100%);
  margin:auto;
  padding:12px 10px 54px;
}

.back{
  position:relative;
  z-index:3;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:54px;
  margin-bottom:14px;
  padding:9px 10px;
  color:#fff4ce;
  text-decoration:none;
  text-align:center;
  text-transform:uppercase;
  border:5px solid #061738;
  border-radius:22px;
  background:
    radial-gradient(circle at 22% 16%,rgba(255,255,255,.22),transparent 28%),
    repeating-linear-gradient(-7deg,rgba(255,255,255,.07) 0 2px,transparent 2px 10px),
    linear-gradient(145deg,#777,#444,#222);
  box-shadow:0 7px 0 rgba(7,24,63,.35);
  font-size:clamp(20px,5vw,31px);
}

.header{
  margin:10px 0 14px;
  padding:14px 12px 16px;
  background:
    radial-gradient(circle at 12% 0%,rgba(255,255,255,.75),transparent 34%),
    linear-gradient(180deg,rgba(255,255,255,.44),transparent 48%),
    var(--paper);
  border:5px solid var(--ink);
  border-radius:30px 25px 33px 26px;
  box-shadow:
    0 10px 0 rgba(7,24,63,.18),
    0 14px 0 rgba(0,0,0,.10),
    inset 0 0 0 3px rgba(255,215,115,.38);
}

h1{
  margin:0 0 8px;
  text-transform:uppercase;
  font-size:clamp(31px,8vw,58px);
  line-height:.9;
  color:var(--ink);
  text-shadow:
    0 3px 0 #f8d67d,
    3px 5px 0 rgba(7,24,63,.10);
}

.sub{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:950;
  font-size:clamp(14px,3.6vw,19px);
  line-height:1.2;
}

.status{
  margin-top:16px;
  text-align:center;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:950;
  font-size:17px;
  line-height:1.3;
  padding:18px 10px;
  border:4px solid var(--ink);
  border-radius:24px;
  background:white;
}

.week-label{
  margin:22px 0 10px;
  padding:7px 12px 8px;
  border:4px dashed rgba(7,24,63,.32);
  border-radius:22px;
  background:rgba(255,255,255,.50);
  color:rgba(7,24,63,.88);
  text-align:center;
  text-transform:uppercase;
  font-size:clamp(22px,5.8vw,38px);
  line-height:.88;
}

.day-card{
  margin:12px 0;
  overflow:hidden;
  border:4px solid var(--ink);
  border-radius:24px;
  background:white;
  box-shadow:
    0 7px 0 rgba(7,24,63,.15),
    0 10px 0 rgba(0,0,0,.07);
}

.day-card.is-weekend{
  background:
    radial-gradient(circle at 12% 0%,rgba(255,255,255,.85),transparent 36%),
    linear-gradient(180deg,#fff9ed 0%,var(--weekend) 100%);
}

.day-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:9px 12px 8px;
  border-bottom:3px solid var(--ink);
  background:
    repeating-linear-gradient(-7deg,rgba(7,24,63,.035) 0 2px,transparent 2px 10px),
    linear-gradient(180deg,#fffdf5,#fff3c8);
}

.date-main{
  margin:0;
  text-transform:uppercase;
  font-size:clamp(25px,6.4vw,44px);
  line-height:.88;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.date-tag{
  flex:0 0 auto;
  padding:5px 9px 6px;
  border:3px solid rgba(7,24,63,.22);
  border-radius:14px;
  background:rgba(255,255,255,.62);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:950;
  font-size:11px;
  text-transform:uppercase;
  opacity:.82;
}

.event-list{display:grid}

.event-row{
  display:flex;
  align-items:flex-start;
  gap:9px;
  padding:11px 11px 8px;
  border-top:2px solid rgba(7,24,63,.12);
  background:white;
}

.event-row:first-child{border-top:0}
.event-row.kind-stage{background:linear-gradient(90deg,var(--stage-soft),#fff)}
.event-row.kind-referent{background:linear-gradient(90deg,var(--referent-soft),#fff)}
.event-row.kind-alert{background:linear-gradient(90deg,var(--alert-soft),#fff)}

.shift-dot{
  flex:0 0 auto;
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  border-radius:12px;
  background:#fff9e8;
  box-shadow:inset 0 0 0 3px rgba(7,24,63,.10);
}

.event-main{
  min-width:0;
  width:100%;
}

.shift-line{
  display:flex;
  align-items:center;
  gap:7px;
  width:100%;
  white-space:nowrap;
}

.shift-title{
  min-width:0;
  margin:0;
  text-transform:uppercase;
  font-size:clamp(24px,6.6vw,38px);
  line-height:.9;
  text-shadow:0 2px 0 rgba(211,162,75,.30);
  overflow:hidden;
  text-overflow:ellipsis;
}

.shift-sep{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:clamp(17px,4.4vw,26px);
  font-weight:950;
  opacity:.7;
}

.time{
  flex:0 0 auto;
  padding:6px 9px 7px;
  border-radius:14px;
  background:#07183f;
  color:#fff4ce;
  font-size:clamp(21px,5.6vw,34px);
  line-height:.9;
  box-shadow:0 4px 0 rgba(7,24,63,.16);
}

.detail{
  margin:6px 0 0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:900;
  font-size:13px;
  line-height:1.25;
  opacity:.82;
  white-space:normal;
}

.agenda-phone{
  margin-top:24px;
  padding:14px 10px 16px;
  border:5px solid var(--ink);
  border-radius:28px;
  background:#fff7dd;
  box-shadow:
    0 8px 0 rgba(7,24,63,.22),
    inset 0 0 0 3px rgba(255,215,115,.35);
}

.agenda-phone h2{
  margin:0 0 14px;
  text-align:center;
  text-transform:uppercase;
  font-size:clamp(24px,6.4vw,42px);
  line-height:.9;
  color:var(--ink);
  text-shadow:
    0 3px 0 #f8d67d,
    3px 5px 0 rgba(7,24,63,.10);
}

.bottom-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.action-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:70px;
  padding:9px 12px;
  border:4px solid var(--ink);
  border-radius:20px;
  color:#fff4ce;
  text-decoration:none;
  text-align:center;
  text-transform:uppercase;
  font-size:clamp(20px,5.4vw,34px);
  line-height:.9;
  box-shadow:
    0 7px 0 rgba(7,24,63,.28),
    inset 0 0 0 3px rgba(255,221,132,.25);
  text-shadow:0 3px 0 rgba(0,0,0,.38);
}

.action-apple{
  background:
    radial-gradient(circle at 22% 16%,rgba(255,255,255,.30),transparent 28%),
    repeating-linear-gradient(-7deg,rgba(255,255,255,.08) 0 2px,transparent 2px 10px),
    linear-gradient(145deg,#3db9ff 0%,#0c6ed5 58%,#083c91 100%);
}

.action-android{
  background:
    radial-gradient(circle at 22% 16%,rgba(255,255,255,.30),transparent 28%),
    repeating-linear-gradient(-7deg,rgba(255,255,255,.08) 0 2px,transparent 2px 10px),
    linear-gradient(145deg,#35d864 0%,#12873d 58%,#075324 100%);
}
</style>
</head>

<body>
<main class="page">
  <a class="back" href="index.html">← Retour accueil</a>

  <section class="header">
    <h1>Stagiaires</h1>
    <p class="sub">Aperçu dynamique des stagiaires à venir</p>
  </section>

  <section id="content" class="status">Chargement...</section>

  <section class="agenda-phone">
    <h2>Ajouter à mon agenda de mon téléphone</h2>
    <div class="bottom-actions" id="bottomActions"></div>
  </section>
</main>

<script>
const CONFIG_PAGE = {
  typeCollectif: "stagiaire",
  fallbackTypes: ["stagiaires", "stage", "stagiere"],
  emptyMessage: "Aucun stagiaire à afficher à partir d’aujourd’hui."
};

const PASSERELLE = "https://script.google.com/macros/s/AKfycbwrhifE-4wl-YvKOjJI8HZ_g_ota7tajTKLY3jvLKEF9AvSPjIbVpqcSkSRcl5OdWV9/exec";

const ICS_DIRECT = "https://calendar.google.com/calendar/ical/2ced33be0e6a5c88fab9bae2ffdf3b56366970e4003b1718a7dabf4c0603eae6%40group.calendar.google.com/private-d3db5a97d6dbdd8ceeeaa375c8a460ef/basic.ics";

const contentEl = document.getElementById("content");
const bottomActions = document.getElementById("bottomActions");

let fallbackIndex = -1;
let lastEvents = [];

function apiJsonpUrl(mode, extra){
  const url = new URL(PASSERELLE);
  url.searchParams.set("mode", mode);
  url.searchParams.set("callback", "recevoirEventsCollectifGhe");
  url.searchParams.set("t", Date.now());

  Object.keys(extra || {}).forEach(k => {
    url.searchParams.set(k, extra[k]);
  });

  return url.toString();
}

function webcalUrl(url){
  return url.replace(/^https:\/\//i, "webcal://");
}

function androidUrl(url){
  return "https://calendar.google.com/calendar/render?cid=" + encodeURIComponent(url);
}

function dateFromKey(key){
  const p = String(key || "").split("-");
  return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
}

function todayKey(){
  const d = new Date();
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2,"0") + "-" +
    String(d.getDate()).padStart(2,"0");
}

function formatDateMain(d){
  return d.toLocaleDateString("fr-FR", {
    weekday:"long",
    day:"numeric",
    month:"long"
  }).toUpperCase();
}

function getIsoWeekNumber(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

function formatWeekLabel(d){
  return "Semaine " + getIsoWeekNumber(d);
}

function toIsoLocal(d){
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2,"0") + "-" +
    String(d.getDate()).padStart(2,"0");
}

function weekKey(d){
  const lundi = new Date(d);
  const day = lundi.getDay() || 7;
  lundi.setDate(lundi.getDate() - day + 1);
  return toIsoLocal(lundi);
}

function isWeekend(d){
  const day = d.getDay();
  return day === 0 || day === 6;
}

function detectRowType(summary, description){
  const raw = (summary + " " + description)
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toUpperCase();

  if(raw.includes("REFERENT") || raw.includes("RÉFÉRENT")) return "referent";
  if(raw.includes("ALERTE") || raw.includes("VERIFIER") || raw.includes("VÉRIFIER")) return "alert";
  return "stage";
}

function detectEmoji(type){
  if(type === "referent") return "🧭";
  if(type === "alert") return "⚠️";
  return "👶";
}

function extractDetails(description, location){
  const lignes = String(description || "")
    .split(/\n+/)
    .map(v => v.trim())
    .filter(Boolean);

  if(location) lignes.push("Lieu : " + location);
  return lignes;
}

function formatTimeRange(e){
  if(e.allDay) return "";
  if(e.startTime && e.endTime && e.startTime !== e.endTime) return e.startTime + "–" + e.endTime;
  return e.startTime || "";
}

function renderAgendaEvents(events){
  const today = todayKey();

  const futurs = (events || [])
    .filter(e => e.dateKey && e.dateKey >= today)
    .sort((a,b) => {
      if(a.dateKey !== b.dateKey) return String(a.dateKey).localeCompare(String(b.dateKey));
      return Number(a.startMs || 0) - Number(b.startMs || 0);
    });

  if(futurs.length === 0){
    contentEl.className = "status";
    contentEl.textContent = CONFIG_PAGE.emptyMessage;
    return;
  }

  const grouped = {};

  futurs.forEach(e => {
    const iso = e.dateKey;
    if(!grouped[iso]){
      grouped[iso] = {
        dateObj:dateFromKey(iso),
        events:[]
      };
    }
    grouped[iso].events.push(e);
  });

  contentEl.className = "";
  contentEl.innerHTML = "";

  let currentWeek = "";

  Object.keys(grouped).sort().forEach(iso => {
    const dayGroup = grouped[iso];
    const wk = weekKey(dayGroup.dateObj);

    if(wk !== currentWeek){
      currentWeek = wk;
      const week = document.createElement("div");
      week.className = "week-label";
      week.textContent = formatWeekLabel(dayGroup.dateObj);
      contentEl.appendChild(week);
    }

    const dayCard = document.createElement("article");
    dayCard.className = "day-card" + (isWeekend(dayGroup.dateObj) ? " is-weekend" : "");

    const head = document.createElement("div");
    head.className = "day-head";

    const dateMain = document.createElement("p");
    dateMain.className = "date-main";
    dateMain.textContent = formatDateMain(dayGroup.dateObj);

    const tag = document.createElement("div");
    tag.className = "date-tag";
    tag.textContent = isWeekend(dayGroup.dateObj) ? "week-end" : "semaine";

    head.appendChild(dateMain);
    head.appendChild(tag);
    dayCard.appendChild(head);

    const list = document.createElement("div");
    list.className = "event-list";

    dayGroup.events.forEach(e => {
      const rowType = detectRowType(e.summary, e.description);
      const emoji = detectEmoji(rowType);
      const title = String(e.summary || "Stagiaire").replace(/\s+/g, " ").trim();
      const details = extractDetails(e.description, e.location);
      const horaire = formatTimeRange(e);

      const row = document.createElement("div");
      row.className = "event-row kind-" + rowType;

      const icon = document.createElement("div");
      icon.className = "shift-dot";
      icon.textContent = emoji;

      const main = document.createElement("div");
      main.className = "event-main";

      const line = document.createElement("div");
      line.className = "shift-line";

      const label = document.createElement("p");
      label.className = "shift-title";
      label.textContent = title;

      line.appendChild(label);

      if(horaire){
        const sep = document.createElement("span");
        sep.className = "shift-sep";
        sep.textContent = "·";

        const time = document.createElement("div");
        time.className = "time";
        time.textContent = horaire;

        line.appendChild(sep);
        line.appendChild(time);
      }

      main.appendChild(line);

      details.forEach(txt => {
        const detail = document.createElement("p");
        detail.className = "detail";
        detail.textContent = txt;
        main.appendChild(detail);
      });

      row.appendChild(icon);
      row.appendChild(main);
      list.appendChild(row);
    });

    dayCard.appendChild(list);
    contentEl.appendChild(dayCard);
  });
}

function chargerType(type){
  const script = document.createElement("script");
  script.src = apiJsonpUrl("events_collectif_jsonp", {type:type});

  script.onerror = function(){
    contentEl.className = "status";
    contentEl.textContent = "Aperçu indisponible. Impossible de joindre la passerelle Apps Script.";
  };

  document.body.appendChild(script);
}

function chargerFallbackSiBesoin(){
  fallbackIndex++;

  if(fallbackIndex >= CONFIG_PAGE.fallbackTypes.length){
    renderAgendaEvents(lastEvents);
    return;
  }

  chargerType(CONFIG_PAGE.fallbackTypes[fallbackIndex]);
}

window.recevoirEventsCollectifGhe = function(data){
  try{
    if(!data || data.ok === false || !Array.isArray(data.events)){
      throw new Error(data && data.erreur ? data.erreur : "Réponse events invalide");
    }

    lastEvents = data.events;

    if(lastEvents.length === 0 && fallbackIndex < CONFIG_PAGE.fallbackTypes.length - 1){
      chargerFallbackSiBesoin();
      return;
    }

    renderAgendaEvents(lastEvents);

  }catch(err){
    contentEl.className = "status";
    contentEl.textContent = "Aperçu indisponible. " + String(err.message || err);
  }
};

function init(){
  bottomActions.innerHTML = `
    <a class="action-btn action-apple" href="${webcalUrl(ICS_DIRECT)}">🍎 Apple</a>
    <a class="action-btn action-android" href="${androidUrl(ICS_DIRECT)}" target="_blank" rel="noopener">🤖 Android</a>
  `;

  chargerType(CONFIG_PAGE.typeCollectif);

  setTimeout(function(){
    if(contentEl.textContent === "Chargement..."){
      contentEl.className = "status";
      contentEl.textContent = "Aperçu indisponible. La passerelle n’a pas répondu en JSONP.";
    }
  }, 9000);
}

init();
</script>
</body>
</html>
