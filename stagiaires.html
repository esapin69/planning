<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace stagiaires</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4efe4;
  color:#171717;
}

.page{
  max-width:760px;
  margin:auto;
  padding:14px;
}

.hero{
  width:100%;
  display:block;
  border:4px solid #171717;
  border-radius:26px;
  box-shadow:8px 8px 0 #171717;
  margin-bottom:22px;
}

.intro{
  background:#fffaf0;
  border:4px solid #171717;
  border-radius:24px;
  padding:18px;
  box-shadow:7px 7px 0 #171717;
  margin-bottom:18px;
}

h1{
  margin:0 0 10px;
  font-size:34px;
  line-height:1;
  text-transform:uppercase;
}

.intro p{
  margin:0;
  font-size:17px;
  font-weight:800;
}

.status{
  text-align:center;
  font-weight:900;
  color:#6b7280;
  margin:18px 0;
}

.summary{
  background:#102f68;
  color:white;
  border:4px solid #171717;
  border-radius:26px;
  padding:18px;
  box-shadow:8px 8px 0 #171717;
  margin-bottom:24px;
}

.summary-title{
  font-size:24px;
  font-weight:900;
  margin-bottom:10px;
}

.summary-big{
  font-size:32px;
  font-weight:900;
  margin-bottom:8px;
}

.summary-line{
  font-size:17px;
  font-weight:800;
  margin:7px 0;
}

.carousel-label{
  font-size:22px;
  font-weight:900;
  margin:8px 0 12px;
}

.carousel{
  display:flex;
  gap:18px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  padding:4px 4px 18px;
}

.carousel::-webkit-scrollbar{
  display:none;
}

.day-slide{
  min-width:92%;
  scroll-snap-align:start;
  background:#fffaf0;
  border:4px solid #171717;
  border-radius:28px;
  padding:16px;
  box-shadow:8px 8px 0 #171717;
}

.day-title{
  font-size:30px;
  font-weight:900;
  color:#102f68;
  margin:0 0 6px;
}

.day-subtitle{
  font-size:16px;
  font-weight:900;
  color:#667085;
  margin-bottom:18px;
}

.pair-card{
  position:relative;
  background:#fffdf7;
  border:4px solid #171717;
  border-radius:24px;
  padding:18px 16px 18px 24px;
  margin-bottom:18px;
  overflow:hidden;
}

.pair-card::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:13px;
  background:linear-gradient(#f5a000 0 50%, #20c765 50% 100%);
}

.pair-title{
  font-size:23px;
  font-weight:900;
  margin-bottom:16px;
  border-bottom:4px dashed #171717;
  padding-bottom:8px;
}

.person-zone{
  padding:12px;
  border-radius:18px;
  margin-bottom:12px;
  background:#f7f7f2;
  border:2px dashed #d8d0bf;
}

.person-name{
  font-size:24px;
  font-weight:900;
  margin-bottom:10px;
}

.agent-head{
  display:flex;
  align-items:center;
  gap:14px;
}

.avatar{
  width:66px;
  height:66px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #171717;
  background:#eee;
}

.avatar-placeholder{
  width:66px;
  height:66px;
  border-radius:50%;
  border:4px solid #171717;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  background:#f1d58a;
}

.info{
  margin-top:10px;
}

.info-label{
  font-size:13px;
  font-weight:900;
  color:#667085;
  text-transform:uppercase;
  letter-spacing:1px;
}

.info-value{
  font-size:21px;
  font-weight:900;
  color:#171717;
  line-height:1.25;
  margin-top:3px;
}

.badge{
  display:inline-block;
  margin-top:10px;
  padding:8px 12px;
  border-radius:999px;
  border:3px solid #171717;
  font-weight:900;
  background:#e9ffeF;
}

.badge.warn{
  background:#fff1c7;
}

.empty{
  text-align:center;
  font-size:18px;
  font-weight:900;
  padding:22px;
  border:3px dashed #171717;
  border-radius:18px;
  background:#fffdf7;
}

.back{
  display:block;
  width:100%;
  text-align:center;
  margin:28px auto 10px;
  padding:17px 20px;
  border:4px solid #171717;
  border-radius:20px;
  background:#102f68;
  color:white;
  font-size:22px;
  font-weight:900;
  text-decoration:none;
  box-shadow:6px 6px 0 #171717;
}
</style>
</head>

<body>
<div class="page">

  <img class="hero" src="Image/Autre page/Photo_stagiaire.png" alt="Espace stagiaires">

  <section class="intro">
    <h1>Espace stagiaires</h1>
    <p>Les stagiaires prévus par date, avec leur référent du jour et les infos utiles.</p>
  </section>

  <div id="status" class="status">Chargement…</div>

  <section id="summary" class="summary">
    <div class="summary-title">🧭 Point stagiaires</div>
    <div class="summary-big">Chargement…</div>
  </section>

  <div class="carousel-label">📅 Journées prévues</div>

  <main id="results" class="carousel">
    <div class="empty">Chargement des stagiaires…</div>
  </main>

  <a class="back" href="index.html">🏠 Retour accueil</a>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzZITQIw7jbrJHyPl7xfcFjv8H1zQrq7yF73ekVx3S23Efjo2fWRsZ-YIiWNOMYCs3r/exec";

function clean(value){
  return value && String(value).trim() !== "" ? String(value).trim() : "Non renseigné";
}

function isMissing(value){
  return !value || String(value).trim() === "" || String(value).trim() === "Non renseigné";
}

function todayFr(){
  const d = new Date();
  const dd = String(d.getDate()).padStart(2,"0");
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const yyyy = d.getFullYear();
  return dd + "/" + mm + "/" + yyyy;
}

function parseFr(date){
  const p = String(date).split("/");
  if(p.length !== 3) return 0;
  return new Date(p[2], p[1]-1, p[0]).getTime();
}

function groupByDate(data){
  const groups = {};

  data.forEach(item => {
    const date = clean(item.date);

    if(!groups[date]){
      groups[date] = {
        date,
        pairs:[]
      };
    }

    groups[date].pairs.push({
      stagiaire_nom:item.stagiaire_nom,
      stagiaire_horaire:item.stagiaire_horaire,
      agent_nom:item.agent_nom,
      agent_horaire:item.agent_horaire,
      agent_telephone:item.agent_telephone,
      agent_avatar:item.agent_avatar
    });
  });

  return Object.values(groups).sort((a,b)=>parseFr(a.date)-parseFr(b.date));
}

function renderSummary(groups){
  const box = document.getElementById("summary");
  const today = todayFr();
  const todayGroup = groups.find(g => g.date === today);
  const nextGroup = groups.find(g => parseFr(g.date) >= parseFr(today));

  if(todayGroup){
    const count = todayGroup.pairs.length;
    const missingPhones = todayGroup.pairs.filter(p => isMissing(p.agent_telephone)).length;

    box.innerHTML = `
      <div class="summary-title">📍 Aujourd’hui</div>
      <div class="summary-big">${count} stagiaire${count>1 ? "s" : ""}</div>
      <div class="summary-line">🟢 ${count} référent${count>1 ? "s" : ""} affilié${count>1 ? "s" : ""}</div>
      <div class="summary-line">☎️ ${missingPhones} téléphone${missingPhones>1 ? "s" : ""} manquant${missingPhones>1 ? "s" : ""}</div>
      <div class="summary-line">${missingPhones ? "⚠️ Vérifier les contacts" : "✅ Infos principales OK"}</div>
    `;
    return;
  }

  if(nextGroup){
    box.innerHTML = `
      <div class="summary-title">📍 Aujourd’hui</div>
      <div class="summary-big">Aucun stagiaire aujourd’hui</div>
      <div class="summary-line">➡️ Prochaine présence : ${nextGroup.date}</div>
      <div class="summary-line">🎓 ${nextGroup.pairs.length} stagiaire${nextGroup.pairs.length>1 ? "s" : ""} prévu${nextGroup.pairs.length>1 ? "s" : ""}</div>
    `;
    return;
  }

  box.innerHTML = `
    <div class="summary-title">📍 Aujourd’hui</div>
    <div class="summary-big">Aucun stagiaire prévu</div>
    <div class="summary-line">✅ Rien à préparer pour le moment</div>
  `;
}

function render(data, updatedAt){
  const results = document.getElementById("results");
  const status = document.getElementById("status");

  if(!data || data.length === 0){
    status.textContent = "Aucune donnée trouvée.";
    results.innerHTML = `<div class="empty">Aucun stagiaire prévu.</div>`;
    renderSummary([]);
    return;
  }

  const groups = groupByDate(data);

  status.textContent = updatedAt
    ? "Dernière mise à jour : " + new Date(updatedAt).toLocaleString("fr-FR")
    : "Données chargées.";

  renderSummary(groups);

  results.innerHTML = groups.map(group => {
    const cards = group.pairs.map(pair => {
      const phoneMissing = isMissing(pair.agent_telephone);

      return `
        <article class="pair-card">
          <div class="pair-title">Binôme du jour</div>

          <div class="person-zone">
            <div class="person-name">🎓 ${clean(pair.stagiaire_nom)}</div>
            <div class="info">
              <div class="info-label">🕒 Horaire stagiaire</div>
              <div class="info-value">${clean(pair.stagiaire_horaire)}</div>
            </div>
          </div>

          <div class="person-zone">
            <div class="agent-head">
              ${
                pair.agent_avatar
                ? `<img class="avatar" src="${pair.agent_avatar}" alt="${clean(pair.agent_nom)}">`
                : `<div class="avatar-placeholder">👤</div>`
              }
              <div class="person-name">🟢 ${clean(pair.agent_nom)}</div>
            </div>

            <div class="info">
              <div class="info-label">🕒 Horaire référent</div>
              <div class="info-value">${clean(pair.agent_horaire)}</div>
            </div>

            <div class="info">
              <div class="info-label">☎️ Contact / GHE</div>
              <div class="info-value">${clean(pair.agent_telephone)}</div>
            </div>

            <div class="badge ${phoneMissing ? "warn" : ""}">
              ${phoneMissing ? "⚠️ Contact à vérifier" : "✅ Contact renseigné"}
            </div>
          </div>
        </article>
      `;
    }).join("");

    return `
      <section class="day-slide">
        <h2 class="day-title">📅 ${group.date}</h2>
        <div class="day-subtitle">${group.pairs.length} stagiaire${group.pairs.length>1 ? "s" : ""} prévu${group.pairs.length>1 ? "s" : ""}</div>
        ${cards}
      </section>
    `;
  }).join("");
}

function loadWithJsonp(){
  const callbackName = "stagiairesCallback_" + Date.now();

  window[callbackName] = function(payload){
    render(payload.resultats || [], payload.updatedAt);
    delete window[callbackName];
  };

  const script = document.createElement("script");
  script.src = API_URL + "?callback=" + callbackName;

  script.onerror = function(){
    document.getElementById("status").textContent = "Erreur : API inaccessible.";
    document.getElementById("results").innerHTML = `<div class="empty">Impossible de charger les données.</div>`;
  };

  document.body.appendChild(script);
}

loadWithJsonp();
</script>

</body>
</html>
