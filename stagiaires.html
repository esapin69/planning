<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7dd">
<title>GHE — Stagiaires</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#07183f;--ink-soft:#33415f;--cream:#fff7dd;--paper:#fffaf0;--paper2:#fff2c9;
  --danger:#b42318;--danger-bg:#fff0ec;--warning:#8a4b00;--warning-bg:#fff4c7;
  --ok:#176b39;--ok-bg:#eaf8ef;--line:#07183f;--shadow:0 6px 0 rgba(7,24,63,.15);
  --display:Impact,"Arial Black",system-ui,sans-serif;
}
html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink)}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body.modal-open{overflow:hidden}
button,input,a{font:inherit;color:inherit}
[hidden]{display:none!important}
.page{width:min(1080px,100%);margin:auto;padding:calc(8px + env(safe-area-inset-top)) 8px calc(80px + env(safe-area-inset-bottom))}
.topbar{display:flex;gap:9px;margin-bottom:9px}
.navbtn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;border:3px solid var(--line);border-radius:18px;background:var(--paper);text-decoration:none;font-size:18px;font-weight:950;box-shadow:0 4px 0 rgba(7,24,63,.12)}
.hero{border:4px solid var(--line);border-radius:22px;overflow:hidden;background:var(--ink);box-shadow:var(--shadow);margin-bottom:11px}
.hero img{display:block;width:100%;height:clamp(104px,24vw,190px);object-fit:cover}
.pilot{background:var(--paper);border:4px solid var(--line);border-radius:22px;padding:11px 12px;box-shadow:var(--shadow);margin-bottom:10px}
.pilot.ok{border-color:#2f8f4e}.pilot.warning{border-color:#d2a631}.pilot.danger{border-color:#c43a2f}
.pilot-title{font-weight:950;font-size:clamp(21px,5.5vw,33px);line-height:1.02}
.pilot-sub{margin-top:4px;color:var(--ink-soft);font-size:14px;font-weight:850;line-height:1.25}
.pilot-pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.pill{display:inline-flex;align-items:center;min-height:30px;padding:6px 9px;border-radius:999px;background:var(--paper2);border:2px solid rgba(7,24,63,.18);font-size:13px;font-weight:900}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warning{background:var(--warning-bg);color:var(--warning)}.pill.danger{background:var(--danger-bg);color:var(--danger)}
.tools{display:grid;gap:8px;margin-bottom:12px}
.search{width:100%;min-height:48px;border:3px solid var(--line);border-radius:17px;padding:9px 12px;font-size:16px;font-weight:850;background:var(--paper);outline:none;box-shadow:0 4px 0 rgba(7,24,63,.12)}
.filters{display:flex;gap:7px;overflow-x:auto;padding:1px 0 4px}
.filter-btn{flex:0 0 auto;border:3px solid var(--line);border-radius:999px;background:var(--paper);padding:8px 12px;font-size:14px;font-weight:950;cursor:pointer}
.filter-btn.active{background:var(--ink);color:var(--cream)}
.day-title{margin:22px 4px 9px;font-family:var(--display);font-size:clamp(31px,8vw,56px);line-height:.88;text-transform:uppercase;text-shadow:0 3px 0 #f8d67d}
.main-card{background:var(--paper);border:4px solid var(--line);border-radius:24px;padding:10px;margin-bottom:12px;box-shadow:var(--shadow)}
.main-card.warning{border-color:#d2a631}.main-card.danger{border-color:#c43a2f}
.card-toggle{width:100%;border:0;background:transparent;padding:2px;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;cursor:pointer}
.card-title{font-size:clamp(18px,4.8vw,28px);line-height:1.05;font-weight:950;text-transform:uppercase;overflow-wrap:anywhere}
.card-meta{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px}
.chevron{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--paper2);font-size:22px;transition:transform .18s}
.card-toggle[aria-expanded="true"] .chevron{transform:rotate(180deg)}
.issue-btn{width:100%;min-height:42px;margin-top:8px;border:2px solid rgba(7,24,63,.18);border-radius:15px;padding:8px 10px;background:var(--paper2);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:950;text-align:left;cursor:pointer}
.issue-btn.warning{background:var(--warning-bg);color:var(--warning);border-color:#e2c060}
.issue-btn.danger{background:var(--danger-bg);color:var(--danger);border-color:#e7a29d}
.details{display:grid;gap:8px;padding-top:10px}
.person{display:grid;grid-template-columns:62px minmax(0,1fr);gap:9px;align-items:center;padding:9px;border:3px solid var(--line);border-radius:20px;background:var(--paper2)}
.person.stagiaire{border-color:#2f67c8;background:linear-gradient(145deg,#edf3ff,#fffaf0)}
.person.referent{border-color:#2f8f4e;background:linear-gradient(145deg,#e8f8ee,#fffaf0)}
.avatar{width:62px;height:62px;border-radius:17px;background:#eaf0ff;overflow:hidden;display:flex;align-items:center;justify-content:center;border:2px solid rgba(7,24,63,.13)}
.avatar img{max-width:97%;max-height:97%;object-fit:contain;display:block}
.initials{width:49px;height:49px;border-radius:14px;border:3px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:19px}
.avatar.has-img .initials{display:none}
.role{display:block;margin-bottom:3px;color:rgba(7,24,63,.58);font-size:12px;font-weight:950;letter-spacing:.65px;text-transform:uppercase}
.person-name{display:block;font-size:clamp(21px,5.4vw,33px);line-height:.98;font-weight:950;text-transform:uppercase;overflow-wrap:anywhere}
.info{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{display:inline-flex;align-items:center;min-height:29px;padding:5px 8px;border-radius:999px;border:2px solid rgba(7,24,63,.18);background:var(--paper);font-size:13px;font-weight:900}
.loading,.error,.empty{background:var(--paper);border:4px solid var(--line);border-radius:21px;padding:14px;font-weight:900;box-shadow:var(--shadow)}
.error{color:var(--danger)}
.modal{position:fixed;inset:0;z-index:1000;display:none;align-items:flex-end;justify-content:center;padding:10px;background:rgba(2,8,23,.67);backdrop-filter:blur(5px)}
.modal.open{display:flex}
.modal-panel{width:min(620px,100%);max-height:88vh;overflow:auto;background:var(--paper);border:5px solid var(--line);border-radius:27px;padding:14px;box-shadow:0 15px 0 rgba(0,0,0,.27)}
.modal-title{margin:0;font-family:var(--display);font-size:clamp(30px,8vw,49px);line-height:.9;text-transform:uppercase}
.modal-sub{margin:7px 0 12px;color:var(--ink-soft);font-weight:800;line-height:1.3}
.issue-section{border:3px solid var(--line);border-radius:19px;padding:10px;margin-top:9px}
.issue-section.stagiaire{border-color:#2f67c8}.issue-section.referent{border-color:#2f8f4e}.issue-section.affectation{border-color:#d2a631}
.issue-section-title{font-size:14px;font-weight:950;text-transform:uppercase;letter-spacing:.5px}
.issue-detail{margin-top:8px;border-radius:15px;padding:9px;border:2px solid transparent}
.issue-detail.warning{background:var(--warning-bg);color:var(--warning);border-color:#e2c060}
.issue-detail.danger{background:var(--danger-bg);color:var(--danger);border-color:#e7a29d}
.issue-message{font-size:14px;font-weight:950;line-height:1.3}
.issue-action{margin-top:6px;padding-top:6px;border-top:1px solid currentColor;font-size:13px;font-weight:800;line-height:1.3}
.close-btn{width:100%;min-height:52px;margin-top:12px;border:4px solid var(--line);border-radius:17px;background:var(--ink);color:var(--cream);font-weight:950}
@media(min-width:720px){.modal{align-items:center}.details{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main class="page">
  <div class="topbar"><a class="navbtn" href="index.html">← Accueil</a></div>
  <section class="hero"><img src="Image/Bannière/Page stagiaire.PNG" alt="Stagiaires GHE" onerror="this.onerror=null;this.src='Image/Banni%C3%A8re/Page%20stagiaire.PNG';"></section>
  <section id="pilot" class="pilot"><div class="pilot-title">Chargement des stagiaires…</div><div class="pilot-sub">Lecture de la source GHE.</div></section>
  <section class="tools">
    <input id="search" class="search" type="search" placeholder="Rechercher stagiaire, référent ou GHE…" autocomplete="off">
    <div class="filters">
      <button class="filter-btn active" data-filter="tous" type="button">Tous</button>
      <button class="filter-btn" data-filter="traiter" type="button">À vérifier</button>
      <button class="filter-btn" data-filter="bloquants" type="button">Bloquants</button>
    </div>
  </section>
  <section id="content"><div class="loading">Chargement…</div></section>
</main>

<div class="modal" id="issueModal" aria-hidden="true">
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="issueModalTitle">
    <h2 class="modal-title" id="issueModalTitle">Points à vérifier</h2>
    <p class="modal-sub" id="issueModalSub"></p>
    <div id="issueModalBody"></div>
    <button class="close-btn" id="issueModalClose" type="button">Fermer</button>
  </div>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzmelNrBU583V3CvOlle3cafAKEAZQ8NAX-peSN6D-yxFO3gX26SnVNUVd5xbwV3CUISg/exec";
let ITEMS=[];let CURRENT_FILTER="tous";
const pilot=document.getElementById("pilot");
const content=document.getElementById("content");
const search=document.getElementById("search");
const issueModal=document.getElementById("issueModal");
const issueModalSub=document.getElementById("issueModalSub");
const issueModalBody=document.getElementById("issueModalBody");

function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function norm(v){return String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\s+/g," ").trim()}
function arr(v){return Array.isArray(v)?v:[]}
function initials(v){const p=String(v||"").trim().split(/\s+/).filter(Boolean);return p.length?((p[0][0]||"")+(p[1]?.[0]||p[0][1]||"")).toUpperCase():"?"}
function levelOf(item){return item.niveau==="danger"?"danger":item.niveau==="warning"?"warning":"ok"}
function anomalyGroups(item){
  const a=item.anomalies||{};
  return {stagiaire:arr(a.stagiaire),referent:arr(a.referent),affectation:arr(a.affectation)};
}
function issueCount(item){const g=anomalyGroups(item);return g.stagiaire.length+g.referent.length+g.affectation.length}
function avatarHtml(person){
  const av=person&&person.avatar||{};const thumb=av.thumb||"";
  return `<div class="avatar ${thumb?"has-img":""}">${thumb?`<img src="${esc(thumb)}" alt="" onerror="this.parentElement.classList.remove('has-img');this.remove()">`:""}<span class="initials">${esc(av.initiales||initials(person&&((person.nomPrenom||person.nomComplet||person.prenomCourt)||"")))}</span></div>`;
}
function chip(text){return text?`<span class="chip">${esc(text)}</span>`:""}
function personHtml(role,person,kind,shift){
  person=person||{};
  const name=person.nomPrenom||person.nomComplet||person.prenomCourt||(kind==="referent"?"Référent à attribuer":"Stagiaire");
  return `<article class="person ${kind}">${avatarHtml(person)}<div><span class="role">${esc(role)}</span><span class="person-name">${esc(name)}</span><div class="info">${kind==="referent"?chip(person.ghe):""}${shift?chip((shift.label||shift.code||"Shift")+(shift.horaire?" · "+shift.horaire:"")):""}</div></div></article>`;
}
function publicIssue(issue){
  if(typeof issue==="string")return {message:issue,action:"Vérifier uniquement la donnée concernée.",niveau:"warning"};
  return {message:String(issue&&issue.message||""),action:String(issue&&issue.action||"Vérifier uniquement la donnée concernée."),niveau:issue&&issue.niveau==="danger"?"danger":"warning"};
}
function issueSection(label,key,list){
  list=arr(list).map(publicIssue).filter(x=>x.message);
  if(!list.length)return "";
  return `<section class="issue-section ${key}"><div class="issue-section-title">${esc(label)}</div>${list.map(x=>`<div class="issue-detail ${x.niveau}"><div class="issue-message">${esc(x.message)}</div><div class="issue-action"><strong>Action :</strong> ${esc(x.action)}</div></div>`).join("")}</section>`;
}
function openIssues(index){
  const item=ITEMS[index];if(!item)return;
  const g=anomalyGroups(item);
  issueModalSub.textContent=(item.dateLabel||"")+" · "+((item.stagiaire&&item.stagiaire.nomPrenom)||"Stagiaire");
  issueModalBody.innerHTML=issueSection("Stagiaire","stagiaire",g.stagiaire)+issueSection("Référent","referent",g.referent)+issueSection("Affectation","affectation",g.affectation);
  issueModal.classList.add("open");issueModal.setAttribute("aria-hidden","false");document.body.classList.add("modal-open");
}
function closeIssues(){issueModal.classList.remove("open");issueModal.setAttribute("aria-hidden","true");document.body.classList.remove("modal-open")}
function filterItems(){
  const q=norm(search.value);
  return ITEMS.map((item,index)=>({item,index})).filter(({item})=>{
    const count=issueCount(item);const level=levelOf(item);
    if(CURRENT_FILTER==="traiter"&&!count)return false;
    if(CURRENT_FILTER==="bloquants"&&level!=="danger")return false;
    if(!q)return true;
    const g=anomalyGroups(item);
    const txt=[item.titre,item.dateLabel,item.semaineLabel,item.shift&&item.shift.code,item.shift&&item.shift.label,
      item.stagiaire&&item.stagiaire.nomPrenom,item.referent&&item.referent.nomComplet,item.referent&&item.referent.ghe,
      ...g.stagiaire.map(x=>x.message||x),...g.referent.map(x=>x.message||x),...g.affectation.map(x=>x.message||x)].join(" ");
    return norm(txt).includes(q);
  });
}
function render(){
  const filtered=filterItems();
  if(!filtered.length){content.innerHTML='<div class="empty">Aucun stagiaire à afficher avec ce filtre.</div>';return}
  const byDate={};
  filtered.forEach(x=>{const k=x.item.dateKey||"date";(byDate[k]||(byDate[k]=[])).push(x)});
  content.innerHTML=Object.keys(byDate).sort().map(k=>{
    const first=byDate[k][0].item;
    return `<section><h2 class="day-title">${esc(first.dateLabel||k)}</h2>${byDate[k].map(({item,index})=>cardHtml(item,index)).join("")}</section>`;
  }).join("");
}
function cardHtml(item,index){
  const count=issueCount(item);const level=levelOf(item);
  const stag=(item.stagiaire&&item.stagiaire.nomPrenom)||"Stagiaire";
  const ref=(item.referent&&item.referent.nomComplet)||"Référent à attribuer";
  const id="details-"+index;
  return `<article class="main-card ${level}">
    <button class="card-toggle" type="button" aria-expanded="false" aria-controls="${id}" data-toggle="${id}">
      <div><div class="card-title">👶 ${esc(stag)} → ${esc(ref)}</div><div class="card-meta">${chip(item.shift&&item.shift.label)}${chip(item.shift&&item.shift.horaire)}${chip(item.semaineLabel)}</div></div>
      <span class="chevron">⌄</span>
    </button>
    ${count?`<button class="issue-btn ${level}" type="button" data-issues="${index}"><span>${level==="danger"?"⛔":"⚠️"} ${count} point${count>1?"s":""} à vérifier</span><span>›</span></button>`:""}
    <div class="details" id="${id}" hidden>
      ${personHtml("Stagiaire",item.stagiaire,"stagiaire",item.shift)}
      ${personHtml("Référent",item.referent,"referent",item.shift)}
    </div>
  </article>`;
}
function updatePilot(){
  const total=ITEMS.length;const danger=ITEMS.filter(x=>levelOf(x)==="danger").length;const warning=ITEMS.filter(x=>levelOf(x)==="warning").length;
  const lvl=danger?"danger":warning?"warning":"ok";
  pilot.className="pilot "+lvl;
  pilot.innerHTML=`<div class="pilot-title">${total} affectation${total>1?"s":""} à venir</div><div class="pilot-sub">Les détails restent repliés. Les alertes sont rattachées uniquement à la bonne personne ou à l’affectation.</div><div class="pilot-pills"><span class="pill ok">✅ ${total-danger-warning} OK</span><span class="pill warning">⚠️ ${warning} à vérifier</span><span class="pill danger">⛔ ${danger} bloquantes</span></div>`;
}
content.addEventListener("click",e=>{
  const toggle=e.target.closest("[data-toggle]");
  if(toggle){const id=toggle.dataset.toggle;const el=document.getElementById(id);const open=toggle.getAttribute("aria-expanded")==="true";toggle.setAttribute("aria-expanded",String(!open));el.hidden=open}
  const issue=e.target.closest("[data-issues]");if(issue)openIssues(Number(issue.dataset.issues));
});
search.addEventListener("input",render);
document.querySelectorAll(".filter-btn").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll(".filter-btn").forEach(x=>x.classList.remove("active"));btn.classList.add("active");CURRENT_FILTER=btn.dataset.filter;render()}));
document.getElementById("issueModalClose").addEventListener("click",closeIssues);
issueModal.addEventListener("click",e=>{if(e.target===issueModal)closeIssues()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeIssues()});

function loadJsonp(){
  const cb="recevoirStagiaires_"+Date.now();const script=document.createElement("script");
  window[cb]=data=>{delete window[cb];script.remove();if(!data||!data.ok){content.innerHTML=`<div class="error">${esc(data&&data.erreur||"Données invalides.")}</div>`;return}ITEMS=arr(data.items);updatePilot();render()};
  script.onerror=()=>{delete window[cb];script.remove();content.innerHTML='<div class="error">Impossible de charger les données.</div>'};
  script.src=WEB_APP_URL+"?mode=site_stagiaires_formations&type=stagiaires&callback="+encodeURIComponent(cb)+"&v="+Date.now();
  document.body.appendChild(script);
}
loadJsonp();
</script>
</body>
</html>
