<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>GHE — Stagiaires</title>

<style>
*,*::before,*::after{box-sizing:border-box}

:root{
  --ink:#07183f;
  --cream:#fff7dd;
  --card:#fffaf0;
  --line:#132752;
  --muted:#69738a;
  --danger:#b42318;
  --danger-bg:#fff1ed;
  --warning:#8a4b00;
  --warning-bg:#fff7db;
  --ok:#166534;
  --ok-bg:#edf9f1;
  --shadow:0 8px 0 rgba(7,24,63,.14);
}

html,body{
  margin:0;
  min-height:100vh;
}

body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#fff7dd;
  color:var(--ink);
}

.page{
  width:min(1080px,100%);
  margin:auto;
  padding:12px 10px 34px;
}

.topbar{
  display:flex;
  gap:8px;
  margin-bottom:12px;
  flex-wrap:wrap;
}

.navbtn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:44px;
  padding:9px 14px;
  border:3px solid var(--line);
  border-radius:16px;
  background:#fffaf0;
  color:var(--ink);
  text-decoration:none;
  font-weight:1000;
  box-shadow:0 4px 0 rgba(7,24,63,.16);
}

.hero{
  border:4px solid var(--line);
  border-radius:26px;
  overflow:hidden;
  background:#07183f;
  box-shadow:var(--shadow);
  margin-bottom:14px;
}

.hero img{
  display:block;
  width:100%;
  height:auto;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:14px 0;
}

.stat{
  background:#fffaf0;
  border:4px solid var(--line);
  border-radius:20px;
  padding:13px 14px;
  box-shadow:var(--shadow);
}

.stat-number{
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:38px;
  line-height:.9;
}

.stat-label{
  font-weight:1000;
  font-size:15px;
  margin-top:4px;
}

.tools{
  display:grid;
  gap:10px;
  margin:14px 0 18px;
}

.search{
  width:100%;
  min-height:54px;
  border:4px solid var(--line);
  border-radius:18px;
  padding:10px 14px;
  font-size:17px;
  font-weight:900;
  color:var(--ink);
  background:#fffaf0;
  outline:none;
  box-shadow:var(--shadow);
}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.filter-btn{
  border:3px solid var(--line);
  border-radius:999px;
  background:#fffaf0;
  color:var(--ink);
  padding:9px 13px;
  font-weight:1000;
  cursor:pointer;
  box-shadow:0 4px 0 rgba(7,24,63,.14);
}

.filter-btn.active{
  background:#07183f;
  color:#fff7dd;
}

.result-separator{
  margin:24px 4px 12px;
  display:flex;
  align-items:center;
  gap:12px;
}

.result-separator::before,
.result-separator::after{
  content:"";
  height:4px;
  flex:1;
  background:#07183f;
  border-radius:99px;
  opacity:.22;
}

.result-separator span{
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:clamp(30px,6vw,52px);
  text-transform:uppercase;
  text-shadow:0 3px 0 #f8d67d;
}

.day-title{
  margin:28px 4px 12px;
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:clamp(34px,7vw,58px);
  line-height:.9;
  text-transform:uppercase;
  text-shadow:0 3px 0 #f8d67d;
}

.stagiaire-card{
  background:#fffaf0;
  border:4px solid var(--line);
  border-radius:24px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}

.stagiaire-card.danger{border-color:var(--danger)}
.stagiaire-card.warning{border-color:#b7791f}
.stagiaire-card.ok{border-color:var(--ok)}

.people-row{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:12px;
  align-items:center;
  margin-bottom:12px;
}

.person{
  display:grid;
  grid-template-columns:84px 1fr;
  gap:12px;
  align-items:center;
  min-width:0;
  background:#fff7dd;
  border:2px solid rgba(7,24,63,.18);
  border-radius:18px;
  padding:10px;
}

.avatar{
  width:78px;
  height:78px;
  border:0;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
}

.avatar img{
  max-width:78px;
  max-height:78px;
  width:auto;
  height:auto;
  object-fit:contain;
  display:block;
}

.avatar .initials{
  width:58px;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:3px solid var(--line);
  border-radius:14px;
  background:#fffaf0;
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:20px;
}

.avatar.has-img .initials{
  display:none;
}

.role{
  display:block;
  font-size:12px;
  text-transform:uppercase;
  font-weight:1000;
  opacity:.62;
  margin-bottom:4px;
}

.name{
  display:block;
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:clamp(24px,4.7vw,38px);
  line-height:.95;
  text-transform:uppercase;
  word-break:break-word;
}

.arrow{
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:34px;
  line-height:1;
}

.summary-line{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:12px;
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:32px;
  padding:6px 10px;
  border-radius:999px;
  background:#fff7dd;
  border:2px solid rgba(7,24,63,.16);
  color:var(--ink);
  font-size:14px;
  font-weight:900;
}

.chip a{
  color:#064ee4;
  font-weight:1000;
}

.status{
  border-radius:999px;
  padding:6px 10px;
  font-weight:1000;
  border:2px solid transparent;
}

.status.ok{
  background:var(--ok-bg);
  color:var(--ok);
  border-color:#b7e0c5;
}

.status.warning{
  background:var(--warning-bg);
  color:var(--warning);
  border-color:#ecd27f;
}

.status.danger{
  background:var(--danger-bg);
  color:var(--danger);
  border-color:#efb1b1;
}

.alert{
  margin:10px 0;
  padding:10px 12px;
  border-radius:16px;
  font-weight:900;
}

.alert.danger{
  background:var(--danger-bg);
  color:var(--danger);
}

.alert.warning{
  background:var(--warning-bg);
  color:var(--warning);
}

.alert ul{
  margin:6px 0 0;
  padding-left:20px;
}

.source{
  margin-top:12px;
  font-size:13px;
  opacity:.68;
  font-weight:900;
}

.empty,.error,.loading{
  background:#fffaf0;
  border:4px solid var(--line);
  border-radius:22px;
  padding:16px;
  font-weight:1000;
  box-shadow:var(--shadow);
}

.error{
  color:var(--danger);
}

.agenda-box{
  margin:28px 0 4px;
  padding:16px 12px;
  background:#fffaf0;
  border:5px solid var(--line);
  border-radius:26px;
  box-shadow:var(--shadow);
}

.agenda-title{
  margin:0 0 12px;
  text-align:center;
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:clamp(27px,6.3vw,48px);
  line-height:.9;
  text-transform:uppercase;
  text-shadow:0 3px 0 #f8d67d;
}

.agenda-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.agenda-btn{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:3px;
  text-decoration:none;
  color:#fff4ce;
  border:5px solid #061738;
  border-radius:22px;
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:clamp(22px,5vw,36px);
  text-transform:uppercase;
  box-shadow:0 8px 0 rgba(7,24,63,.35);
}

.agenda-btn.ios{
  background:linear-gradient(145deg,#3db9ff 0%,#0c6ed5 56%,#083c91 100%);
}

.agenda-btn.android{
  background:linear-gradient(145deg,#35d864 0%,#12873d 56%,#075324 100%);
}

@media(max-width:820px){
  .stats{
    grid-template-columns:1fr;
  }

  .people-row{
    grid-template-columns:1fr;
  }

  .arrow{
    text-align:center;
  }
}

@media(max-width:620px){
  .page{
    padding:10px 8px 28px;
  }

  .hero{
    border-radius:22px;
    border-width:3px;
  }

  .stagiaire-card{
    border-width:3px;
    border-radius:21px;
  }

  .person{
    grid-template-columns:74px 1fr;
    padding:9px;
  }

  .avatar,
  .avatar img{
    max-width:68px;
    max-height:68px;
    width:68px;
    height:68px;
  }

  .name{
    font-size:27px;
  }

  .agenda-box{
    border-width:4px;
  }
}
</style>
</head>

<body>
<main class="page">

  <div class="topbar">
    <a class="navbtn" href="index.html">← Accueil</a>
    <a class="navbtn" href="formations.html">Formations</a>
  </div>

  <section class="hero">
    <img
      src="Image/Bannière/Page stagiaire.PNG"
      alt="Stagiaires GHE"
      onerror="this.onerror=null;this.src='Image/Banni%C3%A8re/Page%20stagiaire.PNG';"
    >
  </section>

  <section class="stats">
    <div class="stat">
      <div class="stat-number" id="statTotal">0</div>
      <div class="stat-label">Total</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="statAlertes">0</div>
      <div class="stat-label">Alertes</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="statOk">0</div>
      <div class="stat-label">OK</div>
    </div>
  </section>

  <section class="tools">
    <input id="search" class="search" type="search" placeholder="Rechercher stagiaire, référent, GHE, téléphone…">

    <div class="filters">
      <button class="filter-btn active" data-filter="tous">Tous</button>
      <button class="filter-btn" data-filter="alertes">Alertes</button>
      <button class="filter-btn" data-filter="ok">OK</button>
      <button class="filter-btn" data-filter="M">Matin</button>
      <button class="filter-btn" data-filter="J">Journée</button>
      <button class="filter-btn" data-filter="J4">J4</button>
      <button class="filter-btn" data-filter="S">Soir</button>
      <button class="filter-btn" data-filter="N">Nuit</button>
    </div>
  </section>

  <div class="result-separator"><span>Résultats</span></div>

  <section id="content">
    <div class="loading">Chargement des stagiaires…</div>
  </section>

  <section class="agenda-box">
    <h2 class="agenda-title">Ajouter l’agenda stagiaires</h2>
    <div class="agenda-buttons">
      <a id="btnIos" class="agenda-btn ios" href="#"><span>🍎</span><span>iOS</span></a>
      <a id="btnAndroid" class="agenda-btn android" href="#"><span>🤖</span><span>Android</span></a>
    </div>
  </section>

</main>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzmelNrBU583V3CvOlle3cafAKEAZQ8NAX-peSN6D-yxFO3gX26SnVNUVd5xbwV3CUISg/exec";

const ICS_URL = "https://calendar.google.com/calendar/ical/2ced33be0e6a5c88fab9bae2ffdf3b56366970e4003b1718a7dabf4c0603eae6%40group.calendar.google.com/private-d3db5a97d6dbdd8ceeeaa375c8a460ef/basic.ics";

let ITEMS = [];
let CURRENT_FILTER = "tous";

document.getElementById("btnIos").href = ICS_URL.replace(/^https:\/\//i, "webcal://");
document.getElementById("btnAndroid").href = "https://calendar.google.com/calendar/render?cid=" + encodeURIComponent(ICS_URL);

document.getElementById("search").addEventListener("input", () => {
  render(filterItems());
});

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    CURRENT_FILTER = btn.dataset.filter;
    render(filterItems());
  });
});

loadJsonp("stagiaires");

function loadJsonp(type){
  const callbackName = "recevoirGhe_" + type + "_" + Date.now();
  const script = document.createElement("script");

  window[callbackName] = function(data){
    delete window[callbackName];
    script.remove();

    if (!data || !data.ok) {
      showError(data && data.erreur ? data.erreur : "Données invalides.");
      return;
    }

    ITEMS = data.items || [];
    updateStats(ITEMS);
    render(filterItems());
  };

  script.onerror = function(){
    delete window[callbackName];
    script.remove();
    showError("Impossible de charger les données.");
  };

  script.src = WEB_APP_URL
    + "?mode=site_stagiaires_formations"
    + "&type=" + encodeURIComponent(type)
    + "&callback=" + encodeURIComponent(callbackName)
    + "&v=" + Date.now();

  document.body.appendChild(script);
}

function filterItems(){
  const q = norm(document.getElementById("search").value);

  return ITEMS.filter(item => {
    if (CURRENT_FILTER === "alertes" && item.niveau === "ok") return false;
    if (CURRENT_FILTER === "ok" && item.niveau !== "ok") return false;

    if (["M","J","J4","S","N"].includes(CURRENT_FILTER)) {
      if (!item.shift || item.shift.base !== CURRENT_FILTER) return false;
    }

    if (!q) return true;

    const stagiaire = item.stagiaire || {};
    const referent = item.referent || {};
    const shift = item.shift || {};
    const alertes = item.alertes || {};

    const txt = [
      item.titre,
      item.dateLabel,
      shift.label,
      shift.code,
      stagiaire.nomPrenom,
      referent.nomComplet,
      referent.ghe,
      referent.telephone,
      (alertes.bloquantes || []).join(" "),
      (alertes.infos || []).join(" ")
    ].join(" ");

    return norm(txt).includes(q);
  });
}

function updateStats(items){
  const total = items.length;
  const alertes = items.filter(x => x.niveau === "danger" || x.niveau === "warning").length;
  const ok = items.filter(x => x.niveau === "ok").length;

  document.getElementById("statTotal").textContent = total;
  document.getElementById("statAlertes").textContent = alertes;
  document.getElementById("statOk").textContent = ok;
}

function render(items){
  const content = document.getElementById("content");

  if (!items.length) {
    content.innerHTML = `<div class="empty">Aucun stagiaire à venir pour le moment.</div>`;
    return;
  }

  const groups = groupByDate(items);

  content.innerHTML = Object.keys(groups).map(dateKey => {
    const list = groups[dateKey];
    const label = list[0].dateLabel || dateKey;

    return `
      <div class="day-title">${esc(label)}</div>
      ${list.map(cardStagiaire).join("")}
    `;
  }).join("");
}

function cardStagiaire(item){
  const stagiaire = item.stagiaire || {};
  const referent = item.referent || {};
  const shift = item.shift || {};
  const alertes = item.alertes || {};
  const source = item.source || {};

  const bloquantes = alertes.bloquantes || [];
  const infos = alertes.infos || [];

  return `
    <article class="stagiaire-card ${esc(item.niveau || "ok")}">

      <div class="people-row">
        <div class="person">
          ${avatarHtml(stagiaire.avatar)}
          <div>
            <span class="role">Stagiaire</span>
            <span class="name">${esc(stagiaire.nomPrenom || "")}</span>
          </div>
        </div>

        <div class="arrow">→</div>

        <div class="person">
          ${avatarHtml(referent.avatar)}
          <div>
            <span class="role">Référent</span>
            <span class="name">${esc(referent.nomComplet || "")}</span>
          </div>
        </div>
      </div>

      <div class="summary-line">
        <span class="chip">Shift : ${esc(shift.label || "Inconnu")}${shift.code ? " · " + esc(shift.code) : ""}</span>
        <span class="chip">Horaire : ${esc(shift.horaire || "non connu")}</span>
        <span class="chip">GHE : ${esc(referent.ghe || "non renseigné")}</span>
        <span class="chip">Téléphone : ${referent.telephone ? `<a href="tel:${esc(referent.telephone)}">${esc(referent.telephone)}</a>` : "non renseigné"}</span>
        <span class="status ${esc(item.niveau || "ok")}">${statusLabel(item.niveau)}</span>
      </div>

      ${bloquantes.length ? alertBlock("danger", "Alertes bloquantes", bloquantes) : ""}
      ${infos.length ? alertBlock("warning", "À vérifier", infos) : ""}

      <div class="source">
        Source : ${esc(source.onglet || "DETAIL_STAGIAIRES")} ${source.ongletSource ? "· " + esc(source.ongletSource) : ""}
      </div>
    </article>
  `;
}

function avatarHtml(avatar){
  avatar = avatar || {};
  const initials = esc(avatar.initiales || "?");
  const thumb = avatar.thumb || "";

  if (!thumb) {
    return `<div class="avatar"><div class="initials">${initials}</div></div>`;
  }

  return `
    <div class="avatar has-img">
      <img src="${esc(thumb)}" alt="" loading="lazy" onerror="this.parentElement.classList.remove('has-img');this.remove();">
      <div class="initials">${initials}</div>
    </div>
  `;
}

function statusLabel(niveau){
  if (niveau === "danger") return "Bloquant";
  if (niveau === "warning") return "À vérifier";
  return "OK";
}

function alertBlock(type, title, list){
  return `
    <div class="alert ${type}">
      <div><strong>${esc(title)}</strong></div>
      <ul>${list.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    </div>
  `;
}

function groupByDate(items){
  return items.reduce((acc,item) => {
    const key = item.dateKey || "sans-date";
    if (!acc[key]) acc[key] = [];
    acc[key].push(item);
    return acc;
  }, {});
}

function showError(message){
  document.getElementById("content").innerHTML = `<div class="error">Problème : ${esc(message)}</div>`;
}

function esc(value){
  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function norm(value){
  return String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .trim();
}
</script>
</body>
</html>
