<script>
const CONFIG_PAGE = {
  typeCollectif: "stagiaires",
  emptyMessage: "Aucun stagiaire à afficher à partir d’aujourd’hui."
};

const PASSERELLE = "https://script.google.com/macros/s/AKfycbwrhifE-4wl-YvKOjJI8HZ_g_ota7tajTKLY3jvLKEF9AvSPjIbVpqcSkSRcl5OdWV9/exec";
const contentEl = document.getElementById("content");
const bottomActions = document.getElementById("bottomActions");

function apiUrl(mode, extra){
  const url = new URL(PASSERELLE);
  url.searchParams.set("mode", mode);
  url.searchParams.set("t", Date.now());
  Object.keys(extra || {}).forEach(k => url.searchParams.set(k, extra[k]));
  return url.toString();
}

function webcalUrl(url){return url.replace(/^https:\/\//i, "webcal://");}
function androidUrl(url){return "https://calendar.google.com/calendar/render?cid=" + encodeURIComponent(url);}

function dateFromMs(ms){
  return new Date(Number(ms));
}

function toIsoLocal(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function formatDateMain(d){
  return d.toLocaleDateString("fr-FR", {
    weekday:"long",
    day:"numeric",
    month:"long"
  }).toUpperCase();
}

function getIsoWeekNumber(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

function formatWeekLabel(d){return "Semaine " + getIsoWeekNumber(d);}

function weekKey(d){
  const lundi = new Date(d);
  const day = lundi.getDay() || 7;
  lundi.setDate(lundi.getDate() - day + 1);
  return toIsoLocal(lundi);
}

function isWeekend(d){
  const day = d.getDay();
  return day === 0 || day === 6;
}

function detectRowType(summary, description){
  const raw = (summary + " " + description)
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toUpperCase();

  if(raw.includes("REFERENT")) return "referent";
  if(raw.includes("STAGIAIRE")) return "stagiaire";
  return "info";
}

function detectEmoji(type){
  if(type === "referent") return "🤝";
  if(type === "stagiaire") return "🧑‍🎓";
  return "📌";
}

function extractDetails(description, location){
  const lignes = String(description || "")
    .split(/\n+/)
    .map(v => v.trim())
    .filter(Boolean);

  if(location) lignes.push("Lieu : " + location);
  return lignes;
}

function formatTimeRange(e){
  if(e.allDay) return "";
  if(e.startTime && e.endTime && e.startTime !== e.endTime) return e.startTime + "–" + e.endTime;
  return e.startTime || "";
}

function renderAgendaEvents(events){
  const today = new Date();
  today.setHours(0,0,0,0);

  const futurs = (events || [])
    .filter(e => e.startMs && dateFromMs(e.startMs) >= today)
    .sort((a,b) => Number(a.startMs) - Number(b.startMs));

  if(futurs.length === 0){
    contentEl.className = "status";
    contentEl.textContent = CONFIG_PAGE.emptyMessage;
    return;
  }

  const grouped = {};

  futurs.forEach(e => {
    const d = dateFromMs(e.startMs);
    const iso = e.dateKey || toIsoLocal(d);

    if(!grouped[iso]){
      grouped[iso] = {
        dateObj:new Date(d.getFullYear(), d.getMonth(), d.getDate()),
        events:[]
      };
    }

    grouped[iso].events.push(e);
  });

  contentEl.className = "";
  contentEl.innerHTML = "";

  let currentWeek = "";

  Object.keys(grouped).sort().forEach(iso => {
    const dayGroup = grouped[iso];
    const wk = weekKey(dayGroup.dateObj);

    if(wk !== currentWeek){
      currentWeek = wk;
      const week = document.createElement("div");
      week.className = "week-label";
      week.textContent = formatWeekLabel(dayGroup.dateObj);
      contentEl.appendChild(week);
    }

    const dayCard = document.createElement("article");
    dayCard.className = "day-card" + (isWeekend(dayGroup.dateObj) ? " is-weekend" : "");

    const head = document.createElement("div");
    head.className = "day-head";

    const dateMain = document.createElement("p");
    dateMain.className = "date-main";
    dateMain.textContent = formatDateMain(dayGroup.dateObj);

    const tag = document.createElement("div");
    tag.className = "date-tag";
    tag.textContent = isWeekend(dayGroup.dateObj) ? "week-end" : "semaine";

    head.appendChild(dateMain);
    head.appendChild(tag);
    dayCard.appendChild(head);

    const list = document.createElement("div");
    list.className = "event-list";

    dayGroup.events.forEach(e => {
      const rowType = detectRowType(e.summary, e.description);
      const emoji = detectEmoji(rowType);
      const title = String(e.summary || "Stagiaire").replace(/\s+/g, " ").trim();
      const details = extractDetails(e.description, e.location);
      const horaire = formatTimeRange(e);

      const row = document.createElement("div");
      row.className = "event-row kind-" + rowType;

      const icon = document.createElement("div");
      icon.className = "shift-dot";
      icon.textContent = emoji;

      const main = document.createElement("div");
      main.className = "event-main";

      const line = document.createElement("div");
      line.className = "shift-line";

      const label = document.createElement("p");
      label.className = "shift-title";
      label.textContent = title;

      line.appendChild(label);

      if(horaire){
        const sep = document.createElement("span");
        sep.className = "shift-sep";
        sep.textContent = "·";

        const time = document.createElement("div");
        time.className = "time";
        time.textContent = horaire;

        line.appendChild(sep);
        line.appendChild(time);
      }

      main.appendChild(line);

      details.forEach(txt => {
        const detail = document.createElement("p");
        detail.className = "detail";
        detail.textContent = txt;
        main.appendChild(detail);
      });

      row.appendChild(icon);
      row.appendChild(main);
      list.appendChild(row);
    });

    dayCard.appendChild(list);
    contentEl.appendChild(dayCard);
  });
}

async function init(){
  const icsUrl = apiUrl("ics_collectif", {type:CONFIG_PAGE.typeCollectif});
  const eventsUrl = apiUrl("events_collectif", {type:CONFIG_PAGE.typeCollectif});

  bottomActions.innerHTML = `
    <a class="action-btn action-apple" href="${webcalUrl(icsUrl)}">🍎 Apple</a>
    <a class="action-btn action-android" href="${androidUrl(icsUrl)}" target="_blank" rel="noopener">🤖 Android</a>
  `;

  try{
    const res = await fetch(eventsUrl, {method:"GET", cache:"no-store"});
    const data = await res.json();

    if(!res.ok || !data || data.ok === false || !Array.isArray(data.events)){
      throw new Error(data && data.erreur ? data.erreur : "Réponse events invalide");
    }

    renderAgendaEvents(data.events);

  }catch(e){
    console.error(e);
    contentEl.className = "status";
    contentEl.textContent = "Aperçu indisponible. Vérifie que la passerelle Apps Script est bien à jour.";
  }
}

init();
</script>
