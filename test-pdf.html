<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF à imprimer</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:#f6f7fb;
  color:#0b1b46;
}
.page{
  max-width:900px;
  margin:auto;
  padding:20px;
}
h1{
  text-align:center;
  font-size:34px;
  margin:10px 0 24px;
  font-weight:900;
}
#packs{
  display:grid;
  grid-template-columns:1fr;
  gap:22px;
}
.pack{
  position:relative;
  background:white;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.14);
}
.pack img{
  width:100%;
  display:block;
}
.zone{
  position:absolute;
  inset:0;
  background:transparent;
  border:0;
  cursor:pointer;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  justify-content:center;
  align-items:center;
  z-index:999;
}
.modal.open{display:flex}
.sheet{
  width:min(92vw,520px);
  background:white;
  border-radius:24px;
  padding:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}
.sheet h2{
  margin:0 0 18px;
  text-align:center;
  font-size:28px;
}
.search{
  width:100%;
  box-sizing:border-box;
  padding:16px;
  border:2px solid #ddd;
  border-radius:14px;
  font-size:18px;
  outline:none;
}
.search:focus{border-color:#2b7fff}
.results{
  margin-top:16px;
  max-height:320px;
  overflow:auto;
}
.results a{
  display:block;
  padding:14px;
  margin-bottom:10px;
  background:#f7f9fc;
  border-radius:12px;
  text-decoration:none;
  color:#0b1b46;
  font-weight:700;
  border:1px solid #e6ebf5;
}
</style>
</head>

<body>

<div class="page">
  <h1>PDF à imprimer</h1>
  <div id="packs"></div>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <h2>Recherche ton nom</h2>
    <input class="search" id="search" placeholder="Votre nom">
    <div class="results" id="results"></div>
  </div>
</div>

<script>
function formatMonth(date){
  const mm = String(date.getMonth() + 1).padStart(2, "0");
  const yyyy = date.getFullYear();
  return `${mm}.${yyyy}`;
}

function nextMonth(date){
  return new Date(date.getFullYear(), date.getMonth() + 1, 1);
}

const today = new Date();
const visibleMonths = [
  formatMonth(today),
  formatMonth(nextMonth(today))
];

const agents = [
  {name:"TEST AGENT", pdf:"#"}
];

let selectedMonth = "";

const packsDiv = document.getElementById("packs");
const modal = document.getElementById("modal");
const search = document.getElementById("search");
const results = document.getElementById("results");

visibleMonths.forEach(month=>{
  const div = document.createElement("div");
  div.className = "pack";

  div.innerHTML = `
    <img src="assets/mois/${month}.jpg" alt="">
    <button class="zone"></button>
  `;

  div.querySelector(".zone").onclick = ()=>{
    selectedMonth = month;
    openSearch();
  };

  packsDiv.appendChild(div);
});

function openSearch(){
  search.value = "";
  results.innerHTML = "";
  modal.classList.add("open");
  setTimeout(()=>search.focus(),150);
}

search.oninput = ()=>{
  const q = search.value.toLowerCase().trim();

  if(q.length < 2){
    results.innerHTML = "";
    return;
  }

  results.innerHTML = agents
    .filter(a => a.name.toLowerCase().includes(q))
    .map(a => `<a href="${a.pdf}" target="_blank">${a.name}</a>`)
    .join("");
};

modal.onclick = (e)=>{
  if(e.target === modal){
    modal.classList.remove("open");
  }
};
</script>

</body>
</html>
